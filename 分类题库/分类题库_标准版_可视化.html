# 上篇:上午综合知识

## 模块 1 · 计算机组成与体系结构(10 题)

### 1.1 [补码计算]
已知某 8 位机器数 [X]补 = 11110011,求 X 的真值。
- A. -13
- B. 13
- C. -131
- D. 131

<details>
<summary>👉 查看答案与解析</summary>

**答案:A**

**四步走**:
1. 符号位 1 → 负数。
2. 补码 11110011,符号位不变,数值位取反 → 10001100。
3. 再 +1 → 10001101 = 0000 1101。
4. 数值部分 = 13,符号负 → **-13**。

**口诀**:负数补码求真值 = 数值位取反 + 1。
</details>

---

### 1.2 [浮点数]
关于浮点数,以下说法正确的是?
- A. 阶码决定精度,尾数决定范围
- B. 阶码决定范围,尾数决定精度
- C. 阶码和尾数都决定精度
- D. 阶码和尾数都决定范围

<details>
<summary>👉 查看答案与解析</summary>

**答案:B**

**解析**:
- 阶码像"科学计数法的指数"→ 决定能表示多大/多小(范围)。
- 尾数像"有效数字"→ 决定小数点后精确到几位(精度)。

**口诀**:阶码定范围,尾数定精度。
</details>

---

### 1.3 [寻址方式]
以下寻址方式中,速度最快的是?
- A. 立即寻址
- B. 直接寻址
- C. 间接寻址
- D. 寄存器间接寻址

<details>
<summary>👉 查看答案与解析</summary>

**答案:A**

**解析**:
- 立即寻址:操作数直接在指令里,不用访存 → 最快。
- 直接寻址:要访存一次。
- 间接寻址:访存两次(最慢)。

**口诀**:立即最快,间接最慢。
</details>

---

### 1.4 [海明码]
4 位数据位,需要多少位校验位才能纠 1 位错?
- A. 2
- B. 3
- C. 4
- D. 5

<details>
<summary>👉 查看答案与解析</summary>

**答案:B**

**公式**:2^k − 1 ≥ n + k(n 数据位,k 校验位)

**试值**:
- k=2:2²−1=3 ≥ 4+2=6?❌
- k=3:2³−1=7 ≥ 4+3=7?✅

选 B(3 位)。
</details>

---

### 1.5 [流水线]
流水线 4 段,每段 1ns,执行 100 条指令,总时间?
- A. 100ns
- B. 103ns
- C. 104ns
- D. 400ns

<details>
<summary>👉 查看答案与解析</summary>

**答案:B**

**公式**:总时间 = 一条指令时间 + 周期 × (n−1)
- 一条指令 = 4 × 1 = 4ns
- 周期 = 1ns(最长段)
- 总时间 = 4 + 1 × (100−1) = 4 + 99 = **103ns**

**关键**:第一条指令要完整走完 4 段,之后每周期出一条。
</details>

---

### 1.6 [Cache 命中率]
Cache 存取周期 10ns,主存 100ns,命中率 90%,平均访问时间?
- A. 19ns
- B. 20ns
- C. 55ns
- D. 91ns

<details>
<summary>👉 查看答案与解析</summary>

**答案:A**

**公式**:t = h × tc + (1−h) × tm
- t = 0.9 × 10 + 0.1 × 100 = 9 + 10 = **19ns**
</details>

### 1.7 [可靠度]
两个子系统可靠度都是 0.9,串联后系统可靠度?
- A. 0.81
- B. 0.9
- C. 0.99
- D. 0.18

<details>
<summary>👉 查看答案与解析</summary>

**答案:A**

**公式**(串联):R = R1 × R2 = 0.9 × 0.9 = **0.81**

**口诀**:串联乘起来,越串越脆弱。
</details>

---

### 1.8 [可靠度并联]
两个子系统可靠度都是 0.9,并联后系统可靠度?
- A. 0.81
- B. 0.9
- C. 0.99
- D. 0.999

<details>
<summary>👉 查看答案与解析</summary>

**答案:C**

**公式**(并联):R = 1 − (1−R1)(1−R2) = 1 − 0.1 × 0.1 = 1 − 0.01 = **0.99**

**口诀**:并联 1 减各不可靠度之积,越并越可靠。
</details>

### 1.9 [CISC vs RISC]
以下关于 RISC 的说法,错误的是?
- A. 指令长度固定
- B. 通用寄存器数量多
- C. 支持流水线技术
- D. 指令种类丰富

<details>
<summary>👉 查看答案与解析</summary>

**答案:D**

**解析**:
- RISC = 精简指令集 → 指令**少而精**,不是丰富。
- 指令丰富是 CISC 的特点(x86)。

**记法**:R = Reduced = 精简。
</details>

### 1.10 [I/O 控制方式]
DMA 方式中,CPU 的参与程度是?
- A. 全程参与
- B. 仅在数据块传输开始和结束时介入
- C. 完全不参与
- D. 每个字传输都介入

<details>
<summary>👉 查看答案与解析</summary>

**答案:B**

**解析**:DMA(直接存储器存取)只在传输**开始和结束**时需 CPU 介入,传输过程不经过 CPU,以**块**为单位。

**对比**:
- 程序查询:全程盯着,字为单位。
- 中断:完成才打断,字为单位。
- DMA:仅开始结束介入,块为单位。
</details>

## 模块 2 · 操作系统(10 题)

### 2.1 [进程状态]
进程 P 等待打印机输出时处于什么状态?输出完成后变为?
- A. 阻塞,运行
- B. 阻塞,就绪
- C. 运行,就绪
- D. 就绪,运行

<details>
<summary>👉 查看答案与解析</summary>

**答案:B**

**解析**:
- 等资源 = **阻塞**。
- 资源到 ≠ 直接运行,要去就绪队列排队 = **就绪**。

**核心规则**:阻塞**不能直接**变运行!
</details>

---

### 2.2 [PV 操作信号量初值]
两个进程共享一台打印机,为防止冲突,信号量初值应设为?
- A. 0
- B. 1
- C. 2
- D. -1

<details>
<summary>👉 查看答案与解析</summary>

**答案:B**

**解析**:打印机只能一个进程用 → 互斥 → 信号量初值 = 1(1 把锁)。

**口诀**:互斥用 1,同步用 0。
</details>

---

### 2.3 [P 操作]
对信号量 S 执行 P 操作后,S = -3,说明有几个进程在等待?
- A. 1
- B. 2
- C. 3
- D. 4

<details>
<summary>👉 查看答案与解析</summary>

**答案:C**

**解析**:P 操作后 S < 0,则 |S| = 等待的进程数。S = -3 → 3 个等待。

**口诀**:P 后负几等几个。
</details>

---

### 2.4 [前驱图]
前驱图 A→B(A 先于 B),A 结尾执行什么操作?B 开头执行什么?
- A. A 结尾 V(S),B 开头 P(S)
- B. A 结尾 P(S),B 开头 V(S)
- C. 都是 V(S)
- D. 都是 P(S)

<details>
<summary>👉 查看答案与解析</summary>

**答案:A**

**口诀**:**箭头起点 V,终点 P**。
- A 是起点 → V(S)(发出"我完成了")。
- B 是终点 → P(S)(等"前面完成了")。

S 初值 = 0(保证 A 先 B 后)。
</details>

### 2.5 [死锁四条件]
以下哪个不是死锁的必要条件?
- A. 互斥
- B. 请求保持
- C. 抢占式调度
- D. 环路等待

<details>
<summary>👉 查看答案与解析</summary>

**答案:C**

**口诀**:**互请不环** = 互斥、请求保持、不剥夺、环路等待。

死锁要求"不剥夺",即不能抢占。所以"抢占式调度"不是死锁条件(反而能避免死锁)。
</details>

---

### 2.6 [死锁资源数]
3 个进程,每个最多需要 2 个同类资源,系统共有几个资源才不会死锁?
- A. 3
- B. 4
- C. 5
- D. 6

<details>
<summary>👉 查看答案与解析</summary>

**答案:B**

**公式**:不死锁条件 M ≥ n × (R−1) + 1

代入:M ≥ 3 × (2−1) + 1 = **4**

**秒杀**:最坏每个进程都拿了 R−1=1 个(共 3 个),再给 1 个就满足某进程,它释放资源给其他进程用。
</details>

### 2.7 [分页地址]
页面大小 4KB,逻辑地址 710,求页号和页内偏移。
- A. 页号 0,偏移 710
- B. 页号 1,偏移 294
- C. 页号 0,偏移 294
- D. 页号 1,偏移 710

<details>
<summary>👉 查看答案与解析</summary>

**答案:A**

**三步走**:
1. 4KB = 4096。
2. 页号 = 710 ÷ 4096 = 0(商)。
3. 偏移 = 710 mod 4096 = 710。

**口诀**:页号=商,偏移=余数。
</details>

---

### 2.8 [页面置换算法]
以下页面置换算法中,存在 Belady 异常(页框增多反而缺页增多)的是?
- A. OPT
- B. FIFO
- C. LRU
- D. LFU

<details>
<summary>👉 查看答案与解析</summary>

**答案:B**

**解析**:只有 **FIFO**(先进先出)有 Belady 异常。LRU 和 OPT 不会出现。

**口诀**:FIFO 看年龄(老的走),有 Belady 异常。
</details>

### 2.9 [磁盘调度]
磁头初始在 53,请求队列:98,183,37,122,14,124,65,67。用 SSTF,第一个服务的是?
- A. 37
- B. 65
- C. 67
- D. 98

<details>
<summary>👉 查看答案与解析</summary>

**答案:B**

**解析**:
- 计算各请求距离 53 的距离:|98-53|=45,|37-53|=16,|14-53|=39,|65-53|=12,|67-53|=14...
- 最小距离 = 12 → 选 65。

**口诀**:SSTF 找最近的。
</details>

### 2.10 [位示图]
位示图主要用于?
- A. 页面置换
- B. 磁盘空闲空间管理
- C. 进程调度
- D. 文件目录查找

<details>
<summary>👉 查看答案与解析</summary>

**答案:B**

**解析**:位示图用每一位(bit)表示一个磁盘块是否空闲(1 占用 0 空闲),用于**磁盘空闲空间管理**。
</details>

## 模块 3 · 数据库系统(10 题)

### 3.1 [关系代数-选择]
"查找年龄大于 20 的学生"用关系代数表示?
- A. π(学生)
- B. σ(年龄>20)(学生)
- C. 学生 ⋈ 年龄>20
- D. 学生 × 年龄

<details>
<summary>👉 查看答案与解析</summary>

**答案:B**

<summary>👉 查看答案与解析</summary>

### 4.4 [哈夫曼树]
给定权值 {2, 3, 4, 7},构造哈夫曼树,求带权路径长度(WPL)。

<details>
<summary>👉 查看答案与解析</summary>

**答案:WPL = 32**

**构造过程**:
1. 选最小两个 2,3 → 合成 5。
2. 剩 {4, 5, 7},选最小 4,5 → 合成 9。
3. 剩 {7, 9},合成 16。

**树结构**:
```
        16
       /  \
      7    9
          / \
         4   5
            / \
           2   3
```

**WPL** = 7×1 + 4×2 + 2×3 + 3×3 = 7 + 8 + 6 + 9 = **32**

**口诀**:每次撮合两个最小。
</details>

### 9.1 [图像数据量]
1024×768 分辨率,24 位真彩色,图像大小约为多少 MB?
- A. 1.5
- B. 2.25
- C. 3
- D. 4.5

<details>
<summary>👉 查看答案与解析</summary>

**答案:B**

**三步走**:
1. 像素数 = 1024 × 768 = 786432
2. 字节 = 786432 × 24 ÷ 8 = 2359296 B
3. MB = 2359296 ÷ 1024 ÷ 1024 ≈ **2.25 MB**

**公式**:字节数 = 分辨率 × 位深 ÷ 8
</details>

### 12.2 [算法思想]
"大问题拆成小问题,分别解决再合并"是哪种算法思想?

- B. 分治法
- C. 贪心法
- D. 回溯法

<summary>👉 查看答案与解析</summary>

### A4.1 [二分查找] (单选)
二分查找的时间复杂度是?
- A. O(n)
- B. O(log n)
- C. O(n log n)
- D. O(n²)

<details>
<summary>👉 查看答案与解析</summary>

**答案:B**

**解析**:每次折半,log n 次即可找到。

**模板**(必记):
```c
while (low <= high) {
    mid = (low + high) / 2;
    if (key == a[mid]) return mid;
    else if (key < a[mid]) high = mid - 1;
    else low = mid + 1;
}
```
</details>

### A4.2 [冒泡排序] (单选)
冒泡排序的内层循环边界是?(n 个元素)
- A. j < n
- B. j < n - 1
- C. j < n - 1 - i
- D. j < i

<details>
<summary>👉 查看答案与解析</summary>

**答案:C**

**模板**(必记):
```c
for (i = 0; i < n - 1; i++)         // 外层
    for (j = 0; j < n - 1 - i; j++) // 内层
        if (a[j] > a[j+1]) swap(a[j], a[j+1]);
```

**关键**:`n - 1 - i` 因为每轮把最大的冒到最后,后 i 个已排好。
</details>

### A4.6 [大题填空] 算法综合题

**题目**:
以下是用 C 实现的二分查找,补全填空。
```c
int binary_search(int a[], int n, int key) {
    int low = 0, high = n - 1, mid;
    while (______(1)______) {
        mid = ______(2)______;
        if (key == a[mid]) return mid;
        else if (key < a[mid]) ______(3)______;
        else ______(4)______;
    }
    return -1;  // 未找到
}
```

<details>
<summary>👉 查看答案与解析</summary>

**答案**:
- (1) `low <= high`
- (2) `(low + high) / 2`
- (3) `high = mid - 1`
- (4) `low = mid + 1`

**关键**:
- (1) 必须 `<=`,不是 `<`(否则漏查最后一个元素)
- (3)(4) 必须 `mid - 1` 和 `mid + 1`,不是 `mid`(否则死循环)

**口诀**:二分查找 `low <= high`,`mid = (low+high)/2`,小了 low 后移,大了 high 前移。
</details>

### A5.6 [大题填空] 设计模式综合题

**题目**:
某气象站系统,温度变化时需通知多个显示器(当前温度显示器、统计显示器)。
使用观察者模式实现,补全代码。

```java
interface Observer {
    void ______(1)______(float temp);  // 接收通知
}

class WeatherData {
    List<Observer> observers = new ArrayList<>();
    void attach(Observer o) { observers.add(o); }
    void notifyObservers(float temp) {
        for (Observer o : observers) o.______(2)______(temp);
    }
}

class CurrentDisplay ______(3)______ Observer {
    public void ______(4)______(float temp) {
        System.out.println("当前温度:" + temp);
    }
}
```

<details>
<summary>👉 查看答案与解析</summary>

**答案**:
- (1) `update`
- (2) `update`
- (3) `implements`
- (4) `update`

**解析**:
- (1) 接口定义 `update` 方法。
- (2) Subject 通知时调用观察者的 `update`(与接口方法名一致)。
- (3) 实现接口用 `implements`。
- (4) 实现接口方法,方法名必须与接口一致 = `update`。

**填空五步法**:
1. 识别模式类型(观察者)
2. 找接口方法签名(update)
3. 调用处照抄方法名
4. 实现接口用 `implements`,继承用 `extends`
5. 看返回类型填 return
</details>
