**【2022.05 · 第5题】**

> 5. 某计算机系统构成如下图所示，假设每个软件的千小时可靠度 R 为 0.95，则该系统的干小时可靠度约为______。
> A.0.95 × (1 − (1 − 0.95)2) × 0.95
> B.0.95 × (1 − 0.95)2 × 0.95
> C.0.95 × 2 × (1 − 0.95) × 0.95
> D.0.954 × (1 − 0.95)2

<details><summary><b>👉 点击展开答案与解析</b></summary>

<p>答案：A<br>本题考查的是混联模型可靠性计算。<br>可以将图示分解为 3 个部分 R1、R2、R3串联，整个系统可靠度为 R1*R2*R3。<br>其中 R1、R3的可靠度都为 R = 0.95，R2的可靠度为 1 − (1 − R)2 = 1 − (1 − 0.95)2。代入表达式可得，系统最终<br>的可靠度为 0.95 × (1 − (1 − 0.95)2) × 0.95，本题选择 A选项。</p>

</details>

**【2024.05 · 第4题】**

> 若浮点数用补码表示，则判断运算结果为规格化数的方法是（4）
> A.阶符与数符相同为规格化数
> B.阶符与数符相异为规格化数
> C.数符与尾数小数点后第一位数字相异为规格化数
> D.数符与尾数小数点后第一位数字相同为规格化数
> 循环余校验码（CRC）利用生成多项式进行编码。设数据位为n位，校验位为k位，

<details><summary><b>👉 点击展开答案与解析</b></summary>

<p>（4）答案：C<br>解析：规格化，对二进制浮点数N=2^ExM，若尾数M满足1/2≤M<1，即尾数最高位数字为"1”，<br>则为规格化的数。<br>对补码来说：如果是正数，尾数的最高位为"1"；如果是负数，尾数的最高位应为"0"（即1.0x..x），<br>或为“1"而以后各位全为0”（即1.10.0）。前者小于-1/2，后者正好等于-1/2。<br>为了机器判断方便，在补码表示中，往往不把-1/2列入规格化的数。这样，补码规格化数规定<br>如下：<br>对于正数，如果1>M≥1/2，称为规格化数，其补码表示形式为：0.1x..x：对于负数，如果<br>-1/2>M≥-1（注意：补码表示的时候可取-1），称为规格化数，其补码表示形式为：1.0x..X。其中<br>x表示可任取“0”或“1”。<br>因此，机器只要判断运算结果的符号位与最高有效位是否相同，便可知道是否是规格化的数。<br>相异即规格化。</p>

</details>

<p>（25）答案：C<br>解析：在Linux文件系统中，有三个角色组，分别是：所有者（Owner）、组（Group）、其他用户（Other)。<br>每个组权限中又分别包含：（读）、w（写）、x（执行）三种权限，每个权限有一个对应的数字值：r（4）、<br>w（2）、x（1）。可以通过将这三种权限数字相加得到角色的权限值，例如，读写权限可以表示为6<br>(4+2+0）。<br>例如命令：chmod754xxx（修改xxx文件或目录的权限）。7，5，4每个数字分别对应这三个<br>所属角色权限，7表示所有者具备读、写和可执行权限，中间的5表示组具备读和可执行权限，最<br>后一个4表示其它用户只具备读权限。<br>在八进制表示法中：用户A（所有者）的完全访问权限是7（4读+2写+1执行）：用户B（组）的只读<br>和运行权限是5（4读+1执行）：用户C（其他用户）的运行权限是1(1执行）。</p>

**【2024.05 · 第26题】**

> FAT文件系统中，文件的物理结构是（26）
> A.顺序结构
> B.链接结构
> C.索引结构
> D.哈希文件

<details><summary><b>👉 点击展开答案与解析</b></summary>

<p>（26）答案：B<br>解析：目前常用的文件系统类型有FAT、Vfat、NTFS、Ext2和HPFS等。FAT也就是Windows支持<br>的，采用链接结构的物理结构文件分配表，FAT12、FAT16、FAT32均是FAT文件系统，分别采用了<br>12位、16位、32位表示簇号。FAT16目录项只为文件名保留了8个字节的空间，只能支持8个字<br>符文件名。基于这种簇状链式结构，FAT文件系统能够有效地管理磁盘上的文件和目录。每个文件<br>或目录都通过其起始簇号与FAT表中的链表相关联，从而实现了对文件数据的快速访问和修改。<br>FAT文件系统使用的文件管理结构是基于文件的簇状链式结构。这一结构主要由以下几个部分<br>组成：<br>引导扇区（BootSector）：位于卷的第一个扇区，包含BIOS参数块（BPB），定义了文件系统的<br>基本参数，如每扇区的字节数、每簇的扇区数等。<br>文件分配表（FAT）：用于管理文件簇链的表格，以链表的形式记录簇的信息。FAT表记录了每<br>个簇的使用情况，包括空闲簇、已分配簇、保留簇、坏簇和文件结束簇等。<br>根目录区（RootDirectoryArea）：在FAT12和FAT16中，根目录区紧跟在FAT表之后，用于存<br>储根目录中的文件和子目录的元数据。而在FAT32中，根目录区被移到了数据区，并可以动态扩展。<br>数据区（DataArea）：存储实际的文件和目录数据。文件和目录的数据被分配在一个或多个簇中，<br>并通过FAT表中的链表进行管理。</p>

</details>

**【2024.05 · 第54题】**

> TCP序号单位是（54）
> A.字节
> B.报文
> C.比特
> D.以上都不是

<details><summary><b>👉 点击展开答案与解析</b></summary>

<p>（54）答案：A<br>解析：序号（SequenceNumber简称Seq）：是TCP报文中用于标识每个字节的唯一数字。它表示在<br>一个TCP连接中发送的字节的顺序。<br>赫兹是频率的单位；比特是信号量的基本单位；报文是TCP/IP网络中传输的信息单位，而TCP<br>序列号是基于每个数据段中的字节的，而不是整个报文。<br>TCP序号的单位是字节。TCP报头中的序号和确认号字段都是以字节<br>为单位进行编码的。<br>游端口（16位）<br>目的端口（16位）<br>序号（32位）<br>确认号（32位）<br>20字节<br>固定首<br>数据偏移<br>部长度<br>保留（6位）<br>（4位）<br>窗口（16位）<br>检验和（16位）<br>紧急指针（16位）<br>选项（长度可变）<br>填充<br>X<br>TCP首部<br>TCP报文段的数据部分<br>↑<br>IP首部<br>IP数据报的数据部分<br>TCP序号的作用和重要性在于保证数据的顺序性和可靠性。由于网络上的传输顺序是不确定的，<br>TCP通过为每个字节分配一个序号来确保数据的顺序性。同时，确认应答机制进一步保证了数据的<br>可靠性。如果发送方收到了接收方的确认应答，就认为数据已经被正确接收。除了序号和确认号，<br>TCP还有其他重要的特性，如面向字节流、全双工通信等。这些特性共同保证了TCP在网络通信中<br>的高效和可靠。<br>具体来说，当TCP发送数据时，它会将数据分割成多个字节块，并为每个字节块分配一个序号。<br>这些序号从初始序列号（ISN）开始，通常是随机选择的，以确保每个连接都有唯一的序号序列。随<br>着数据的传输，每个后续的字节块都会按顺序增加序号。例如，如果初始序列号是1000，并且每个<br>数据段包含100字节，那么第一个数据段的序号就是1000，第二个数据段的序号是1100，以此类推。<br>源端口（SourcePort），16位，指明发送数据的进程使用的端口号。<br>目的端口（DestinationPort），16位，指明数据将发往目的主机的端口号。<br>序号（SequenceNumber），32位，表示该报文段所发送数据的第一个字节的编号，在TCP连接<br>中所传输字节流的每一个字节都会按顺序编号，由于序列号是由32位表示，所以每2^32个字节，<br>就会产生序列号回绕，再次从0开始。在建立连接时由计算机生成的随机数作为其初始值，通过SYN<br>包传给接收端主机，每发送一次数据，就「累加」一次该值。<br>确认号（AcknowledgmentNumber），32位，表示接收方期望收到发送方下一个报文段的第一个<br>字节数据的编号，也就是告诉发送方：我希望你下次发送的数据的第一个字节数据的编号为此确认<br>号。确认号只有在ACK标志为1时才有效。发送端收到确认应答后代表确认序号之前的数据都已经<br>被正常接收。<br>数据偏移（DataOffset），4位，它指出TCP报文段的数据起始距离TCP报文段的起始处有多远。<br>实际上是TCP首部长度，用来标识数据段的起始位置。最大能表示的数是15，单位是4个字节，因<br>此数据偏移的最大值是60个字节，这也是TCP首部的最大字节。因为固定首部的存在，数据偏移<br>的值最小为20个字节，因此选项长度不能超过40字节*（减去20个字节的固定首部）。<br>保留位（Reserved），6位，保留为今后使用，现在必须置为0。<br>窗口大小（Window），16位。表示现在允许对方发送的数据量，也就是告诉对方，本报文段确<br>认号开始允许对方发送的数据量，到达此值，需要ACK确认后才能继续发送数据。窗口指的是发送<br>本报文段的一方的接受窗口（而不是自己的发送窗口），窗口大小是给对方用的。之所以要有这个限<br>制，是因为接收方的数据缓存空间是有限的。<br>校验和（Checksum），16位。检验和字段检验的范围包括首部和数据这两部分。通过CRC算法<br>提供额外的可靠性。<br>紧急指针UrgentPointer），16位。紧急指针仅在URG=1时才有意义，它指出本报文段中的紧<br>急数据的字节数（紧急数据结束后就是普通数据）。因此，在紧急指针指出了紧急数据的末尾在报文<br>段中的位置。当所有紧急数据都处理完时，TCP就告诉应用程序恢复到正常操作。值得注意的是，<br>即使窗口为0时也可以发送紧急数据。但是在实际操作中很少使用紧急指针。<br>选项部分（Options），长度可变，最长可达40个字节。当没有使用“选项"时，TCP的首部长度<br>是20字节。最大长度可以根据TCP首部长度进行推算。</p>

</details>

<p>参考答案：DC<br>TCP 传输层上的安全协议，最常使用 SSL/TLS 的场景是在HTTPS 中，通过在HTTP 和TCP 中加了一<br>层SSL/TLS，使得不安全的HTTP成为了安全的HTTPS。<br>HTTPS采用混合加密方式，即使用非对称加密算法和对称加密算法相结合的方式。整个握<br>手过程中，服务器和客户端通过非对称加密算法进行通信，确认彼此身份后，再生成一个会话密<br>钥，采用对称加密算法对后续的通信数据进行加密传输。因此，浏览器和服务器之间用于加密<br>HTTP消息的方式是会话密钥+对称加密。答案选D。<br>在PKI体系中，为了避免证书被恶意使用或泄露造成损失，引入了证书吊销机制，即当证书<br>被撤销时，应及时向证书颁发机构（CA）发起吊销请求，将该证书列入证书吊销列表（CRL）中。<br>此外，还可以使用在线证书状态协议（OCSP）查询证书是否被吊销。客户端在建立SSL/TLS连<br>接时，会验证服务器证书的有效性，如果证书被撤销，则无法验证证书的合法性，此时可能会出<br>现安全漏洞，导致网络攻击，那么客户端无法再信任服务器。答案选C。<br>以下关于入侵防御系统功能的描述中，不正确的是_（10）</p>

<details><summary><b>👉 点击展开答案与解析</b></summary>

<p>（48）答案：C<br>解析：撞库是黑客通过收集互联网已泄露的用户和密码信息，生成对应的字典表，尝试批量登录其<br>他网站后，得到一系列可以登录的用户。很多用户在不同网站使用的是相同的账号密码，因此黑客<br>可以通过获取用户在A网站的账户从而尝试登录B网址，这就可以理解为撞库攻击。<br>社工库：就是黑客们将泄漏的用户数据整合分析，然后集中归档的一个地方。社工库的主要功<br>能在于收集、整理和存储目标个体或组织的各类信息，以在进行社会工程学攻击时提供精准的背景<br>资料。<br>拖库是指攻击者使用各种手段，获取并下载整个数据库的内容，包括敏感信息，如用户账号、<br>密码、个人身份信息等。这种行为严重破坏了数据的完整性和机密性，对企业和个人的信息安全构<br>成了严重威胁。<br>洗库是指黑客入侵网站后，通过技术手段将获取的大量用户数据进行分析和变现的过程。洗库<br>是黑客入侵的一种手段，目的是将有价值的数据转化为现金或其他形式的收益。</p>

**【2024.05 · 第56题】**

> 由于知识技术可以同时被多个人使用，所以知识专利具有（56）
> A.双重性
> B.独占性
> C.地域性
> D.时间性

<details><summary><b>👉 点击展开答案与解析</b></summary>

<p>（56）答案：B<br>解析：知识产权的特点：（1）无形性。知识产权是一种无形财产权。知识产权的客体指的是智力创<br>作性成果（也称为知识产品），是一种没有形体的精神财富。（2）双重性。某些知识产权具有财产权和<br>人身权双重性。（3）确认性。无形的智力创作性成果不像有形财产那样直观可见，因此，智力创作<br>性成果的财产权需要依法审查确认，以得到法律保护。（4）独占性。由于智力成果具有可以同时被<br>多个主体所使用的特点，因此，法律授予知识产权一种专有权，具有独占性。（5）地域性。知识产<br>权具有严格的地域性特点，即各国主管机关依照本国法律授予的知识产权，只能在其本国领域内受<br>法律保护，例如中国专利局授予的专利权或中国商标局核准的商标专用权，只能在中国领域内受保<br>护，其他国家则不给予保护。（6）时间性。知识产权具有法定的保护期限，一旦保护期限届满，权<br>利将自行终止，成为社会公众可以自由使用的知识。</p>

</details>

        document.addEventListener('DOMContentLoaded', () => {
            // Theme setup
            const themeBtn = document.getElementById('theme-btn');
            const html = document.documentElement;
            
            const savedTheme = localStorage.getItem('theme') || 'light';
            html.setAttribute('data-theme', savedTheme);
            themeBtn.textContent = savedTheme === 'light' ? '🌙' : '☀️';
            
            themeBtn.addEventListener('click', () => {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeBtn.textContent = newTheme === 'light' ? '🌙' : '☀️';
            });

            // Mobile menu
            const menuBtn = document.getElementById('menu-btn');
            const sidebar = document.getElementById('sidebar');
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('open');
            });
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 900 && !sidebar.contains(e.target) && e.target !== menuBtn) {
                    sidebar.classList.remove('open');
                }
            });

            // Parse markdown
            let rawMd = document.getElementById('raw-markdown').textContent;
            
            const contentDiv = document.getElementById('markdown-content');
            contentDiv.innerHTML = marked.parse(rawMd);
            
            // Syntax highlighting
            if (window.Prism) {
                Prism.highlightAll();
            }

            // Generate TOC
            const tocDiv = document.getElementById('toc');
            const headers = contentDiv.querySelectorAll('h1, h2, h3, h4');
            
            // Highlight specific markers
            const walker = document.createTreeWalker(contentDiv, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            let node;
            while (node = walker.nextNode()) {
                textNodes.push(node);
            }
            textNodes.forEach(textNode => {
                if (textNode.nodeValue.includes('🔺') || textNode.nodeValue.includes('重点')) {
                    const span = document.createElement('span');
                    span.innerHTML = textNode.nodeValue
                        .replace(/🔺/g, '<span class="highlight-icon">🔺</span>')
                        .replace(/重点/g, '<span style="color: #ef4444; font-weight: bold; border-bottom: 2px dashed #ef4444;">重点</span>');
                    textNode.parentNode.replaceChild(span, textNode);
                }
            });
            
            headers.forEach((h, index) => {
                const id = 'heading-' + index;
                h.id = id;
                const a = document.createElement('a');
                a.href = '#' + id;
                a.textContent = h.textContent;
                a.className = 'toc-' + h.tagName.toLowerCase();
                
                a.addEventListener('click', (e) => {
                    if (window.innerWidth <= 900) {
                        sidebar.classList.remove('open');
                    }
                });
                
                tocDiv.appendChild(a);
            });

            // Scroll to top button
            const toTop = document.getElementById('totop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    toTop.classList.add('visible');
                } else {
                    toTop.classList.remove('visible');
                }
            });
            
            // Active TOC highlighting
            const tocLinks = document.querySelectorAll('#toc a');
            window.addEventListener('scroll', () => {
                let current = '';
                // Add a small offset to highlight early
                const offset = 100;
                headers.forEach(h => {
                    const top = h.offsetTop;
                    if (scrollY >= top - offset) {
                        current = h.getAttribute('id');
                    }
                });
                
                tocLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === '#' + current) {
                        link.classList.add('active');
                    }
                });
            });
            
        });
    </script>
