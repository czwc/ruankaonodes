<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>软件设计师 · 错题笔记</title>
<style>
  :root {
    --primary:#2563eb; --primary-dark:#1d4ed8; --bg:#eef3fb; --card:#fff;
    --text:#0f172a; --muted:#64748b; --border:#dbe3ef; --soft:#f8fafc;
    --ok:#16a34a; --danger:#dc2626; --warning:#f59e0b; --purple:#7c3aed;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:"Microsoft YaHei UI","Segoe UI",Arial,sans-serif;
    background:
      radial-gradient(circle at top left, rgba(37,99,235,.18), transparent 34%),
      radial-gradient(circle at top right, rgba(124,58,237,.12), transparent 40%),
      linear-gradient(180deg,#f8fbff 0%, var(--bg) 100%);
    color:var(--text); min-height:100vh;
  }
  .wrap { max-width:1280px; margin:0 auto; padding:24px 28px 60px; }

  header {
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;
    margin-bottom:20px; padding:22px 26px; border:1px solid rgba(219,227,239,.85); border-radius:22px;
    background:rgba(255,255,255,.82); backdrop-filter:blur(10px);
    box-shadow:0 14px 40px rgba(15,23,42,.08);
  }
  h1 { font-size:26px; margin:0 0 6px; letter-spacing:.2px; }
  .sub { color:var(--muted); font-size:14px; }

  .progress-panel {
    min-width:300px; flex:0 0 auto;
    background:linear-gradient(135deg,#eff6ff,#f5f3ff);
    border:1px solid #dbe3ef; border-radius:16px; padding:14px 18px;
  }
  .progress-panel .nums { display:flex; gap:22px; margin-bottom:10px; }
  .progress-panel .num b { font-size:22px; color:var(--primary-dark); }
  .progress-panel .num span { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
  .progress-bar { height:8px; border-radius:99px; background:#dbe3ef; overflow:hidden; }
  .progress-bar > div { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--primary),#38bdf8); transition:width .4s ease; }

  .toolbar {
    display:flex; gap:12px; flex-wrap:wrap; align-items:center;
    margin-bottom:18px; padding:14px 16px;
    background:rgba(255,255,255,.9); border:1px solid var(--border);
    border-radius:18px; box-shadow:0 10px 26px rgba(15,23,42,.06);
    position:sticky; top:0; z-index:20;
  }
  #search {
    flex:1 1 260px; min-height:46px; border:1px solid var(--border); border-radius:13px;
    padding:10px 14px; font-size:15px; outline:none; background:#fff;
    transition:border-color .15s, box-shadow .15s;
  }
  #search:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(37,99,235,.13); }
  .filter-btn {
    border:1px solid var(--border); background:#fff; border-radius:13px;
    padding:10px 16px; font-size:14px; font-weight:700; cursor:pointer; color:var(--text);
    transition:all .15s;
  }
  .filter-btn:hover { border-color:var(--primary); color:var(--primary); }
  .filter-btn.active { background:var(--primary); border-color:var(--primary); color:#fff; }

  .cats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .cat-btn {
    border:1px solid var(--border); background:rgba(255,255,255,.9); border-radius:999px;
    padding:8px 18px; font-size:14px; font-weight:700; cursor:pointer; color:var(--muted);
    transition:all .15s;
  }
  .cat-btn:hover { border-color:var(--primary); color:var(--primary); transform:translateY(-1px); }
  .cat-btn.active { background:linear-gradient(135deg,var(--primary),#38bdf8); border-color:transparent; color:#fff; box-shadow:0 6px 16px rgba(37,99,235,.28); }
  .cat-btn .count { opacity:.75; font-weight:600; font-size:12px; margin-left:4px; }

  .notes { display:grid; grid-template-columns:repeat(auto-fill, minmax(480px, 1fr)); gap:16px; }
  .note {
    background:rgba(255,255,255,.96); border:1px solid var(--border); border-radius:20px;
    box-shadow:0 10px 30px rgba(15,23,42,.07); overflow:hidden;
    display:flex; flex-direction:column; transition:transform .15s, box-shadow .15s;
    border-left:5px solid var(--primary);
  }
  .note:hover { transform:translateY(-2px); box-shadow:0 16px 40px rgba(15,23,42,.12); }
  .note.mastered { border-left-color:var(--ok); }
  .note.starred { box-shadow:0 10px 30px rgba(245,158,11,.18); border-color:#fcd34d; }

  .note-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:16px 18px 0; }
  .note-title { font-size:17px; font-weight:800; margin:0; line-height:1.4; }
  .note-meta { display:flex; gap:8px; flex-wrap:wrap; padding:10px 18px 0; align-items:center; }
  .badge {
    font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px;
    background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe;
  }
  .badge.tag { background:#f5f3ff; color:#6d28d9; border-color:#ddd6fe; }
  .badge.date { background:var(--soft); color:var(--muted); border-color:var(--border); }
  .badge.star { background:#fffbeb; color:#b45309; border-color:#fcd34d; }

  .note-body {
    padding:12px 18px 4px; font-size:14.5px; line-height:1.75; color:#1e293b;
    max-height:210px; overflow:hidden; position:relative;
  }
  .note-body.expanded { max-height:none; }
  .note-body:not(.expanded)::after {
    content:""; position:absolute; left:0; right:0; bottom:0; height:56px;
    background:linear-gradient(180deg, transparent, rgba(255,255,255,.97));
    pointer-events:none;
  }

  .note-foot {
    display:flex; gap:10px; padding:12px 18px 16px; margin-top:auto; flex-wrap:wrap;
  }
  .mini-btn {
    border:1px solid var(--border); background:#fff; border-radius:10px;
    padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer; color:var(--text);
    transition:all .15s;
  }
  .mini-btn:hover { border-color:var(--primary); color:var(--primary); }
  .mini-btn.toggle { color:var(--primary-dark); background:#eff6ff; border-color:#bfdbfe; }
  .mini-btn.master-btn.on { background:var(--ok); border-color:var(--ok); color:#fff; }
  .mini-btn.star-btn.on { background:var(--warning); border-color:var(--warning); color:#fff; }

  .empty {
    grid-column:1/-1; text-align:center; color:var(--muted); padding:70px 20px;
    background:rgba(255,255,255,.8); border:1px dashed var(--border); border-radius:20px;
  }
  .empty b { display:block; font-size:17px; color:var(--text); margin-bottom:8px; }

  /* ── 笔记内容排版 ── */
  .note-body h4 { margin:14px 0 6px; font-size:15px; color:var(--primary-dark); }
  .note-body p { margin:6px 0; }
  .note-body ul, .note-body ol { margin:6px 0; padding-left:22px; }
  .note-body li { margin:3px 0; }
  .note-body table { border-collapse:collapse; width:100%; margin:10px 0; font-size:13.5px; background:#fff; }
  .note-body th, .note-body td { border:1px solid var(--border); padding:7px 10px; text-align:left; vertical-align:top; }
  .note-body th { background:#eff6ff; color:#1e40af; font-weight:700; }
  .note-body tr:nth-child(even) td { background:#f8fafc; }
  .note-body code {
    background:#eef2ff; color:#3730a3; border-radius:6px; padding:1px 7px;
    font-family:Consolas,"Courier New",monospace; font-size:13px;
  }
  .note-body pre {
    background:#0b1220; color:#d7e7ff; border-radius:12px; padding:14px 16px;
    overflow:auto; font-family:Consolas,"Courier New",monospace; font-size:13px; line-height:1.6;
  }
  .note-body pre code { background:none; color:inherit; padding:0; }
  .note-body .key {
    background:linear-gradient(180deg, transparent 62%, #fde68a 62%);
    font-weight:700; padding:0 2px;
  }
  .note-body .warn {
    background:#fffbeb; border:1px solid #fcd34d; border-radius:10px;
    padding:8px 12px; color:#92400e; font-size:13.5px; margin:8px 0;
  }
  .note-body .tip {
    background:#ecfdf5; border:1px solid #a7f3d0; border-radius:10px;
    padding:8px 12px; color:#065f46; font-size:13.5px; margin:8px 0;
  }
  .note-body .formula {
    background:linear-gradient(135deg,#eff6ff,#ecfeff); border:1px solid #bfdbfe;
    color:#1e40af; padding:8px 12px; border-radius:10px; margin:8px 0;
    font-weight:700; text-align:center; font-size:14px;
  }
  .note-body details.q {
    border:1px solid var(--border); border-radius:10px; background:var(--soft);
    margin:8px 0; font-size:13.5px;
  }
  .note-body details.q summary {
    cursor:pointer; padding:8px 12px; font-weight:700; color:var(--primary-dark);
    list-style:none; display:flex; align-items:center; gap:8px;
  }
  .note-body details.q summary::-webkit-details-marker { display:none; }
  .note-body details.q summary::before { content:"▸"; color:var(--primary); transition:transform .15s; }
  .note-body details.q[open] summary::before { transform:rotate(90deg); }
  .note-body details.q .ans { padding:2px 14px 10px; border-top:1px dashed var(--border); margin-top:2px; }
  .note-body details.q .ans p { margin:8px 0 0; }

  @media (max-width:1080px) { .notes { grid-template-columns:1fr; } }
  @media (max-width:680px) {
    .wrap { padding:14px; }
    header { flex-direction:column; align-items:stretch; }
    .progress-panel { min-width:0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>软件设计师 · 错题笔记</h1>
      <div class="sub">知识总结 · 分类复习 · 掌握度追踪</div>
    </div>
    <div class="progress-panel">
      <div class="nums">
        <div class="num"><b id="statTotal">0</b><span>知识点</span></div>
        <div class="num"><b id="statMastered">0</b><span>已掌握</span></div>
        <div class="num"><b id="statStarred">0</b><span>重点</span></div>
      </div>
      <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
    </div>
  </header>

  <div class="toolbar">
    <input id="search" type="text" placeholder="搜索知识点标题、内容、标签…" />
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">全部</button>
    <button class="filter-btn" data-filter="unmastered" onclick="setFilter('unmastered', this)">未掌握</button>
    <button class="filter-btn" data-filter="starred" onclick="setFilter('starred', this)">★ 重点</button>
  </div>

  <div class="cats" id="cats"></div>

  <div class="notes" id="notes"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   知识点数据（由 AI 总结后添加）
   category 取值（软考大纲）：
   计算机组成 / 操作系统 / 数据库 / 计算机网络 / 软件工程 /
   数据结构与算法 / 程序设计语言 / 数学与经济 / 知识产权 / 专业英语
   content 支持 HTML：h4/p/ul/table/code/pre/.key/.warn/.tip/.formula
   ═══════════════════════════════════════════════════════════════════ */
const NOTES = [
  {
    id: 1,
    category: "计算机组成",
    title: "CRC 循环冗余校验码 · 编码规则",
    tags: ["校验码", "必考", "易混淆"],
    date: "2026-08-31",
    content: `
      <h4>编码格式</h4>
      <div class="formula">CRC 码 = 【k 位原始数据】 + 【r 位校验码（全部追加在末尾）】</div>
      <ul>
        <li>原始 <b>k 位数据</b>放在<b>前面</b>，保持原样不变</li>
        <li>计算得到的 <b>r 位校验码</b>拼接在数据<b>末尾</b></li>
      </ul>

      <h4>计算步骤（模 2 除法）</h4>
      <ol>
        <li>确定生成多项式，其<b>最高次幂 = r</b>（校验位位数）</li>
        <li>在 k 位数据末尾<b>补 r 个 0</b></li>
        <li>用补 0 后的数<b>模 2 除</b>（按位异或，不借位）生成多项式</li>
        <li>得到的 <b>r 位余数</b>就是校验码，<b>替换掉</b>刚才补的 0</li>
      </ol>

      <h4>CRC vs 海明码（高频对比）</h4>
      <table>
        <tr><th>对比项</th><th>CRC</th><th>海明码</th></tr>
        <tr><td>校验位位置</td><td><span class="key">全部追加在末尾</span></td><td><span class="key">穿插在数据位之间</span>（放在 2ⁿ 位：第1、2、4、8…位）</td></tr>
        <tr><td>数据位位置</td><td>在前，连续完整</td><td>被校验位隔开</td></tr>
        <tr><td>核心运算</td><td>模 2 除法（异或）</td><td>分组偶校验</td></tr>
        <tr><td>能力</td><td>检错（不能纠错定位）</td><td>检错 + <b>纠 1 位错</b></td></tr>
      </table>

      <div class="warn">⚠ 易错点：题目说"校验位穿插分布在数据位之间"的是<b>海明码</b>，不是 CRC！CRC 的数据永远在前面、校验码永远在最后。</div>
      <div class="tip">💡 记忆口诀：CRC = <b>尾</b>巴加校验（数据尾随校验）；海明 = <b>插</b>花式分布（2ⁿ 位插校验）。</div>
    `
  },
  {
    id: 2,
    category: "计算机组成",
    title: "中断 vs 异常 · 核心区分规则",
    tags: ["中断", "必考", "易混淆"],
    date: "2026-08-31",
    content: `
      <h4>核心区分规则</h4>
      <div class="formula">看信号来源：<b>CPU 外部</b> → 中断（异步）｜<b>CPU 内部执行指令</b> → 异常（同步）</div>

      <table>
        <tr><th>对比项</th><th>中断（外部）</th><th>异常（内部）</th></tr>
        <tr><td>来源</td><td><span class="key">CPU 外面的设备信号</span></td><td><span class="key">CPU 执行指令自己产生</span></td></tr>
        <tr><td>同步/异步</td><td>异步事件（与指令流无关）</td><td>同步事件（由某条指令触发）</td></tr>
        <tr><td>典型例子</td><td>DMA 传送结束、键盘、硬盘、网卡等<b>外设</b>发出的信号</td><td>除 0 溢出、缺页、非法指令、断点（陷阱 trap）</td></tr>
      </table>

      <h4>判断技巧</h4>
      <ul>
        <li>看到 <b>DMA、键盘、硬盘、网卡、打印机、时钟</b> 这类<b>外设</b>词 → 中断</li>
        <li>看到 <b>溢出、缺页、非法/特权指令、断点、地址越界</b> 这类<b>指令执行出错/陷阱</b> → 异常</li>
      </ul>

      <div class="warn">⚠ 易错点："<b>缺页</b>"是 CPU 执行访存指令时产生的，属于<b>异常</b>，不是中断！很多人想当然把它归为中断。</div>
      <div class="tip">💡 记忆口诀：<b>外</b>部找中断（外部设备），<b>内</b>部找异常（内部出错）。缺页、除0 都是"执行指令惹的祸" → 异常。</div>
    `
  },
  {
    id: 3,
    category: "计算机组成",
    title: "中断的两种叫法与分类（含电源故障归属）",
    tags: ["中断", "易混淆", "分类"],
    date: "2026-08-31",
    content: `
      <h4>两种教材叫法（本质相同，范围不同）</h4>
      <table>
        <tr><th>叫法版本</th><th>外部类</th><th>内部类</th></tr>
        <tr><td>叫法 1：<b>中断 vs 异常</b></td><td>中断：外部硬件产生（DMA 结束、键盘、定时器）</td><td>异常：CPU 内部指令出错（除 0、非法指令）</td></tr>
        <tr><td>叫法 2：<b>硬件中断 vs 软件中断</b></td><td>硬件中断：外设触发（键盘按键、定时器溢出、DMA 完成）</td><td>软件中断（<b>也叫异常</b>）：程序执行出错触发（除零、缺页）</td></tr>
      </table>

      <h4>电源故障的归属（高频坑）</h4>
      <ul>
        <li>电源故障属于<span class="key">机器故障类</span>中断</li>
        <li><b>不属于</b>软件中断，也不是普通外设中断</li>
      </ul>

      <h4>中断的完整分类（按经典教材）</h4>
      <table>
        <tr><th>类别</th><th>含义</th><th>例子</th></tr>
        <tr><td>外中断（硬件中断）</td><td>CPU 外部设备引起</td><td>键盘、定时器、DMA 完成、打印机</td></tr>
        <tr><td>内中断（软件中断/异常）</td><td>指令执行出错或陷阱</td><td>除 0、缺页、非法指令、断点</td></tr>
        <tr><td>机器故障类</td><td>硬件本身故障</td><td><b>电源故障</b>、内存校验错</td></tr>
      </table>

      <div class="warn">⚠ 易错点：题目问"电源故障属于哪类中断"——选<b>机器故障类</b>！它既不是软件中断，也不算普通外设中断。</div>
      <div class="tip">💡 记忆口诀：叫法不同心相同——"外设叫硬中，出错叫软中（异常），<b>断电是机器故障</b>"。</div>
    `
  },
  {
    id: 4,
    category: "计算机组成",
    title: "浮点数运算全套 · 加减乘除速记",
    tags: ["浮点数", "必考", "计算题"],
    date: "2026-08-31",
    content: `
      <h4>一、浮点加减法（零对尾规）</h4>
      <div class="formula">判零 → 对阶 → 尾数加减 → 规格化 + 舍入 + 判溢出</div>
      <ul>
        <li>① 判零：有 0 直接出结果，省去计算</li>
        <li>② 对阶：<span class="key">小阶向大阶对齐，尾数右移</span>（阶小的尾数右移 1 位，阶码 +1，直到相等）</li>
        <li>③ 尾数加（减）运算</li>
        <li>④ 规格化 + 舍入 + 判溢出</li>
      </ul>
      <p>为什么小阶向大阶对齐？→ 尾数<b>右移损失低位精度</b>；若大向小对齐，尾数左移会丢失高位有效数字，错误更严重。</p>

      <h4>二、浮点乘法（零加乘规）</h4>
      <ol>
        <li>判 0</li>
        <li><span class="key">阶码相加</span></li>
        <li><span class="key">尾数相乘</span></li>
        <li>规格化、舍入、判溢出</li>
      </ol>

      <h4>三、浮点除法（零减除规）</h4>
      <ol>
        <li>判 0</li>
        <li><span class="key">阶码相减</span></li>
        <li><span class="key">尾数相除</span></li>
        <li>规格化、舍入、判溢出</li>
      </ol>

      <h4>加减 vs 乘除对比</h4>
      <table>
        <tr><th>运算</th><th>阶码操作</th><th>尾数操作</th><th>是否对阶</th></tr>
        <tr><td>加减</td><td>先<b>对阶</b>（小→大）</td><td>尾数加减</td><td>✅ 必须对阶</td></tr>
        <tr><td>乘法</td><td>阶码<b>相加</b></td><td>尾数相乘</td><td>❌ 不用对阶</td></tr>
        <tr><td>除法</td><td>阶码<b>相减</b></td><td>尾数相除</td><td>❌ 不用对阶</td></tr>
      </table>

      <div class="warn">⚠ 易错点：对阶永远是"小阶向大阶"、尾数右移；<b>只有加减法才需要对阶</b>，乘除直接算阶码。</div>
      <div class="tip">💡 极简 4 字速记：加减 = <b>零对尾规</b>（要对阶！小追大）｜乘法 = <b>零加乘规</b>｜除法 = <b>零减除规</b>。一句话：<b>加减要对阶，乘除不用对阶；乘阶加，除阶减。</b></div>
    `
  },
  {
    id: 5,
    category: "计算机组成",
    title: "浮点数表示范围 · 极值公式速记",

 = 1011₂（4位补码）
 → 真值 = -5</code></pre>

        <li><b>拼出新地址</b>：物理地址 = 帧号 × 页大小 + 页内偏移</li>
      </ol>
      <p>关键：<span class="key">偏移量原样照抄</span>，变的只是页号 → 帧号。</p>

    content: `
      <h4>符号定义</h4>
      <ul>
        <li><b>n₀</b>：叶子结点（度 = 0）；<b>n₁</b>：度为 1 的结点；<b>n₂</b>：度为 2 的结点；<b>N</b>：总结点数</li>
      </ul>

      <h4>公式 1｜二叉树通用恒等式</h4>
      <div class="formula">n₀ = n₂ + 1</div>
      <ul>
        <li>推导：n₂ = n₀ − 1</li>
        <li>含义：叶子结点永远比度为 2 的结点<b>多 1 个</b></li>
      </ul>

      <h4>公式 2｜完全二叉树独有约束</h4>
      <div class="formula">n₁ = 0 或 n₁ = 1</div>
      <ul><li>完全二叉树<b>最多只能有 1 个结点只有左孩子</b>，不可能有 2 个及以上 n₁</li></ul>

      <h4>公式 3｜总结点公式</h4>
      <div class="formula">N = n₀ + n₁ + n₂ = n₀ + n₁ + (n₀ − 1) = 2n₀ − 1 + n₁</div>
      <ul>
        <li>已知叶子求<b>最大</b>结点数（取 n₁ = 1）：<span class="key">N = 2n₀</span>（例：n₀ = 124 → 248）</li>
        <li>已知叶子求<b>最小</b>结点数（取 n₁ = 0）：<span class="key">N = 2n₀ − 1</span>（例：n₀ = 124 → 247）</li>
      </ul>

      <h4>公式 4｜已知 N 反推叶子</h4>
      <div class="formula">n₀ = ⌈N / 2⌉（向上取整）</div>
      <ul>
        <li>N 为偶数：n₀ = N/2，此时 n₁ = 1</li>
        <li>N 为奇数：n₀ = (N+1)/2，此时 n₁ = 0</li>
      </ul>

      <h4>公式 5｜顺序存储下标（从 1 开始编号）</h4>
      <div class="formula">父 i，左 2i，右 2i+1</div>
      <ul>
        <li>父结点下标 = ⌊i/2⌋</li>
        <li>2i &gt; N 时 i 是<b>叶子</b>（无左孩子）；2i+1 &gt; N 时<b>只有左孩子</b></li>
        <li>衍生结论：<b>最后一个非叶子（分支）结点编号 = ⌊N/2⌋</b>，其后全是叶子</li>
        <li>从 0 开始编号变体（如 C 数组）：左 2i+1，右 2i+2，父 ⌊(i−1)/2⌋</li>
      </ul>

      <div class="tip">💡 速记口诀：叶子定求总数——<b>最多乘二，最少乘二减一</b>；总数定求叶子——<b>对半向上取整</b>；单孩结点<b>要么 0 要么 1</b>；顺序存储<b>空位不能跳</b>。</div>

      <h4>典型真题自测</h4>
      <details class="q"><summary>1. 某完全二叉树共有 700 个结点，则叶子结点数为？</summary>
        <div class="ans"><p>n₀ = ⌈700/2⌉ = <b>350</b>（N 为偶数，n₁ = 1）</p></div>

      <details class="q"><summary>2. 一棵完全二叉树上有 701 个结点，则叶子结点数为？</summary>

      </details>
      <details class="q"><summary>4. 700 个结点的完全二叉树按层序从 1 编号，最后一个非叶子结点的编号是？</summary>
        <div class="ans"><p>⌊700/2⌋ = <b>350</b>，编号 351~700 全是叶子（共 350 个，与公式 4 呼应）。</p></div>
      </details>

      <div class="warn">⚠ 易错点：顺序存储中<b>空结点也占位</b>，下标不能跳；先看清从 0 还是 1 开始编号再套公式。</div>
    `

      </ul>

      <div class="formula">n₀ = 1 + Σ(度数 − 1) × 该度数结点数（n₁ 不出现）</div>
      <ul>
        <li>即叶子数 = 1 + 1×n₂ + 2×n₃ + 3×n₄ + …，<b>度为 1 的结点根本不影响结果</b></li>
        <li>二叉树特例：n₀ = 1 + n₂，正是经典恒等式 <b>n₀ = n₂ + 1</b>——本公式是它的推广</li>

    content: `
      <h4>基础名词先看懂</h4>
      <ul>
        <li><b>主键</b>：唯一标识一行的属性；<b>主属性</b>：出现在候选键里的字段；<b>非主属性</b>：不在候选键里的字段</li>
        <li><b>部分依赖</b>：主键是组合键，<b>只靠主键一部分</b>就能推出某个字段</li>
        <li><b>传递依赖</b>：A → B，B → C，且 B 不反过来推 A，则 C 传递依赖 A</li>
      </ul>

      <h4>四条判定规则（逐条往上套）</h4>
      <table>
        <tr><th>范式</th><th>规则</th><th>判定要点</th></tr>
        <tr><td><b>1NF</b></td><td>列不可再分，单元格只能存单个值</td><td>正常设计的二维表基本都满足</td></tr>
        <tr><td><b>2NF</b></td><td>消除非主属性对主键的<b>部分函数依赖</b></td><td><span class="key">单主键天然 2NF</span>；组合键若 (A,B)→C 且 A→C（C 只依赖一半）即违反；传递依赖仍允许</td></tr>
        <tr><td><b>3NF</b></td><td>消除非主属性对主键的<b>传递依赖</b></td><td>不允许主键 → X → 非主属性；做题实例：教师号→岗位，岗位→薪资，薪资是非主属性 → 只到 2NF；否则<b>冗余、插入/删除/修改异常</b></td></tr>
        <tr><td><b>BCNF</b></td><td>所有决定方都必须是候选键</td><td>连<b>主属性之间</b>的依赖都要清理；<span class="key">BCNF 一定是 3NF，反之不然</span></td></tr>
      </table>

      <h4>极简判断口诀（做题直接背）</h4>
      <ol>
        <li><b>1NF：单元格不拆分</b></li>
        <li><b>2NF：字段不能只靠主键一半推出；单主键天然 2NF</b></li>
        <li><b>3NF：非主属性不能隔层推导（干掉传递依赖）</b></li>
        <li><b>BCNF：所有决定方都必须是候选键，主属性也不能互相依赖</b></li>
      </ol>
      <p>一句话区分：1NF 单元格干净｜2NF 没有"沾一半主键就能确定的值"｜3NF <b>没有二手数据（传递得来的值）</b>｜BCNF 连主键内部都不能互相决定。</p>

      <h4>典型真题自测</h4>
      <details class="q"><summary>1. R(A, B, C)，函数依赖 F = {A→B, B→C}，则 R 最高属于第几范式？</summary>
        <div class="ans"><p><b>2NF</b>。单属性主键 A 天然满足 2NF；但 A→B→C，C 传递依赖 A → 不满足 3NF。</p></div>
      </details>
      <details class="q"><summary>2. R(A, B, C)，函数依赖 F = {AB→C, C→B}，则 R 最高属于？</summary>
        <div class="ans"><p><b>3NF</b>。候选键为 AB 和 AC，A、B、C 全是主属性（无非主属性）→ 满足 3NF；但 C→B 的决定方 C 不是候选键 → 不满足 BCNF。</p></div>
      </details>

      <div class="warn">⚠ 易错点：2NF 只禁止【组合主键带来的部分依赖】，<b>传递依赖依然允许</b>——别把 2NF 和 3NF 的考点弄混。</div>
    `

        <li><b>a</b> = 每次分成几个子问题（T 前面的<b>系数</b>）</li>
        <li><b>b</b> = 每个子问题规模缩到原来的几分之一（<b>分母</b>）</li>
        <li><b>f(n)</b> = 每次递归之外的合并/额外工作量</li>
      </ul>

      <h4>三步用法（保姆级）</h4>
      <ol>
        <li><b>认人</b>：从公式里找出 a、b、f(n)</li>
        <li><b>算临界值</b>：c = log<sub>b</sub>a，得到"递归方的量级" n<sup>c</sup>。<br>常用值：<code>log<sub>2</sub>2 = 1</code>、<code>log<sub>2</sub>4 = 2</code>、<code>log<sub>2</sub>1 = 0</code></li>
        <li><b>比大小</b>（f(n) 与 n<sup>c</sup> 谁大听谁的）：
          <ul>
            <li>f(n) <b>小于</b> n<sup>c</sup> → 答案 = <b>n<sup>c</sup></b>（递归主导）</li>
            <li>f(n) <b>等于</b> n<sup>c</sup> → 答案 = <b>n<sup>c</sup>·log n</b>（打平乘 log）</li>
            <li>f(n) <b>大于</b> n<sup>c</sup> → 答案 = <b>f(n)</b>（合并主导）</li>
          </ul>
        </li>
      </ol>
      <div class="formula">f 小取 n<sup>c</sup>，f 大取 f(n)，打平乘 log n</div>

      <h4>三个示范（照着走一遍就会）</h4>
      <table>
        <tr><th>递归式</th><th>拆出 a、b、f</th><th>临界值</th><th>比较</th><th>答案</th></tr>
        <tr><td>T(n)=2T(n/2)+n</td><td>a=2, b=2, f=n</td><td>log<sub>2</sub>2=1 → n</td><td>n = n（打平）</td><td><b>n·log n</b></td></tr>
        <tr><td>T(n)=4T(n/2)+n</td><td>a=4, b=2, f=n</td><td>log<sub>2</sub>4=2 → n<sup>2</sup></td><td>n &lt; n<sup>2</sup>（f 小）</td><td><b>n<sup>2</sup></b></td></tr>
        <tr><td>T(n)=T(n/2)+1</td><td>a=1, b=2, f=1</td><td>log<sub>2</sub>1=0 → 1</td><td>1 = 1（打平）</td><td><b>log n</b></td></tr>
      </table>

      <h4>为什么"打平乘 log"？（理解版，看懂就不用死背）</h4>
      <p>把递归想成一棵树：每层分成 a 份、每份缩成 1/b，树高共 <b>log<sub>b</sub>n</b> 层。</p>
      <ul>
        <li><b>打平时</b>（f=n 且 n<sup>c</sup>=n）：<b>每一层</b>的合并工作量都约等于 n，共 log n 层 → 总量 n·log n</li>
        <li><b>f 小时</b>：越往下每层工作量越小，大头是最底层的叶子（共 n<sup>c</sup> 个）→ n<sup>c</sup></li>
        <li><b>f 大时</b>：第一层合并就是 f(n)，后面各层更小 → f(n)</li>
      </ul>

      <h4>九大高频递归式秒查表（背这张）</h4>
      <table>
        <tr><th>递归式</th><th>临界值</th><th>判定</th><th>渐近紧界 Θ</th></tr>
        <tr><td>T(n)=2T(n/2)+n</td><td>n</td><td>打平</td><td><span class="key">n log n</span></td></tr>
        <tr><td>T(n)=2T(n/2)+n log n</td><td>n</td><td>f 带 log（打平加强版）</td><td><span class="key">n log<sup>2</sup>n</span></td></tr>
        <tr><td>T(n)=2T(n/2)+1</td><td>n</td><td>f 小</td><td><span class="key">n</span></td></tr>
        <tr><td>T(n)=2T(n/2)+n<sup>2</sup></td><td>n</td><td>f 大</td><td><span class="key">n<sup>2</sup></span></td></tr>
        <tr><td>T(n)=4T(n/2)+n</td><td>n<sup>2</sup></td><td>f 小</td><td><span class="key">n<sup>2</sup></span></td></tr>
        <tr><td>T(n)=4T(n/2)+n<sup>2</sup></td><td>n<sup>2</sup></td><td>打平</td><td><span class="key">n<sup>2</sup> log n</span></td></tr>
        <tr><td>T(n)=4T(n/2)+n<sup>3</sup></td><td>n<sup>2</sup></td><td>f 大</td><td><span class="key">n<sup>3</sup></span></td></tr>
        <tr><td>T(n)=T(n/2)+1</td><td>1</td><td>打平</td><td><span class="key">log n</span></td></tr>
        <tr><td>T(n)=T(n/2)+n</td><td>1</td><td>f 大</td><td><span class="key">n</span></td></tr>
      </table>

      <h4>经典算法对应（选择题秒杀）</h4>
      <ul>
        <li>T(n)=T(n/2)+1 → <b>二分查找</b> → O(log n)</li>
        <li>T(n)=2T(n/2)+n → <b>归并排序 / 快排平均情况</b> → O(n log n)</li>
      </ul>

      <div class="warn">⚠ 易错点：①别把 a、b 弄反——a 是 T 前面的<b>系数</b>（分几份），b 是<b>分母</b>（缩几倍）；②log<sub>2</sub>4 = <b>2</b> 不是 4；③ f(n)=n·log n 与 n<sup>c</sup>=n 只差一个 log 因子，属于"打平家族"→ log 次数 +1（n log<sup>2</sup>n），<b>不是</b> f 大！</div>
      <div class="tip">💡 口诀：<b>先算 log<sub>b</sub>a 得 n<sup>c</sup>；f 小取 n<sup>c</sup>，f 大取 f，打平乘 log；f 已带 log 就再乘一个。</b></div>

      <h4>典型真题自测</h4>
      <details class="q"><summary>1. 二分查找的递归式为 T(n)=T(n/2)+1，其时间复杂度为？</summary>
        <div class="ans"><p>a=1, b=2 → n<sup>c</sup> = n<sup>0</sup> = 1；f(n)=1 与 1 打平 → <b>Θ(log n)</b>。</p></div>
      </details>
      <details class="q"><summary>2. T(n)=4T(n/2)+n<sup>2</sup> 的渐近紧界是？</summary>
        <div class="ans"><p>a=4, b=2 → n<sup>c</sup> = n<sup>2</sup>；f(n)=n<sup>2</sup> 与之打平 → <b>Θ(n<sup>2</sup> log n)</b>。</p></div>
      </details>
      <details class="q"><summary>3. 归并排序的递归式为 T(n)=2T(n/2)+n，其时间复杂度为？</summary>
        <div class="ans"><p>n<sup>c</sup> = n，f(n)=n 打平 → <b>Θ(n log n)</b>。</p></div>
      </details>
    `
  },

    title: "事务隔离级别 · 四级递进与三类并发问题",
    tags: ["事务", "必考", "易混淆"],
    date: "2026-09-01",
    content: `
      <h4>先搞懂三个并发问题（前提）</h4>
      <table>
        <tr><th>问题</th><th>场景</th><th>本质</th></tr>
        <tr><td><b>脏读</b></td><td>读到了别人<b>未提交</b>的数据，对方一回滚，你读的就是错的</td><td>读了未提交</td></tr>
        <tr><td><b>不可重复读</b></td><td>同一事务内两次读<b>同一行</b>，结果不一样（别人改了并提交）</td><td>针对<b>改</b>（UPDATE）</td></tr>
        <tr><td><b>幻读</b></td><td>同一事务内两次<b>按同一条件查询</b>，行数变多/变少（别人插入或删除并提交）</td><td>针对<b>增删</b>（INSERT/DELETE）</td></tr>
      </table>

      <h4>四个隔离级别（安全从低 → 高，性能反过来）</h4>
      <table>
        <tr><th>隔离级别</th><th>中文</th><th>脏读</th><th>不可重复读</th><th>幻读</th></tr>
        <tr><td><b>READ UNCOMMITTED</b></td><td>读未提交</td><td>❌ 可能</td><td>❌ 可能</td><td>❌ 可能</td></tr>
        <tr><td><b>READ COMMITTED</b></td><td>读已提交</td><td>✅ 防住</td><td>❌ 可能</td><td>❌ 可能</td></tr>
        <tr><td><b>REPEATABLE READ</b></td><td>可重复读</td><td>✅ 防住</td><td>✅ 防住</td><td>❌ 可能</td></tr>
        <tr><td><b>SERIALIZABLE</b></td><td>串行化</td><td>✅ 防住</td><td>✅ 防住</td><td>✅ 防住</td></tr>
      </table>
      <ul>
        <li><b>READ UNCOMMITTED</b>：最低级，三个问题全允许（裸奔）</li>
        <li><b>READ COMMITTED</b>：解决<b>脏读</b>，还存在不可重复读、幻读</li>
        <li><b>REPEATABLE READ</b>：解决脏读 + 不可重复读，还会出现幻读（<span class="key">MySQL 默认级别</span>）</li>
        <li><b>SERIALIZABLE</b>：<span class="key">安全最高</span>，全部问题都禁止，事务串行执行，<b>性能最差</b></li>
      </ul>

      <div class="warn">⚠ 易错点：①<b>不可重复读 vs 幻读</b>——前者是别人<b>改</b>了某行（同一行两次读值不一样），后者是别人<b>增/删</b>了行（同一条件两次查行数不一样）；②MySQL 默认是 <b>REPEATABLE READ</b>（不是 READ COMMITTED）；③Oracle / SQL Server 默认是 READ COMMITTED。</div>
      <div class="tip">💡 口诀：<b>未提交全中招，读已防脏读，可重复防改读，串行全防最安全；安全越高，性能越差。</b></div>

      <h4>典型真题自测</h4>
      <details class="q"><summary>1. MySQL 数据库默认的事务隔离级别是？</summary>
        <div class="ans"><p><b>REPEATABLE READ（可重复读）</b>。解决了脏读和不可重复读，仍可能出现幻读。</p></div>
      </details>
      <details class="q"><summary>2. 事务 T1 两次执行同一查询，第二次发现多了一行（期间 T2 插入并提交），这种现象是？</summary>
        <div class="ans"><p><b>幻读</b>。针对<b>行数变化</b>（INSERT/DELETE）；若是同一行的<b>值</b>变了，才是不可重复读。</p></div>
      </details>
      <details class="q"><summary>3. 哪个隔离级别能同时防止脏读、不可重复读和幻读？</summary>
        <div class="ans"><p><b>SERIALIZABLE（串行化）</b>。安全性最高，但事务串行执行、性能最差。</p></div>
      </details>
    `
  },

    content: `
      <h4>三剑客对比表</h4>
      <table>
        <tr><th>排序</th><th>时间（平均）</th><th>最坏</th><th>稳定？</th><th>额外空间</th></tr>
        <tr><td><b>归并排序</b></td><td>n log n</td><td>n log n</td><td>✅ 稳定</td><td><span class="key">O(n)</span></td></tr>
        <tr><td><b>堆排序</b></td><td>n log n</td><td>n log n</td><td>❌ 不稳定</td><td><span class="key">O(1)</span></td></tr>
        <tr><td><b>快速排序</b></td><td>n log n</td><td><span class="key">O(n²)</span>（基本有序时）</td><td>❌ 不稳定</td><td><span class="key">O(log n)</span>（递归栈，平均）</td></tr>
      </table>

      <h4>记忆要点</h4>
      <ul>
        <li><b>归并</b>：稳定但要 O(n) 辅助数组（拿空间换稳定）</li>
        <li><b>堆</b>：空间最省 O(1)，但不稳定</li>
        <li><b>快排</b>：平均最快（常数因子小），但<b>基本有序时退化到 O(n²)</b>；空间是递归栈，平均 O(log n)、最坏 O(n)</li>
      </ul>

      <h4>稳定性全家族（顺带记住）</h4>
      <ul>
        <li>❌ 不稳定四兄弟：<b>快、选（选择）、堆、希（希尔）</b></li>
        <li>✅ 稳定：冒泡、插入、归并、基数</li>
      </ul>

      <div class="warn">⚠ 易错点：①快排<b>最坏</b> O(n²)（原序列基本有序 + 固定选首元素为基准），平均才是 O(n log n)；②快排的 O(log n) 空间是<b>平均</b>递归深度，最坏 O(n)；③归并是三者中<b>唯一稳定</b>的。</div>
      <div class="tip">💡 口诀：<b>归并稳定费空间，堆排省地不稳当，快排最快怕有序；不稳定家族——快选堆希。</b></div>

      <h4>典型真题自测</h4>
      <details class="q"><summary>1. 以下排序算法中，平均时间复杂度为 O(n log n) 且稳定的是？</summary>
        <div class="ans"><p><b>归并排序</b>。快排和堆排都不稳定。</p></div>
      </details>
      <details class="q"><summary>2. 对基本有序的数据排序，快排的时间复杂度会退化为？</summary>
        <div class="ans"><p><b>O(n²)</b>。每次划分极不均衡（一边 0 个、一边 n−1 个），要递归 n 层。</p></div>
      </details>
      <details class="q"><summary>3. 哪种排序算法的辅助空间为 O(1)？</summary>
        <div class="ans"><p><b>堆排序</b>。归并要 O(n)，快排平均 O(log n)（递归栈）。</p></div>
      </details>

      <h4>口诀拆解</h4>
      <ul>

        <li><b>有序别选快排</b>：基本有序时快排每趟划分一边为空 → 退化最坏 <b>O(n²)</b></li>

      <h4>谁爱有序、谁怕有序、谁无所谓</h4>
      <table>
        <tr><th>态度</th><th>排序</th><th>说明</th></tr>
        <tr><td>😍 爱有序（有序更快）</td><td><b>插入、冒泡</b></td><td>基本有序时最好 <span class="key">O(n)</span>；逆序时最坏 O(n²)</td></tr>

        <tr><td>😌 无所谓（好坏一样）</td><td><b>选择、归并、堆</b></td><td>选择恒 O(n²)；归并、堆恒 O(n log n)——<b>与初始状态无关</b></td></tr>
      </table>

      <div class="warn">⚠ 易错点：①<b>选择排序</b>最好最坏都是 O(n²)，比较次数与初始状态<b>无关</b>（每趟该扫的都得扫）；②"时间复杂度与初始序列无关"常考多选——<b>选择、归并、堆</b>；③快排最坏出现在<b>基本有序或基本逆序</b>，不只"有序"一种。</div>

    content: `
      <h4>口诀 1：死锁临界公式</h4>
      <div class="formula">n 个进程，每个最多需要 i 个资源：<br>n×(i−1) ≥ 资源总数 R → 达到死锁临界（最坏情况必死锁）<br>保证不死锁的最少资源数 = n×(i−1) + 1</div>
      <ul>
        <li><b>原理</b>：最坏情况是每个进程都拿到了 i−1 个（都差 1 个），谁也做不完 → 死锁</li>
        <li><b>多给 1 个</b>：任意一个进程凑够 i 个，跑完<b>释放全部</b>资源 → 大家都得救</li>
        <li>"至少多少资源保证不死锁"= n×(i−1)+1，软考高频计算题</li>
      </ul>

      <h4>口诀 2：信号量取值的含义</h4>
      <table>
        <tr><th>信号量 S</th><th>含义</th></tr>
        <tr><td><b>S &gt; 0</b></td><td>S = <b>可用资源数</b></td></tr>
        <tr><td><b>S = 0</b></td><td>资源刚好用完，<b>无进程等待</b></td></tr>
        <tr><td><b>S &lt; 0</b></td><td><span class="key">可用 = 0，|S| = 等待队列中的进程数</span></td></tr>
      </table>
      <ul>
        <li><b>P 操作</b>（wait）：S = S−1；若 S &lt; 0，进程<b>阻塞</b>入等待队列</li>
        <li><b>V 操作</b>（signal）：S = S+1；若 S ≤ 0，<b>唤醒</b>一个等待进程</li>
      </ul>

      <div class="warn">⚠ 易错点：①公式别记反——判断"会不会死锁"用 <b>R ≤ n×(i−1)</b>（可能死锁）；"保证不死锁至少多少资源"答 <b>n×(i−1)+1</b>；②S&lt;0 时别答"可用资源为负"——可用恒为 <b>0</b>，负号只用来数排队人数。</div>
      <div class="tip">💡 口诀：<b>死锁临界 n 乘 i 减 1，加 1 保证不死锁；信号量为负，可用归零，绝对值数排队人。</b></div>

      <h4>典型真题自测</h4>
      <details class="q"><summary>1. 某系统有 9 个进程，每个进程最多需要 4 个资源，系统至少需要多少个资源才能保证不发生死锁？</summary>
        <div class="ans"><p>n×(i−1)+1 = 9×3+1 = <b>28 个</b>。最坏时每进程占 3 个共 27 个，多出 1 个即可救全局。</p></div>
      </details>
      <details class="q"><summary>2. 信号量 S 的当前值为 −3，其含义是？</summary>
        <div class="ans"><p>可用资源 = <b>0</b>，等待队列中有 <b>3 个进程</b>。</p></div>
      </details>
      <details class="q"><summary>3. 3 个进程共享 12 个资源，每个进程最多需要几个资源时可能发生死锁？</summary>
        <div class="ans"><p>n×(i−1) ≥ 12 → 3(i−1) ≥ 12 → <b>i ≥ 5</b>。i=5 时最坏各占 4 个共 12 个，全部差 1 → 死锁。</p></div>
      </details>
    `

    title: "参数传递 · 传值调用 vs 传址调用",
    tags: ["参数传递", "必考", "代码题"],
    date: "2026-09-01",
    content: `
      <h4>口诀拆解</h4>
      <ul>
        <li><b>传值</b>：实参把<b>值的副本</b>给形参——<b>啥值都能传</b>（常量、变量、表达式都行）</li>
        <li><b>传址</b>：实参把<b>地址</b>给形参——<b>必须有地址</b>（常量、表达式没有地址，不能传）</li>
      </ul>

      <h4>对比表</h4>
      <table>
        <tr><th>对比项</th><th>传值调用</th><th>传址调用</th></tr>
        <tr><td>传递内容</td><td>值的<b>副本</b></td><td><b>地址</b></td></tr>
        <tr><td>形参修改实参？</td><td>❌ 不影响（改的是副本）</td><td>✅ 直接改实参的存储单元</td></tr>
        <tr><td>实参形式</td><td><span class="key">常量、变量、表达式都行</span></td><td><span class="key">必须"有地址"：变量取地址 &amp;x、数组名、指针</span></td></tr>
      </table>

      <h4>经典陷阱：swap 函数</h4>
      <pre><code>// 传值：改副本，交换失败
void swap(int x, int y) {
    int t = x; x = y; y = t;   // 实参 a、b 不变！
}

// 传址：改地址指向的单元，交换成功
void swap(int *x, int *y) {
    int t = *x; *x = *y; *y = t;  // 实参真正交换 ✓
}</code></pre>

      <h4>混合参数速算（真题常见形态）</h4>
      <pre><code>void f(int x, int *y) { x = x + 1; *y = *y + 1; }
int a = 1, b = 1;
f(a, &amp;b);                    // a 传值，b 传址
printf("%d %d", a, b);        // 输出 1 2</code></pre>
      <ul>
        <li>a 传<b>值</b> → 形参 x 改了也<b>不回传</b>，a 还是 1</li>
        <li>b 传<b>址</b> → *y 直接修改 b 的内存，b 变 2</li>
      </ul>

      <div class="warn">⚠ 易错点：①传址调用的实参<b>不能是常量和表达式</b>（它们没有地址）；②看到函数体内改形参，先问"传的什么"——<b>传值白改，传址真改</b>。</div>
      <div class="tip">💡 口诀：<b>传值传值，实参给形参，啥值都能传；传址传址，实参给地址，必须有地址。</b>做题版：传值白改，传址真改。</div>

      <h4>典型真题自测</h4>
      <details class="q"><summary>1. 传址调用时，以下不能作为实参的是？</summary>
        <div class="ans"><p><b>常量、表达式</b>（如 5、a+b）——它们没有地址；变量、数组名、指针都可以传址。</p></div>
      </details>
      <details class="q"><summary>2. 函数 f(int x, int *y) 内执行 x++; (*y)++; 实参 a=1 传值、b=1 传址，调用后 a、b 分别是？</summary>
        <div class="ans"><p>a = <b>1</b>（传值不改实参），b = <b>2</b>（传址直接修改）。</p></div>
      </details>
    `

    content: `
      <h4>五大运算速查（每年必考 1~2 分）</h4>
      <table>
        <tr><th>符号</th><th>名称</th><th>作用</th><th>记法</th></tr>
        <tr><td><b>σ</b>（sigma）</td><td>选择</td><td><span class="key">挑行</span>（筛选满足条件的记录）</td><td>σ<sub>条件</sub>(R)，行过滤</td></tr>
        <tr><td><b>π</b>（pi）</td><td>投影</td><td><span class="key">挑列</span>（取指定属性列）</td><td>π<sub>列名</sub>(R)，列过滤</td></tr>
        <tr><td><b>⋈</b></td><td>自然连接</td><td>按<b>同名列相等</b>拼接两表，去掉重复列</td><td>两个 R 合体</td></tr>
        <tr><td><b>×</b></td><td>笛卡尔积</td><td>两表所有行两两组合</td><td>全配对</td></tr>
        <tr><td><b>∪ ∩ −</b></td><td>并/交/差</td><td>集合运算（要求两表结构相同）</td><td>数学集合那套</td></tr>
      </table>

      <h4>关系代数 ↔ SQL 对照（真题套路）</h4>
      <table>
        <tr><th>SQL 写法</th><th>对应关系代数</th></tr>
        <tr><td>SELECT sno, name FROM ...</td><td><b>π</b>（投影，挑列）</td></tr>
        <tr><td>WHERE age &gt; 20</td><td><b>σ</b>（选择，挑行）</td></tr>
        <tr><td>FROM A, B / JOIN</td><td><b>×</b> 笛卡尔积 / <b>⋈</b> 连接</td></tr>
      </table>
      <p>执行顺序：<b>FROM（连接/积）→ WHERE（σ）→ SELECT（π）</b>，即"先拼表、再筛行、最后挑列"。</p>

      <h4>选择题秒杀技巧</h4>
      <ul>
        <li>表达式里 <b>σ 写在 ⋈ 之前</b> = 先筛选再连接（优化后效率更高，等价变换题最爱）</li>
        <li>π 的下标是<b>列</b>，σ 的下标是<b>条件</b>——看下标内容就能分辨</li>
        <li>自然连接 ⋈ = 笛卡尔积 + 按同名列相等筛选 + 去掉重复列</li>
      </ul>

      <div class="warn">⚠ 易错点：①σ 是行、π 是列，<b>别写反</b>；②笛卡尔积行数 = m×n，列数 = 两表列数<b>之和</b>；③投影运算可能<b>去掉重复行</b>。</div>
      <div class="tip">💡 口诀：<b>西格玛挑行，派挑列，连接按同名列；先连后选再投影（FROM → WHERE → SELECT）。</b></div>

      <h4>典型真题自测</h4>

    content: `
      <h4>三大分类速记</h4>
      <div class="formula">DDL 管结构（建库建表）｜DML 管数据（增删改查）｜DCL 管权限（授权回收）</div>
      <table>
        <tr><th>分类</th><th>全称</th><th>命令</th><th>一句话</th></tr>
        <tr><td><b>DDL</b></td><td>数据定义语言</td><td><span class="key">CREATE / ALTER / DROP</span></td><td>搭房子：建库、建表、建视图、改结构</td></tr>
        <tr><td><b>DML</b></td><td>数据操纵语言</td><td><span class="key">INSERT / UPDATE / DELETE / SELECT</span></td><td>住房子：对表里的数据增删改查</td></tr>
        <tr><td><b>DCL</b></td><td>数据控制语言</td><td><span class="key">GRANT / REVOKE</span></td><td>发钥匙：授权、收回权限</td></tr>
      </table>

      <h4>SQL 必背语法骨架（下午大题模板）</h4>
      <pre><code>-- 建表（DDL）：主键 + 外键约束是下午题必写
CREATE TABLE SC(
  sno CHAR(8),
  cno CHAR(6),
  grade INT,
  PRIMARY KEY (sno, cno),                    -- 组合主键
  FOREIGN KEY (sno) REFERENCES Student(sno)  -- 外键
);

-- 查询骨架（DML）：下午题第 2~3 题核心
SELECT 列, 聚合函数
FROM 表1, 表2
WHERE 表1.外键 = 表2.主键        -- 多表连接条件
  AND 行过滤条件
GROUP BY 分组列
HAVING 组过滤条件;               -- 带聚合函数的条件只能用 HAVING

-- 权限（DCL）
GRANT SELECT ON 表 TO 用户 WITH GRANT OPTION;  -- 允许转授
REVOKE SELECT ON 表 FROM 用户;                 -- 收回</code></pre>

      <h4>WHERE vs HAVING（高频易混）</h4>
      <ul>
        <li><b>WHERE</b>：过滤<b>原始行</b>，<b>不能用聚合函数</b></li>
        <li><b>HAVING</b>：过滤<b>分组后的结果</b>，可以带聚合函数（如 HAVING AVG(grade)&gt;80）</li>
        <li>执行顺序：<b>WHERE → GROUP BY → HAVING</b></li>
      </ul>

      <div class="warn">⚠ 易错点：①SELECT 考试归 <b>DML</b>（操纵数据）；②TRUNCATE 清空表属于 <b>DDL</b> 不是 DML；③WHERE 里写 AVG() 直接错——聚合条件必须放 <b>HAVING</b>；④GRANT 带 <b>WITH GRANT OPTION</b> 才允许把权限再转授给别人。</div>
      <div class="tip">💡 口诀：<b>DDL 定义建表忙，DML 增删改查上，DCL 授权管门房；行条件 WHERE，组条件 HAVING。</b></div>

      <h4>典型真题自测</h4>
      <details class="q"><summary>1. DROP、GRANT、UPDATE 分别属于哪类 SQL 语言？</summary>
        <div class="ans"><p>DROP → <b>DDL</b>，GRANT → <b>DCL</b>，UPDATE → <b>DML</b>。</p></div>
      </details>
      <details class="q"><summary>2. 查询平均成绩大于 80 的学生学号，聚合条件应写在哪个子句？</summary>
        <div class="ans"><p><b>HAVING</b>。聚合函数条件不能放 WHERE；顺序：WHERE 筛行 → GROUP BY 分组 → HAVING 筛组。</p></div>
      </details>
      <details class="q"><summary>3. 授权用户 A 查询权限并允许 A 转授给他人，语句怎么写？</summary>
        <div class="ans"><p>GRANT SELECT ON 表 TO A <b>WITH GRANT OPTION</b>。</p></div>
      </details>
    `
  },

      <h4>冷备份 vs 热备份（按"停不停机"分）</h4>
      <table>
        <tr><th>对比项</th><th>冷备份（离线备份）</th><th>热备份（在线备份）</th></tr>
        <tr><td>数据库状态</td><td><span class="key">关闭数据库后备份</span></td><td>数据库<b>运行中</b>备份</td></tr>

      <table>
        <tr><th>策略</th><th>备份内容</th><th>恢复方式</th><th>特点</th></tr>
        <tr><td><b>完全备份</b></td><td>全部数据</td><td>只需最近一次完全备份</td><td>最慢、最占空间、最安全</td></tr>
        <tr><td><b>增量备份</b></td><td>上次备份（<b>任意类型</b>）之后变化的数据</td><td>完全备份 + <span class="key">所有增量依次恢复</span></td><td>备份最快，恢复最麻烦，坏一个全完</td></tr>
        <tr><td><b>差量备份</b></td><td>上次<b>完全备份</b>之后变化的数据</td><td>完全备份 + <span class="key">最后一个差量</span></td><td>介于两者之间，恢复只需 2 份</td></tr>

      <div class="warn">⚠ 易错点：①增量以"上次备份"为基准（可能是完全/差量/增量），差量以"上次<b>完全</b>备份"为基准——这是两者的本质区别；②差量 = 差异，只备份与最近一次完全备份的差异部分。</div>

      </details>

    content: `
      <h4>数据仓库四大特征（必背）</h4>
      <div class="formula">面向主题的、集成的、<b>相对稳定（不可更新）</b>的、随时间变化的</div>
      <ul>

        <li><b>集成的</b>：把多个数据源的数据统一格式汇总进来</li>

        <li><b>随时间变化</b>：数据带时间维度，反映历史变化趋势</li>
      </ul>

      <h4>OLTP vs OLAP 对比（高频选择题）</h4>
      <table>
        <tr><th>对比项</th><th>OLTP（联机事务处理）</th><th>OLAP（联机分析处理）</th></tr>
        <tr><td>面向对象</td><td>操作人员 / 底层业务</td><td><span class="key">决策层 / 高层管理</span></td></tr>
        <tr><td>功能</td><td>日常事务：增删改（记账、下单）</td><td>数据分析：汇总、多维分析、支持决策</td></tr>
        <tr><td>数据</td><td>当前的、最新的明细数据</td><td><span class="key">历史的、 aggregated 汇总数据</span></td></tr>
        <tr><td>数据库类型</td><td>传统关系数据库</td><td><b>数据仓库</b></td></tr>
        <tr><td>典型问题</td><td>"今天这单谁买的"</td><td>"近三年各季度销量趋势"</td></tr>
      </table>

      <h4>数据挖掘四大任务（见到就归类）</h4>
      <table>
        <tr><th>任务</th><th>干啥</th><th>例子</th></tr>
        <tr><td><b>分类</b></td><td>按已知标签归类（<b>有监督</b>）</td><td>判断客户是否流失（是/否）</td></tr>
        <tr><td><b>聚类</b></td><td>无标签自动分组（<b>无监督</b>）</td><td>把客户按消费习惯分成几群</td></tr>
        <tr><td><b>关联规则</b></td><td>找"一起出现"的规律</td><td>买啤酒的人常买尿布</td></tr>
        <tr><td><b>预测/回归</b></td><td>预测连续数值</td><td>预测下月销售额</td></tr>
      </table>

      <div class="warn">⚠ 易错点：①数据仓库"相对稳定"指<b>不修改、不删除</b>，不是数据不变（会随时间增加）；②OLAP 用数据仓库，<b>OLTP 用普通数据库</b>，别配反；③分类有标签（监督）、聚类无标签（无监督）是经典辨析点。</div>
      <div class="tip">💡 口诀：<b>仓库四性：主题、集成、稳定、随时间；OLTP 管日常事务，OLAP 助高层决策；分类有标签，聚类自动抱团。</b></div>

      <h4>典型真题自测</h4>
      <details class="q"><summary>1. 数据仓库最核心的特征（与普通数据库最大的区别）是？</summary>
        <div class="ans"><p><b>相对稳定（不可更新）</b>——数据入库后基本不修改不删除，只做查询和汇总分析。</p></div>
      </details>
      <details class="q"><summary>2. 银行"分析近五年客户消费变化趋势以支持营销决策"属于 OLTP 还是 OLAP？</summary>
        <div class="ans"><p><b>OLAP</b>。面向决策层、分析历史汇总数据、基于数据仓库；OLTP 处理日常事务操作。</p></div>
      </details>
      <details class="q"><summary>3. 将客户自动分成几个消费群组，事先没有类别标签，属于哪种数据挖掘任务？</summary>
        <div class="ans"><p><b>聚类</b>（无监督）；若事先有"流失/不流失"标签再归类，则是分类。</p></div>
      </details>
    `
  },
  {
    id: 35,
    category: "计算机组成",
    title: "操作码 vs 地址码 · CPU 靠什么区分指令类型",
    tags: ["指令系统", "易混淆", "Day1小测"],
    date: "2026-09-04",
    content: `
      <h4>指令的两大组成部分</h4>
      <div class="formula">一条指令 = <b>操作码</b>（干什么） + <b>地址码</b>（对谁干、结果放哪）</div>

      <h4>考点辨析</h4>
      <ul>
        <li><b>操作码</b>：指出指令要完成的操作类型（取数、加法、跳转、存数…）→ CPU 区分指令类型<b>只看操作码</b></li>
        <li><b>地址码</b>：给出操作数或其地址（源操作数、目的操作数位置）</li>
      </ul>

      <h4>实战判别</h4>
      <ul>
        <li>题目问"区分取数指令还是加法指令的依据" → <b>操作码</b></li>
        <li>题目问"操作数存放在哪里" → 地址码 / 寻址方式</li>
      </ul>

      <div class="warn">⚠ 错因记录（2026-09-04 Day1 小测）：把"区分指令类型的依据"错选为"地址码"。地址码只是"对谁干"，不决定"干什么"。</div>
      <div class="tip">💡 记忆类比：外卖单上，<b>操作码 = 要做红烧肉</b>（做什么），<b>地址码 = 送到哪栋楼</b>（对谁干）。CPU 看的是"做什么"。</div>
    `
  }
];
/* ═══════════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const LS_KEY = 'rkgc_study_progress_v1';
let progress = {};   // { id: { mastered: bool, starred: bool } }
let curFilter = 'all';
let curCat = '全部';

try { progress = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch(e) { progress = {}; }
function saveProgress() { localStorage.setItem(LS_KEY, JSON.stringify(progress)); }
function pstate(id) {
  if (!progress[id]) progress[id] = { mastered:false, starred:false };
  return progress[id];
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderCats() {
  const counts = {};
  NOTES.forEach(n => counts[n.category] = (counts[n.category] || 0) + 1);
  const cats = ['全部', ...Object.keys(counts)];
  $('cats').innerHTML = cats.map(c => {
    const cnt = c === '全部' ? NOTES.length : counts[c];
    const active = c === curCat ? ' active' : '';
    return `<button class="cat-btn${active}" onclick="setCat('${esc(c)}')">${esc(c)}<span class="count">${cnt}</span></button>`;
  }).join('');
}

function noteVisible(n) {
  const st = pstate(n.id);
  if (curCat !== '全部' && n.category !== curCat) return false;
  if (curFilter === 'unmastered' && st.mastered) return false;
  if (curFilter === 'starred' && !st.starred) return false;
  const q = $('search').value.trim().toLowerCase();
  if (q) {
    const hay = (n.title + ' ' + n.tags.join(' ') + ' ' + n.category + ' ' + n.content.replace(/<[^>]+>/g, ' ')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function renderNotes() {
  const list = NOTES.filter(noteVisible);
  if (!list.length) {
    $('notes').innerHTML = '<div class="empty"><b>没有匹配的知识点</b>换个关键词或筛选条件试试</div>';
    return;
  }
  $('notes').innerHTML = list.map(n => {
    const st = pstate(n.id);
    const cls = (st.mastered ? ' mastered' : '') + (st.starred ? ' starred' : '');
    const tags = n.tags.map(t => `<span class="badge tag">${esc(t)}</span>`).join('');
    return `
    <article class="note${cls}">
      <div class="note-head">
        <h3 class="note-title">${esc(n.title)}</h3>
        <button class="mini-btn star-btn${st.starred ? ' on' : ''}" onclick="toggleStar(${n.id})" title="标记重点">★</button>
      </div>
      <div class="note-meta">
        <span class="badge">${esc(n.category)}</span>${tags}
        <span class="badge date">${esc(n.date)}</span>
        ${st.mastered ? '<span class="badge" style="background:#ecfdf5;color:#047857;border-color:#a7f3d0">✓ 已掌握</span>' : ''}
      </div>
      <div class="note-body" id="body-${n.id}">${n.content}</div>
      <div class="note-foot">
        <button class="mini-btn toggle" onclick="toggleBody(${n.id}, this)">展开全文</button>
        <button class="mini-btn master-btn${st.mastered ? ' on' : ''}" onclick="toggleMastered(${n.id})">${st.mastered ? '✓ 已掌握' : '标记掌握'}</button>
      </div>
    </article>`;
  }).join('');
}

function renderStats() {
  const total = NOTES.length;
  const mastered = NOTES.filter(n => pstate(n.id).mastered).length;
  const starred = NOTES.filter(n => pstate(n.id).starred).length;
  $('statTotal').textContent = total;
  $('statMastered').textContent = mastered;
  $('statStarred').textContent = starred;
  $('progressFill').style.width = total ? (mastered / total * 100).toFixed(1) + '%' : '0%';
}

function renderAll() { renderCats(); renderNotes(); renderStats(); }

function setFilter(f, btn) {
  curFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderNotes();
}
function setCat(c) { curCat = c; renderCats(); renderNotes(); }
function toggleBody(id, btn) {
  const body = $('body-' + id);
  body.classList.toggle('expanded');
  btn.textContent = body.classList.contains('expanded') ? '收起' : '展开全文';
}
function toggleMastered(id) {
  pstate(id).mastered = !pstate(id).mastered;
  saveProgress(); renderNotes(); renderStats();
}
function toggleStar(id) {
  pstate(id).starred = !pstate(id).starred;
  saveProgress(); renderNotes(); renderStats();
}

$('search').addEventListener('input', renderNotes);
renderAll();
</script>
</body>
</html>
