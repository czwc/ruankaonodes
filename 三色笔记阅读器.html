<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8fa">
<title>三色笔记阅读器｜软考软件设计师</title>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
:root{--bg:#edf0f2;--paper:#fff;--text:#17212b;--muted:#65717c;--line:#d8dee3;--brand:#087f5b;--brand-dark:#066649;--toolbar:#fff;--danger:#b23a3a;--shadow:0 14px 38px rgba(23,33,43,.14)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;overflow:hidden}button,input{font:inherit}.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:100;background:#fff;padding:8px;border:2px solid var(--brand)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}.toolbar{position:relative;z-index:20;display:flex;align-items:center;gap:8px;min-height:58px;padding:8px 14px;background:var(--toolbar);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(23,33,43,.06)}.title{min-width:190px;margin-right:auto}.title strong{display:block;font-size:14px}.title span{display:block;font-size:11px;color:var(--muted)}
.icon-btn,.text-btn{height:38px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);cursor:pointer}.icon-btn{width:38px;font-size:18px}.text-btn{padding:0 12px;font-weight:700;font-size:12px}.icon-btn:hover,.text-btn:hover{border-color:var(--brand);color:var(--brand)}button:disabled{opacity:.42;cursor:not-allowed}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.primary:hover{background:var(--brand-dark);color:#fff}.page-control{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}.page-control input{width:55px;height:36px;border:1px solid var(--line);border-radius:5px;text-align:center;color:var(--text)}.page-control input:focus{outline:3px solid rgba(8,127,91,.16);border-color:var(--brand)}.zoom-label{min-width:48px;text-align:center;font-size:12px;color:var(--muted)}
.workspace{min-height:0;display:grid;grid-template-columns:230px 1fr}.sidebar{min-height:0;background:#f8fafb;border-right:1px solid var(--line);display:flex;flex-direction:column}.side-head{padding:14px;border-bottom:1px solid var(--line)}.side-head strong{display:block;font-size:13px}.side-head span{font-size:11px;color:var(--muted)}.thumbs{min-height:0;overflow:auto;padding:10px}.thumb{width:100%;display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center;padding:7px;margin-bottom:6px;border:1px solid transparent;border-radius:6px;background:transparent;text-align:left;cursor:pointer;color:var(--text)}.thumb:hover{background:#fff;border-color:var(--line)}.thumb.active{background:#e5f4ee;border-color:#8fcdb9}.thumb canvas{display:block;width:58px;height:auto;background:#fff;box-shadow:0 2px 7px rgba(23,33,43,.12)}.thumb b{font-size:12px}.thumb small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.viewer{position:relative;min-width:0;min-height:0;overflow:auto;display:grid;place-items:start center;padding:28px}.page-wrap{position:relative;background:var(--paper);box-shadow:var(--shadow);line-height:0}.page-wrap canvas{display:block;max-width:none}.loading,.empty{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:var(--bg);padding:24px}.loading[hidden],.empty[hidden]{display:none}.message{max-width:600px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px;text-align:center;box-shadow:var(--shadow)}.message h1{font-size:22px;margin:0 0 8px}.message p{color:var(--muted);font-size:13px;margin:7px 0}.message .actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}.drop{margin-top:18px;padding:22px;border:2px dashed var(--line);border-radius:7px;color:var(--muted);font-size:12px}.drop.drag{border-color:var(--brand);background:#eaf7f2;color:var(--brand)}.error{color:var(--danger)!important}.spinner{width:34px;height:34px;border:4px solid #dce5e1;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
.progress-line{height:3px;position:absolute;left:0;right:0;bottom:-1px;background:transparent}.progress-line span{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}.mobile-title{display:none}.file-input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:780px){.toolbar{flex-wrap:wrap;padding:7px 9px}.title{display:none}.mobile-title{display:block;margin-right:auto;font-weight:800;font-size:13px}.workspace{grid-template-columns:1fr}.sidebar{position:absolute;z-index:15;top:58px;bottom:0;left:0;width:230px;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.viewer{padding:16px}.text-btn.file-label{padding:0 9px}.toolbar .hide-mobile{display:none}.page-control input{width:48px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}@media print{.toolbar,.sidebar,.empty,.loading{display:none!important}.app,.workspace{display:block;height:auto}.viewer{display:block;overflow:visible;padding:0}.page-wrap{box-shadow:none}.page-wrap canvas{max-width:100%;height:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#viewer">跳到笔记页面</a>
<div class="app">
<header class="toolbar">
  <button class="icon-btn" id="sidebarBtn" type="button" title="显示或隐藏缩略图" aria-label="显示或隐藏缩略图">☰</button>
  <div class="title"><strong>三色笔记阅读器</strong><span id="fileStatus">准备加载本地笔记</span></div><span class="mobile-title">三色笔记</span>
  <button class="icon-btn" id="prevBtn" type="button" title="上一页" aria-label="上一页">←</button>
  <div class="page-control"><label for="pageInput">第</label><input id="pageInput" type="number" min="1" value="1" inputmode="numeric"><span>/ <b id="pageCount">0</b> 页</span></div>
  <button class="icon-btn" id="nextBtn" type="button" title="下一页" aria-label="下一页">→</button>
  <button class="icon-btn hide-mobile" id="zoomOutBtn" type="button" title="缩小" aria-label="缩小">−</button><span class="zoom-label hide-mobile" id="zoomLabel">100%</span><button class="icon-btn hide-mobile" id="zoomInBtn" type="button" title="放大" aria-label="放大">＋</button>
  <button class="text-btn hide-mobile" id="fitBtn" type="button">适合宽度</button>
  <label class="text-btn primary file-label" for="fileInput">选择 PDF</label><input class="file-input" id="fileInput" type="file" accept="application/pdf,.pdf">
  <button class="icon-btn hide-mobile" id="fullBtn" type="button" title="全屏" aria-label="全屏">⛶</button>
  <div class="progress-line"><span id="progressLine"></span></div>
</header>
<div class="workspace">
  <aside class="sidebar" id="sidebar" aria-label="页面缩略图"><div class="side-head"><strong>页面目录</strong><span id="sideMeta">加载后可快速跳页</span></div><div class="thumbs" id="thumbs"></div></aside>
  <main class="viewer" id="viewer">
    <div class="page-wrap" id="pageWrap"><canvas id="pageCanvas"></canvas></div>
    <div class="loading" id="loading" hidden><div class="message"><div class="spinner"></div><strong id="loadingText">正在读取笔记...</strong></div></div>
    <div class="empty" id="empty"><div class="message"><h1>打开三色笔记</h1><p>本地运行时会自动尝试加载你已拥有的 PDF。公开网站不会包含该教辅原文件，你可以选择自己合法持有的副本。</p><div class="actions"><label class="text-btn primary file-label" for="fileInput">选择本机 PDF</label><button class="text-btn" id="retryBtn" type="button">重新尝试本地文件</button></div><div class="drop" id="dropZone">也可以把 PDF 拖到这里<br>文件只在当前浏览器中读取，不会上传</div><p class="error" id="errorText"></p></div></div>
  </main>
</div>
</div>
<script>
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const LOCAL_PDF='软考学习资料/software_designer/05. 软件设计师 学霸笔记/04、一本通三色笔记软件设计师笔记130页.pdf';
const PROGRESS_KEY='ruankao_tricolor_reader_v1';
const $=id=>document.getElementById(id);
const state={pdf:null,page:1,scale:1.15,renderTask:null,renderSeq:0,source:'',thumbObserver:null};
const ui={canvas:$('pageCanvas'),wrap:$('pageWrap'),viewer:$('viewer'),loading:$('loading'),loadingText:$('loadingText'),empty:$('empty'),error:$('errorText'),pageInput:$('pageInput'),pageCount:$('pageCount'),prev:$('prevBtn'),next:$('nextBtn'),zoomLabel:$('zoomLabel'),thumbs:$('thumbs'),sidebar:$('sidebar'),fileStatus:$('fileStatus'),progress:$('progressLine'),sideMeta:$('sideMeta')};
function saved(){try{return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}')}catch{return{}}}
function persist(){try{localStorage.setItem(PROGRESS_KEY,JSON.stringify({page:state.page,scale:state.scale,updated:Date.now()}))}catch(_){}}
function setBusy(on,text='正在读取笔记...'){ui.loading.hidden=!on;ui.loadingText.textContent=text}
function setError(text){ui.error.textContent=text||''}
function updateControls(){const ready=!!state.pdf;ui.prev.disabled=!ready||state.page<=1;ui.next.disabled=!ready||state.page>=state.pdf.numPages;ui.pageInput.disabled=!ready;ui.pageInput.value=state.page;ui.pageCount.textContent=ready?state.pdf.numPages:0;ui.zoomLabel.textContent=Math.round(state.scale*100)+'%';ui.progress.style.width=ready?(state.page/state.pdf.numPages*100)+'%':'0%';ui.sideMeta.textContent=ready?`共 ${state.pdf.numPages} 页 · 当前第 ${state.page} 页`:'加载后可快速跳页'}
async function openDocument(source,label){setError('');setBusy(true,'正在载入 PDF...');try{if(state.pdf){await state.pdf.destroy();state.pdf=null}const task=pdfjsLib.getDocument(source);state.pdf=await task.promise;state.source=label;const old=saved();state.page=Math.min(Math.max(Number(old.page)||1,1),state.pdf.numPages);state.scale=Math.min(Math.max(Number(old.scale)||1.15,.55),2.5);ui.empty.hidden=true;ui.fileStatus.textContent=label+' · '+state.pdf.numPages+' 页';buildThumbs();await renderPage();}catch(error){console.error(error);state.pdf=null;ui.empty.hidden=false;setError(label.includes('本地')?'未找到本地 PDF，请点击“选择本机 PDF”。':'PDF 无法读取，请确认文件没有损坏。');updateControls()}finally{setBusy(false)}}
async function renderPage(){if(!state.pdf)return;const seq=++state.renderSeq;setBusy(true,`正在渲染第 ${state.page} 页...`);try{const page=await state.pdf.getPage(state.page);if(seq!==state.renderSeq)return;const viewport=page.getViewport({scale:state.scale});const ratio=Math.min(window.devicePixelRatio||1,2);ui.canvas.width=Math.floor(viewport.width*ratio);ui.canvas.height=Math.floor(viewport.height*ratio);ui.canvas.style.width=Math.floor(viewport.width)+'px';ui.canvas.style.height=Math.floor(viewport.height)+'px';const ctx=ui.canvas.getContext('2d',{alpha:false});ctx.setTransform(ratio,0,0,ratio,0,0);if(state.renderTask)state.renderTask.cancel();state.renderTask=page.render({canvasContext:ctx,viewport});await state.renderTask.promise;state.renderTask=null;ui.viewer.scrollTo({top:0,left:Math.max(0,(viewport.width-ui.viewer.clientWidth)/2),behavior:'instant'});persist();updateControls();markThumb();}catch(error){if(error&&error.name!=='RenderingCancelledException')setError('该页渲染失败，请重试。')}finally{if(seq===state.renderSeq)setBusy(false)}}
function go(page){if(!state.pdf)return;const target=Math.min(Math.max(Math.round(Number(page)||1),1),state.pdf.numPages);if(target===state.page){ui.pageInput.value=target;return}state.page=target;renderPage()}
function zoom(delta){state.scale=Math.min(Math.max(state.scale+delta,.55),2.5);renderPage()}
async function fitWidth(){if(!state.pdf)return;const page=await state.pdf.getPage(state.page);const base=page.getViewport({scale:1});state.scale=Math.min(Math.max((ui.viewer.clientWidth-40)/base.width,.55),2.5);renderPage()}
function buildThumbs(){ui.thumbs.innerHTML='';if(state.thumbObserver)state.thumbObserver.disconnect();state.thumbObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting)renderThumb(entry.target)}),{root:ui.thumbs,rootMargin:'160px'});for(let i=1;i<=state.pdf.numPages;i++){const b=document.createElement('button');b.type='button';b.className='thumb';b.dataset.page=i;b.innerHTML=`<canvas aria-hidden="true"></canvas><span><b>第 ${i} 页</b><small>${Math.round(i/state.pdf.numPages*100)}% 进度</small></span>`;b.addEventListener('click',()=>{go(i);if(innerWidth<=780)ui.sidebar.classList.remove('open')});ui.thumbs.appendChild(b);state.thumbObserver.observe(b)}markThumb()}
async function renderThumb(button){if(button.dataset.rendered||!state.pdf)return;button.dataset.rendered='1';try{const page=await state.pdf.getPage(Number(button.dataset.page));const viewport=page.getViewport({scale:.14});const canvas=button.querySelector('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport}).promise}catch(_){button.dataset.rendered=''}}
function markThumb(){ui.thumbs.querySelectorAll('.thumb.active').forEach(x=>x.classList.remove('active'));const active=ui.thumbs.querySelector(`[data-page="${state.page}"]`);if(active){active.classList.add('active');active.scrollIntoView({block:'nearest'})}}
async function openFile(file){if(!file)return;if(file.type&&file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){setError('请选择 PDF 文件。');return}try{const data=await file.arrayBuffer();await openDocument({data},file.name)}catch(error){console.error(error);setError('无法读取所选文件，请重新选择。')}}
$('fileInput').addEventListener('change',e=>openFile(e.target.files[0]));ui.prev.addEventListener('click',()=>go(state.page-1));ui.next.addEventListener('click',()=>go(state.page+1));ui.pageInput.addEventListener('change',()=>go(ui.pageInput.value));$('zoomOutBtn').addEventListener('click',()=>zoom(-.15));$('zoomInBtn').addEventListener('click',()=>zoom(.15));$('fitBtn').addEventListener('click',fitWidth);$('sidebarBtn').addEventListener('click',()=>ui.sidebar.classList.toggle('open'));$('retryBtn').addEventListener('click',()=>openDocument(encodeURI(LOCAL_PDF),'本地三色笔记'));$('fullBtn').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());
const drop=$('dropZone');['dragenter','dragover'].forEach(name=>drop.addEventListener(name,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(name=>drop.addEventListener(name,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>openFile(e.dataTransfer.files[0]));document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(state.page-1)}if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(state.page+1)}if(e.key==='Home'){e.preventDefault();go(1)}if(e.key==='End'&&state.pdf){e.preventDefault();go(state.pdf.numPages)}if(e.key==='+'||e.key==='=')zoom(.15);if(e.key==='-')zoom(-.15)});window.addEventListener('resize',()=>{if(innerWidth<=780)ui.sidebar.classList.remove('open')});updateControls();openDocument(encodeURI(LOCAL_PDF),'本地三色笔记');
</script>
<script src="system-shell.js"></script>
</body>
</html>
