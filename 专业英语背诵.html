<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6c5ce7">
<title>专业英语每日背</title>
<style>
:root{--primary:#6c5ce7;--primary-dark:#5a4bd1;--primary-light:#a29bfe;--accent:#fd79a8;--bg:#0f0f23;--card-bg:#1a1a2e;--card-bg2:#16213e;--text:#e8e8f0;--text-dim:#8888aa;--success:#00b894;--warning:#fdcb6e;--danger:#e17055;--radius:16px;--shadow:0 8px 32px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:100;background:rgba(15,15,35,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--primary-light),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar .stats{display:flex;gap:12px;font-size:12px;color:var(--text-dim);align-items:center}
.topbar .stats span{display:flex;align-items:center;gap:3px}
.topbar .stats b{color:var(--primary-light);font-size:14px}
.progress-bar{height:3px;background:rgba(255,255,255,.06);position:relative}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s ease;border-radius:0 3px 3px 0}
.container{max-width:560px;margin:0 auto;padding:16px;padding-bottom:100px}
.mode-tabs{display:flex;gap:6px;margin-bottom:12px}
.mode-tab{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:var(--card-bg);color:var(--text-dim);font-size:13px;cursor:pointer;transition:all .2s;text-align:center}
.mode-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.categories{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;-ms-overflow-style:none;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.08);background:var(--card-bg);color:var(--text-dim);font-size:13px;cursor:pointer;transition:all .25s;white-space:nowrap}
.cat-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 14px rgba(108,92,231,.4)}
.stats-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat-card{background:var(--card-bg);border-radius:12px;padding:14px 10px;text-align:center;border:1px solid rgba(255,255,255,.04)}
.stat-card .num{font-size:24px;font-weight:800}
.stat-card .desc{font-size:11px;color:var(--text-dim);margin-top:4px}
.stat-card.s1 .num{color:var(--success)}
.stat-card.s2 .num{color:var(--warning)}
.stat-card.s3 .num{color:var(--primary-light)}
.card-area{perspective:1200px;margin:16px 0}
.card{position:relative;width:100%;min-height:380px;border-radius:var(--radius);transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;top:0;left:0;width:100%;min-height:380px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.card-front{background:linear-gradient(145deg,var(--card-bg),var(--card-bg2));border:1px solid rgba(108,92,231,.15)}
.card-back{background:linear-gradient(145deg,#1e1e3a,#1a1a3e);border:1px solid rgba(253,121,168,.15);transform:rotateY(180deg);overflow-y:auto}
.word{font-size:32px;font-weight:800;color:#fff;text-align:center;word-break:break-word;line-height:1.2}
.phonetic{font-size:15px;color:var(--primary-light);margin-top:8px;font-style:italic}
.pos-tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;margin-top:10px;background:rgba(108,92,231,.2);color:var(--primary-light)}
.speak-btn{margin-top:18px;width:52px;height:52px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(108,92,231,.45);transition:transform .15s}
.speak-btn:active{transform:scale(.9)}
.speak-btn.speaking{animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 20px rgba(108,92,231,.45)}50%{box-shadow:0 6px 30px rgba(108,92,231,.8)}}
.hint{margin-top:16px;font-size:12px;color:var(--text-dim)}
.back-label{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;align-self:flex-start}
.back-meaning{font-size:17px;color:var(--text);line-height:1.6;margin-bottom:14px;align-self:flex-start}
.back-example{font-size:14px;color:var(--primary-light);line-height:1.5;margin-bottom:8px;align-self:flex-start;font-style:italic}
.back-example-trans{font-size:13px;color:var(--text-dim);line-height:1.5;align-self:flex-start;margin-bottom:14px}
.mnemonic-box{align-self:stretch;margin-top:6px;padding:12px 14px;border-radius:12px;background:rgba(253,203,110,.08);border-left:3px solid var(--warning);margin-bottom:12px}
.mnemonic-label{font-size:11px;color:var(--warning);font-weight:700;margin-bottom:4px}
.mnemonic-text{font-size:13px;color:var(--text);line-height:1.5}
.exam-box{align-self:stretch;padding:12px 14px;border-radius:12px;background:rgba(0,184,148,.08);border-left:3px solid var(--success)}
.exam-label{font-size:11px;color:var(--success);font-weight:700;margin-bottom:4px}
.exam-text{font-size:13px;color:var(--text);line-height:1.5}
.action-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(15,15,35,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.06);padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;max-width:560px;margin:0 auto}
.action-btn{flex:1;padding:14px 8px;border-radius:14px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:4px}
.action-btn .icon{font-size:20px}
.action-btn .label{font-size:11px}
.btn-again{background:rgba(225,112,85,.15);color:var(--danger);border:1px solid rgba(225,112,85,.3)}
.btn-hard{background:rgba(253,203,110,.15);color:var(--warning);border:1px solid rgba(253,203,110,.3)}
.btn-good{background:rgba(0,184,148,.15);color:var(--success);border:1px solid rgba(0,184,148,.3)}
.btn-easy{background:rgba(108,92,231,.15);color:var(--primary-light);border:1px solid rgba(108,92,231,.3)}
.action-btn:active{transform:scale(.95)}
.complete-screen{display:none;text-align:center;padding:40px 20px}
.complete-screen.show{display:block}
.complete-icon{font-size:64px;margin-bottom:16px}
.complete-title{font-size:22px;font-weight:700;margin-bottom:8px}
.complete-sub{font-size:14px;color:var(--text-dim);margin-bottom:24px}
.complete-btn{padding:14px 32px;border-radius:14px;border:none;background:var(--primary);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(108,92,231,.4);margin:0 6px}
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end;justify-content:center}
.settings-overlay.show{display:flex}
.settings-panel{width:100%;max-width:560px;background:var(--card-bg);border-radius:20px 20px 0 0;padding:24px 20px;padding-bottom:max(24px,env(safe-area-inset-bottom));animation:slideUp .3s ease;max-height:80vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.settings-panel h2{font-size:18px;margin-bottom:16px;text-align:center}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.setting-row label{font-size:14px}
.setting-row select{background:var(--card-bg2);color:var(--text);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 10px;font-size:13px}
.setting-row input[type=range]{-webkit-appearance:none;width:120px;height:4px;border:none;background:var(--primary);border-radius:2px}
.setting-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--primary-light);cursor:pointer}
.settings-close{width:100%;margin-top:16px;padding:14px;border-radius:14px;border:none;background:var(--primary);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--card-bg);border:1px solid rgba(108,92,231,.3);border-radius:12px;padding:10px 20px;font-size:14px;z-index:300;opacity:0;transition:all .3s;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.list-mode{display:none}
.list-mode.show{display:block}
.search-box{width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:var(--card-bg);color:var(--text);font-size:14px;margin-bottom:12px}
.search-box::placeholder{color:var(--text-dim)}
.word-item{background:var(--card-bg);border-radius:12px;padding:14px 16px;margin-bottom:8px;border:1px solid rgba(255,255,255,.04);display:flex;align-items:center;gap:12px;transition:all .2s;cursor:pointer}
.word-item:active{transform:scale(.98)}
.word-item .wi-word{font-size:16px;font-weight:600;flex:1}
.word-item .wi-meaning{font-size:13px;color:var(--text-dim);flex:2}
.word-item .wi-speak{width:36px;height:36px;border-radius:50%;border:none;background:rgba(108,92,231,.15);color:var(--primary-light);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.word-item .wi-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.word-item .wi-status.new{background:var(--text-dim)}
.word-item .wi-status.learning{background:var(--warning)}
.word-item .wi-status.mastered{background:var(--success)}
.card-mode.hidden{display:none}
/* 测验模式 */
.quiz-mode{display:none}
.quiz-mode.show{display:block}
.quiz-card{background:var(--card-bg);border-radius:var(--radius);padding:24px 20px;margin:16px 0;box-shadow:var(--shadow);border:1px solid rgba(108,92,231,.15)}
.quiz-q{font-size:15px;color:var(--text-dim);margin-bottom:8px}
.quiz-word{font-size:24px;font-weight:700;color:#fff;margin-bottom:20px}
.quiz-options{display:flex;flex-direction:column;gap:10px}
.quiz-opt{padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:var(--card-bg2);color:var(--text);font-size:15px;cursor:pointer;transition:all .2s;text-align:left}
.quiz-opt:active{transform:scale(.98)}
.quiz-opt.correct{background:rgba(0,184,148,.15);border-color:var(--success);color:var(--success)}
.quiz-opt.wrong{background:rgba(225,112,85,.15);border-color:var(--danger);color:var(--danger)}
.quiz-result{display:none;text-align:center;padding:40px 20px}
.quiz-result.show{display:block}
.quiz-score{font-size:48px;font-weight:800;color:var(--primary-light);margin-bottom:8px}
.quiz-score-label{font-size:14px;color:var(--text-dim);margin-bottom:24px}
.swipe-hint{text-align:center;font-size:11px;color:var(--text-dim);margin-top:8px}
@media(max-width:380px){.word{font-size:26px}.action-btn .label{font-size:10px}}
</style>
</head>
<body>

<div class="topbar">
  <h1>📖 专业英语每日背</h1>
  <div class="stats">
    <span>🔥<b id="streak">0</b>天</span>
    <span>✅<b id="todayDone">0</b>/<b id="todayTotal">0</b></span>
    <span id="settingsBtn" style="cursor:pointer;font-size:18px">⚙️</span>
  </div>
</div>
<div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>

<div class="container">
  <div class="mode-tabs">
    <div class="mode-tab active" id="tabCard">📇 卡片</div>
    <div class="mode-tab" id="tabList">📋 列表</div>
    <div class="mode-tab" id="tabQuiz">📝 测验</div>
  </div>
  <div class="categories" id="categories"></div>
  <div class="stats-panel">
    <div class="stat-card s1"><div class="num" id="masteredCount">0</div><div class="desc">已掌握</div></div>
    <div class="stat-card s2"><div class="num" id="learningCount">0</div><div class="desc">学习中</div></div>
    <div class="stat-card s3"><div class="num" id="newCount">0</div><div class="desc">未学习</div></div>
  </div>

  <div class="card-mode" id="cardMode">
    <div class="card-area">
      <div class="card" id="card">
        <div class="card-face card-front">
          <div class="word" id="wordText"></div>
          <div class="phonetic" id="phonetic"></div>
          <div class="pos-tag" id="posTag"></div>
          <button class="speak-btn" id="speakBtn" onclick="event.stopPropagation()">🔊</button>
          <div class="hint">点击卡片查看释义 · 左右滑动切换</div>
        </div>
        <div class="card-face card-back">
          <div class="back-label">释义</div>
          <div class="back-meaning" id="meaning"></div>
          <div class="back-label">例句</div>
          <div class="back-example" id="example"></div>
          <div class="back-example-trans" id="exampleTrans"></div>
          <div class="mnemonic-box">
            <div class="mnemonic-label">💡 记忆技巧</div>
            <div class="mnemonic-text" id="mnemonic"></div>
          </div>
          <div class="exam-box">
            <div class="exam-label">🎯 考点提示</div>
            <div class="exam-text" id="examPoint"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="swipe-hint">⬅️ 上一个 · 右滑下一个 ➡️</div>
  </div>

  <div class="list-mode" id="listMode">
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 搜索单词或释义...">
    <div id="wordList"></div>
  </div>

  <div class="quiz-mode" id="quizMode">
    <div id="quizContent"></div>
    <div class="quiz-result" id="quizResult">
      <div class="complete-icon">📊</div>
      <div class="quiz-score" id="quizScore">0/0</div>
      <div class="quiz-score-label">测验完成！</div>
      <button class="complete-btn" id="quizRestartBtn">再测一次</button>
    </div>
  </div>

  <div class="complete-screen" id="completeScreen">
    <div class="complete-icon">🎉</div>
    <div class="complete-title">今日学习完成！</div>
    <div class="complete-sub" id="completeSub">你今天学习了 0 个单词</div>
    <button class="complete-btn" id="restartBtn">再学一轮</button>
    <button class="complete-btn" id="goQuizBtn" style="background:var(--accent)">去做测验</button>
  </div>
</div>

<div class="action-bar" id="actionBar">
  <button class="action-btn btn-again" data-grade="0"><span class="icon">😵</span><span class="label">不会</span></button>
  <button class="action-btn btn-hard" data-grade="1"><span class="icon">🤔</span><span class="label">困难</span></button>
  <button class="action-btn btn-good" data-grade="2"><span class="icon">🙂</span><span class="label">良好</span></button>
  <button class="action-btn btn-easy" data-grade="3"><span class="icon">😎</span><span class="label">简单</span></button>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <h2>⚙️ 设置</h2>
    <div class="setting-row"><label>🔊 语音引擎</label><select id="voiceEngineSelect"><option value="auto" selected>自动（推荐）</option><option value="online">在线语音</option><option value="system">系统语音</option></select></div>
    <div class="setting-row"><label>🔊 语音语速</label><input type="range" id="rateSlider" min="0.5" max="1.5" step="0.1" value="0.8"></div>
    <div class="setting-row"><label>🗣️ 发音口音</label><select id="voiceSelect"><option value="en-US">美式英语</option><option value="en-GB">英式英语</option><option value="en-AU">澳式英语</option></select></div>
    <div class="setting-row"><label>📊 每日新词数</label><select id="dailySelect"><option value="10">10个</option><option value="15">15个</option><option value="20" selected>20个</option><option value="30">30个</option><option value="50">50个</option></select></div>
    <div class="setting-row"><label>🔄 自动播放</label><select id="autoPlaySelect"><option value="0" selected>关闭</option><option value="1">开启</option></select></div>
    <div class="setting-row"><label>📤 导出进度</label><button id="exportBtn" style="background:rgba(108,92,231,.15);color:var(--primary-light);border:1px solid rgba(108,92,231,.3);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer">导出</button></div>
    <div class="setting-row"><label>📥 导入进度</label><button id="importBtn" style="background:rgba(0,184,148,.15);color:var(--success);border:1px solid rgba(0,184,148,.3);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer">导入</button></div>
    <div class="setting-row"><label>🗑️ 重置进度</label><button id="resetBtn" style="background:rgba(225,112,85,.15);color:var(--danger);border:1px solid rgba(225,112,85,.3);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer">重置</button></div>
    <button class="settings-close" id="settingsCloseBtn">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===================== 词库 =====================
var WORDS=[
{cat:"软件工程",word:"requirement",phonetic:"/rɪˈkwaɪərmənt/",pos:"n.",meaning:"需求，要求",example:"The requirement analysis is the first step.",exampleTrans:"需求分析是第一步。",mnemonic:"require(要求)+ment(名词后缀)→需求",examPoint:"软考常考需求分析阶段的活动。区分功能需求与非功能需求。"},
{cat:"软件工程",word:"specification",phonetic:"/ˌspesɪfɪˈkeɪʃn/",pos:"n.",meaning:"规格说明，规范",example:"The software specification document defines the system behavior.",exampleTrans:"软件规格说明文档定义了系统行为。",mnemonic:"specify(指定)的名词形式→详细指定→规格说明",examPoint:"软件需求规格说明书(SRS)是需求阶段的核心交付物，常出现在英语填空题中。"},
{cat:"软件工程",word:"maintenance",phonetic:"/ˈmeɪntənəns/",pos:"n.",meaning:"维护，保养",example:"Software maintenance accounts for a large portion of the cost.",exampleTrans:"软件维护占成本的很大一部分。",mnemonic:"maintain(维持)+ance→维护",examPoint:"软件维护占软件生命周期成本的60%以上。四种维护类型：改正性、适应性、完善性、预防性。完善性维护占比最大。"},
{cat:"软件工程",word:"verification",phonetic:"/ˌverɪfɪˈkeɪʃn/",pos:"n.",meaning:"验证",example:"Verification ensures the product meets its design specifications.",exampleTrans:"验证确保产品符合设计规格。",mnemonic:"verify(核实)→verification 验证（是否做对了产品）",examPoint:"V&V：Verification=验证（是否正确地构造了产品），Validation=确认（是否构造了正确的产品）。高频考点！"},
{cat:"软件工程",word:"validation",phonetic:"/ˌvælɪˈdeɪʃn/",pos:"n.",meaning:"确认，有效性验证",example:"Validation ensures the product meets user needs.",exampleTrans:"确认确保产品满足用户需求。",mnemonic:"valid(有效的)→validation 确认（是否做了对的产品）",examPoint:"与verification成对出现。Validation关注'是否满足用户需求'，Verification关注'是否符合规格说明'。"},
{cat:"软件工程",word:"prototype",phonetic:"/ˈproʊtətaɪp/",pos:"n.",meaning:"原型，样机",example:"We built a prototype to test the concept.",exampleTrans:"我们构建了一个原型来测试概念。",mnemonic:"proto(原始)+type(类型)→原型",examPoint:"原型模型分抛弃式和演化式两种。抛弃式原型用于明确需求后丢弃，演化式原型最终演变为产品。"},
{cat:"软件工程",word:"iteration",phonetic:"/ˌɪtəˈreɪʃn/",pos:"n.",meaning:"迭代，反复",example:"Agile development uses short iterations.",exampleTrans:"敏捷开发使用短迭代。",mnemonic:"iterate(反复)的名词→迭代",examPoint:"迭代模型与瀑布模型的对比是高频考点。迭代模型每次迭代都产生可运行的增量。"},
{cat:"软件工程",word:"increment",phonetic:"/ˈɪŋkrəmənt/",pos:"n.",meaning:"增量，递增",example:"Each increment adds new functionality to the product.",exampleTrans:"每个增量给产品增加新功能。",mnemonic:"in(进入)+crease(增长)→增量",examPoint:"增量模型：每个增量发布一个可交付版本。与迭代模型的区别是常考点。"},
{cat:"软件工程",word:"deliverable",phonetic:"/dɪˈlɪvərəbl/",pos:"n.",meaning:"可交付成果",example:"The deliverable for this phase is the design document.",exampleTrans:"本阶段的可交付成果是设计文档。",mnemonic:"deliver(交付)+able(可…的)→可交付的",examPoint:"每个开发阶段都有对应的deliverable，如需求阶段的SRS、设计阶段的SDD。"},
{cat:"软件工程",word:"milestone",phonetic:"/ˈmaɪlstoʊn/",pos:"n.",meaning:"里程碑",example:"We reached a major milestone in the project.",exampleTrans:"我们达到了项目的一个主要里程碑。",mnemonic:"mile(英里)+stone(石头)→里程碑",examPoint:"里程碑是项目进度跟踪的关键节点，通常标志一个阶段的完成。"},
{cat:"软件工程",word:"lifecycle",phonetic:"/ˈlaɪfˌsaɪkl/",pos:"n.",meaning:"生命周期",example:"The software lifecycle includes requirements, design, coding, testing, and maintenance.",exampleTrans:"软件生命周期包括需求、设计、编码、测试和维护。",mnemonic:"life(生命)+cycle(循环)→生命周期",examPoint:"软件生命周期模型（瀑布、螺旋、增量、迭代）是必考内容。"},
{cat:"软件工程",word:"spiral",phonetic:"/ˈspaɪrəl/",pos:"n./adj.",meaning:"螺旋（的）",example:"The spiral model emphasizes risk analysis.",exampleTrans:"螺旋模型强调风险分析。",mnemonic:"spiral(螺旋)→螺旋模型",examPoint:"螺旋模型四阶段：制定计划→风险分析→实施工程→客户评估。最大特点是风险驱动。"},
{cat:"面向对象",word:"encapsulation",phonetic:"/ɪnˌkæpsjuˈleɪʃn/",pos:"n.",meaning:"封装",example:"Encapsulation hides the internal state of an object.",exampleTrans:"封装隐藏了对象的内部状态。",mnemonic:"capsule(胶囊)→把东西装进胶囊→封装",examPoint:"面向对象三大特性之一。封装=数据+操作封装在一起，隐藏内部细节，仅通过接口访问。"},
{cat:"面向对象",word:"inheritance",phonetic:"/ɪnˈherɪtəns/",pos:"n.",meaning:"继承",example:"Inheritance allows a subclass to reuse parent class code.",exampleTrans:"继承允许子类复用父类代码。",mnemonic:"inherit(继承)的名词形式",examPoint:"OO三大特性之一。单继承vs多继承、继承的is-a关系是常考点。"},
{cat:"面向对象",word:"polymorphism",phonetic:"/ˌpɒlɪˈmɔːfɪzəm/",pos:"n.",meaning:"多态",example:"Polymorphism allows methods to have different behaviors.",exampleTrans:"多态允许方法有不同的行为。",mnemonic:"poly(多)+morph(形态)+ism→多态",examPoint:"OO三大特性之一。多态分静态多态（重载）和动态多态（重写+虚函数）。"},
{cat:"面向对象",word:"abstraction",phonetic:"/æbˈstrækʃn/",pos:"n.",meaning:"抽象",example:"Abstraction focuses on essential features.",exampleTrans:"抽象关注本质特征。",mnemonic:"abs(离开)+tract(拉)→从具体中抽出→抽象",examPoint:"抽象是OO的基础。抽象类不能实例化，抽象方法必须在子类中实现。"},
{cat:"面向对象",word:"instantiation",phonetic:"/ɪnˌstænʃiˈeɪʃn/",pos:"n.",meaning:"实例化",example:"Object instantiation creates an instance of a class.",exampleTrans:"对象实例化创建类的实例。",mnemonic:"instance(实例)→instantiate→实例化",examPoint:"类是模板，对象是实例。实例化=创建对象的过程。"},
{cat:"面向对象",word:"constructor",phonetic:"/kənˈstrʌktər/",pos:"n.",meaning:"构造函数",example:"The constructor initializes the object state.",exampleTrans:"构造函数初始化对象状态。",mnemonic:"construct(构造)+or→构造者/构造函数",examPoint:"构造函数与类同名，无返回值，在创建对象时自动调用。"},
{cat:"面向对象",word:"destructor",phonetic:"/dɪˈstrʌktər/",pos:"n.",meaning:"析构函数",example:"The destructor releases resources when the object is destroyed.",exampleTrans:"析构函数在对象销毁时释放资源。",mnemonic:"de(反)+struct(构造)→析构",examPoint:"析构函数在对象生命周期结束时自动调用，用于释放资源。"},
{cat:"面向对象",word:"overriding",phonetic:"/ˌoʊvərˈraɪdɪŋ/",pos:"n.",meaning:"重写，覆盖",example:"Method overriding redefines a parent class method.",exampleTrans:"方法重写重新定义父类方法。",mnemonic:"over(覆盖)+ride(骑)→骑在上面覆盖→重写",examPoint:"重写(override)vs重载(overload)的区别是高频考点！重写是子类重新定义父类方法，重载是同类同名不同参。"},
{cat:"面向对象",word:"overloading",phonetic:"/ˌoʊvərˈloʊdɪŋ/",pos:"n.",meaning:"重载",example:"Function overloading allows same name with different parameters.",exampleTrans:"函数重载允许同名不同参数。",mnemonic:"over(过度)+load(装载)→装太多→重载",examPoint:"重载发生在编译时（静态绑定），重写发生在运行时（动态绑定）。"},
{cat:"数据结构",word:"algorithm",phonetic:"/ˈælgərɪðəm/",pos:"n.",meaning:"算法",example:"This algorithm has O(n log n) complexity.",exampleTrans:"该算法的复杂度为O(n log n)。",mnemonic:"以波斯数学家al-Khwarizmi命名",examPoint:"算法的五个特性：有穷性、确定性、可行性、输入、输出。常考填空。"},
{cat:"数据结构",word:"recursion",phonetic:"/rɪˈkɜːrʃn/",pos:"n.",meaning:"递归",example:"Recursion solves problems by self-reference.",exampleTrans:"递归通过自我引用解决问题。",mnemonic:"re(回)+cur(跑)→跑回来→递归",examPoint:"递归必须有终止条件，否则栈溢出。常见递归：阶乘、斐波那契、树的遍历。"},
{cat:"数据结构",word:"traversal",phonetic:"/trævərsəl/",pos:"n.",meaning:"遍历",example:"Tree traversal visits every node exactly once.",exampleTrans:"树的遍历访问每个节点恰好一次。",mnemonic:"travel(旅行)→traversal遍历",examPoint:"二叉树遍历：前序(根左右)、中序(左根右)、后序(左右根)。前序+中序可唯一确定一棵树。"},
{cat:"数据结构",word:"stack",phonetic:"/stæk/",pos:"n.",meaning:"栈",example:"A stack follows the LIFO principle.",exampleTrans:"栈遵循后进先出原则。",mnemonic:"stack=一叠盘子→栈（后进先出）",examPoint:"栈是LIFO结构。应用：函数调用、表达式求值、括号匹配、递归。"},
{cat:"数据结构",word:"queue",phonetic:"/kjuː/",pos:"n.",meaning:"队列",example:"A queue follows the FIFO principle.",exampleTrans:"队列遵循先进先出原则。",mnemonic:"queue读音同Q→排队→队列",examPoint:"队列是FIFO结构。循环队列、优先队列是常考点。"},
{cat:"数据结构",word:"linked list",phonetic:"/lɪŋkt lɪst/",pos:"n.",meaning:"链表",example:"A linked list allows dynamic memory allocation.",exampleTrans:"链表允许动态内存分配。",mnemonic:"link(链接)+list(列表)→链表",examPoint:"链表vs数组的区别：链表插入删除O(1)，数组随机访问O(1)。"},
{cat:"数据结构",word:"hash table",phonetic:"/hæʃ ˈteɪbl/",pos:"n.",meaning:"哈希表",example:"A hash table provides O(1) average lookup time.",exampleTrans:"哈希表提供O(1)平均查找时间。",mnemonic:"hash(切碎)→把数据切碎映射→哈希",examPoint:"哈希冲突解决方法：开放地址法、链地址法。哈希表平均查找O(1)。"},
{cat:"数据结构",word:"complexity",phonetic:"/kəmˈpleksəti/",pos:"n.",meaning:"复杂度",example:"Time complexity measures algorithm efficiency.",exampleTrans:"时间复杂度衡量算法效率。",mnemonic:"complex(复杂的)→complexity复杂度",examPoint:"时间复杂度排序：O(1)<O(logn)<O(n)<O(nlogn)<O(n²)<O(2ⁿ)<O(n!)。常考比较。"},
{cat:"数据结构",word:"asymptotic",phonetic:"/ˌeɪsɪmˈtɒtɪk/",pos:"adj.",meaning:"渐近的",example:"Asymptotic notation describes algorithm growth rate.",exampleTrans:"渐近记号描述算法增长率。",mnemonic:"a(向)+sym(同)+totic→渐近趋向",examPoint:"大O记号表示上界，Ω表示下界，Θ表示确界。"},
{cat:"操作系统",word:"concurrency",phonetic:"/kənˈkʌrənsi/",pos:"n.",meaning:"并发",example:"Concurrency allows multiple tasks to make progress.",exampleTrans:"并发允许多个任务同时推进。",mnemonic:"con(共同)+cur(跑)→一起跑→并发",examPoint:"并发vs并行：并发是宏观同时微观交替，并行是真正同时（多核）。"},
{cat:"操作系统",word:"synchronization",phonetic:"/ˌsɪŋkrənaɪˈzeɪʃn/",pos:"n.",meaning:"同步",example:"Synchronization prevents race conditions.",exampleTrans:"同步防止竞态条件。",mnemonic:"syn(同)+chron(时间)→同步",examPoint:"PV操作实现进程同步与互斥。互斥信号量初值为1，同步信号量初值为0。"},
{cat:"操作系统",word:"deadlock",phonetic:"/ˈdedlɒk/",pos:"n.",meaning:"死锁",example:"Deadlock occurs when processes wait for each other.",exampleTrans:"当进程互相等待时发生死锁。",mnemonic:"dead(死)+lock(锁)→死锁",examPoint:"死锁四必要条件：互斥、请求保持、不剥夺、环路等待。破坏任一即可预防死锁。高频！"},
{cat:"操作系统",word:"semaphore",phonetic:"/ˈseməfɔːr/",pos:"n.",meaning:"信号量",example:"A semaphore controls access to shared resources.",exampleTrans:"信号量控制对共享资源的访问。",mnemonic:"sema(信号)+phore(携带)→信号量",examPoint:"PV操作：P=wait(S=S-1)，V=signal(S=S+1)。S>0时进程可进入，S<=0时进程阻塞。下午题必考！"},
{cat:"操作系统",word:"scheduling",phonetic:"/ˈʃedjuːlɪŋ/",pos:"n.",meaning:"调度",example:"CPU scheduling determines which process runs next.",exampleTrans:"CPU调度决定下一个运行的进程。",mnemonic:"schedule(时间表)→scheduling调度",examPoint:"调度算法：FCFS、SJF、RR、优先级调度。常考平均周转时间计算。"},
{cat:"操作系统",word:"interrupt",phonetic:"/ˌɪntəˈrʌpt/",pos:"n./v.",meaning:"中断",example:"An interrupt signals the CPU to handle an event.",exampleTrans:"中断通知CPU处理事件。",mnemonic:"inter(在中间)+rupt(断)→中断",examPoint:"中断分为硬件中断和软件中断。中断处理过程：保存现场→处理中断→恢复现场。"},
{cat:"操作系统",word:"virtual",phonetic:"/ˈvɜːrtʃuəl/",pos:"adj.",meaning:"虚拟的",example:"Virtual memory extends physical memory capacity.",exampleTrans:"虚拟内存扩展物理内存容量。",mnemonic:"virtue(效能)→virtual虚拟的",examPoint:"虚拟内存通过分页/分段实现。页面置换算法：FIFO、LRU、OPT。LRU是常考点。"},
{cat:"操作系统",word:"throughput",phonetic:"/ˈθruːpʊt/",pos:"n.",meaning:"吞吐量",example:"The system throughput is measured in transactions per second.",exampleTrans:"系统吞吐量以每秒事务数衡量。",mnemonic:"through(通过)+put(放)→通过的量→吞吐量",examPoint:"吞吐量=单位时间内完成的进程数。与周转时间、响应时间一起考。"},
{cat:"操作系统",word:"fragmentation",phonetic:"/ˌfræɡmenˈteɪʃn/",pos:"n.",meaning:"碎片（化）",example:"External fragmentation wastes memory between allocated blocks.",exampleTrans:"外部碎片浪费了已分配块之间的内存。",mnemonic:"fragment(碎片)→fragmentation碎片化",examPoint:"内部碎片=分配了没用，外部碎片=没分配但太小不能用。紧凑技术解决外部碎片。"},
{cat:"数据库",word:"transaction",phonetic:"/trænˈzækʃn/",pos:"n.",meaning:"事务",example:"A transaction must satisfy ACID properties.",exampleTrans:"事务必须满足ACID特性。",mnemonic:"trans(跨越)+action(行动)→事务",examPoint:"ACID：原子性、一致性、隔离性、持久性。四个特性全称是必考填空题！"},
{cat:"数据库",word:"normalization",phonetic:"/ˌnɔːrməlaɪˈzeɪʃn/",pos:"n.",meaning:"规范化",example:"Normalization eliminates data redundancy.",exampleTrans:"规范化消除数据冗余。",mnemonic:"normal(正常)→normalization规范化",examPoint:"范式：1NF→2NF→3NF→BCNF。BCNF消除了主属性对码的部分和传递依赖。"},
{cat:"数据库",word:"redundancy",phonetic:"/rɪˈdʌndənsi/",pos:"n.",meaning:"冗余",example:"Data redundancy wastes storage space.",exampleTrans:"数据冗余浪费存储空间。",mnemonic:"re(再)+dund(多余)→冗余",examPoint:"规范化目的就是消除冗余，但冗余不一定是坏事（如反规范化提升查询性能）。"},
{cat:"数据库",word:"integrity",phonetic:"/ɪnˈteɡrəti/",pos:"n.",meaning:"完整性",example:"Referential integrity ensures valid foreign keys.",exampleTrans:"参照完整性确保外键有效。",mnemonic:"integer(完整)→integrity完整性",examPoint:"三种完整性：实体完整性(主键)、参照完整性(外键)、用户定义完整性。"},
{cat:"数据库",word:"constraint",phonetic:"/kənˈstreɪnt/",pos:"n.",meaning:"约束",example:"A primary key constraint ensures uniqueness.",exampleTrans:"主键约束确保唯一性。",mnemonic:"con(一起)+strain(拉紧)→约束",examPoint:"常见约束：PRIMARY KEY、FOREIGN KEY、UNIQUE、NOT NULL、CHECK。"},
{cat:"数据库",word:"schema",phonetic:"/ˈskiːmə/",pos:"n.",meaning:"模式，架构",example:"The database schema defines the table structure.",exampleTrans:"数据库模式定义了表结构。",mnemonic:"scheme(方案)→schema模式",examPoint:"三级模式：外模式(用户视图)、模式(逻辑结构)、内模式(物理存储)。两级映像保证数据独立性。"},
{cat:"数据库",word:"query",phonetic:"/ˈkwɪri/",pos:"n./v.",meaning:"查询",example:"SQL queries retrieve data from tables.",exampleTrans:"SQL查询从表中检索数据。",mnemonic:"query=question(问题)→查询",examPoint:"SQL查询语句：SELECT...FROM...WHERE...GROUP BY...HAVING...ORDER BY。执行顺序是考点。"},
{cat:"数据库",word:"index",phonetic:"/ˈɪndeks/",pos:"n.",meaning:"索引",example:"An index speeds up database queries.",exampleTrans:"索引加快数据库查询。",mnemonic:"in(进入)+dex(指示)→索引",examPoint:"索引类型：B+树索引、哈希索引。索引提升查询但降低更新速度。"},
{cat:"数据库",word:"candidacy",phonetic:"/ˈkændɪdəsi/",pos:"n.",meaning:"候选",example:"A candidate key minimally identifies a tuple.",exampleTrans:"候选键最小地标识一个元组。",mnemonic:"candidate(候选人)→candidacy候选",examPoint:"候选键→选一个作主键。主键属性非空且唯一。超键包含候选键。"},
{cat:"网络",word:"protocol",phonetic:"/ˈproʊtəkɒl/",pos:"n.",meaning:"协议",example:"TCP is a reliable transport protocol.",exampleTrans:"TCP是可靠的传输协议。",mnemonic:"proto(第一)+col→协议",examPoint:"OSI七层模型各层协议：物理层(PPP)、数据链路层(HDLC)、网络层(IP)、传输层(TCP/UDP)、应用层(HTTP/FTP/SMTP)。"},
{cat:"网络",word:"packet",phonetic:"/ˈpækɪt/",pos:"n.",meaning:"数据包",example:"Data is transmitted in packets across the network.",exampleTrans:"数据以数据包形式在网络中传输。",mnemonic:"pack(打包)→packet小包",examPoint:"数据在网络层被封装为数据包(packet)，在传输层为报文段(segment)。"},
{cat:"网络",word:"routing",phonetic:"/ˈruːtɪŋ/",pos:"n.",meaning:"路由",example:"Routing determines the path for data packets.",exampleTrans:"路由决定数据包的路径。",mnemonic:"route(路线)→routing路由",examPoint:"路由协议：RIP(距离向量)、OSPF(链路状态)、BGP(路径向量)。RIP最大跳数15。"},
{cat:"网络",word:"bandwidth",phonetic:"/ˈbændwɪdθ/",pos:"n.",meaning:"带宽",example:"Higher bandwidth allows faster data transfer.",exampleTrans:"更高带宽允许更快的数据传输。",mnemonic:"band(频带)+width(宽度)→带宽",examPoint:"奈奎斯特定理(无噪声)和香农定理(有噪声)是计算带宽上限的公式。"},
{cat:"网络",word:"encryption",phonetic:"/ɪnˈkrɪpʃn/",pos:"n.",meaning:"加密",example:"Encryption protects data confidentiality.",exampleTrans:"加密保护数据机密性。",mnemonic:"en(使)+crypt(隐藏)→加密",examPoint:"对称加密(DES/AES)vs非对称加密(RSA)。对称加密速度快但密钥分发困难。"},
{cat:"网络",word:"authentication",phonetic:"/ɔːˌθentɪˈkeɪʃn/",pos:"n.",meaning:"认证，身份验证",example:"Authentication verifies user identity.",exampleTrans:"认证验证用户身份。",mnemonic:"auth(真实)→authentication认证",examPoint:"认证(authentication)vs授权(authorization)：认证=你是谁，授权=你能做什么。"},
{cat:"网络",word:"firewall",phonetic:"/ˈfaɪərwɔːl/",pos:"n.",meaning:"防火墙",example:"A firewall blocks unauthorized network access.",exampleTrans:"防火墙阻止未授权的网络访问。",mnemonic:"fire(火)+wall(墙)→防火墙",examPoint:"防火墙工作在网络层和传输层，过滤规则基于IP地址和端口号。"},
{cat:"网络",word:"socket",phonetic:"/ˈsɒkɪt/",pos:"n.",meaning:"套接字",example:"A socket is an endpoint for network communication.",exampleTrans:"套接字是网络通信的端点。",mnemonic:"socket(插座)→像插座一样连接→套接字",examPoint:"Socket=IP地址+端口号。TCP三次握手建立连接，四次挥手释放连接。"},
{cat:"网络",word:"topology",phonetic:"/təˈpɒlədʒi/",pos:"n.",meaning:"拓扑",example:"Common network topologies include star, bus, and ring.",exampleTrans:"常见网络拓扑包括星型、总线型和环型。",mnemonic:"topo(地方)+logy(学科)→拓扑",examPoint:"网络拓扑：总线型、星型、环型、树型、网状。星型最常用，中心节点故障则全网瘫痪。"},
{cat:"设计模式",word:"singleton",phonetic:"/ˈsɪŋɡltən/",pos:"n.",meaning:"单例模式",example:"The singleton pattern ensures only one instance exists.",exampleTrans:"单例模式确保只有一个实例存在。",mnemonic:"single(单一)→singleton单例",examPoint:"创建型模式。确保一个类只有一个实例，提供全局访问点。"},
{cat:"设计模式",word:"observer",phonetic:"/əbˈzɜːrvər/",pos:"n.",meaning:"观察者",example:"The observer pattern notifies subscribers of changes.",exampleTrans:"观察者模式通知订阅者变化。",mnemonic:"observe(观察)→observer观察者",examPoint:"行为型模式。一对多依赖关系，状态变化时通知所有观察者。MVC中用到。"},
{cat:"设计模式",word:"factory",phonetic:"/ˈfæktəri/",pos:"n.",meaning:"工厂模式",example:"The factory pattern creates objects without specifying the class.",exampleTrans:"工厂模式创建对象而不指定类。",mnemonic:"factory(工厂)→生产对象→工厂模式",examPoint:"创建型模式。分简单工厂、工厂方法、抽象工厂三种。"},
{cat:"设计模式",word:"adapter",phonetic:"/əˈdæptər/",pos:"n.",meaning:"适配器",example:"The adapter pattern converts one interface to another.",exampleTrans:"适配器模式将一个接口转换为另一个。",mnemonic:"adapt(适应)→adapter适配器",examPoint:"结构型模式。适配器让不兼容的接口协同工作。类适配器vs对象适配器。"},

// ===================== 状态管理 =====================
var STORAGE_KEY='pro_english_v2';
var _memStore={}; // 内存备份，防止localStorage不可用时崩溃
var _lsOK=false;
try{localStorage.setItem('_test','1');localStorage.removeItem('_test');_lsOK=true;}catch(e){_lsOK=false;}

var state={category:'全部',cardIndex:0,todayQueue:[],learned:{},settings:{rate:0.8,voice:'en-US',daily:20,autoPlay:0,voiceEngine:'auto'},streak:0,lastStudyDate:'',mode:'card',quizIndex:0,quizScore:0,quizQuestions:[]};

function loadState(){
  try{
    var s=_lsOK?localStorage.getItem(STORAGE_KEY):_memStore[STORAGE_KEY];
    if(s){var p=JSON.parse(s);for(var k in p){if(k!=='quizIndex'&&k!=='quizScore'&&k!=='quizQuestions')state[k]=p[k];}}
  }catch(e){}
  var today=new Date().toDateString();
  if(state.lastStudyDate!==today){
    var yest=new Date(Date.now()-86400000).toDateString();
    if(state.lastStudyDate!==yest&&state.lastStudyDate!==today){state.streak=0;}
  }
}
function saveState(){
  try{
    var d=JSON.stringify(state);
    if(_lsOK)localStorage.setItem(STORAGE_KEY,d);
    else _memStore[STORAGE_KEY]=d;
  }catch(e){}
}

// ===================== 间隔重复 (SM-2简化) =====================
function getInterval(g,rc,pi){
  if(g===0)return 1;
  if(g===1)return Math.max(1,Math.round(pi*1.2));
  if(g===2){if(rc===0)return 2;if(rc===1)return 4;return Math.round(pi*2);}
  if(g===3){if(rc===0)return 4;if(rc===1)return 7;return Math.round(pi*2.5);}
  return 1;
}
function getWordStatus(w){
  var i=state.learned[w];if(!i)return'new';
  if(i.grade>=2&&i.reviewCount>=3)return'mastered';return'learning';
}
function isDueToday(w){
  var i=state.learned[w];if(!i)return true;
  if(!i.nextReview)return true;return new Date(i.nextReview)<=new Date();
}

// ===================== 初始化今日队列 =====================
function initTodayQueue(){
  var today=new Date().toDateString();
  if(state.todayQueue.length>0&&state.lastStudyDate===today)return;
  var pool=state.category==='全部'?WORDS:WORDS.filter(function(w){return w.cat===state.category;});
  var due=pool.filter(function(w){var i=state.learned[w.word];return i&&isDueToday(w.word);}).map(function(w){return w.word;});
  var nw=pool.filter(function(w){return!state.learned[w.word];}).map(function(w){return w.word;});
  var q=due.concat(nw).slice(0,state.settings.daily);
  if(q.length<state.settings.daily){
    var extra=pool.filter(function(w){return q.indexOf(w.word)<0;}).map(function(w){return w.word;});
    q=q.concat(extra).slice(0,state.settings.daily);
  }
  state.todayQueue=q;state.cardIndex=0;state.lastStudyDate=today;saveState();
}

// ===================== 渲染 =====================
function renderCategories(){
  var cats=['全部'];WORDS.forEach(function(w){if(cats.indexOf(w.cat)<0)cats.push(w.cat);});
  var c=document.getElementById('categories');
  c.innerHTML=cats.map(function(c2){return'<div class="cat-btn '+(c2===state.category?'active':'')+'" data-cat="'+c2+'">'+c2+'</div>';}).join('');
  c.querySelectorAll('.cat-btn').forEach(function(btn){
    btn.onclick=function(){state.category=btn.dataset.cat;state.todayQueue=[];initTodayQueue();renderCategories();renderCard();renderStats();renderList();};
  });
}

function renderCard(){
  if(state.cardIndex>=state.todayQueue.length){showComplete();return;}
  document.getElementById('cardMode').style.display='';
  document.getElementById('completeScreen').classList.remove('show');
  document.getElementById('actionBar').style.display='';
  var word=state.todayQueue[state.cardIndex];
  var w=WORDS.find(function(x){return x.word===word;});
  if(!w){state.cardIndex++;renderCard();return;}
  document.getElementById('wordText').textContent=w.word;
  document.getElementById('phonetic').textContent=w.phonetic;
  document.getElementById('posTag').textContent=w.pos;
  document.getElementById('meaning').textContent=w.meaning;
  document.getElementById('example').textContent=w.example;
  document.getElementById('exampleTrans').textContent=w.exampleTrans;
  document.getElementById('mnemonic').textContent=w.mnemonic;
  document.getElementById('examPoint').textContent=w.examPoint||'';
  document.getElementById('card').classList.remove('flipped');
  if(state.settings.autoPlay)setTimeout(function(){speak(w.word);},300);
  var prog=(state.cardIndex/state.todayQueue.length)*100;
  document.getElementById('progressFill').style.width=prog+'%';
  document.getElementById('todayDone').textContent=state.cardIndex;
  document.getElementById('todayTotal').textContent=state.todayQueue.length;
}

function renderStats(){
  var pool=state.category==='全部'?WORDS:WORDS.filter(function(w){return w.cat===state.category;});
  var m=0,l=0,n=0;
  pool.forEach(function(w){var s=getWordStatus(w.word);if(s==='mastered')m++;else if(s==='learning')l++;else n++;});
  document.getElementById('masteredCount').textContent=m;
  document.getElementById('learningCount').textContent=l;
  document.getElementById('newCount').textContent=n;
  document.getElementById('streak').textContent=state.streak;
  document.getElementById('todayDone').textContent=state.cardIndex;
  document.getElementById('todayTotal').textContent=state.todayQueue.length;
}

function renderList(){
  var pool=state.category==='全部'?WORDS:WORDS.filter(function(w){return w.cat===state.category;});
  var searchVal=(document.getElementById('searchBox')||{}).value||'';
  if(searchVal){
    var sv=searchVal.toLowerCase();
    pool=pool.filter(function(w){return w.word.toLowerCase().indexOf(sv)>=0||w.meaning.indexOf(searchVal)>=0;});
  }
  var c=document.getElementById('wordList');
  c.innerHTML=pool.map(function(w){
    var s=getWordStatus(w.word);
    return'<div class="word-item" data-word="'+w.word+'"><div class="wi-status '+s+'"></div><div class="wi-word">'+w.word+'</div><div class="wi-meaning">'+w.meaning+'</div><button class="wi-speak">🔊</button></div>';
  }).join('');
  c.querySelectorAll('.word-item').forEach(function(item){
    item.onclick=function(){
      var word=item.dataset.word;var idx=state.todayQueue.indexOf(word);
      if(idx>=0){state.cardIndex=idx;}else{state.todayQueue.push(word);state.cardIndex=state.todayQueue.length-1;}
      switchMode('card');renderCard();
    };
    var sp=item.querySelector('.wi-speak');
    sp.onclick=function(e){e.stopPropagation();speak(item.dataset.word);};
  });
}

function showComplete(){
  document.getElementById('cardMode').style.display='none';
  document.getElementById('actionBar').style.display='none';
  document.getElementById('completeScreen').classList.add('show');
  document.getElementById('progressFill').style.width='100%';
  document.getElementById('todayDone').textContent=state.todayQueue.length;
  document.getElementById('completeSub').textContent='你今天学习了 '+state.todayQueue.length+' 个单词，继续加油！';
  state.streak++;saveState();renderStats();
}

// ===================== 测验模式 =====================
function initQuiz(){
  var pool=state.category==='全部'?WORDS:WORDS.filter(function(w){return w.cat===state.category;});
  // 随机抽取10题
  var shuffled=pool.slice().sort(function(){return Math.random()-0.5;});
  var quizWords=shuffled.slice(0,Math.min(10,pool.length));
  state.quizQuestions=quizWords.map(function(w){
    // 随机出题方向：英文选中文 或 中文选英文
    var enToZh=Math.random()>0.5;
    var correct=enToZh?w.meaning:w.word;
    // 随机生成3个干扰项
    var distractors=pool.filter(function(x){return x.word!==w.word;}).slice().sort(function(){return Math.random()-0.5;}).slice(0,3).map(function(x){return enToZh?x.meaning:x.word;});
    var options=[correct].concat(distractors).sort(function(){return Math.random()-0.5;});
    return{word:w.word,meaning:w.meaning,enToZh:enToZh,correct:correct,options:options,answered:false};
  });
  state.quizIndex=0;state.quizScore=0;
  renderQuiz();
}

function renderQuiz(){
  var qc=document.getElementById('quizContent');
  var qr=document.getElementById('quizResult');
  if(state.quizIndex>=state.quizQuestions.length){
    qc.style.display='none';
    qr.classList.add('show');
    document.getElementById('quizScore').textContent=state.quizScore+'/'+state.quizQuestions.length;
    return;
  }
  qr.classList.remove('show');
  qc.style.display='block';
  var q=state.quizQuestions[state.quizIndex];
  var progress='第 '+(state.quizIndex+1)+'/'+state.quizQuestions.length+' 题';
  var questionText=q.enToZh?'以下英文单词的中文释义是？':'以下中文释义对应的英文单词是？';
  var questionWord=q.enToZh?q.word:q.meaning;
  var html='<div class="quiz-card">';
  html+='<div class="quiz-q">'+progress+' · '+questionText+'</div>';
  html+='<div class="quiz-word">'+questionWord+'</div>';
  if(q.enToZh){
    html+='<button class="speak-btn" style="margin:0 auto 16px" onclick="speak(\''+q.word+'\')">🔊</button>';
  }
  html+='<div class="quiz-options">';
  q.options.forEach(function(opt,i){
    var cls='';
    if(q.answered){
      if(opt===q.correct)cls='correct';
      else if(opt===q.selected)cls='wrong';
    }
    html+='<button class="quiz-opt '+cls+'" data-opt="'+opt+'" '+(q.answered?'disabled':'')+'>'+opt+'</button>';
  });
  html+='</div>';
  if(q.answered){
    var w=WORDS.find(function(x){return x.word===q.word;});
    if(w){
      html+='<div class="mnemonic-box" style="margin-top:14px"><div class="mnemonic-label">💡 '+w.word+' '+w.phonetic+'</div><div class="mnemonic-text">'+w.meaning+'。'+w.mnemonic+'</div></div>';
    }
  }
  html+='</div>';
  qc.innerHTML=html;
  // 更新进度条
  var prog=(state.quizIndex/state.quizQuestions.length)*100;
  document.getElementById('progressFill').style.width=prog+'%';
  // 绑定选项点击
  qc.querySelectorAll('.quiz-opt').forEach(function(btn){
    btn.onclick=function(){
      if(q.answered)return;
      var opt=btn.dataset.opt;
      q.selected=opt;q.answered=true;
      if(opt===q.correct){state.quizScore++;showToast('✅ 正确！');}
      else{showToast('❌ 正确答案：'+q.correct);}
      saveState();
      renderQuiz();
      // 2秒后自动下一题
      setTimeout(function(){
        state.quizIndex++;renderQuiz();
      },2000);
    };
  });
}

// ===================== 语音 =====================
var voices=[];
var _speechOK=(typeof speechSynthesis!=='undefined'&&speechSynthesis!==null);
function loadVoices(){if(_speechOK)voices=speechSynthesis.getVoices();}
if(_speechOK){
  loadVoices();
  if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=loadVoices;
}

// 语音引擎：auto=先试在线再试系统，online=仅在线，system=仅系统
function _getVoiceEngine(){
  return state.settings.voiceEngine||'auto';
}

function speak(text){
  var btn=document.getElementById('speakBtn');
  if(btn)btn.classList.add('speaking');
  var engine=_getVoiceEngine();
  if(engine==='online'){_speakOnline(text);return;}
  if(engine==='system'){_speakSystem(text);return;}
  // auto: 先在线，失败再系统
  _speakOnline(text,function(ok){
    if(!ok)_speakSystem(text);
  });
}

// 在线语音（有道TTS，手机上最可靠）
function _speakOnline(text,fallback){
  var lang=(state.settings.voice||'en-US').split('-')[0];
  var type=lang==='en'?(state.settings.voice==='en-GB'?1:2):2;
  var url='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(text)+'&type='+type;
  var audio=new Audio();
  audio.src=url;
  var btn=document.getElementById('speakBtn');
  var done=false;
  audio.oncanplay=function(){
    if(done)return;done=true;
    audio.play().catch(function(){if(fallback)fallback(false);else _speakSystem(text);});
  };
  audio.onended=function(){if(btn)btn.classList.remove('speaking');};
  audio.onerror=function(){
    if(done)return;done=true;
    if(fallback)fallback(false);
    else{if(btn)btn.classList.remove('speaking');_speakSystem(text);}
  };
  // 超时检测：3秒没加载成功就走备用
  setTimeout(function(){
    if(!done){done=true;if(fallback)fallback(false);else _speakSystem(text);}
  },3000);
  audio.load();
}

// 系统语音（Web Speech API，桌面端用）
function _speakSystem(text){
  if(!_speechOK){
    var btn=document.getElementById('speakBtn');
    if(btn)btn.classList.remove('speaking');
    showToast('语音不可用，请在设置中切换在线语音');
    return;
  }
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=state.settings.voice;u.rate=parseFloat(state.settings.rate);
    var v=voices.find(function(v2){return v2.lang===state.settings.voice;});
    if(v)u.voice=v;
    var btn=document.getElementById('speakBtn');
    u.onend=function(){if(btn)btn.classList.remove('speaking');};
    u.onerror=function(){if(btn)btn.classList.remove('speaking');};
    speechSynthesis.speak(u);
  }catch(e){
    var btn2=document.getElementById('speakBtn');
    if(btn2)btn2.classList.remove('speaking');
  }
}

// ===================== 评分 =====================
function handleGrade(grade){
  var word=state.todayQueue[state.cardIndex];if(!word)return;
  var info=state.learned[word]||{grade:0,nextReview:null,reviewCount:0,lastSeen:null};
  var prevInt=info.nextReview?Math.max(1,Math.round((new Date(info.nextReview)-new Date(info.lastSeen))/86400000)):1;
  var interval=getInterval(grade,info.reviewCount,prevInt);
  var now=new Date();
  state.learned[word]={grade:grade,reviewCount:info.reviewCount+1,lastSeen:now.toISOString(),nextReview:new Date(now.getTime()+interval*86400000).toISOString()};
  saveState();state.cardIndex++;renderCard();renderStats();renderList();
}

// ===================== 模式切换 =====================
function switchMode(m){
  state.mode=m;
  document.getElementById('tabCard').classList.toggle('active',m==='card');
  document.getElementById('tabList').classList.toggle('active',m==='list');
  document.getElementById('tabQuiz').classList.toggle('active',m==='quiz');
  document.getElementById('cardMode').classList.toggle('hidden',m!=='card');
  document.getElementById('listMode').classList.toggle('show',m==='list');
  document.getElementById('quizMode').classList.toggle('show',m==='quiz');
  document.getElementById('actionBar').style.display=m==='card'?'':'none';
  if(m==='card'){document.getElementById('cardMode').style.display='';}
  else{document.getElementById('cardMode').style.display='none';}
  if(m==='quiz'){initQuiz();}
  if(m==='list'){renderList();}
}

// ===================== Toast =====================
function showToast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

// ===================== 滑动手势 =====================
var touchStartX=0,touchStartY=0,touchEndX=0,touchEndY=0;
var cardEl=document.getElementById('card');
cardEl.addEventListener('touchstart',function(e){
  touchStartX=e.changedTouches[0].screenX;
  touchStartY=e.changedTouches[0].screenY;
},false);
cardEl.addEventListener('touchend',function(e){
  touchEndX=e.changedTouches[0].screenX;
  touchEndY=e.changedTouches[0].screenY;
  handleSwipe();
},false);
function handleSwipe(){
  var dx=touchEndX-touchStartX;
  var dy=touchEndY-touchStartY;
  if(Math.abs(dx)<50||Math.abs(dy)>Math.abs(dx))return; // 水平滑动距离不够或垂直滑动为主
  if(dx>0){
    // 右滑=上一个
    if(state.cardIndex>0){state.cardIndex--;renderCard();renderStats();}
  }else{
    // 左滑=下一个（不评分直接跳过）
    if(state.cardIndex<state.todayQueue.length-1){state.cardIndex++;renderCard();renderStats();}
  }
}

// ===================== 事件绑定 =====================
document.getElementById('card').addEventListener('click',function(e){
  if(e.target.id==='speakBtn'||e.target.closest('#speakBtn'))return;
  document.getElementById('card').classList.toggle('flipped');
});
document.getElementById('speakBtn').addEventListener('click',function(e){

});
document.querySelectorAll('.action-btn').forEach(function(btn){

});

document.getElementById('tabQuiz').addEventListener('click',function(){switchMode('quiz');});
document.getElementById('restartBtn').addEventListener('click',function(){

});

  state.settings.autoPlay=parseInt(e.target.value);saveState();
});
document.getElementById('voiceEngineSelect').addEventListener('change',function(e){
  state.settings.voiceEngine=e.target.value;saveState();showToast('语音引擎已切换');
});
document.getElementById('resetBtn').addEventListener('click',function(){
  if(confirm('确定重置所有学习进度？')){state.learned={};state.streak=0;state.todayQueue=[];saveState();initTodayQueue();renderCard();renderStats();renderList();showToast('已重置');}
});
document.getElementById('settingsOverlay').addEventListener('click',function(e){
  if(e.target===this)document.getElementById('settingsOverlay').classList.remove('show');
});
// 搜索
document.getElementById('searchBox').addEventListener('input',function(){renderList();});
// 导出
document.getElementById('exportBtn').addEventListener('click',function(){
  var data=JSON.stringify({learned:state.learned,streak:state.streak,settings:state.settings});
  var blob=new Blob([data],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='english_progress.json';a.click();
  URL.revokeObjectURL(url);showToast('进度已导出');
});
// 导入
document.getElementById('importBtn').addEventListener('click',function(){
  var input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var data=JSON.parse(ev.target.result);
        if(data.learned)state.learned=data.learned;
        if(data.streak)state.streak=data.streak;
        if(data.settings)state.settings=data.settings;
        saveState();renderCard();renderStats();renderList();showToast('进度已导入');
      }catch(err){showToast('导入失败：文件格式错误');}
    };
    reader.readAsText(file);
  };
  input.click();
});

}
