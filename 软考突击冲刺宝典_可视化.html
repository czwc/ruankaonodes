    <script>
    // CDN加载失败时的简易Markdown解析器
    if(typeof marked==='undefined'){
      window.marked={parse:function(md){
        // 基础Markdown转HTML，保证离线也能看
        var h=md;
        // 转义HTML
        h=h.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        // 代码块
        h=h.replace(/```([\s\S]*?)```/g,function(m,c){return'<pre><code>'+c+'</code></pre>';});
        // 标题
        h=h.replace(/^#### (.*)$/gm,'<h4>$1</h4>');
        h=h.replace(/^### (.*)$/gm,'<h3>$1</h3>');
        h=h.replace(/^## (.*)$/gm,'<h2>$1</h2>');
        h=h.replace(/^# (.*)$/gm,'<h1>$1</h1>');
        // 引用
        h=h.replace(/^&gt; (.*)$/gm,'<blockquote><p>$1</p></blockquote>');
        // 分割线
        h=h.replace(/^---$/gm,'<hr>');
        // 粗体
        h=h.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
        // 行内代码
        h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
        // 列表
        h=h.replace(/^- \[ \] (.*)$/gm,'<li><input type="checkbox"> $1</li>');
        h=h.replace(/^- (.*)$/gm,'<li>$1</li>');
        h=h.replace(/^\* (.*)$/gm,'<li>$1</li>');
        // 表格（简易处理）
        h=h.replace(/^\|(.*)\|$/gm,function(m,r){
          var cells=r.split('|').filter(function(c){return c.trim();});
          if(cells[0]&&cells[0].indexOf('-')>=0&&cells[0].indexOf(':')<0)return'';
          return'<tr>'+cells.map(function(c){return'<td>'+c.trim()+'</td>';}).join('')+'</tr>';
        });
        h=h.replace(/(<tr>[\s\S]*?<\/tr>)/g,'<table>$1</table>');
        // 段落
        h=h.replace(/\n\n/g,'</p><p>');
        h='<div><p>'+h+'</p></div>';
        // 清理空段落
        h=h.replace(/<p><\/p>/g,'');
        h=h.replace(/<p>(<h[1-4]>)/g,'$1');
        h=h.replace(/(<\/h[1-4]>)<\/p>/g,'$1');
        h=h.replace(/<p>(<blockquote>)/g,'$1');
        h=h.replace(/(<\/blockquote>)<\/p>/g,'$1');
        h=h.replace(/<p>(<hr>)/g,'$1');
        h=h.replace(/<p>(<pre>)/g,'$1');
        h=h.replace(/(<\/pre>)<\/p>/g,'$1');
        h=h.replace(/<p>(<table>)/g,'$1');
        h=h.replace(/(<\/table>)<\/p>/g,'$1');
        h=h.replace(/<p>(<ul>)/g,'$1');
        h=h.replace(/(<\/ul>)<\/p>/g,'$1');
        h=h.replace(/<p>(<li>)/g,'<ul>$1');
        h=h.replace(/(<\/li>)<\/p>/g,'$1</ul>');
        return h;
      }};
    }
    </script>

# 软考突击冲刺宝典 (含小白真题解析)

> **写在前面的话：**
> 这份宝典是专门为**基础薄弱、时间紧迫（如考前几个月）**的同学准备的。里面没有长篇大论，全是**口诀、套路、真题和保姆级解析**。哪怕你是一个步骤都不懂的小白，只要跟着这套逻辑顺下来，也能稳拿及格分！

---

## 第一部分：上午选择题 (高频必背考点)

### 1. 数据结构与算法

#### 🌳 二叉树遍历
*   **前序遍历**：根 → 左 → 右
*   **中序遍历**：左 → 根 → 右
*   **后序遍历**：左 → 右 → 根

> 💡 **小白白话解**：前、中、后，指的都是**“根节点”**什么时候被访问。如果是前序，第一个就是根！

> **🎯 经典真题实战**
> **题目**：已知某二叉树的前序遍历序列为 `A-B-D-C`，中序遍历序列为 `B-D-A-C`，请问它的后序遍历序列是什么？
> A. D-B-C-A  　　 B. B-D-C-A 　　 C. D-C-B-A 　　 D. B-C-D-A
> 
> **👦 小白保姆级解析（选 A）**：
> **第一步（找根）**：看前序 `A-B-D-C`。前序的**第一个字母永远是整棵树的根**！所以这棵树的根是 **A**。
> **第二步（分左右）**：拿着这个根 **A**，去中序 `B-D-A-C` 里面找它。找到了吧？在A左边的 `B-D` 就是A的左子树，在A右边的 `C` 就是A的右子树。
> **第三步（确定内部顺序）**：现在知道左边是 `B-D`。再回看前序，`B` 在 `D` 前面，说明左子树里 **B** 是根。再去中序看，`D` 在 `B` 的右边，说明 `D` 是 `B` 的右孩子。
> **第四步（画图）**：A 是老大，左边小弟是 B，B 的右脚底下踩着 D；A 的右边小弟是 C。
> **第五步（写后序）**：后序口诀是“左右根”。先读左子树（B和D的后序是 D-B），再读右子树（C），最后读根（A）。拼起来就是 `D-B-C-A`。

#### 📊 线性表、栈、队列与排序
*   **链表 vs 顺序表**：
    *   链表：插入删除快，查找慢（就像一条绳子上的蚂蚱，找谁得顺着摸，但拔掉一只很方便）。
    *   顺序表：查找快，插入删除慢（就像带座号的电影院，找座位很快，但如果在中间加个座位，后面所有人都要挪位置）。
*   **栈与队列**：
    *   **栈**：后进先出 LIFO（像个竹筒装豆子，最后放进去的，最先倒出来）。
    *   **队列**：先进先出 FIFO（就像食堂排队，先排队的人先打饭）。
*   **排序复杂度（必记口诀）**：
    *   **冒泡 / 插入 / 选择**：都是慢吞吞的，最坏情况时间复杂度都是 **$O(n^2)$**。
    *   **快速 / 归并 / 堆排序**：高级货，时间复杂度都是 **$O(n\log n)$**。

#### 🕸️ 图
*   **最小生成树**：Prim（普里姆算法，加点法）、Kruskal（克鲁斯卡尔算法，加边法）。
*   **最短路径**：Dijkstra（迪杰斯特拉算法）。
> 💡 **小白白话解**：考试只要看到问“最小生成树”，答案必定在 Prim 或 Kruskal 之间选；看到“最短路径”，选 Dijkstra 绝对没错！

### 2. 操作系统

#### 🔒 死锁四大条件
（必须同时满足才会死锁）：**互斥、请求保持、不剥夺、环路等待**。
> 💡 **小白白话解**：两个人在独木桥中间碰头。桥只能过一人（**互斥**）；谁都不肯退后（**请求保持**）；又不能把对方推下水（**不剥夺**）；就这么大眼瞪小眼僵持着（**环路等待**）。

#### 📁 内存管理
*   **分页**：逻辑地址拆成 → **页号 + 页内偏移量**。系统把内存分成固定大小的块（页框），程序也分成同样大小的页，一页对应一个页框。
*   **分段**：按程序的逻辑模块划分（比如主函数一段，子函数一段），有利于保护和共享。
*   **虚拟内存**：物理内存不够，拿硬盘凑。基于**局部性原理**（程序运行时只集中在某个区域），当找不到数据时会发生**缺页中断**。
    *   **局部性原理是什么？**：程序在一段时间内只访问一小部分地址。分两种：**时间局部性**（刚访问过的数据很快还会再访问，比如循环体）和**空间局部性**（访问了某个地址，附近地址也会被访问，比如数组遍历）。
    *   **缺页中断是什么？**：CPU要访问的页不在内存中（在硬盘上），触发中断 → OS把缺的页从硬盘调入内存 → 如果内存满了就用页面置换算法淘汰一页 → 调入新页后继续执行。这个过程对程序透明（程序不知道）。

#### 🚦 进程三态模型
**就绪 (Ready)、运行 (Running)、阻塞 (Blocked)**。

> **🎯 经典真题实战**
> **题目**：进程 P 正在等待打印机输出，此时 P 处于什么状态？如果打印机输出完毕，P 变成了什么状态？
> A. 阻塞状态，运行状态
> B. 阻塞状态，就绪状态
> C. 运行状态，就绪状态
> 
> **👦 小白保姆级解析（选 B）**：
> **第一步**：理解三种状态。
> “运行” = 正在被 CPU 算。
> “就绪” = 万事俱备，只欠 CPU（资源都有了，就等 CPU 临幸）。
> “阻塞” = 卡住了，在等别的资源（比如等用户输入，等打印机）。
> **第二步**：套入题目。P 在等打印机，所以它卡住了，处于**阻塞状态**。
> **第三步**：打印机完事了，它不卡了。但是！**解除阻塞后绝对不能直接去运行**，因为 CPU 可能还在忙别的事，所以它必须乖乖去排队，也就是变成**就绪状态**。

### 3. 计算机网络

#### 🌐 五层模型与协议
1.  **应用层**：HTTP（80端口）、HTTPS（443端口）、FTP（21端口）、SSH（22端口）、DHCP（分发IP）、DNS（域名解析）。
2.  **传输层**：
    *   **TCP**：可靠、面向连接。有“三次握手”（建立连接）和“四次挥手”（断开连接）。（打电话，保证接通）。
    *   **UDP**：不可靠、无连接、速度快。用于视频直播等。（发短信，不管你收没收到）。
3.  **网络层**：IP（路由器在这里）。
4.  **数据链路层**：MAC 地址、交换机。
5.  **物理层**：网线、光纤、集线器。

#### 🏠 私有 IP 段（必考，死记硬背）
局域网内用的 IP（路由器给你分配的），外网无法直接访问：
*   **10.0.0.0** ~ 10.255.255.255
*   **172.16.0.0** ~ 172.31.255.255
*   **192.168.0.0** ~ 192.168.255.255

> **🎯 经典真题实战**
> **题目**：以下 IP 地址中，可以在 Internet 上直接使用的是？
> A. 192.168.1.1 　　 B. 10.254.1.2 　　 C. 172.15.2.3 　　 D. 172.16.0.1
> 
> **👦 小白保姆级解析（选 C）**：
> 题目问可以在 Internet（公网/外网）上直接用的，也就是问**哪个不是私有 IP**。
> 选项A：192.168 开头，家里 WiFi 常见，私有，排除。
> 选项B：10 开头，私有，排除。
> 选项D：172.16 开头，属于 172.16~172.31 的私有范围，排除。
> 选项C：172.**15**，不在私有段里面，所以它是公网 IP。选它！

### 4. 数据库

#### 🔒 事务 ACID 属性
*   **A - 原子性**：要么全做，要么全不做（转账不能我扣了钱你没收到）。
*   **C - 一致性**：执行前后，数据总量要守恒。
*   **I - 隔离性**：多个事务并发执行时互不干扰。
*   **D - 持久性**：一旦提交，数据就永远保存在硬盘上了，系统崩溃也不怕。

#### 📊 三大范式 (Normal Form)
*   **1NF（第一范式）**：列不可再分（每个格子只能装一个数据）。比如"电话"字段不能同时存"手机和座机"，必须拆成两列。
*   **2NF（第二范式）**：消除**部分函数依赖**。
    *   **部分函数依赖是什么意思？**：就是某个非主键属性，只依赖了联合主键的**一部分**。比如主键是(学号,课程号)，但"姓名"只跟"学号"有关，跟"课程号"无关——这就是"部分依赖"，说明姓名不应该放在这张表里。
    *   **怎么解决**：把只依赖部分主键的属性拆出去，单独建表。
*   **3NF（第三范式）**：消除**传递函数依赖**。
    *   **传递函数依赖是什么意思？**：A决定B，B又决定C，就说C对A有"传递依赖"。比如学号→系号→系主任，系主任是通过系号"传递"过来的，不是学号直接决定的。
    *   **怎么解决**：把传递链上的属性拆出去单独建表。

> **🎯 经典真题实战**
> **题目**：关系表 学生(学号，姓名，系号，系主任姓名) 中，存在哪个级别的依赖问题？不满足哪一范式？
> A. 部分依赖，不满足2NF
> B. 传递依赖，不满足3NF
> 
> **👦 小白保姆级解析（选 B）**：
> **第一步**：找主键。谁能唯一确定一个学生？显然是“学号”。
> **第二步**：分析依赖。
> 学号 → 姓名（学号决定姓名，没毛病）
> 学号 → 系号（学号决定你在哪个系，没毛病）
> 系号 → 系主任姓名（**问题来了！**系主任的名字是由系号决定的，而不是直接由学号决定的）。
> **第三步**：结论。这就形成了：`学号` 决定 `系号`，`系号` 又决定 `系主任`。这叫“**传递依赖**”。只要有传递依赖，就不满足 **3NF**。

#### 🔑 ER图与键
*   **实体、属性、联系**：矩形画实体，椭圆画属性，菱形画联系。
*   **1:1、1:n、m:n**：一对一、一对多、多对多。
*   **主键**：唯一标识一行记录，不能重复，不能为空。
*   **外键**：把别人家的主键拿过来放到自己表里，用来做关联。

### 5. 软件工程

#### 🏗️ 开发模型必背套路
*   **瀑布模型**：一步接一步，不回头。适用于**需求明确**的项目。缺点是后期改动极难。
*   **原型模型**：**需求不明确**。先糊弄一个界面（原型）给客户看，客户满意了再写代码。
*   **增量模型**：把软件拆成一个个小模块，**逐步交付**。（先给你一个能打字的版本，下个月再给你加上排版功能）。
*   **螺旋模型**：强调**风险分析**。适用于庞大、复杂、高风险的项目。
*   **敏捷开发**：小团队、小步快跑、拥抱需求变化（老板一天一个想法就用这个）。

#### 📐 模块独立性与测试
*   **模块独立性**：**高内聚，低耦合**。（自己内部紧密团结，和别的模块划清界限。耦合越低越好，内聚越高越好）。
    *   **内聚（从低到高7级）**：偶然内聚（最差，模块内各元素毫无关系）→ 逻辑内聚（执行逻辑相似的功能）→ 时间内聚（同一时间执行）→ 过程内聚（按特定顺序执行）→ 通信内聚（操作同一数据）→ 顺序内聚（一个的输出是另一个的输入）→ 功能内聚（最好，所有元素完成一个功能）。
    *   **耦合（从低到高7级）**：非直接耦合（无直接关系）→ 数据耦合（传数据参数）→ 标记耦合（传数据结构）→ 控制耦合（传控制信号）→ 外部耦合（共享外部数据）→ 公共耦合（共享全局变量）→ 内容耦合（最差，直接访问对方内部）。
    *   **口诀**：内聚越高越好（功能内聚最好），耦合越低越好（数据耦合最好）。

#### 🏢 软件过程能力成熟度（CMMI）
*   **CMMI是什么？**：评估软件开发组织的能力成熟度等级，从低到高5级：
    *   **1级-初始级**：无序混乱，靠个人英雄主义，成功靠运气。
    *   **2级-已管理级**：建立了基本项目管理，能重复以前的成功。
    *   **3级-已定义级**：有了标准的过程规范，全组织统一执行。
    *   **4级-量化管理级**：用数据量化管理过程，可预测结果。
    *   **5级-优化级**：持续改进，不断优化过程。
    *   **口诀**：初(1)管(2)定(3)量(4)优(5)——"初管定量优"
*   **测试阶段顺序**：单元测试（测单个文件） → 集成测试（拼起来测接口） → 系统测试（在真实环境测整体） → 验收测试（甲方爸爸来测）。

### 6. UML 必背 (统一建模语言)

#### 🔗 五大关系强度
**泛化（继承） > 实现 > 组合 > 聚合 > 关联 > 依赖**。
*   **泛化**：就是面向对象里的“继承”（猫 泛化于 动物）。
*   **组合**：整体和部分共生死。（人 和 人的大脑）。
*   **聚合**：整体和部分可分离。（车队 和 汽车，汽车离开车队照样开）。

#### 🗺️ 常用图
*   **用例图**：从用户角度看系统能干啥。
*   **类图**：展示系统的静态结构（包含哪些类，类有什么方法）。
*   **时序图/状态图/活动图**：表示动态的行为。

> **🎯 经典真题实战**
> **题目**：在面向对象建模中，汽车（Car）包含引擎（Engine）和轮胎（Wheel），且没有了引擎汽车就报废不能存在了，而轮胎可以被拆下来换到别的车上。请问汽车与引擎、汽车与轮胎分别是什么关系？
> A. 组合、聚合 　　 B. 聚合、组合
> 
> **👦 小白保姆级解析（选 A）**：
> 题目说汽车和引擎“共生死（不能存在了）”，这就叫**组合**（强烈的拥有）。
> 题目说轮胎可以“拆下来分离”，这就叫**聚合**（较弱的拼凑）。

### 📝 题型一：数据流图 (DFD) 答题模板

**这是下午第一题，纯阅读理解找茬游戏。一共15分，争取拿满！**

#### 📋 DFD四大基本元素（必须认识！）
*   **外部实体**：系统外面的人或系统（用**矩形**表示）。比如"用户"、"管理员"、"银行系统"。
*   **加工（Process）**：对数据的处理动作（用**圆圈/圆角矩形**表示）。比如"计算工资"、"验证密码"。
*   **数据流**：数据的流动方向（用**箭头**表示），箭头上要标数据名称。比如"订单信息→"。
*   **数据存储**：保存数据的地方（用**两条平行线**表示）。比如"学生表"、"库存数据库"。

#### 🔑 核心法宝：父子图平衡原则
顶层图（父图）和 0层图（子图）的输入、输出箭头必须一模一样！父图有几个箭头进出，子图边缘也必须有对应的箭头。

#### 🔍 找缺失的数据流（固定套路三板斧）
1.  **对比父子图找茬**：父图有的流，子图边上没有？补上！
2.  **找外部实体与加工**：看看题干描述，用户/系统（外部实体）发出的动作，有没有箭头指向圈圈（加工）？如果没有，补充！
3.  **找文件读写**：题干说“保存至数据库/将某某存档”，有没有圈圈指向两条横线（数据存储）的箭头？如果没有，补充！

#### 🗣️ 改错题固定话术（直接默写）
题目问：图中某某加工有问题，请指出。
*   **黑洞现象**：某加工只有输入的数据流，没有输出的数据流。（光吃不拉，存在黑洞）。
*   **奇迹现象**：某加工只有输出，没有输入。（凭空产生，存在奇迹）。
*   **平衡问题**：父图和子图的数据流不平衡，需补充 / 删减相应的输入输出流。

### 🗄️ 题型二：数据库 ER 设计模板

**这是下午第二题。题目会给你一段需求，让你画 ER 图并转成关系表。**

#### 🔑 万能转换法则（直接背）
怎么把 ER 图里的菱形（联系）变成表格里的外键？
*   **1:1（一对一）**：随便！两边的表，你可以把A的主键塞进B做外键，也可以把B的主键塞进A。
*   **1:n（一对多）**：**把 1 的一方的主键，拿过来放进 n 的一方做外键**。（比如：一个班级有多个学生。就把“班级号”作为外键放进“学生表”里）。
*   **m:n（多对多）**：**必须新建一张中间关系表！** 这张新表必须包含双方的主键，组成“联合主键”。（比如：学生和课程是多对多，必须建一张“选课成绩表”，里面包含“学号”和“课程号”）。

> **🎯 小白实战演示**
> **题目**：部门（部门号，名称）和 员工（员工号，姓名）。一个部门有多个员工，一个员工只属于一个部门。现需转换为关系模式，请问员工关系表应该包含哪些属性？
> **小白秒杀**：
> 1. 判断关系：部门(1) 对 员工(n)。是 1:n 关系。
> 2. 背口诀：“1的主键放进n做外键”。1是部门，主键是“部门号”。
> 3. 结果：员工表里必须强行加上“部门号”。所以员工表 = (员工号，姓名，**部门号**)！

#### 🗣️ 范式判断话术
*   如果题目问：这个表为什么不满足 2NF？
    答：因为存在**部分函数依赖**。（有非主键属性只依赖了联合主键的一部分）。
*   如果题目问：这个表为什么不满足 3NF？
    答：因为存在**传递函数依赖**。

### 8. PV操作（下午题必考15分！）

> ⚠️ **这是下午题的"半壁江山"，几乎每年必考！务必背熟！**

#### 🔑 信号量基本概念
*   **信号量S**：一个整数变量，表示可用资源数。
*   **P操作（wait）**：`S = S - 1`。如果 `S < 0`，进程**阻塞等待**。（申请资源，资源-1）
*   **V操作（signal）**：`S = S + 1`。如果 `S <= 0`，**唤醒**一个等待进程。（释放资源，资源+1）

> 💡 **小白白话解**：S就是"停车场空位数"。P操作就是"开进去一辆"（空位-1），没位了就排队等。V操作就是"开出来一辆"（空位+1），有排队的就放行一辆。

#### 🔑 互斥 vs 同步
*   **互斥**：多个进程争抢**同一个**资源。设互斥信号量 `mutex = 1`。
    *   进入临界区前 `P(mutex)`，退出后 `V(mutex)`。
    *   **临界区是什么？**：就是访问共享资源的那段代码。比如两个进程都要写同一个文件，写文件的那几行代码就是临界区，同一时刻只能一个进程进去。
*   **同步**：进程间有**先后顺序**要求。设同步信号量 `S = 0`。
    *   前驱操作完成后 `V(S)`，后继操作开始前 `P(S)`。
    *   **同步是什么意思？**：就是"你先做完我才能做"。比如必须先生产出产品，消费者才能取。生产者做完后V(S)通知，消费者P(S)等待通知。

#### 🎯 PV操作万能解题步骤
1.  **找共享资源** → 设互斥信号量（初值=1）
2.  **找先后顺序** → 设同步信号量（初值=0）
3.  **找缓冲区** → 设缓冲区信号量（初值=缓冲区大小）
4.  **套模板**：互斥P操作夹在同步P操作中间（P(mutex)必须在P(S)之后！否则会死锁）

> **🎯 经典真题：生产者-消费者问题**
> 生产者生产产品放入缓冲区，消费者从缓冲区取产品。缓冲区容量为N。
> ```
> semaphore empty = N;   // 空缓冲区数
> semaphore full = 0;    // 满缓冲区数
> semaphore mutex = 1;   // 互斥信号量
> 
> 生产者:                 消费者:
> while(true) {           while(true) {
>   生产一个产品;            P(full);    // 等有产品
>   P(empty);   // 等有空位     P(mutex);  // 锁缓冲区
>   P(mutex);   // 锁缓冲区     从缓冲区取产品;
>   放入缓冲区;               V(mutex);  // 解锁
>   V(mutex);   // 解锁         V(empty);  // 空位+1
>   V(full);    // 产品+1      消费产品;
> }                        }
> ```
> **关键**：P操作的顺序不能颠倒！必须先P(empty/full)再P(mutex)，否则会死锁！

### 11. 计算机组成原理（上午必考3-5分）

#### 🔑 校验码
*   **奇偶校验**：只能检奇数个错，不能纠错。加一位校验位让1的个数为偶数（偶校验）或奇数（奇校验）。
*   **海明码**：可检错可纠错。公式：`2^r >= m + r + 1`（r=校验位，m=数据位）。
    *   **海明码是什么？**：在数据位中插入多个校验位，每个校验位负责一组数据位的奇偶校验。出错时通过校验位的组合就能定位到哪一位错了，然后翻转那一位就纠正了。
*   **CRC循环冗余校验**：用模2除法（异或），只能检错不能纠错。
    *   **模2除法是什么？**：就是做除法时不借位，用异或(XOR)代替减法。比如1011除以11，不借位直接异或。CRC用这个方法算出余数（校验码）附在数据后面，接收方用同样的方式验证余数是否为0。

#### 🔑 存储体系（速度从快到慢）
寄存器 → Cache → 内存 → 硬盘 → 外存
*   **Cache命中率**：`命中率 = 命中次数 / 总访问次数`
*   **平均访问时间**：`T = h × Tc + (1-h) × Tm`（h=命中率，Tc=Cache时间，Tm=内存时间）

#### 🔑 寻址方式
*   **立即寻址**：操作数直接在指令中。
*   **直接寻址**：指令中放操作数的地址。
*   **间接寻址**：指令中放"指向操作数地址的地址"。
*   **寄存器寻址**：操作数在寄存器中。
*   **基址寻址**：基址寄存器+偏移量。

> **🎯 考点**：流水线、Cache、校验码是三大高频考点。

#### 🔑 流水线技术
*   **流水线是什么？**：把一条指令的执行分成多个阶段（如取指→译码→执行→访存→写回），每个阶段用不同的硬件部件，这样多条指令可以重叠执行，就像工厂流水线一样。
*   **流水线周期**：等于最长阶段的时间（木桶效应，最慢的阶段决定整体速度）。
*   **流水线执行时间**：`T = (一条指令的各阶段时间之和) + (n-1) × 流水线周期`。其中n是指令数。
    *   **举例**：5个阶段各2ns，100条指令。T = (5×2) + (100-1)×2 = 10 + 198 = 208ns。不用流水线则是100×10=1000ns。
*   **流水线加速比**：`S = 不用流水线的时间 / 用流水线的时间`
*   **流水线吞吐率**：`TP = 指令数 / 流水线总时间`
