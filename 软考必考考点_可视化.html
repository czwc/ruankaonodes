# 上篇:上午综合知识(75 道单选题)

## 模块 1 · 计算机组成与体系结构 ⭐⭐⭐(5~6 分)

### 1.1 CPU 的组成与功能

**一句话**:CPU = 运算器 + 控制器 + 寄存器组 + 内部总线。

**运算器四大件**:

| 部件 | 一句话 | 作用 |
|---|---|---|
| 算术逻辑单元 ALU | 干活的 | 算术运算 + 逻辑运算 |
| 累加寄存器 AC | 装结果的 | ALU 的工作区,暂存结果 |
| 数据缓冲寄存器 DR | 中转站 | CPU 与内存/外设的中转 |
| 状态条件寄存器 PSW | 状态标志 | 保存条件码、进位等 |

**控制器四大件**:

| 部件 | 一句话 | 作用 |
|---|---|---|
| 指令寄存器 IR | 装当前指令 | 对用户透明 |
| **程序计数器 PC** | 指向下一条指令地址 | 顺序 +1,转移加位移量 |
| 地址寄存器 AR | 装当前内存地址 | — |
| 指令译码器 ID | 翻译操作码 | — |

> 💡 **小白口诀**:PC 决定"接下来取哪条",IR 装"正在执行的这条",ID 负责"翻译这条指令"。
>
> **必考结论**:产生操作控制信号的部件是**控制器**;为 ALU 提供工作区的是**累加寄存器 AC**;跟踪指令地址的是 **PC**。

---

### 1.2 数据的表示:四种编码

**一句话**:计算机里所有数都存在内存里,存的方式不同,叫不同的"码"。

| 编码 | 正数 | 负数 | 特点 |
|---|---|---|---|
| 原码 | 符号位 0 | 符号位 1 | 最直观,+0/-0 两种表示 |
| 反码 | 同原码 | 符号位 1,数值位取反 | 过渡品,+0/-0 两种 |
| **补码** | 同原码 | 反码 + 1 | **计算机实际用的**,0 只有一种 |
| 移码 | 补码符号位取反 | 补码符号位取反 | 用于浮点数阶码 |

> 💡 **小白口诀**:正数三码一个样,负数反码补码算;补码 = 反码 + 1,移码 = 补码翻符号。
>
> **三大结论**:
> 1. 补码可以简化运算部件设计。
> 2. 补码再取补码等于原码。
> 3. ±0 的补码、移码相同。

**🎯 真题实战**
> 已知某 8 位机器数 [X]补 = 11110011,求 X 的真值。
> A. -13   B. 13   C. -131   D. 131
>
> **四步走(选 A)**:
> 1. 看符号位是 1 → 负数。
> 2. 补码 11110011,符号位不变,数值位取反 → 10001100。
> 3. 再 +1 → 10001101 = 0000 1101。
> 4. 数值部分 = 13,符号负 → **-13**。

---

### 1.3 浮点数表示(必考)

**公式**:N = 2^E × F(阶码 E + 尾数 F)

**核心结论(必背)**:
- **阶码决定范围**(阶码越大,能表示的数越大)。
- **尾数决定精度**(尾数越长,小数点后越精确)。
- **规格化**:把尾数绝对值限定在 [0.5, 1)。
- **对阶**:小阶向大阶对,浮点数右移(尾数右移,阶码增大)。

> 💡 **小白记法**:阶码像"科学计数法的指数"(管大小),尾数像"有效数字"(管精度)。

---

### 1.4 寻址方式(必考)

**一句话**:CPU 找操作数的方式。

| 寻址方式 | 一句话 | 速度 |
|---|---|---|
| **立即寻址** | 操作数直接在指令里 | 最快 |
| 寄存器寻址 | 操作数在寄存器里 | 快 |
| 直接寻址 | 指令给出内存地址 | 中 |
| 寄存器间接寻址 | 地址在寄存器里 | 中 |
| 间接寻址 | 指令给的是地址的地址 | 最慢 |
| 相对寻址 | 当前地址 + 偏移量 | — |
| 变址寻址 | 变址寄存器 + 偏移量 | — |

> 💡 **小白记法**:立即数最快(直接给),间接最慢(绕一圈)。引入多种寻址的目的:**扩大寻址空间并提高灵活性**。

---

### 1.5 校验码:三种必考

**一句话**:数据传输可能出错,校验码就是"给数据加个标签,出错了能发现"。

| 校验码 | 检错 | 纠错 | 一句话记法 |
|---|---|---|---|
| 奇偶校验 | 只能发现奇数位错 | ❌ 不能 | 加个奇偶位,让 1 的个数为奇/偶 |
| **海明码** | 能发现 | ✅ 能纠 1 位错 | 公式 2^k − 1 ≥ n + k |
| CRC 循环冗余 | 能发现 | ❌ 不能 | 用"模 2 除法"算余数 |

> 💡 **海明码必背公式**:2^k − 1 ≥ n + k(k 校验位,n 数据位)。已知数据位 n,求校验位 k 时,从 k=2 开始试。
>
> 例如 n=4 → 试 k=3:2^3 − 1 = 7 ≥ 4+3=7 ✅。所以 4 位数据要 3 位校验。
>
> **码距结论**:码距 = 2 能检错;码距 ≥ 3 才可能纠错。

### 1.6 指令系统:CISC vs RISC

| 对比项 | CISC(复杂指令集) | RISC(精简指令集) |
|---|---|---|
| 指令数量 | 多 | 少 |
| 指令长度 | 不固定 | 固定 |
| 执行时间 | 不固定 | 一个周期 |
| 寻址方式 | 多 | 少 |
| 译码方式 | 微程序控制 | 硬布线控制 |
| 通用寄存器 | 一般 | 多 |
| 流水线 | 不支持 | 支持 |
| 代表 | x86 | ARM |

> 💡 **小白记法**:C = Complex = 复杂 = x86;R = Reduced = 精简 = 手机 ARM。

### 1.7 流水线技术(必考计算)

**一句话**:把一条指令的执行分成几段,多条指令重叠执行,像工厂流水线。

**流水线周期 = 最长段的执行时间**。

**核心公式(必背)**:

- 流水线总执行时间 = 一条指令完整时间 + 流水线周期 × (n − 1)
- 吞吐率 TP = n ÷ 总执行时间
- 加速比 S = 顺序执行时间 ÷ 流水线执行时间
- 最大吞吐率 = 1 ÷ 流水线周期

**🎯 真题实战**
> 流水线由 4 段组成,每段时间 1ns,执行 100 条指令,求总时间和吞吐率。
>
> **四步走**:
> 1. 流水线周期 = 1ns(最长段)。
> 2. 一条指令完整时间 = 4 × 1 = 4ns。
> 3. 总时间 = 4 + 1 × (100 − 1) = 4 + 99 = 103ns。
> 4. 吞吐率 = 100 ÷ 103 ≈ 0.97 条/ns。

> 💡 **小白陷阱**:第一条指令要完整走完 4 段(4ns),之后每 1ns 出一条,所以是 4 + 99,不是 100。

---

### 1.8 存储系统(必考)

**存储层次(从快到慢,从小到大)**:

> **CPU 寄存器 → Cache → 主存 → 外存(硬盘)**

| 存储器 | 特点 | 用途 |
|---|---|---|
| SRAM(静态) | 快、贵、不需刷新 | **做 Cache** |
| DRAM(动态) | 慢、便宜、需定期刷新 | **做主存** |
| ROM | 只读 | 存 BIOS |
| PROM | 一次可写 | — |
| EPROM | 紫外线可擦 | — |
| EEPROM | 电可擦 | — |

**Cache 命中率公式(必背)**:

- 平均访问时间 t = h × tc + (1 − h) × tm
  - h = 命中率,tc = Cache 时间,tm = 主存时间

**🎯 真题实战**
> Cache 存取周期 10ns,主存存取周期 100ns,命中率 90%,求平均访问时间。
>
> A. 19ns   B. 20ns   C. 55ns   D. 91ns
>
> **三步走(选 A)**:t = 0.9×10 + 0.1×100 = 9 + 10 = **19ns**。

---

### 1.9 中断(必考概念)

**一句话**:CPU 正在执行程序,突发事件(如 I/O 完成)打断它,处理完再回来。

**中断过程**:

> 中断请求 → 中断响应 → 保护现场 → 中断服务 → 恢复现场 → 中断返回

**核心结论**:
- 中断向量 = 中断服务程序的入口地址。
- 多个中断同时发生,按**优先级**处理。
- **DMA 不经过 CPU**,直接在外设与内存间传数据。

---

### 1.10 总线与 I/O 控制方式

**三种总线**:数据总线(传数据)、地址总线(决定寻址范围)、控制总线(传命令)。

**I/O 控制方式(从慢到快)**:

| 方式 | CPU 参与度 | 传输单位 | 一句话 |
|---|---|---|---|
| 程序查询 | 全程盯着 | 字 | CPU 一直问"好没好" |
| 中断驱动 | 好了才喊 | 字 | 完成才打断 CPU |
| **DMA** | 仅开始结束介入 | **块** | 直接存储器存取,不经过 CPU |
| 通道 | 完全独立 | 块 | 大型机用 |

> 💡 **小白记法**:程序查询最笨,DMA 最聪明(数据直接走,不经过 CPU)。

---

### 1.11 可靠度计算(必考)

**串联系统**:

> R = R1 × R2 × ... × Rn(一个坏全坏,整体可靠度 = 各可靠度之积)

**并联系统**:

> R = 1 − (1 − R1)(1 − R2)...(1 − Rn)(全坏才坏,整体可靠度 = 1 − 各不可靠度之积)

**🎯 真题实战**
> 两个子系统,可靠度都是 0.9,串联和并联时系统可靠度各是多少?
>
> **秒杀**:
> - 串联:R = 0.9 × 0.9 = **0.81**
> - 并联:R = 1 − (1−0.9)(1−0.9) = 1 − 0.01 = **0.99**

> 💡 **小白记法**:串联越串越脆弱(乘起来变小),并联越并越可靠(冗余兜底)。

## 模块 2 · 操作系统 ⭐⭐⭐

### 2.1 进程三态模型(必考)

```
        调度                时间片到
   就绪 ──────→ 运行 ──────→ 就绪
     ↑           │
     │           │ 等待资源
     │           ↓
     └─── 阻塞 ←──┘
        (资源到位)
```

**核心规则(必背)**:
- **运行 → 阻塞**:进程主动等待资源(如等 I/O)。
- **阻塞 → 就绪**:资源到了,**不能直接去运行**,要去就绪队列排队!
- **就绪 → 运行**:被 CPU 调度。
- **运行 → 就绪**:时间片用完被剥夺。

> 💡 **小白陷阱**:阻塞**绝对不会**直接变运行!这是最高频的迷惑选项。

---

### 2.2 PV 操作与信号量(⭐ 下午也可能考)

**一句话**:多个进程抢同一个资源,容易打架;PV 操作就是"先发个号牌,拿到才能用"。

- **P 操作(P 锁)**:申请资源,信号量 −1。若减完 < 0,进程阻塞等待。
- **V 操作(V 放)**:释放资源,信号量 +1。若加完 ≤ 0,唤醒一个等待进程。

**经典场景**:

| 场景 | 信号量初值 | 含义 |
|---|---|---|
| 互斥(只有一个能用) | 1 | 1 把锁,谁拿到谁用 |
| 同步(前完成才到后) | 0 | 先 V 后 P,保证顺序 |

> 💡 **小白套路**:互斥用 1,同步用 0;P 申请,V 释放。

**🎯 真题实战**
> 两个进程共享一台打印机,为防止冲突,信号量初值应设为?
> A. 0   B. 1   C. 2   D. −1
>
> **秒杀(选 B)**:打印机只能一个进程用 → 互斥 → 信号量初值 = 1。

---

### 2.3 死锁(四大必要条件)

**四大条件(必须同时满足,背口诀)**:

> **互  请  不  环** = 互斥、请求保持、不剥夺、环路等待

> 💡 **小白白话**(独木桥两人相遇):
> - 互斥:桥只能过一人
> - 请求保持:拿着自己的位置,还要对方让
> - 不剥夺:不能把人推下水
> - 环路等待:A 等 B,B 等 A,转圈等

**死锁预防**:破坏四个条件之一即可。如**破坏环路等待** = 给资源编号,按序申请。

**死锁避免**:银行家算法(分配前先模拟,看会不会进入不安全状态)。

---

### 2.4 内存管理:分页地址计算(必考)

**逻辑地址 = 页号 P │ 页内偏移 W**

**公式**:页内偏移位数 = log2(页面大小)。

**🎯 真题实战**
> 页面大小 4KB,逻辑地址 8196,求页号和页内偏移。
>
> **三步走**:
> 1. 4KB = 2^12,所以偏移占 12 位 = 4096。
> 2. 页号 = 8196 ÷ 4096 = 2(商)
> 3. 页内偏移 = 8196 mod 4096 = 4(余数)
> 4. 所以在第 2 页,偏移 4。

**分段 vs 分页**:

| 方式 | 特点 | 优点 |
|---|---|---|
| 分页 | 按固定大小分 | 内存利用率高 |
| 分段 | 按逻辑模块分 | 利于共享和保护 |
| 段页式 | 先分段再分页 | 兼顾两者 |

---

### 2.5 页面置换算法

| 算法 | 一句话 | 特点 |
|---|---|---|
| **OPT** 最佳 | 淘汰最长时间不用的 | 理论上的,无法实现 |
| **FIFO** 先进先出 | 最先进来的先走 | 有 Belady 异常(页框多反而缺页多) |
| **LRU** 最近最少用 | 最久没碰过的走 | 常用,效果接近 OPT |

> 💡 **小白记法**:OPT 看未来(神仙算法),FIFO 看年龄(老的走),LRU 看最近(冷宫的走)。

---

### 2.6 磁盘调度算法(必考)

**一句话**:磁盘有很多请求排队,先服务谁?这就是调度算法。

| 算法 | 一句话 | 特点 |
|---|---|---|
| FCFS | 先来先服务 | 公平但寻道长 |
| SSTF | 最短寻道时间优先 | 可能"饥饿"远处请求 |
| SCAN | 电梯算法,来回扫 | 到尽头才折返 |
| C-SCAN | 单向扫描,到头直接回起点 | 起点请求等待短 |

> 💡 **小白记法**:FCFS 排队,SSTF 找最近,SCAN 像电梯来回,C-SCAN 只往一个方向扫。

> 💡 **小白记法**:逻辑独立性靠外/模式,物理独立性靠模式/内。映像就是"翻译层",底层变了上层不改。

### 3.3 SQL 语句(高频)

### 3.4 范式(必考概念)

| 范式 | 一句话要求 | 白话 |
|---|---|---|
| **1NF** | 每列不可再分 | 一个格子只能装一个值 |
| **2NF** | 消除部分依赖 | 非主键必须**完全**依赖联合主键 |
| **3NF** | 消除传递依赖 | 不能 A→B→C |
| **BCNF** | 消除主属性对码的依赖 | 比 3NF 更严格 |

> 💡 **小白口诀**:1NF 不拆分,2NF 全依赖,3NF 不传递。

**🎯 真题实战**
> 关系表 学生(学号,姓名,系号,系主任姓名),存在哪级依赖问题?
> A. 部分依赖,不满足 2NF
> B. 传递依赖,不满足 3NF
>
> **三步走(选 B)**:
> 1. 主键 = 学号。
> 2. 学号→系号,系号→系主任(系主任由系号决定,不是学号直接决定)。
> 3. 形成传递依赖:学号→系号→系主任,不满足 **3NF**。

## 模块 4 · 数据结构 ⭐⭐⭐

### 4.1 线性表、栈、队列

| 结构 | 特点 | 一句话 |
|---|---|---|
| 顺序表 | 连续存储 | 查找快,增删慢 |
| 链表 | 不连续 | 增删快,查找慢 |
| **栈** | 后进先出 LIFO | 竹筒装豆,最后进的先出 |
| **队列** | 先进先出 FIFO | 食堂排队 |
| 循环队列 | 队首接队尾 | 判空 front=rear;判满 (rear+1)%n=front |

---

### 4.2 二叉树(高频)

**性质(必背)**:
- 第 i 层最多 2^(i−1) 个节点(i≥1)。
- 深度为 k 的二叉树最多 2^k − 1 个节点。
- **n0 = n2 + 1**(叶子数 = 度 2 节点数 + 1)。

**遍历(背口诀)**:

| 遍历 | 顺序 | 一句话 |
|---|---|---|
| 前序 | 根→左→右 | 根在**前** |
| 中序 | 左→根→右 | 根在**中** |
| 后序 | 左→右→根 | 根在**后** |

**完全二叉树 vs 满二叉树**:
- 满二叉树:每层都满。
- 完全二叉树:除最后一层外都满,最后一层从左到右连续。

**线索二叉树**:把空指针利用起来,指向前驱/后继节点,方便遍历。

**平衡二叉树(AVL)**:任意节点左右子树高度差 ≤ 1。

---

### 4.3 哈夫曼树(必考)

**一句话**:带权路径长度最短的树,用于数据压缩。

**构造步骤**:
1. 把每个节点看成独立森林。
2. 选**两个权值最小**的,合成一棵新树,根是两权之和。
3. 重复,直到只剩一棵树。

> 💡 **小白记法**:每次"撮合"两个最小的,新节点是它们之和。

**前缀码**:哈夫曼编码是前缀码(任何一个编码都不是另一个的前缀),译码不会歧义。

---

### 4.4 图(必考)

**邻接矩阵 vs 邻接表**:

| 存储方式 | 适用 | 空间 |
|---|---|---|
| 邻接矩阵 | 稠密图 | n² |
| 邻接表 | 稀疏图 | n + e |

**遍历**:
- **DFS 深度优先**:一条道走到黑,用栈。
- **BFS 广度优先**:层层扩展,用队列。

**必考算法**:

| 问题 | 算法 | 一句话 |
|---|---|---|
| 最小生成树 | **Prim**(加点) | 从一点出发,每次加最近的点 |
| 最小生成树 | **Kruskal**(加边) | 按边权排序,从小加,不成环 |
| 最短路径 | **Dijkstra** | 单源最短路径 |
| 拓扑排序 | 拓扑算法 | 找入度为 0 的删 |

> 💡 **小白秒杀**:
> - 看到"最小生成树" → Prim 或 Kruskal
> - 看到"最短路径" → Dijkstra
> - 看到"AOV 网排序" → 拓扑排序

---

### 4.5 查找

| 查找方式 | 时间复杂度 | 适用 |
|---|---|---|
| 顺序查找 | O(n) | 无序表 |
| **二分查找** | O(log n) | 有序顺序表 |
| 分块查找 | 介于两者之间 | 块间有序块内无序 |
| **散列查找** | O(1) 平均 | 散列表 |

**散列冲突处理**:
- **开放定址法**:冲突就找下一个空位(线性探测、二次探测)。
- **链地址法**:冲突的挂成链表。

---

### 4.6 排序算法对比(必考表格)

| 算法 | 平均时间 | 最坏 | 空间 | 稳定性 |
|---|---|---|---|---|
| 冒泡 | O(n²) | O(n²) | O(1) | ✅ 稳定 |
| 简单选择 | O(n²) | O(n²) | O(1) | ❌ 不稳定 |
| 直接插入 | O(n²) | O(n²) | O(1) | ✅ 稳定 |
| **快速** | O(n log n) | O(n²) | O(log n) | ❌ 不稳定 |
| **归并** | O(n log n) | O(n log n) | O(n) | ✅ 稳定 |
| **堆排序** | O(n log n) | O(n log n) | O(1) | ❌ 不稳定 |

> 💡 **小白口诀**:
> - "插冒归"稳定(插入、冒泡、归并)。
> - 快排最快但最坏变 O(n²)。
> - 堆排空间最省(原地)。

```
源程序 → 词法分析 → 语法分析 → 语义分析 → 中间代码 → 代码优化 → 目标代码

### 5.2 正规式与有限自动机(必考)

**正规式**:描述单词结构的式子。

| `ab` | a 后接 b |
| `a*` | a 出现 0 次或多次(闭包) |

**有限自动机**:

### 6.3 软件需求与设计

### 6.4 模块独立性:耦合与内聚(必考)

**高内聚、低耦合**是设计目标。

**内聚(从低到高,越高越好)**:

> 偶然内聚 < 逻辑内聚 < 时间内聚 < 过程内聚 < 通信内聚 < 顺序内聚 < 功能内聚

### 8.2 子网划分(必考计算)

**公式**:
- 子网数 = 2^n(n = 借的主机位)
- 每子网主机数 = 2^m − 2(m = 剩余主机位,减网络号和广播号)

**🎯 真题实战**
> 某公司 C 类地址 192.168.1.0/24,要划分 4 个子网,求子网掩码和每子网主机数。
>
> **四步走**:
> 1. 需要 4 个子网 → 2^n ≥ 4 → n = 2。
> 2. 借 2 位 → 剩 8−2 = 6 位主机。
> 3. 子网掩码 = 24 + 2 = /26 = 255.255.255.192。
> 4. 每子网主机 = 2^6 − 2 = 62。

### 9.1 图像数据量计算(必考)

**公式**:

> 字节数 = (分辨率 × 位深) ÷ 8

**🎯 真题实战**
> 1024×768 分辨率,24 位真彩色,求一张图大小(MB)。
>
> **三步走**:
> 1. 像素数 = 1024 × 768 = 786432
> 2. 字节 = 786432 × 24 ÷ 8 = 2359296 B
> 3. MB = 2359296 ÷ 1024 ÷ 1024 ≈ 2.25 MB

## 题型 1 · 数据流图 DFD(必答第 1 题)⭐⭐⭐

### 核心概念

**一句话**:用箭头表示数据怎么在系统里流动。

**四大要素**:

| 符号 | 名称 | 一句话 |
|---|---|---|
| 矩形 | 外部实体 | 系统外的人/系统,如"用户" |
| 圆/圆角矩形 | 加工 | 处理动作,如"计算工资" |
| 双横线 | 数据存储 | 文件/数据库,如"学生表" |
| 箭头 | 数据流 | 数据流动方向 |

### 数据字典(配套 DFD)

**一句话**:对 DFD 里的每个东西做详细文字说明。

**四大条目**:
- **数据流条目**:说明数据流的组成。
- **数据项条目**:说明数据的最小单位。

### 父子图平衡原则(必考!)

### 找缺失数据流"三板斧"

1. **对比父子图**:父图有的流,子图没有 → 补。
2. **找外部实体**:题目说"用户提交订单",看有没有从用户到加工的箭头 → 没有就补。
3. **找数据存储**:题目说"保存到数据库",看加工有没有指向数据存储的箭头 → 没有就补。

**五大算法思想**:

| 算法 | 一句话 | 典型问题 |
|---|---|---|
| 分治法 | 大问题拆小,分别解决再合并 | 归并排序、最大子段和 |
| 动态规划 | 子问题重叠,记录结果避免重复 | 0-1 背包、矩阵连乘 |

**分治 vs 动态规划**:

- 动态规划:子问题**重叠**(记录中间结果)。

### 高频模式详解

#### 1. 单例模式(Singleton)

**一句话**:一个类只能有一个实例。

**典型场景**:数据库连接池、配置管理器。

**Java 代码骨架**:

```java
public class Singleton {
    private static Singleton instance;
    private Singleton() {}  // 私有构造
    public static Singleton getInstance() {
        if (instance == null) {
            instance = new Singleton();
        }
        return instance;
    }
}
```

---

#### 2. 工厂方法模式(Factory Method)

**一句话**:定义接口创建对象,但由子类决定实例化哪个类。

**场景**:日志系统(文件日志/数据库日志)。

```java
interface Logger { void log(String msg); }
class FileLogger implements Logger { ... }
class DBLogger implements Logger { ... }

abstract class LoggerFactory {
    abstract Logger createLogger();
}
class FileLoggerFactory extends LoggerFactory {
    Logger createLogger() { return new FileLogger(); }
}
```

---

#### 3. 抽象工厂(Abstract Factory)

**一句话**:创建一系列相关或互相依赖的对象。

**区别工厂方法**:工厂方法创**一个**产品,抽象工厂创**一族**产品。

---

#### 4. 建造者模式(Builder)

**一句话**:把复杂对象的构造与表示分离。

**场景**:构建复杂对象(如一辆汽车由很多部件组成)。

---

#### 5. 原型模式(Prototype)

**一句话**:通过复制已有实例创建新对象(深拷贝/浅拷贝)。

---

#### 6. 适配器模式(Adapter)

**一句话**:让接口不兼容的类能合作。

**类比**:电源适配器(220V 转 5V)。

---

#### 7. 桥接模式(Bridge)⭐

**一句话**:把抽象部分与实现部分分离,使它们都可以独立变化。

**场景**:不同品牌 × 不同功能,避免类爆炸。

---

#### 8. 组合模式(Composite)⭐

**一句话**:树形结构,部分-整体,叶子节点和组合节点统一对待。

**场景**:文件系统(文件夹和文件)。

---

#### 9. 装饰模式(Decorator)

**一句话**:动态给对象加功能,比继承更灵活。

**场景**:给咖啡加糖加奶(层层装饰)。

---

#### 10. 外观模式(Facade)

**一句话**:为子系统提供统一接口。

**场景**:电脑开机一键启动(内部各子系统协调)。

---

#### 11. 代理模式(Proxy)

**一句话**:为其他对象提供代理以控制访问。

**场景**:远程代理、虚拟代理、安全代理。

---

#### 12. 观察者模式(Observer)⭐

**一句话**:一对多依赖,一个对象状态变化,所有依赖者收到通知。

**场景**:微信公众号推送、事件监听。

```java
interface Observer { void update(String msg); }
class Subscriber implements Observer { ... }

class Subject {
    List<Observer> list = new ArrayList<>();
    void attach(Observer o) { list.add(o); }
    void notifyAll(String msg) {
        for (Observer o : list) o.update(msg);
    }
}
```

---

#### 13. 策略模式(Strategy)⭐

**一句话**:定义一系列算法,封装起来,可互换。

**场景**:支付方式(微信/支付宝/银行卡)。

```java
interface PayStrategy { void pay(int amount); }
class WeChatPay implements PayStrategy { ... }
class AliPay implements PayStrategy { ... }

class Context {
    PayStrategy strategy;
    void setStrategy(PayStrategy s) { this.strategy = s; }
    void pay(int amount) { strategy.pay(amount); }
}
```

---

#### 14. 状态模式(State)⭐

**一句话**:对象状态改变时行为也改变,把状态封装成类。

**场景**:订单状态(待付款、已发货、已签收)。

---

#### 15. 命令模式(Command)

**一句话**:把请求封装成对象,实现请求排队、记录、撤销。

---

#### 16. 责任链模式(Chain of Responsibility)

**一句话**:请求沿链传递,直到有一个处理。

**场景**:OA 审批流(组长→经理→总监)。

---

#### 17. 模板方法(Template Method)

**一句话**:父类定义算法骨架,子类实现具体步骤。

**场景**:做饭(烧水→放食材→调味,具体食材子类定)。

---

#### 18. 迭代器(Iterator)

**一句话**:顺序访问集合元素,不暴露内部结构。

---

#### 19. 备忘录(Memento)

**一句话**:保存对象状态,以便恢复(撤销功能)。

---

#### 20. 中介者(Mediator)

**一句话**:用中介对象封装一组对象交互,降低耦合。

**场景**:聊天室(用户之间不直接通信,通过聊天室)。

---

#### 21. 访问者(Visitor)

**一句话**:把操作从对象结构中分离出来。

---

#### 22. 解释器(Interpreter)

**一句话**:定义一种语言,解释其句子(规则引擎)。

---

### 填空套路

题目给出 90% 代码,你要填的通常是:
1. **创建对象**:`new XxxImpl()`
2. **调用方法**:`subject.notifyObservers()`
3. **接口方法名**:和接口定义一致
4. **返回值**:看上下文要返回什么类型

> 💡 **小白绝招**:不会填就看接口/抽象类的方法签名,照着抄!

<script>
var md=document.getElementById('raw-markdown').textContent;
var html=marked.parse(md);
document.getElementById('markdown-content').innerHTML=html;
var htmlEl=document.documentElement;
var savedTheme=localStorage.getItem('rk-theme');
if(savedTheme){htmlEl.setAttribute('data-theme',savedTheme);document.getElementById('theme-btn').textContent=savedTheme==='dark'?'☀️':'🌙';}
document.getElementById('theme-btn').addEventListener('click',function(){
var currentTheme=htmlEl.getAttribute('data-theme');
var newTheme=currentTheme==='dark'?'light':'dark';
htmlEl.setAttribute('data-theme',newTheme);
this.textContent=newTheme==='dark'?'☀️':'🌙';
localStorage.setItem('rk-theme',newTheme);
});
var toc=document.getElementById('toc');
var headers=document.querySelectorAll('.content h1, .content h2, .content h3');
headers.forEach(function(h){
if(!h.id){h.id='h-'+Math.random().toString(36).substr(2,9);}
var level=parseInt(h.tagName[1]);
var cls=level===2?'h2':(level===3?'h3':'');
var a=document.createElement('a');
a.href='#'+h.id;
a.textContent=h.textContent;
a.className=cls+' rk-toc-link';
a.dataset.target=h.id;
toc.appendChild(a);
});
document.getElementById('menu-btn').addEventListener('click',function(){
document.getElementById('sidebar').classList.toggle('open');
});
document.getElementById('menu-close').addEventListener('click',function(){
document.getElementById('sidebar').classList.remove('open');
});
document.addEventListener('click',function(e){
var sidebar=document.getElementById('sidebar');
if(window.innerWidth<=900&&!sidebar.contains(e.target)&&e.target.id!=='menu-btn'){
sidebar.classList.remove('open');
}
if(e.target.classList.contains('rk-toc-link')){
if(window.innerWidth<=900){sidebar.classList.remove('open');}
}
});
var tocLinks=document.querySelectorAll('.rk-toc-link');
function updateActiveToc(){
var scrollPos=window.scrollY+100;
var current=null;
headers.forEach(function(h){
if(h.offsetTop<=scrollPos){current=h;}
});
if(current){
tocLinks.forEach(function(l){l.classList.remove('active');});
var activeLink=document.querySelector('.rk-toc-link[data-target="'+current.id+'"]');
if(activeLink){activeLink.classList.add('active');}
}
}
window.addEventListener('scroll',function(){
var scrollTop=window.scrollY;
var docHeight=document.documentElement.scrollHeight-window.innerHeight;
var percent=Math.min(100,(scrollTop/docHeight)*100);
document.getElementById('progressBar').style.width=percent+'%';
updateActiveToc();
});
document.getElementById('totop').addEventListener('click',function(e){
e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});
});
var searchBox=document.getElementById('searchBox');
searchBox.addEventListener('input',function(){
var q=this.value.trim().toLowerCase();
var blocks=document.querySelectorAll('#markdown-content > *');
if(!q){
blocks.forEach(function(b){b.classList.remove('search-hide');});
document.querySelectorAll('mark').forEach(function(m){
var p=m.parentNode;p.innerHTML=p.textContent;
});
return;
}
blocks.forEach(function(b){
var text=b.textContent.toLowerCase();
if(text.indexOf(q)>=0){
b.classList.remove('search-hide');
}else{
b.classList.add('search-hide');
}
});
});
</script>
