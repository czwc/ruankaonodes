      <li>数一数这棵树：<b>n₀（叶子）= 3</b>（D/E/F）、<b>n₁（独生）= 1</b>（C）、<b>n₂（二胎）= 2</b>（A、B）——记住这组数，下面验证公式用</li>

    <p><b>公式 1 为什么 n₀ = n₂ + 1？</b>（看懂推导，一辈子忘不掉）</p>

    <p><b>白话版：</b>每个"二胎结点"（n₂）都会让家族里多出 1 个孩子没孩子可生，多出来的只能当叶子 → 叶子比二胎多 1 个。</p>

  <details class="ex"><summary>例题 1｜叶子数计算（送分题模板）</summary>

  <h3>1.2 二叉树遍历与还原（前序+中序 → 后序，年年考）</h3>
  <div class="explain">
    <p><b>三种遍历就一句话：都是"先左后右"，区别只在"根"什么时候访问。</b></p>
    <div class="formula">前序 = 根左右｜中序 = 左根右｜后序 = 左右根</div>
    <ul>
      <li><b>前序</b>：一进门先报根的名字，再逛左子树、右子树（像检查官先盖章）</li>
      <li><b>中序</b>：从最左边的叶子开始，按"左→根→右"报（二叉搜索树的中序 = 从小到大排序）</li>
      <li><b>后序</b>：孩子全处理完才轮到根（像"处理完再汇报"）</li>
    </ul>
    <div class="explain">
      <p><b>拿开头那棵树现场走一遍</b>，跟着念一遍就懂了：</p>
      <pre><code>          A
        /   \\
       B     C
      / \\   /
     D   E F</code></pre>
      <ul>
        <li><b>前序（根左右）</b>：报 A → 钻进左子树报 B → B 的左 D → B 的右 E → 钻进右子树报 C → C 的左 F → 结果 <b>A B D E C F</b></li>
        <li><b>中序（左根右）</b>：最左边的 D 先报 → B → E → 回到 A → 右边最深的 F 先报 → C → 结果 <b>D B E A F C</b></li>
        <li><b>后序（左右根）</b>：D → E（B 的孩子报完才轮到 B）→ B → F → C → 最后 A → 结果 <b>D E B F C A</b></li>
      </ul>
      <p>这三个结果正好就是例题 1 用的前序和中序——把"怎么走"和"例题"对上号，遍历就活了。</p>
    </div>
    <p><b>还原三定律</b>（已知两个序求第三个的核心武器）：</p>
    <ul>
      <li><span class="key">前序第一个 = 根</span>；<span class="key">后序最后一个 = 根</span></li>
      <li>拿到根，去<b>中序</b>里找它 → 它左边全是左子树、右边全是右子树（中序是唯一能"切分"左右的！）</li>
      <li>对左、右子树递归重复上面两步</li>
    </ul>
    <p class="tip" style="margin:6px 0">💡 为什么必须有中序？前序+后序都是"根在两端"，切不出左右边界；只有中序能定位根的左右领地。所以<b>前+中、后+中可以还原，前+后不行</b>——这是概念判断题的坑。</p>
  </div>

  <details class="ex"><summary>例题 1｜前序 + 中序 → 求后序（完整手把手）</summary>
    <div class="body">
      <p class="q">前序：A B D E C F　中序：D B E A F C　求后序。</p>
      <div class="step"><b>第 1 步找总根</b>：前序第一个是 A → 根是 A。去中序切分：D B E ｜ A ｜ F C → 左子树 {D,B,E}，右子树 {F,C}</div>
      <div class="step"><b>第 2 步切左子树</b>：左子树的前序（从前序里按顺序挑出 B D E）= B D E → 根是 B。中序 D B E：D ｜ B ｜ E → D 是 B 的左孩子，E 是 B 的右孩子</div>
      <div class="step"><b>第 3 步切右子树</b>：右子树的前序 = C F → 根是 C。中序 F C：F 在左 → F 是 C 的左孩子</div>
      <div class="step"><b>第 4 步拼后序（左右根）</b>：左子树后序 = D E B，右子树后序 = F C，最后根 A</div>
      <p class="ansline">答案：D E B F C A</p>
      <div class="tip">💡 自检技巧：把还原出的树自己遍历一遍，看前序/中序是否和题目一致，一致就 100% 正确。</div>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜中序 + 后序 → 求前序（反向练一遍）</summary>
    <div class="body">
      <p class="q">中序：D B E A F C　后序：D E B F C A　求前序。</p>
      <div class="step"><b>第 1 步</b>：后序最后一个 = A → 根。中序切分：左 {D,B,E}，右 {F,C}</div>
      <div class="step"><b>第 2 步</b>：左子树后序 = D E B → 最后一个是 B = 左子树根。中序 D｜B｜E → 左 D、右 E</div>
      <div class="step"><b>第 3 步</b>：右子树后序 = F C → C 是根，F 在其左</div>
      <div class="step"><b>第 4 步拼前序（根左右）</b>：A → 左子树前序 B D E → 右子树前序 C F</div>
      <p class="ansline">答案：A B D E C F（和例题 1 是同一棵树，正反各练一遍就熟了）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"前序+后序"不能唯一确定二叉树（比如只有一个孩子的结点，分不清是左孩子还是右孩子）；②切中序时务必"先找根再切"，顺序反了容易切错边。</div>

  <h3>1.3 哈夫曼树与 WPL（构造 + 计算，2 分稳拿）</h3>
  <div class="explain">
    <p><b>哈夫曼树是干嘛的？</b>让"常用的字符编码更短、少用的更长"，从而总编码长度最短。衡量标准是<b>带权路径长度 WPL</b>（Weighted Path Length）：</p>
    <div class="formula">WPL = Σ（每个叶子的权值 × 它到根的边数）</div>
    <p><b>构造方法就一招：贪心——每次从候选堆里挑最小的两个合并</b>，它们的和作为新结点放回候选堆，重复到只剩一棵树。这样权值小的天然被"压"到离根最远的地方。</p>
    <ul>
      <li>哈夫曼树中<b>没有度为 1 的结点</b>（每次都是 2 合 1）</li>
      <li>n 个叶子 → 总结点数 = <span class="key">2n − 1</span>（n 个叶子 + n−1 个新建结点）</li>
    </ul>
  </div>

  <details class="ex"><summary>例题 1｜哈夫曼树构造 + WPL 计算（逐步画）</summary>
    <div class="body">
      <p class="q">权值集合 {1, 2, 3, 4}，构造哈夫曼树并求 WPL。</p>
      <div class="step"><b>第 1 步</b>：候选 {1,2,3,4}，挑最小的 1 和 2 → 合并成 3。候选变为 {3, 3, 4}（新 3 + 原 3 + 4）</div>
      <div class="step"><b>第 2 步</b>：挑最小的两个 3 和 3 → 合并成 6。候选变为 {4, 6}</div>
      <div class="step"><b>第 3 步</b>：4 + 6 = 10 → 根，构造完毕</div>
      <div class="step"><b>第 4 步·画出来看看</b>（括号里是"合并出来的新结点"，画出来才好数层数）：</div>
      <pre><code>            (10)
           /    \\
         (6)     4
        /   \\
      (3)   (3)
      / \\
     1   2</code></pre>
      <div class="step"><b>第 5 步算 WPL</b>：1 和 2 在第 3 层（路径长 3），原来的 3 在第 2 层（路径长 2），4 在第 1 层（路径长 1）<br>WPL = 1×3 + 2×3 + 3×2 + 4×1 = 3 + 6 + 6 + 4 = <b>19</b></div>
      <p class="ansline">答案：WPL = 19</p>
      <div class="tip">💡 快速验算：WPL 也等于<b>所有"合并产生的新结点权值"之和</b>：3 + 6 + 10 = 19 ✓ 两种算法一致，考场用它保命。</div>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜概念判断</summary>
    <div class="body">
      <p class="q">一棵哈夫曼树有 20 个叶子结点，它的总结点数是？它有度为 1 的结点吗？</p>
      <div class="step"><b>步骤①</b>：哈夫曼树每次 2 合 1，没有度 1 结点 → n₁ = 0，只有 n₀ 和 n₂</div>
      <div class="step"><b>步骤②</b>：n₂ = n₀ − 1 = 19 → 总结点 = 20 + 19 = <b>39</b>（或直接套 2n−1 = 2×20−1）</div>
      <p class="ansline">答案：39 个总结点；没有度为 1 的结点</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①候选队列每次"重新找最小的两个"，新合成的结点也要参与下一轮竞争；②WPL 用"权×边数"，路径长是<b>边数不是层数</b>（根是第 0 条边）——用"新结点求和法"验算可避免数错层。</div>

  <h3>1.4 栈和队列（进出顺序题，年年 1~2 分）</h3>
  <div class="explain">
    <p><b>栈（Stack）</b>：像羽毛球筒——只有一个口，后放进去的先拿出来 → <span class="key">后进先出 LIFO</span>。常见应用：函数调用、递归、表达式求值、括号匹配。</p>
    <p><b>队列（Queue）</b>：像排队买票——一头进另一头出 → <span class="key">先进先出 FIFO</span>。常见应用：排队处理任务、打印队列、广度优先搜索。</p>
    <p><b>出入栈合法性判断（考试就考这个）：</b>拿"入栈顺序"模拟一遍——按顺序入栈，遇到出栈序列里的元素就出栈，看能否凑出题目给的出栈顺序。核心规律：<b>某元素出栈后，紧接着要出的元素只能"还在栈顶"或"还没入栈"，栈底的顺序永远变不了</b>。</p>
    <p><b>循环队列（计算题）：</b>把数组首尾相连省空间。约定：front 指队首元素，rear 指队尾元素的<b>下一个位置</b>：</p>
    <div class="formula">元素个数 = (rear − front + m) mod m（m = 队列总容量）<br>判空：rear = front　｜　判满：(rear + 1) mod m = front（牺牲一个格子区分空和满）</div>
  </div>

  <details class="ex"><summary>例题 1｜出栈序列合法性判断</summary>
    <div class="body">
      <p class="q">入栈顺序为 1、2、3、4，判断出栈序列 ①3、4、2、1　②4、3、1、2 是否可能？</p>
      <div class="step"><b>①模拟</b>：进 1、2、3 → 出 3；进 4 → 出 4；再出 2、1 → 得到 3,4,2,1 → <b>合法 ✓</b></div>
      <div class="step"><b>②模拟</b>：第一个出 4 → 必须 1、2、3、4 全进栈再连出 4、3；此时栈里剩 2（在上）、1（在下）→ 只能先出 2 再出 1，凑不出"1 在 2 前" → <b>非法 ✗</b></div>
      <p class="ansline">答案：① 可能；② 不可能（栈内上下顺序不能颠倒）</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜循环队列元素个数</summary>
    <div class="body">
      <p class="q">循环队列容量 m=6，front=2，rear=5，队列中有几个元素？还能继续入队吗？</p>
      <div class="step"><b>套公式</b>：(5 − 2 + 6) mod 6 = 9 mod 6 = <b>3 个</b></div>
      <div class="step"><b>判满</b>：(rear+1) mod m = (5+1) mod 6 = 0 ≠ front(2) → 未满 → <b>还能入队</b></div>
      <p class="ansline">答案：3 个；未满，可继续入队</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"rear 指队尾元素本身还是下一个位置"要看清题干约定，约定不同公式差 1；②"两个栈模拟一个队列"（一个管进、一个管出）是常见概念题；③栈是 LIFO 队列是 FIFO，选项爱互换着坑人。</div>

  <h3>1.5 排序全家桶（对比表 + "走一趟"题打法）</h3>
  <div class="explain">
    <p>上午题排序就考两件事：<b>背对比表</b>（复杂度/稳定性）和<b>模拟"走一趟"</b>（给序列问某排序第一趟后的结果）。对比表先背下来：</p>
    <table>
      <tr><th>算法</th><th>平均</th><th>最坏</th><th>稳定?</th><th>额外空间</th><th>一句话特征</th></tr>
      <tr><td><b>冒泡</b></td><td>n²</td><td>n²</td><td>✅</td><td>O(1)</td><td>相邻比，大数后沉；基本有序最好 O(n)</td></tr>
      <tr><td><b>插入</b></td><td>n²</td><td>n²</td><td>✅</td><td>O(1)</td><td>像整理扑克牌；基本有序最好 O(n)</td></tr>
      <tr><td><b>选择</b></td><td>n²</td><td>n²</td><td>❌</td><td>O(1)</td><td>每趟挑最小放前面；比较次数恒定 n²/2</td></tr>
      <tr><td><b>希尔</b></td><td>n^1.3 左右</td><td>n²</td><td>❌</td><td>O(1)</td><td>分组插入，跳跃式</td></tr>
      <tr><td><b>快排</b></td><td><b>n log n</b></td><td><span class="key">n²（基本有序时）</span></td><td>❌</td><td>O(log n)</td><td>基准分两边；平均最快</td></tr>
      <tr><td><b>归并</b></td><td>n log n</td><td>n log n</td><td>✅</td><td><span class="key">O(n)</span></td><td>稳定且快，代价是要辅助数组</td></tr>
      <tr><td><b>堆</b></td><td>n log n</td><td>n log n</td><td>❌</td><td><span class="key">O(1)</span></td><td>空间最省的 n log n</td></tr>
      <tr><td><b>基数</b></td><td>d×(n+r)</td><td>同左</td><td>✅</td><td>O(n+r)</td><td>按位分配收集，不比较</td></tr>
    </table>
    <p><b>稳定性口诀：</b>不稳定四兄弟——<span class="key">快选堆希</span>（快排、选择、堆、希尔）；其余（冒泡、插入、归并、基数）都稳定。</p>
    <p><b>堆是什么（小白版）：</b>堆 = 完全二叉树 + "父 ≥ 子"（大顶堆）。考点三连：①建好堆后<b>堆顶就是最大值</b>；②升序排序用大顶堆——每趟把堆顶（当前最大）与末尾交换、再重新调整；③所以堆排每趟都能确定一个最值的最终位置（呼应下面的概念题）。</p>
    <p><b>"走一趟"题的通法：</b>别背结论，考场上就按算法规则模拟一轮。每个算法"走完一趟"的标志要清楚：</p>
    <ul>
      <li><b>快排一趟</b>：基准元素落到最终位置，左边全 ≤ 它、右边全 ≥ 它</li>
      <li><b>冒泡一趟</b>：最大（或最小）元素"沉"到序列末端</li>
      <li><b>选择一趟</b>：第 i 小的元素与第 i 位交换</li>
      <li><b>堆排一趟</b>：堆顶（最大）与末尾交换，然后重新调整</li>
      <li><b>插入/希尔一趟</b>：只是局部归位，<b>不能保证任何元素在最终位置</b>（概念题考点！）</li>
    </ul>
    <p>例题 1 用的是<b>"挖坑法"</b>，先记住流程再跟着走：把基准挖走留个坑 → 右指针找小数填坑 → 左指针找大数填坑 → 轮流填到两指针相遇，把基准放回坑里。</p>
  </div>

  <details class="ex"><summary>例题 1｜快排走一趟（逐步模拟）</summary>
    <div class="body">
      <p class="q">对序列 49, 38, 65, 97, 76, 13, 27 做一趟快速排序（以 49 为基准），结果是？</p>
      <div class="step"><b>规则</b>：基准 49 暂时"离位"；右指针从右往左找比 49 小的，填到左边空位；左指针再从左往右找比 49 大的，填到右边空位；两指针相遇处放回 49。</div>
      <div class="step"><b>①</b>右端 27 &lt; 49 → 27 挪到最左 → [27], 38, 65, 97, 76, 13, [空]</div>
      <div class="step"><b>②</b>左端 38 &lt; 49 不动，65 &gt; 49 → 65 挪到右端空位 → 27, 38, [空], 97, 76, 13, 65</div>
      <div class="step"><b>③</b>右指针从 76 往左找小：76 &gt; 49 不算，13 &lt; 49 → 13 填进位置 3 的坑 → 27, 38, 13, 97, 76, [空], 65；坑移到 13 的老家</div>
      <div class="step"><b>④</b>左指针走到 97：97、76 都比 49 大不用搬，左右指针在位置 4 相遇 → 循环结束，49 放回坑里 → <b>27, 38, 13, 49, 97, 76, 65</b></div>
      <p class="ansline">答案：27 38 13 49 97 76 65（检查：49 左边全小、右边全大 ✓ 49 已在最终位置）</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜概念题：一趟后能确定最终位置的有哪些</summary>
    <div class="body">
      <p class="q">以下排序中，"经过一趟处理后能保证至少一个元素处于最终排序位置"的是？A.快排 B.插入 C.冒泡 D.归并 E.选择 F.堆</p>
      <div class="step"><b>逐个判断</b>：快排 ✓（基准归位）；冒泡 ✓（最值沉底）；选择 ✓（最小值换到首位）；堆 ✓（堆顶与末尾交换后末尾归位）</div>
      <div class="step"><b>排除</b>：插入——只是"新来一张牌插进前面有序区"，前面的牌还会再动；归并——只是合并有序段，元素位置还会变。</div>
      <p class="ansline">答案：A C E F（快排、冒泡、选择、堆）</p>
    </div>
  </details>
  <details class="ex"><summary>例题 3｜冒泡走一趟（感受"大数沉底"）</summary>
    <div class="body">
      <p class="q">对 49, 38, 65, 97, 76, 13, 27 做一趟从左到右的冒泡（升序），结果是？</p>
      <div class="step"><b>规则</b>：相邻两个比，左边大就交换；一轮走完，最大的数一定"沉"到末尾。</div>
      <div class="step"><b>①</b>49&gt;38 换 → 38,49,65,97,76,13,27　<b>②</b>49&lt;65 不动、65&lt;97 不动</div>
      <div class="step"><b>③</b>97&gt;76 换 → 38,49,65,76,97,13,27　<b>④</b>97&gt;13 换 → 38,49,65,76,13,97,27</div>
      <div class="step"><b>⑤</b>97&gt;27 换 → 38,49,65,76,13,27,97</div>
      <p class="ansline">答案：38 49 65 76 13 27 97（97 沉底；下一趟 76 沉到倒数第二……一趟沉一个）</p>
      <div class="tip">💡 对比例题 1 的快排：快排一趟让"基准"归位（中间），冒泡一趟让"最值"归位（末尾）——这就是例题 2 概念题的判断依据。</div>
    </div>
  </details>
  <div class="warn">⚠ 易错：①插入排序最坏 O(n²) 但<b>最好 O(n)</b>（基本有序时），与快排正好相反；②"归并"是稳定里唯一达到 O(n log n) 的，考试问"稳定 + n log n"就是它；③希尔趟数多，每趟只能部分有序，别选它。</div>

  <h3>1.6 图论基础（边数/度/拓扑 + 遍历算法，送分概念）</h3>
  <div class="explain">
    <p><b>两组公式 + 一个流程，图论选择题就通关了：</b></p>
    <div class="formula">无向完全图边数 n(n−1)/2　｜　有向完全图弧数 n(n−1)　｜　所有顶点度数之和 = 2×边数</div>
    <ul>
      <li><b>度</b>：无向图就是连了几条边；有向图分<b>入度</b>（几支箭进来）和<b>出度</b>（几支箭出去），且<b>入度和总 = 出度和总 = 弧数</b></li>
      <li><b>邻接矩阵</b>：无向图对称；无向图顶点 i 的度 = 第 i 行元素和；有向图第 i 行和 = 出度、第 i 列和 = 入度</li>
      <li><b>连通</b>：无向图任意两点有路；<b>强连通</b>：有向图任意两点互相有路</li>
    </ul>
    <p><b>拓扑排序（流程题，照做就行）：</b></p>
    <ol>
      <li>找一个<b>入度为 0</b> 的顶点输出（可以有多个，所以<b>拓扑序列不唯一</b>）</li>
      <li>删掉它和它发出的所有边</li>
      <li>重复，直到全部输出；<b>如果中途找不到入度 0 的点 → 图里有环 → 无拓扑序列</b></li>
    </ol>
  </div>

  <details class="ex"><summary>例题 1｜拓扑序列计数</summary>
    <div class="body">
      <p class="q">图中有 5 个顶点，边：A→B、A→C、B→D、C→D、D→E。可能的拓扑序列有几种？</p>
      <div class="step"><b>①</b>算入度：A=0，B=1，C=1，D=2，E=1 → 只有 A 入度为 0，第一步只能选 A</div>
      <div class="step"><b>②</b>删 A 及其出边后：B=0，C=0，D=2，E=1 → B、C 都可选，<b>且 B、C 互不影响</b>（它们之间无边）→ 2 种选择</div>
      <div class="step"><b>③</b>B、C 都输出后 D 才入度 0 → D → 最后 E</div>
      <p class="ansline">答案：2 种（A B C D E 和 A C B D E）。要点：序列开头锁死 A、结尾锁死 E，只有中间 B/C 可交换。</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜度与边数</summary>
    <div class="body">
      <p class="q">某无向图有 16 条边，所有顶点度数之和是多少？若有向图有 8 条弧，各顶点入度之和、出度之和分别是？</p>
      <div class="step"><b>无向图</b>：每条边给两个端点各贡献 1 度 → 度数和 = 2×16 = <b>32</b></div>
      <div class="step"><b>有向图</b>：每条弧给起点 +1 出度、终点 +1 入度 → 入度和 = 出度和 = 弧数 = <b>8</b></div>
      <p class="ansline">答案：32；入度和 8、出度和 8</p>
    </div>
  </details>
  <p><b>图算法速查表（见到名字能对号入座）：</b></p>
  <table>
    <tr><th>算法/概念</th><th>干什么</th><th>记法</th></tr>
    <tr><td><b>DFS 深度优先</b></td><td>一条路走到底，走不动再回头换岔路</td><td>用<b>栈/递归</b>实现</td></tr>
    <tr><td><b>BFS 广度优先</b></td><td>像水波纹一圈圈扩散，先访问所有邻居</td><td>用<b>队列</b>实现（呼应 1.4）</td></tr>
    <tr><td><b>Prim / Kruskal</b></td><td>求<b>最小生成树</b>：n 个顶点用 n−1 条边连通且总边权最小</td><td>Prim 挑点、Kruskal 挑短边</td></tr>
    <tr><td><b>Dijkstra</b></td><td>求一个点到其他各点的<b>最短路径</b></td><td>贪心，逐个确定最近的点</td></tr>
    <tr><td><b>AOE 网与关键路径</b></td><td>工程最短工期 = 最长路径</td><td>详见专题②的 2.6</td></tr>
  </table>

  <details class="ex"><summary>例题 3｜DFS 与 BFS 序列（同一张图两种走法）</summary>
    <div class="body">
      <p class="q">无向图：A—B、A—C、B—D、C—D，邻接点都按字母顺序访问。从 A 出发的 DFS 和 BFS 序列分别是？</p>
      <div class="step"><b>DFS（走到底再回头）</b>：A → B → D（B 的邻居）→ D 的邻居 A、B 都走过了，只剩 C → C → 结果 <b>A, B, D, C</b></div>
      <div class="step"><b>BFS（先访问所有邻居）</b>：访问 A → 邻居 B、C 依次入队 → 出队 B 访问 → 出队 C 访问 → B 的邻居 D 入队 → 出队 D → 结果 <b>A, B, C, D</b></div>
      <p class="ansline">答案：DFS = A B D C；BFS = A B C D</p>
      <div class="tip">💡 注意：邻接点顺序以<b>题目给的邻接表/矩阵为准</b>，不一定按字母序——先看清再走。</div>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"有环就没拓扑序列、拓扑必 DAG（有向无环）"是判断题标准答案；②拓扑序列<b>不唯一</b>，题目问"可能是"就找满足所有先后约束的；③完全图别把有向/无向公式混用——有向是"每对顶点两条弧"，所以是 n(n−1)；④DFS 用栈、BFS 用队列，这俩配对常考。</div>

  <h3>1.7 查找：二分查找与散列表（两个高频计算点）</h3>
  <div class="explain">
    <p><b>二分查找：</b>每次和"中间元素"比，扔掉一半。前提是<b>有序 + 顺序存储</b>。</p>
    <div class="formula">n 个元素，二分最多比较 ⌈log₂(n+1)⌉ 次</div>
    <p><b>散列表（哈希表）：</b>用函数 H(key) 直接算出存储地址。冲突怎么办？<b>线性探测</b>：地址被占了就顺延到下一格（+1），再占就再 +1。</p>
    <ul>
      <li>常用函数：<b>除留余数法</b> H(key) = key mod p（p 取不超过表长的最大素数）</li>
      <li><b>装填因子 α</b> = 已存元素数 / 表长（衡量拥挤程度）</li>
      <li><b>平均查找长度 ASL</b> = 每个元素的比较次数之和 ÷ 元素个数</li>
    </ul>
  </div>

  <details class="ex"><summary>例题 1｜二分查找比较几次 + 走哪条路</summary>
    <div class="body">
      <p class="q">在有序表 1~15 中查找 11，依次与哪些元素比较？共比较几次？（mid = ⌊(low+high)/2⌋）</p>
      <div class="step"><b>第 1 次</b>：low=1, high=15 → mid=8；11 &gt; 8 → 去右半边（low=9）</div>
      <div class="step"><b>第 2 次</b>：low=9, high=15 → mid=12；11 &lt; 12 → 去左半边（high=11）</div>
      <div class="step"><b>第 3 次</b>：low=9, high=11 → mid=10；11 &gt; 10 → low=11</div>
      <div class="step"><b>第 4 次</b>：low=11, high=11 → mid=11 → 找到！</div>
      <p class="ansline">答案：比较 8、12、10、11，共 4 次（= ⌈log₂16⌉，正好是上限）</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜散列表线性探测 + ASL</summary>
    <div class="body">

      <div class="step"><b>插 15</b>：15 mod 7 = 1 → 1 号位空 → 放 1 号位（比较 1 次）</div>
      <div class="step"><b>插 22</b>：22 mod 7 = 1 → 冲突；探测 2 号位 → 空 → 放 2 号位（比较 2 次）</div>

  <h3>1.8 时间复杂度（循环计数法 + 主定理查表法）</h3>
  <div class="explain">
    <p><b>复杂度只保留"增长最快的那一项"，系数也丢掉</b>。先背大小天梯：</p>
    <div class="formula">O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(n³) &lt; O(2ⁿ) &lt; O(n!)</div>
    <p><b>方法一：循环计数法</b>（普通循环题通用）——数一数最内层语句总共执行多少次，列式求和，取大头。</p>
    <ul>
      <li>两层独立嵌套 for 1..n → n×n = n²</li>
      <li>内层依赖外层（for j=1..i）→ 1+2+…+n = n(n+1)/2 → 还是 O(n²)（丢系数和低次项）</li>
      <li>循环变量<b>每次翻倍/乘 3</b>（i=i*2）→ 走 log₂n 步就到 n → O(log n)</li>
    </ul>
    <p><b>方法二：主定理查表法</b>（递归式专用，你错题笔记 id 20 有完整九宫格，这里放速查版）：</p>
    <div class="formula">T(n)=a·T(n/b)+f(n)：先算 c = log 以 b 为底 a 的对数（递归方的量级）<br>f(n) 比 nᶜ 小 → 取 nᶜ｜f(n) 比 nᶜ 大 → 取 f(n)｜打平 → 乘一个 log n</div>
    <table>
      <tr><th>递归式</th><th>对应算法</th><th>复杂度</th></tr>
      <tr><td>T(n)=2T(n/2)+n</td><td>归并排序</td><td><span class="key">O(n log n)</span></td></tr>
      <tr><td>T(n)=T(n/2)+1</td><td>二分查找</td><td><span class="key">O(log n)</span></td></tr>
      <tr><td>T(n)=2T(n−1)+1</td><td>汉诺塔</td><td><span class="key">O(2ⁿ)</span></td></tr>
    </table>
    <p>📌 小注：T(n)=2T(n−1)+1 这类"<b>规模每次减 1</b>"的递推<b>不归主定理管</b>（主定理只处理 T(n/b) 缩小倍数型），它是逐层累加：1+2+4+…+2ⁿ⁻¹ ≈ 2ⁿ → O(2ⁿ)。考试直接背结论即可。</p>
  </div>

  <details class="ex"><summary>例题 1｜双层循环计数</summary>
    <div class="body">
      <p class="q">求下列代码的时间复杂度：</p>
      <pre><code>for (i = 1; i &lt;= n; i++)
  for (j = 1; j &lt;= i; j++)
    sum++;</code></pre>
      <div class="step"><b>①</b>内层执行次数：i=1 时 1 次，i=2 时 2 次……i=n 时 n 次</div>
      <div class="step"><b>②</b>总次数 = 1+2+…+n = n(n+1)/2 ≈ n²/2</div>
      <div class="step"><b>③</b>丢掉系数 1/2 和低次项 → O(n²)</div>
      <p class="ansline">答案：O(n²)</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜翻倍循环 + 主定理</summary>
    <div class="body">
      <p class="q">① i=1; while (i &lt;= n) i = i * 3; 的时间复杂度？② T(n) = 2T(n/2) + n 的时间复杂度？</p>
      <div class="step"><b>①</b>：i 走 3⁰→3¹→3²→…→3ᵏ ≤ n，即 k = log₃n 步 → O(log n)。底数不影响大 O（log₃n = log₂n / log₂3，只差常数）</div>
      <div class="step"><b>②</b>：a=2, b=2 → n^(log₂2) = n；f(n)=n 与 n 打平 → 乘 log → O(n log n)（归并排序！）</div>
      <p class="ansline">答案：① O(log n)　② O(n log n)</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"两段循环先后执行"是相加取最大，不是相乘；②对数底数不同不影响大 O；③O(2ⁿ) 和 O(n²) 差距悬殊，别选混——天梯顺序要背牢。</div>

  <h3>1.9 专题收尾 · 考前 60 秒速过</h3>

      <tr><td><b>标记</b></td><td>传<b>整个结构/记录</b></td><td>把整个"学生对象"传过去，其实只用一个字段</td></tr>
      <tr><td><b>控制</b></td><td>传<b>开关/标志</b>指挥对方</td><td>传个"mode=1 还是 2"，对方据此走不同分支</td></tr>
      <tr><td><b>外部</b></td><td>绑定外部环境</td><td>绑死某设备、某文件格式</td></tr>
      <tr><td><b>公共</b></td><td>共享<b>全局数据区</b></td><td>大家都读写同一个全局变量</td></tr>
      <tr><td><b>内容</b>（最差）</td><td><b>直接改对方内部</b></td><td>模块 A 直接访问 B 的内部变量/跳进 B 的代码</td></tr>
    </table>
    <p><b>口诀：</b>内聚低→高"<span class="key">偶逻时过通顺功</span>"｜耦合好→差"<span class="key">数标控外公内</span>"</p>
  </div>

  <details class="ex"><summary>例题 1｜内聚类型判断</summary>
    <div class="body">
      <p class="q">① 模块 M 里放的是"开机时打开日志、加载配置、连接数据库"三个操作；② 模块 N 中，先执行"读文件"，紧跟着"用文件内容算工资"。M 和 N 分别是什么内聚？</p>
      <div class="step"><b>①</b>三个操作抱团的唯一理由 = 都在"开机这个时刻"执行 → <b>时间内聚</b>（时间内聚的经典标志就是"初始化"）</div>
      <div class="step"><b>②</b>"读文件"的输出正好是"算工资"的输入，前者的产出喂给后者 → <b>顺序内聚</b>（若是"都操作同一个文件"才是通信内聚，区分点：有没有"输出变输入"的接力）</div>
      <p class="ansline">答案：时间内聚 / 顺序内聚</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜耦合类型判断</summary>
    <div class="body">
      <p class="q">① 模块 A 调用 B 时传了一个标志位 flag，B 根据 flag 的值走不同处理分支；② 模块 A 直接修改了模块 B 内部的变量。分别是什么耦合？</p>
      <div class="step"><b>①</b>传的不是数据而是"指挥棒"（A 控制了 B 的内部逻辑走向）→ <b>控制耦合</b></div>
      <div class="step"><b>②</b>伸手进了别人家里改东西 → <b>内容耦合</b>（最恶劣的一种）</div>
      <p class="ansline">答案：控制耦合 / 内容耦合</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①内聚最高 = <b>功能内聚</b>（不是"顺序"）；耦合最低 = <b>数据耦合/非直接</b>（"数据耦合"是理想的实在耦合）；②时间 vs 通信：初始化类选<b>时间</b>，共用同一份数据选<b>通信</b>；③控制耦合比数据耦合差——传开关意味着一方插手另一方的逻辑。</div>

  <h3>2.4 软件测试（阶段顺序 + 覆盖计算 + McCabe）</h3>
  <div class="explain">
    <p><b>测试阶段顺序（背熟）：</b></p>
    <div class="formula">单元 → 集成 → 确认 → 系统 → 验收（"单集确系验"）</div>
    <ul>
      <li><b>单元</b>：验零件（单个函数/模块）；<b>集成</b>：拼起来看<b>接口</b>；<b>确认</b>：对照需求确认"做对了没"；<b>系统</b>：连硬件环境一起整体验；<b>验收</b>：用户点头</li>
      <li><b>α 测试</b>：用户在<b>开发方场地</b>测（开发者旁边盯着）；<b>β 测试</b>：用户拿回<b>自己环境</b>自由用</li>
      <li><b>V 模型对应关系</b>：单元测试 ↔ 详细设计｜集成测试 ↔ 概要设计｜系统/验收测试 ↔ 需求分析</li>
    </ul>
    <p><b>白盒覆盖从弱到强</b>（以判断条件 <code>x&gt;0 且 y&gt;0</code> 为例）：</p>
    <table>
      <tr><th>覆盖</th><th>要求</th><th>对这个例子</th></tr>
      <tr><td><b>语句</b>（最弱）</td><td>每条语句至少执行一次</td><td>随便找一组让代码全跑通的值</td></tr>
      <tr><td><b>判定（分支）</b></td><td>每个判定的<b>真、假</b>各走一次</td><td>要一组整体为真 + 一组整体为假</td></tr>
      <tr><td><b>条件</b></td><td>每个<b>子条件</b>的真假都取到</td><td>x 取过真/假，y 也取过真/假（可以凑在一次里）</td></tr>
      <tr><td><b>判定-条件</b></td><td>判定和条件同时满足</td><td>上面两个的要求都达到</td></tr>
      <tr><td><b>条件组合</b></td><td>所有子条件的<b>真假组合</b>都覆盖</td><td>真真、真假、假真、假假 4 组全要</td></tr>
      <tr><td><b>路径</b></td><td>所有可行路径都走一遍</td><td>每条岔路组合都走（最强但代价最大）</td></tr>
    </table>
    <p><b>黑盒三件套</b>（不看代码看功能）：<b>等价类划分</b>（有效/无效各挑代表）、<b>边界值分析</b>（专测边界和 ±1，bug 爱藏在边上）、<b>因果图</b>（条件组合画图）。</p>
    <p><b>McCabe 环形复杂度</b>（衡量程序圈圈多复杂）：</p>
    <div class="formula">V(G) = 边数 E − 结点数 N + 2 ＝ 判定结点个数 + 1</div>
  </div>

  <details class="ex"><summary>例题 1｜McCabe 计算（送分公式题）</summary>
    <div class="body">
      <p class="q">某控制流图有 15 条边、10 个结点，环形复杂度是多少？又：一段代码里有 2 个 if 和 1 个 while，环形复杂度是多少？</p>
      <div class="step"><b>①</b>套公式：V(G) = E − N + 2 = 15 − 10 + 2 = <b>7</b></div>
      <div class="step"><b>②</b>每个判定结点（if、while 都算）+1：3 个判定 → 3 + 1 = <b>4</b></div>
      <p class="ansline">答案：7 / 4（两种算法互相验证，考场上挑顺手的用）</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜覆盖强弱判断</summary>
    <div class="body">
      <p class="q">为条件 "x&gt;0 且 y&gt;0" 设计测试用例：用例1 = (x=1, y=1)，它满足哪些覆盖？再补一组 (x=1, y=-1) 后，覆盖提升到什么级别？</p>
      <div class="step"><b>只看用例1</b>：x&gt;0 真、y&gt;0 真 → 整个判定为真。只走到了判定的一边 → 满足<b>语句覆盖</b>，不满足判定覆盖（缺"假"的情况）</div>
      <div class="step"><b>加入用例2</b>：判定为假（y 条件假）→ 判定真假都走了 → 满足<b>判定覆盖</b>。再看条件：x 取过真，y 取过真和假……x 还没取过假 → 还不满足条件覆盖</div>
      <p class="ansline">答案：用例1 满足语句覆盖；加用例2 后达到判定覆盖（想满足条件覆盖还得让 x 取一次假，如 x=-1, y=-1）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①<b>while、if 都算一个判定结点</b>，McCabe 千万别漏循环；②判定覆盖 ≠ 条件覆盖——判定看"整体真假"，条件看"每个子条件真假"，二者谁也不包含谁；③α/β 区别只看<b>场地</b>：开发方场地 = α，用户家里 = β。</div>

  <h3>2.5 软件维护四兄弟（2 分稳拿）</h3>
  <div class="explain">
    <p>软件交付不是结束，后面全是"维护"。四种维护按"为什么要改"区分：</p>
    <table>
      <tr><th>维护</th><th>为啥改</th><th>例子</th></tr>
      <tr><td><b>改正性</b></td><td>修 <b>bug</b>（以前就有，现在暴露）</td><td>用户报告下单偶尔失败，排查修复</td></tr>
      <tr><td><b>适应性</b></td><td><b>环境变了</b>，软件被迫跟着变</td><td>换新操作系统、数据位数升级（<b>千年虫</b>就是经典适应性维护）</td></tr>
      <tr><td><b>完善性</b></td><td>用户想<b>加功能、提性能</b></td><td>要求新增报表导出、页面提速——<span class="key">占比最大（约一半）</span></td></tr>
      <tr><td><b>预防性</b></td><td>还没坏，<b>提前改造</b>防患未然</td><td>把老代码重构得更易维护，为将来打底</td></tr>
    </table>
    <p><b>口诀：</b>修错是改正、换境是适应、加餐是完善、健身是预防。</p>
  </div>
  <details class="ex"><summary>例题｜维护类型判断三连</summary>
    <div class="body">
      <p class="q">①修复"打印偶尔乱码"；②把系统从 Windows 迁到国产操作系统；③用户要求新增大屏展示功能；④重构老模块方便未来扩展。各属于哪种维护？</p>
      <div class="step"><b>①</b>修 bug → <b>改正性</b>　<b>②</b>运行环境变了 → <b>适应性</b></div>
      <div class="step"><b>③</b>加功能 → <b>完善性</b>　<b>④</b>未雨绸缪提前改造 → <b>预防性</b></div>
      <p class="ansline">答案：改正 / 适应 / 完善 / 预防</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：占比最大的是<b>完善性维护</b>（不是改正性！很多人想当然选修 bug）；"千年虫"是<b>适应性</b>（环境：年份数据从两位变四位）。</div>

  <h3>2.6 甘特图 vs PERT + 关键路径（计算题）</h3>
  <div class="explain">
    <p><b>两个工具的分工：</b></p>
    <ul>
      <li><b>甘特图</b>：横道图，一条横杠一个任务——<b>直观</b>看"谁在什么时候干"，但<b>看不出任务之间的依赖关系</b></li>
      <li><b>PERT 图（网络图）</b>：箭头表示先后依赖——<b>能找关键路径</b>、算工期</li>
    </ul>
    <p><b>关键路径白话版</b>：晚饭时间——电饭煲煮饭要 30 分钟；同时炒菜 20 分钟 + 做汤 10 分钟。晚饭几点能好？<b>由最长的那条链决定</b>（30 分钟），不是把所有活加起来。项目同理：</p>
    <div class="formula">关键路径 = 项目网络图里<b>最长</b>的那条路径 = 完成项目的<b>最短工期</b><br>关键路径上的活动时差为 0：它延误 1 天，整个项目就延误 1 天</div>
  </div>

  <details class="ex"><summary>例题 1｜求关键路径与工期（逐步算）</summary>
    <div class="body">
      <p class="q">活动与工期：A(3天)、B(4天)、C(2天)、D(5天)、E(3天)。A、B 可同时开始；C 依赖 A；D、E 依赖 B。求关键路径和总工期。</p>
      <div class="step"><b>第 1 步·列出所有从头到尾的路径</b>：<br>路径① A → C；路径② B → D；路径③ B → E</div>
      <div class="step"><b>第 2 步·每条路径算总长</b>：① 3+2 = 5 天；② 4+5 = 9 天；③ 4+3 = 7 天</div>
      <div class="step"><b>第 3 步·取最长</b>：9 天 → B → D 是关键路径。B 和 D 上任何一个拖延，项目就拖延；A、C 有 9−5 = 4 天富余（浮动时间）</div>
      <p class="ansline">答案：关键路径 B → D，总工期 9 天</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜概念判断</summary>
    <div class="body">
      <p class="q">判断正误：①关键路径是持续时间最短的路径；②关键活动的总时差为 0；③压缩一个非关键活动的工期可以让项目提前完成。</p>
      <div class="step"><b>①</b>✗——关键路径是<b>最长</b>的路径（最长 = 决定总工期 = "最短工期"），千万别把"最短工期"理解成"最短路径"</div>
      <div class="step"><b>②</b>✓——关键活动一天富余都没有，时差 = 0</div>
      <div class="step"><b>③</b>✗——压缩非关键活动（本来就有富余）不改变总工期；必须压缩<b>关键活动</b>才有效</div>
      <p class="ansline">答案：错 / 对 / 错</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"关键路径 = 最长路径"，但它的含义是"最短工期"——两个说法是同一件事，别绕晕；②多条路径长度相同 = 可以有<b>多条关键路径</b>；③想提前完工，先压关键活动（还要考虑赶工成本）。</div>

  <h3>2.7 UML 图与类图六种关系（上午下午都考）</h3>
  <div class="explain">
    <p><b>UML 图分两大类（"静态/动态"分类是常考概念）：</b></p>
    <ul>
      <li><b>静态图（画结构）</b>：类图、对象图、<b>构件图</b>（代码组件）、<b>部署图</b>（硬件设备）、包图</li>
      <li><b>动态图（画行为）</b>：<b>用例图</b>、<b>顺序图</b>（按时间排消息）、通信图（协作图）、<b>状态图</b>（一个对象的状态变化）、<b>活动图</b>（像流程图）</li>
    </ul>
    <p><b>用例图三关系（下午 UML 题必考）：</b></p>
    <ul>
      <li><b>«include» 包含</b>：基用例<b>必须</b>执行被包含用例（"网上支付"必含"验证密码"），箭头指向被包含者</li>
      <li><b>«extend» 扩展</b>：可选的额外行为（"支付"偶尔触发"发送优惠券"）</li>
      <li><b>泛化</b>：一般 → 特殊，符号和类图一样是空心三角</li>
    </ul>
    <p><b>类图六种关系（从"缘分浅"到"缘分深"）：</b></p>
    <table>
      <tr><th>关系</th><th>含义</th><th>图形符号</th><th>例子</th></tr>
      <tr><td><b>依赖</b></td><td>临时用一下就完</td><td>虚线箭头</td><td>方法参数里用到别人</td></tr>
      <tr><td><b>关联</b></td><td>长期知道对方</td><td>实线（可带箭头）</td><td>学生 选修 课程</td></tr>
      <tr><td><b>聚合</b></td><td>整体-部分，<b>能拆开各自活</b></td><td>实线 + <b>空心菱形</b>（指向整体）</td><td>电脑 ◇— USB 鼠标</td></tr>
      <tr><td><b>组合</b></td><td>整体-部分，<b>同生共死</b></td><td>实线 + <b>实心菱形</b>（指向整体）</td><td>公司 ◆— 部门</td></tr>
      <tr><td><b>泛化</b></td><td>is-a 继承</td><td>实线 + <b>空心三角</b>（指向父类）</td><td>狗 → 动物</td></tr>
      <tr><td><b>实现</b></td><td>实现接口</td><td><b>虚线</b> + 空心三角</td><td>鸟类 → 飞行接口</td></tr>
    </table>
    <p><b>口诀：</b>菱形画在<b>整体</b>那端——<span class="key">空心能拆（聚合）、实心同死（组合）</span>；三角指向<b>父/接口</b>——实线继承（泛化）、虚线实现。</p>
  </div>

  <details class="ex"><summary>例题 1｜六关系对号入座</summary>
    <div class="body">
      <p class="q">①狗是一种动物；②公司由部门组成，公司注销则部门随之消失；③电脑和 USB 鼠标；④订单处理时要临时调用日志工具。各是什么关系？</p>
      <div class="step"><b>①</b>"是一种" → <b>泛化</b>（is-a）</div>
      <div class="step"><b>②</b>整体-部分且同生共死 → <b>组合</b>（实心菱形）</div>
      <div class="step"><b>③</b>整体-部分但鼠标拔了还能用 → <b>聚合</b>（空心菱形）</div>
      <div class="step"><b>④</b>临时调用一下 → <b>依赖</b></div>
      <p class="ansline">答案：泛化 / 组合 / 聚合 / 依赖</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜用例图关系判断</summary>
    <div class="body">
      <p class="q">"网上支付"用例一定会执行"验证密码"，且偶尔触发"发送优惠券"。两个关系分别是什么？</p>
      <div class="step"><b>分析</b>：必须执行 → <b>«include» 包含</b>；可选、偶尔发生 → <b>«extend» 扩展</b></div>
      <p class="ansline">答案：include 包含 / extend 扩展（一句话：include 必做，extend 可选）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①聚合 vs 组合只看一点——<b>部分能不能离开整体单独存在</b>（鼠标拔了能用=聚合；公司没了部门不存在=组合）；②菱形指向整体、三角指向父类/接口，方向画反是下午题常见扣分点；③顺序图强调<b>时间先后</b>，活动图像流程图（可画分支并发），别混。</div>

  <h3>2.8 软件质量六大特性（背词送分题）</h3>
  <div class="explain">
    <p>ISO/IEC 9126 质量模型六特性，考法 = 给场景选特性：</p>
    <table>
      <tr><th>特性</th><th>白话</th><th>场景关键词</th></tr>
      <tr><td><b>功能性</b></td><td>该做的都做对</td><td>功能齐全、结果正确</td></tr>
      <tr><td><b>可靠性</b></td><td>别动不动崩</td><td><b>平均无故障时间 MTBF</b>、故障恢复</td></tr>
      <tr><td><b>易用性</b></td><td>小白一学就会</td><td>界面友好、易学易用</td></tr>
      <tr><td><b>效率</b></td><td>快不快、省不省</td><td>响应时间、内存占用</td></tr>
      <tr><td><b>维护性</b></td><td>好改不好改</td><td>易修改、易诊断</td></tr>
      <tr><td><b>可移植性</b></td><td>换个平台行不行</td><td>从 Windows 搬到 Linux 改动小</td></tr>
    </table>

  <details class="ex"><summary>例题 2｜DHCP 与 DNS 场景</summary>
    <div class="body">
      <p class="q">①新电脑插上网线就能上网，IP 地址是谁给的？②浏览器输入 www.test.com，第一步先找谁？</p>
      <div class="step"><b>①</b><b>DHCP 服务器</b>自动分配 IP/掩码/网关/DNS（四步：Discover→Offer→Request→ACK）</div>
      <div class="step"><b>②</b>先问 <b>DNS 服务器</b>把域名翻译成 IP，才能发起 HTTP 连接</div>
      <p class="ansline">答案：DHCP；DNS</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①FTP 有<b>两个端口</b>：21 控制、20 传数据；②HTTPS = 443 不是 4433；③DNS 用 UDP 但端口 53 唯一；④DHCP 能分配的不只是 IP，还有掩码/网关/DNS 一套。</div>

  <h3>3.5 冲突域与广播域 + 传输介质</h3>
  <div class="explain">
    <p><b>两个"域"的概念（选设备题的钥匙）：</b></p>
    <ul>
      <li><b>冲突域</b>：一嗓子喊出去可能和别人"撞车"的范围（大家抢一条路）</li>
      <li><b>广播域</b>：广播包能到达的范围（一嗓子全楼都听见）</li>
    </ul>
    <table>
      <tr><th>设备</th><th>工作层</th><th>隔离冲突域？</th><th>隔离广播域？</th></tr>
      <tr><td>集线器 Hub</td><td>物理层</td><td>❌（全体共享带宽）</td><td>❌</td></tr>
      <tr><td>交换机</td><td>数据链路层</td><td><span class="key">✅（每个端口独立）</span></td><td>❌（默认广播全通）</td></tr>
      <tr><td>路由器</td><td>网络层</td><td>✅</td><td><span class="key">✅</span></td></tr>
    </table>
    <ul>
      <li><b>VLAN（虚拟局域网）</b>：在交换机上把一台设备"切成"多个逻辑局域网 → <b>隔离广播域</b>（考题常考：不用路由器也能隔离广播域的方法 = 划 VLAN）</li>
      <li><b>传输介质</b>：双绞线（网线，一般 ≤100 米）｜光纤（远距离、高速、<b>抗电磁干扰</b>，靠光信号）｜同轴电缆（老式）｜无线（微波、红外）</li>
    </ul>
  </div>

  <details class="ex"><summary>例题｜隔离广播域的正确姿势</summary>
    <div class="body">
      <p class="q">一台交换机下接 200 台电脑，广播风暴严重。在不增加路由器的情况下，怎么缓解？</p>
      <div class="step"><b>分析</b>：交换机隔离冲突域但<b>不隔离广播域</b>（200 台都在一个广播域里）</div>
      <div class="step"><b>方案</b>：在交换机上划分 <b>VLAN</b>，把 200 台切成若干逻辑组，广播只在本 VLAN 内传播</div>
      <p class="ansline">答案：划分 VLAN 隔离广播域</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"交换机隔离冲突域、路由器隔离广播域"是标准答案组合；②光纤靠<b>光信号</b>传输，抗电磁干扰最强、传输最远；③Hub 是纯物理层设备，转发=广播，效率最低。</div>

  <h3>3.6 IPv6 速览（概念题，1 分）</h3>
  <div class="explain">
    <ul>
      <li>地址长度：<b>128 位</b>（IPv4 才 32 位），写成 8 组 4 位十六进制，冒号隔开，如 <code>2001:0db8:0000:0000:0000:ff00:0042:8329</code></li>
      <li><b>缩写规则</b>：每段前导 0 可省；<b>"::" 只能出现一次</b>（代表连续多段全 0）。上例缩写：<code>2001:db8::ff00:42:8329</code></li>
      <li><b>回环地址</b>：<code>::1</code>（对应 IPv4 的 127.0.0.1）</li>
      <li>IPv4 → IPv6 过渡技术：<b>双协议栈</b>（两套都装）、<b>隧道</b>（v6 包裹在 v4 里穿行）、NAT-PT 转换</li>
    </ul>
  </div>
  <details class="ex"><summary>例题｜IPv6 基础两连</summary>
    <div class="body">
      <p class="q">①IPv6 地址多少位？②缩写规则里"::"能用两次吗？</p>
      <div class="step"><b>①</b><b>128 位</b>——地址数量号称"地球上每粒沙子都能分一个"</div>
      <div class="step"><b>②</b><b>只能一次</b>——出现两次就无法还原省略了几段 0</div>
      <p class="ansline">答案：128 位；"::"最多出现一次</p>
    </div>
  </details>

  <h3>3.7 无线网络与移动通信（认代号题）</h3>
  <div class="explain">
    <table>
      <tr><th>标准</th><th>俗称</th><th>频段 / 特点</th></tr>
      <tr><td><b>802.11b / g / n</b></td><td>WiFi 4 及以前</td><td><b>2.4GHz</b>（穿墙好、速度低、干扰多）</td></tr>
      <tr><td><b>802.11ac</b></td><td>WiFi 5</td><td><b>5GHz</b>（速度快、穿墙差）</td></tr>
      <tr><td><b>802.11ax</b></td><td><span class="key">WiFi 6</span></td><td>2.4/5GHz 双频，高并发低时延</td></tr>
      <tr><td>802.15（蓝牙）</td><td>—</td><td>短距离个人局域网</td></tr>
      <tr><td>3G / 4G / 5G</td><td>移动通信</td><td><b>5G 三大场景：高速率（eMBB）、低时延高可靠（URLLC）、海量连接（mMTC）</b></td></tr>
    </table>
    <ul>
      <li>无线安全演进：<b>WEP（已破解淘汰）→ WPA → WPA2 → WPA3</b></li>
      <li>无线接入设备：<b>AP（接入点）</b>——手机连 WiFi 就是连到 AP</li>
    </ul>
  </div>
  <details class="ex"><summary>例题｜WiFi 代号速答</summary>
    <div class="body">
      <p class="q">①WiFi 6 对应哪个标准？②2.4GHz 和 5GHz 各自的优缺点？</p>
      <div class="step"><b>①</b><b>802.11ax</b></div>
      <div class="step"><b>②</b>2.4GHz：<b>穿墙强、速度慢</b>；5GHz：<b>速度快、穿墙弱</b>（互相倒过来记）</div>
      <p class="ansline">答案：802.11ax；2.4G 穿墙好速度慢，5G 速度快穿墙差</p>
    </div>
  </details>

  <h3>3.8 网络安全速览（配合错题笔记 id 16~19 背）</h3>
  <div class="explain">
    <p><b>攻击类型三连（判断"这是什么攻击"）：</b></p>
    <table>
      <tr><th>攻击</th><th>手法</th><th>防御</th></tr>
      <tr><td><b>DoS / DDoS</b></td><td>海量请求把服务器<b>淹没</b>，让它没法服务正常用户（DDoS = 僵尸网络"肉鸡"一起上）</td><td>防火墙、流量清洗、CDN 分流</td></tr>
      <tr><td><b>SQL 注入</b></td><td>在输入框里<b>拼接 SQL 语句</b>骗数据库（输入 ' or '1'='1）</td><td><span class="key">参数化查询、过滤输入</span></td></tr>
      <tr><td><b>XSS 跨站脚本</b></td><td>往网页里<b>注入恶意脚本</b>，盗别人 Cookie</td><td>对输出转义、过滤输入</td></tr>
      <tr><td><b>ARP 欺骗</b></td><td>伪造 ARP 应答冒充网关，截获流量</td><td>静态绑定、交换机防护</td></tr>
    </table>
    <p><b>防护设备两兄弟：</b></p>
    <ul>
      <li><b>防火墙</b>：站门口的保安——<b>包过滤</b>（按 IP/端口放行）、<b>应用代理</b>（替你进出）</li>
      <li><b>IDS 入侵检测</b>：监控报警器（只报警不拦截）；<b>IPS</b>：能主动拦截</li>
    </ul>
    <p>病毒、勒索软件、哈希算法细节已在错题笔记 id 16~19，考前一起过。</p>
  </div>
  <details class="ex"><summary>例题｜攻击识别两连</summary>
    <div class="body">
      <p class="q">①登录框输入 <code>' or '1'='1</code> 就绕过了密码验证，这是什么攻击？怎么防？②上千台"肉鸡"同时向某网站发请求导致瘫痪呢？</p>
      <div class="step"><b>①</b>输入被拼进了 SQL 语句 → <b>SQL 注入</b>；防御：<b>参数化查询</b>、过滤特殊字符</div>
      <div class="step"><b>②</b>多肉鸡分布式洪泛 → <b>DDoS</b>；防御：流量清洗、防火墙、CDN</div>
      <p class="ansline">答案：SQL 注入（参数化查询防）；DDoS 分布式拒绝服务</p>
    </div>
  </details>

  <h3>3.9 专题收尾 · 考前 60 秒速过</h3>
  <ul>
    <li><b>分层</b>：物链网传会表应；交换机=链路、路由器=网络、集线器=物理；加密压缩=表示层</li>
    <li><b>子网</b>：可用主机 = 2^主机位 − 2；块大小 = 256 − 末段掩码；/26→62 台、/27→30 台、/28→14 台</li>
    <li><b>地址</b>：A 1~126｜B 128~191｜C 192~223｜127 回环｜私有三段 + NAT 上公网</li>
    <li><b>TCP/UDP</b>：三次握手（确认双向+防旧请求）；UDP 快——DNS、DHCP、直播都用它</li>
    <li><b>端口</b>：DNS 53｜HTTP 80｜HTTPS 443｜SMTP 25｜POP3 110｜FTP 21/20｜SSH 22</li>
    <li><b>广播域</b>：交换机隔冲突域、路由器隔广播域；划 VLAN 也能隔广播域</li>
    <li><b>IPv6</b>：128 位；"::"只出现一次；回环 ::1</li>
    <li><b>无线</b>：WiFi6 = 802.11ax；2.4G 穿墙好、5G 速度快；WPA3 最安全</li>
  </ul>
  `

/* ════════════════════════════════════════════════════════════ */
function secIds(t) {
  if (!t.done) return [];
  return [...t.html.matchAll(/<h3>/g)].map((m, i, arr) => t.id + '-' + i);
}

function renderNav() {
  $('nav').innerHTML = TOPICS.map(t => {
    const cls = t.done ? 'has' : 'empty';
    const doneMark = t.done && secIds(t).length && secIds(t).every(id => mastered[id]) ? ' done' : '';
    return `<button class="${cls}${doneMark}" ${t.done ? `onclick="jump(${t.id})"` : ''} title="${t.done ? t.title : t.title + '（待更新）'}">${t.done && doneMark ? '✓ ' : ''}${t.title}</button>`;
  }).join('');
}

function jump(id) {
  document.getElementById('sec-' + id)?.scrollIntoView({ behavior: 'smooth' });
}

function render() {
  const done = TOPICS.filter(t => t.done);
  $('content').innerHTML = done.map(t => {
    const secs = [...t.html.matchAll(/<h3>/g)];
    let html = t.html;
    // 给每个 h3 打上小节 id
    let idx = 0;
    html = html.replace(/<h3>/g, () => `<h3 id="s-${t.id}-${idx++}">`);
    const secCount = secs.length;
    const doneCount = [...Array(secCount).keys()].filter(i => mastered[t.id + '-' + i]).length;
    return `
    <section class="sec" id="sec-${t.id}">
      <div class="sec-head">
        <h2>${t.title}</h2>
        <div>
          <span class="score">${t.score}</span>
          <button class="ok-btn" onclick="toggleSec(${t.id}, this)">✓ 已吃透本专题</button>
        </div>
      </div>
      ${html}
    </section>`;
  }).join('');
  renderNav(); renderStats();
}

function renderStats() {
  let total = 0, doneN = 0;
  TOPICS.filter(t => t.done).forEach(t => {
    const n = (t.html.match(/<h3>/g) || []).length;
    total += n;
    for (let i = 0; i < n; i++) if (mastered[t.id + '-' + i]) doneN++;
  });
  $('statTotal').textContent = total;
  $('statDone').textContent = doneN;
  $('fill').style.width = total ? (doneN / total * 100) + '%' : '0%';
}

function toggleSec(id, btn) {
  const sec = document.getElementById('sec-' + id);
  const h3s = sec.querySelectorAll('h3');
  const on = btn.classList.toggle('on');
  h3s.forEach((h, i) => {
    const key = id + '-' + i;
    if (on) mastered[key] = true; else delete mastered[key];
  });
  sec.classList.toggle('mastered', on);
  localStorage.setItem(MASTER_KEY, JSON.stringify(mastered));
  renderNav(); renderStats();
}

function $ (id) { return document.getElementById(id); }
render();
</script>
