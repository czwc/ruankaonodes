      <li>数一数这棵树：<b>n₀（叶子）= 3</b>（D/E/F）、<b>n₁（独生）= 1</b>（C）、<b>n₂（二胎）= 2</b>（A、B）——记住这组数，下面验证公式用</li>

    <p><b>公式 1 为什么 n₀ = n₂ + 1？</b>（看懂推导，一辈子忘不掉）</p>

    <p><b>白话版：</b>每个"二胎结点"（n₂）都会让家族里多出 1 个孩子没孩子可生，多出来的只能当叶子 → 叶子比二胎多 1 个。</p>

  <details class="ex"><summary>例题 1｜叶子数计算（送分题模板）</summary>

  <h3>1.2 二叉树遍历与还原（前序+中序 → 后序，年年考）</h3>
  <div class="explain">
    <p><b>三种遍历就一句话：都是"先左后右"，区别只在"根"什么时候访问。</b></p>
    <div class="formula">前序 = 根左右｜中序 = 左根右｜后序 = 左右根</div>
    <ul>
      <li><b>前序</b>：一进门先报根的名字，再逛左子树、右子树（像检查官先盖章）</li>
      <li><b>中序</b>：从最左边的叶子开始，按"左→根→右"报（二叉搜索树的中序 = 从小到大排序）</li>
      <li><b>后序</b>：孩子全处理完才轮到根（像"处理完再汇报"）</li>
    </ul>
    <div class="explain">
      <p><b>拿开头那棵树现场走一遍</b>，跟着念一遍就懂了：</p>
      <pre><code>          A
        /   \\
       B     C
      / \\   /
     D   E F</code></pre>
      <ul>
        <li><b>前序（根左右）</b>：报 A → 钻进左子树报 B → B 的左 D → B 的右 E → 钻进右子树报 C → C 的左 F → 结果 <b>A B D E C F</b></li>
        <li><b>中序（左根右）</b>：最左边的 D 先报 → B → E → 回到 A → 右边最深的 F 先报 → C → 结果 <b>D B E A F C</b></li>
        <li><b>后序（左右根）</b>：D → E（B 的孩子报完才轮到 B）→ B → F → C → 最后 A → 结果 <b>D E B F C A</b></li>
      </ul>
      <p>这三个结果正好就是例题 1 用的前序和中序——把"怎么走"和"例题"对上号，遍历就活了。</p>
    </div>
    <p><b>还原三定律</b>（已知两个序求第三个的核心武器）：</p>
    <ul>
      <li><span class="key">前序第一个 = 根</span>；<span class="key">后序最后一个 = 根</span></li>
      <li>拿到根，去<b>中序</b>里找它 → 它左边全是左子树、右边全是右子树（中序是唯一能"切分"左右的！）</li>
      <li>对左、右子树递归重复上面两步</li>
    </ul>
    <p class="tip" style="margin:6px 0">💡 为什么必须有中序？前序+后序都是"根在两端"，切不出左右边界；只有中序能定位根的左右领地。所以<b>前+中、后+中可以还原，前+后不行</b>——这是概念判断题的坑。</p>
  </div>

  <details class="ex"><summary>例题 1｜前序 + 中序 → 求后序（完整手把手）</summary>
    <div class="body">
      <p class="q">前序：A B D E C F　中序：D B E A F C　求后序。</p>
      <div class="step"><b>第 1 步找总根</b>：前序第一个是 A → 根是 A。去中序切分：D B E ｜ A ｜ F C → 左子树 {D,B,E}，右子树 {F,C}</div>
      <div class="step"><b>第 2 步切左子树</b>：左子树的前序（从前序里按顺序挑出 B D E）= B D E → 根是 B。中序 D B E：D ｜ B ｜ E → D 是 B 的左孩子，E 是 B 的右孩子</div>
      <div class="step"><b>第 3 步切右子树</b>：右子树的前序 = C F → 根是 C。中序 F C：F 在左 → F 是 C 的左孩子</div>
      <div class="step"><b>第 4 步拼后序（左右根）</b>：左子树后序 = D E B，右子树后序 = F C，最后根 A</div>
      <p class="ansline">答案：D E B F C A</p>
      <div class="tip">💡 自检技巧：把还原出的树自己遍历一遍，看前序/中序是否和题目一致，一致就 100% 正确。</div>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜中序 + 后序 → 求前序（反向练一遍）</summary>
    <div class="body">
      <p class="q">中序：D B E A F C　后序：D E B F C A　求前序。</p>
      <div class="step"><b>第 1 步</b>：后序最后一个 = A → 根。中序切分：左 {D,B,E}，右 {F,C}</div>
      <div class="step"><b>第 2 步</b>：左子树后序 = D E B → 最后一个是 B = 左子树根。中序 D｜B｜E → 左 D、右 E</div>
      <div class="step"><b>第 3 步</b>：右子树后序 = F C → C 是根，F 在其左</div>
      <div class="step"><b>第 4 步拼前序（根左右）</b>：A → 左子树前序 B D E → 右子树前序 C F</div>
      <p class="ansline">答案：A B D E C F（和例题 1 是同一棵树，正反各练一遍就熟了）</p>
    </div>

  <div class="warn">⚠ 易错：①"前序+后序"不能唯一确定二叉树（比如只有一个孩子的结点，分不清是左孩子还是右孩子）；②切中序时务必"先找根再切"，顺序反了容易切错边。</div>

  <h3>1.3 哈夫曼树与 WPL（构造 + 计算，2 分稳拿）</h3>
  <div class="explain">
    <p><b>哈夫曼树是干嘛的？</b>让"常用的字符编码更短、少用的更长"，从而总编码长度最短。衡量标准是<b>带权路径长度 WPL</b>（Weighted Path Length）：</p>
    <div class="formula">WPL = Σ（每个叶子的权值 × 它到根的边数）</div>
    <p><b>构造方法就一招：贪心——每次从候选堆里挑最小的两个合并</b>，它们的和作为新结点放回候选堆，重复到只剩一棵树。这样权值小的天然被"压"到离根最远的地方。</p>
    <ul>
      <li>哈夫曼树中<b>没有度为 1 的结点</b>（每次都是 2 合 1）</li>
      <li>n 个叶子 → 总结点数 = <span class="key">2n − 1</span>（n 个叶子 + n−1 个新建结点）</li>
    </ul>
  </div>

  <details class="ex"><summary>例题 1｜哈夫曼树构造 + WPL 计算（逐步画）</summary>
    <div class="body">
      <p class="q">权值集合 {1, 2, 3, 4}，构造哈夫曼树并求 WPL。</p>
      <div class="step"><b>第 1 步</b>：候选 {1,2,3,4}，挑最小的 1 和 2 → 合并成 3。候选变为 {3, 3, 4}（新 3 + 原 3 + 4）</div>
      <div class="step"><b>第 2 步</b>：挑最小的两个 3 和 3 → 合并成 6。候选变为 {4, 6}</div>
      <div class="step"><b>第 3 步</b>：4 + 6 = 10 → 根，构造完毕</div>
      <div class="step"><b>第 4 步·画出来看看</b>（括号里是"合并出来的新结点"，画出来才好数层数）：</div>
      <pre><code>            (10)
           /    \\
         (6)     4
        /   \\
      (3)   (3)
      / \\
     1   2</code></pre>
      <div class="step"><b>第 5 步算 WPL</b>：1 和 2 在第 3 层（路径长 3），原来的 3 在第 2 层（路径长 2），4 在第 1 层（路径长 1）<br>WPL = 1×3 + 2×3 + 3×2 + 4×1 = 3 + 6 + 6 + 4 = <b>19</b></div>
      <p class="ansline">答案：WPL = 19</p>
      <div class="tip">💡 快速验算：WPL 也等于<b>所有"合并产生的新结点权值"之和</b>：3 + 6 + 10 = 19 ✓ 两种算法一致，考场用它保命。</div>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜概念判断</summary>
    <div class="body">
      <p class="q">一棵哈夫曼树有 20 个叶子结点，它的总结点数是？它有度为 1 的结点吗？</p>
      <div class="step"><b>步骤①</b>：哈夫曼树每次 2 合 1，没有度 1 结点 → n₁ = 0，只有 n₀ 和 n₂</div>
      <div class="step"><b>步骤②</b>：n₂ = n₀ − 1 = 19 → 总结点 = 20 + 19 = <b>39</b>（或直接套 2n−1 = 2×20−1）</div>
      <p class="ansline">答案：39 个总结点；没有度为 1 的结点</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①候选队列每次"重新找最小的两个"，新合成的结点也要参与下一轮竞争；②WPL 用"权×边数"，路径长是<b>边数不是层数</b>（根是第 0 条边）——用"新结点求和法"验算可避免数错层。</div>

  <h3>1.4 栈和队列（进出顺序题，年年 1~2 分）</h3>
  <div class="explain">
    <p><b>栈（Stack）</b>：像羽毛球筒——只有一个口，后放进去的先拿出来 → <span class="key">后进先出 LIFO</span>。常见应用：函数调用、递归、表达式求值、括号匹配。</p>
    <p><b>队列（Queue）</b>：像排队买票——一头进另一头出 → <span class="key">先进先出 FIFO</span>。常见应用：排队处理任务、打印队列、广度优先搜索。</p>
    <p><b>出入栈合法性判断（考试就考这个）：</b>拿"入栈顺序"模拟一遍——按顺序入栈，遇到出栈序列里的元素就出栈，看能否凑出题目给的出栈顺序。核心规律：<b>某元素出栈后，紧接着要出的元素只能"还在栈顶"或"还没入栈"，栈底的顺序永远变不了</b>。</p>
    <p><b>循环队列（计算题）：</b>把数组首尾相连省空间。约定：front 指队首元素，rear 指队尾元素的<b>下一个位置</b>：</p>
    <div class="formula">元素个数 = (rear − front + m) mod m（m = 队列总容量）<br>判空：rear = front　｜　判满：(rear + 1) mod m = front（牺牲一个格子区分空和满）</div>
  </div>

  <details class="ex"><summary>例题 1｜出栈序列合法性判断</summary>
    <div class="body">
      <p class="q">入栈顺序为 1、2、3、4，判断出栈序列 ①3、4、2、1　②4、3、1、2 是否可能？</p>
      <div class="step"><b>①模拟</b>：进 1、2、3 → 出 3；进 4 → 出 4；再出 2、1 → 得到 3,4,2,1 → <b>合法 ✓</b></div>
      <div class="step"><b>②模拟</b>：第一个出 4 → 必须 1、2、3、4 全进栈再连出 4、3；此时栈里剩 2（在上）、1（在下）→ 只能先出 2 再出 1，凑不出"1 在 2 前" → <b>非法 ✗</b></div>
      <p class="ansline">答案：① 可能；② 不可能（栈内上下顺序不能颠倒）</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜循环队列元素个数</summary>
    <div class="body">
      <p class="q">循环队列容量 m=6，front=2，rear=5，队列中有几个元素？还能继续入队吗？</p>
      <div class="step"><b>套公式</b>：(5 − 2 + 6) mod 6 = 9 mod 6 = <b>3 个</b></div>
      <div class="step"><b>判满</b>：(rear+1) mod m = (5+1) mod 6 = 0 ≠ front(2) → 未满 → <b>还能入队</b></div>
      <p class="ansline">答案：3 个；未满，可继续入队</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"rear 指队尾元素本身还是下一个位置"要看清题干约定，约定不同公式差 1；②"两个栈模拟一个队列"（一个管进、一个管出）是常见概念题；③栈是 LIFO 队列是 FIFO，选项爱互换着坑人。</div>

  <h3>1.5 排序全家桶（对比表 + "走一趟"题打法）</h3>
  <div class="explain">
    <p>上午题排序就考两件事：<b>背对比表</b>（复杂度/稳定性）和<b>模拟"走一趟"</b>（给序列问某排序第一趟后的结果）。对比表先背下来：</p>
    <table>
      <tr><th>算法</th><th>平均</th><th>最坏</th><th>稳定?</th><th>额外空间</th><th>一句话特征</th></tr>
      <tr><td><b>冒泡</b></td><td>n²</td><td>n²</td><td>✅</td><td>O(1)</td><td>相邻比，大数后沉；基本有序最好 O(n)</td></tr>
      <tr><td><b>插入</b></td><td>n²</td><td>n²</td><td>✅</td><td>O(1)</td><td>像整理扑克牌；基本有序最好 O(n)</td></tr>
      <tr><td><b>选择</b></td><td>n²</td><td>n²</td><td>❌</td><td>O(1)</td><td>每趟挑最小放前面；比较次数恒定 n²/2</td></tr>
      <tr><td><b>希尔</b></td><td>n^1.3 左右</td><td>n²</td><td>❌</td><td>O(1)</td><td>分组插入，跳跃式</td></tr>
      <tr><td><b>快排</b></td><td><b>n log n</b></td><td><span class="key">n²（基本有序时）</span></td><td>❌</td><td>O(log n)</td><td>基准分两边；平均最快</td></tr>
      <tr><td><b>归并</b></td><td>n log n</td><td>n log n</td><td>✅</td><td><span class="key">O(n)</span></td><td>稳定且快，代价是要辅助数组</td></tr>
      <tr><td><b>堆</b></td><td>n log n</td><td>n log n</td><td>❌</td><td><span class="key">O(1)</span></td><td>空间最省的 n log n</td></tr>
      <tr><td><b>基数</b></td><td>d×(n+r)</td><td>同左</td><td>✅</td><td>O(n+r)</td><td>按位分配收集，不比较</td></tr>
    </table>
    <p><b>稳定性口诀：</b>不稳定四兄弟——<span class="key">快选堆希</span>（快排、选择、堆、希尔）；其余（冒泡、插入、归并、基数）都稳定。</p>
    <p><b>堆是什么（小白版）：</b>堆 = 完全二叉树 + "父 ≥ 子"（大顶堆）。考点三连：①建好堆后<b>堆顶就是最大值</b>；②升序排序用大顶堆——每趟把堆顶（当前最大）与末尾交换、再重新调整；③所以堆排每趟都能确定一个最值的最终位置（呼应下面的概念题）。</p>
    <p><b>"走一趟"题的通法：</b>别背结论，考场上就按算法规则模拟一轮。每个算法"走完一趟"的标志要清楚：</p>
    <ul>
      <li><b>快排一趟</b>：基准元素落到最终位置，左边全 ≤ 它、右边全 ≥ 它</li>
      <li><b>冒泡一趟</b>：最大（或最小）元素"沉"到序列末端</li>
      <li><b>选择一趟</b>：第 i 小的元素与第 i 位交换</li>
      <li><b>堆排一趟</b>：堆顶（最大）与末尾交换，然后重新调整</li>
      <li><b>插入/希尔一趟</b>：只是局部归位，<b>不能保证任何元素在最终位置</b>（概念题考点！）</li>
    </ul>
    <p>例题 1 用的是<b>"挖坑法"</b>，先记住流程再跟着走：把基准挖走留个坑 → 右指针找小数填坑 → 左指针找大数填坑 → 轮流填到两指针相遇，把基准放回坑里。</p>
  </div>

  <details class="ex"><summary>例题 1｜快排走一趟（逐步模拟）</summary>
    <div class="body">
      <p class="q">对序列 49, 38, 65, 97, 76, 13, 27 做一趟快速排序（以 49 为基准），结果是？</p>
      <div class="step"><b>规则</b>：基准 49 暂时"离位"；右指针从右往左找比 49 小的，填到左边空位；左指针再从左往右找比 49 大的，填到右边空位；两指针相遇处放回 49。</div>
      <div class="step"><b>①</b>右端 27 &lt; 49 → 27 挪到最左 → [27], 38, 65, 97, 76, 13, [空]</div>
      <div class="step"><b>②</b>左端 38 &lt; 49 不动，65 &gt; 49 → 65 挪到右端空位 → 27, 38, [空], 97, 76, 13, 65</div>
      <div class="step"><b>③</b>右指针从 76 往左找小：76 &gt; 49 不算，13 &lt; 49 → 13 填进位置 3 的坑 → 27, 38, 13, 97, 76, [空], 65；坑移到 13 的老家</div>
      <div class="step"><b>④</b>左指针走到 97：97、76 都比 49 大不用搬，左右指针在位置 4 相遇 → 循环结束，49 放回坑里 → <b>27, 38, 13, 49, 97, 76, 65</b></div>
      <p class="ansline">答案：27 38 13 49 97 76 65（检查：49 左边全小、右边全大 ✓ 49 已在最终位置）</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜概念题：一趟后能确定最终位置的有哪些</summary>
    <div class="body">
      <p class="q">以下排序中，"经过一趟处理后能保证至少一个元素处于最终排序位置"的是？A.快排 B.插入 C.冒泡 D.归并 E.选择 F.堆</p>
      <div class="step"><b>逐个判断</b>：快排 ✓（基准归位）；冒泡 ✓（最值沉底）；选择 ✓（最小值换到首位）；堆 ✓（堆顶与末尾交换后末尾归位）</div>
      <div class="step"><b>排除</b>：插入——只是"新来一张牌插进前面有序区"，前面的牌还会再动；归并——只是合并有序段，元素位置还会变。</div>
      <p class="ansline">答案：A C E F（快排、冒泡、选择、堆）</p>
    </div>
  </details>
  <details class="ex"><summary>例题 3｜冒泡走一趟（感受"大数沉底"）</summary>
    <div class="body">
      <p class="q">对 49, 38, 65, 97, 76, 13, 27 做一趟从左到右的冒泡（升序），结果是？</p>
      <div class="step"><b>规则</b>：相邻两个比，左边大就交换；一轮走完，最大的数一定"沉"到末尾。</div>
      <div class="step"><b>①</b>49&gt;38 换 → 38,49,65,97,76,13,27　<b>②</b>49&lt;65 不动、65&lt;97 不动</div>
      <div class="step"><b>③</b>97&gt;76 换 → 38,49,65,76,97,13,27　<b>④</b>97&gt;13 换 → 38,49,65,76,13,97,27</div>
      <div class="step"><b>⑤</b>97&gt;27 换 → 38,49,65,76,13,27,97</div>
      <p class="ansline">答案：38 49 65 76 13 27 97（97 沉底；下一趟 76 沉到倒数第二……一趟沉一个）</p>
      <div class="tip">💡 对比例题 1 的快排：快排一趟让"基准"归位（中间），冒泡一趟让"最值"归位（末尾）——这就是例题 2 概念题的判断依据。</div>
    </div>
  </details>
  <div class="warn">⚠ 易错：①插入排序最坏 O(n²) 但<b>最好 O(n)</b>（基本有序时），与快排正好相反；②"归并"是稳定里唯一达到 O(n log n) 的，考试问"稳定 + n log n"就是它；③希尔趟数多，每趟只能部分有序，别选它。</div>

  <h3>1.6 图论基础（边数/度/拓扑 + 遍历算法，送分概念）</h3>
  <div class="explain">
    <p><b>两组公式 + 一个流程，图论选择题就通关了：</b></p>
    <div class="formula">无向完全图边数 n(n−1)/2　｜　有向完全图弧数 n(n−1)　｜　所有顶点度数之和 = 2×边数</div>
    <ul>
      <li><b>度</b>：无向图就是连了几条边；有向图分<b>入度</b>（几支箭进来）和<b>出度</b>（几支箭出去），且<b>入度和总 = 出度和总 = 弧数</b></li>
      <li><b>邻接矩阵</b>：无向图对称；无向图顶点 i 的度 = 第 i 行元素和；有向图第 i 行和 = 出度、第 i 列和 = 入度</li>
      <li><b>连通</b>：无向图任意两点有路；<b>强连通</b>：有向图任意两点互相有路</li>
    </ul>
    <p><b>拓扑排序（流程题，照做就行）：</b></p>
    <ol>
      <li>找一个<b>入度为 0</b> 的顶点输出（可以有多个，所以<b>拓扑序列不唯一</b>）</li>
      <li>删掉它和它发出的所有边</li>
      <li>重复，直到全部输出；<b>如果中途找不到入度 0 的点 → 图里有环 → 无拓扑序列</b></li>
    </ol>
  </div>

  <details class="ex"><summary>例题 1｜拓扑序列计数</summary>
    <div class="body">
      <p class="q">图中有 5 个顶点，边：A→B、A→C、B→D、C→D、D→E。可能的拓扑序列有几种？</p>
      <div class="step"><b>①</b>算入度：A=0，B=1，C=1，D=2，E=1 → 只有 A 入度为 0，第一步只能选 A</div>
      <div class="step"><b>②</b>删 A 及其出边后：B=0，C=0，D=2，E=1 → B、C 都可选，<b>且 B、C 互不影响</b>（它们之间无边）→ 2 种选择</div>
      <div class="step"><b>③</b>B、C 都输出后 D 才入度 0 → D → 最后 E</div>
      <p class="ansline">答案：2 种（A B C D E 和 A C B D E）。要点：序列开头锁死 A、结尾锁死 E，只有中间 B/C 可交换。</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜度与边数</summary>
    <div class="body">
      <p class="q">某无向图有 16 条边，所有顶点度数之和是多少？若有向图有 8 条弧，各顶点入度之和、出度之和分别是？</p>
      <div class="step"><b>无向图</b>：每条边给两个端点各贡献 1 度 → 度数和 = 2×16 = <b>32</b></div>
      <div class="step"><b>有向图</b>：每条弧给起点 +1 出度、终点 +1 入度 → 入度和 = 出度和 = 弧数 = <b>8</b></div>
      <p class="ansline">答案：32；入度和 8、出度和 8</p>
    </div>
  </details>
  <p><b>图算法速查表（见到名字能对号入座）：</b></p>
  <table>
    <tr><th>算法/概念</th><th>干什么</th><th>记法</th></tr>
    <tr><td><b>DFS 深度优先</b></td><td>一条路走到底，走不动再回头换岔路</td><td>用<b>栈/递归</b>实现</td></tr>
    <tr><td><b>BFS 广度优先</b></td><td>像水波纹一圈圈扩散，先访问所有邻居</td><td>用<b>队列</b>实现（呼应 1.4）</td></tr>
    <tr><td><b>Prim / Kruskal</b></td><td>求<b>最小生成树</b>：n 个顶点用 n−1 条边连通且总边权最小</td><td>Prim 挑点、Kruskal 挑短边</td></tr>
    <tr><td><b>Dijkstra</b></td><td>求一个点到其他各点的<b>最短路径</b></td><td>贪心，逐个确定最近的点</td></tr>
    <tr><td><b>AOE 网与关键路径</b></td><td>工程最短工期 = 最长路径</td><td>详见专题②的 2.6</td></tr>
  </table>

  <details class="ex"><summary>例题 3｜DFS 与 BFS 序列（同一张图两种走法）</summary>
    <div class="body">
      <p class="q">无向图：A—B、A—C、B—D、C—D，邻接点都按字母顺序访问。从 A 出发的 DFS 和 BFS 序列分别是？</p>
      <div class="step"><b>DFS（走到底再回头）</b>：A → B → D（B 的邻居）→ D 的邻居 A、B 都走过了，只剩 C → C → 结果 <b>A, B, D, C</b></div>
      <div class="step"><b>BFS（先访问所有邻居）</b>：访问 A → 邻居 B、C 依次入队 → 出队 B 访问 → 出队 C 访问 → B 的邻居 D 入队 → 出队 D → 结果 <b>A, B, C, D</b></div>
      <p class="ansline">答案：DFS = A B D C；BFS = A B C D</p>
      <div class="tip">💡 注意：邻接点顺序以<b>题目给的邻接表/矩阵为准</b>，不一定按字母序——先看清再走。</div>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"有环就没拓扑序列、拓扑必 DAG（有向无环）"是判断题标准答案；②拓扑序列<b>不唯一</b>，题目问"可能是"就找满足所有先后约束的；③完全图别把有向/无向公式混用——有向是"每对顶点两条弧"，所以是 n(n−1)；④DFS 用栈、BFS 用队列，这俩配对常考。</div>

  <h3>1.7 查找：二分查找与散列表（两个高频计算点）</h3>
  <div class="explain">
    <p><b>二分查找：</b>每次和"中间元素"比，扔掉一半。前提是<b>有序 + 顺序存储</b>。</p>
    <div class="formula">n 个元素，二分最多比较 ⌈log₂(n+1)⌉ 次</div>
    <p><b>散列表（哈希表）：</b>用函数 H(key) 直接算出存储地址。冲突怎么办？<b>线性探测</b>：地址被占了就顺延到下一格（+1），再占就再 +1。</p>
    <ul>
      <li>常用函数：<b>除留余数法</b> H(key) = key mod p（p 取不超过表长的最大素数）</li>
      <li><b>装填因子 α</b> = 已存元素数 / 表长（衡量拥挤程度）</li>
      <li><b>平均查找长度 ASL</b> = 每个元素的比较次数之和 ÷ 元素个数</li>
    </ul>
  </div>

  <details class="ex"><summary>例题 1｜二分查找比较几次 + 走哪条路</summary>
    <div class="body">
      <p class="q">在有序表 1~15 中查找 11，依次与哪些元素比较？共比较几次？（mid = ⌊(low+high)/2⌋）</p>
      <div class="step"><b>第 1 次</b>：low=1, high=15 → mid=8；11 &gt; 8 → 去右半边（low=9）</div>
      <div class="step"><b>第 2 次</b>：low=9, high=15 → mid=12；11 &lt; 12 → 去左半边（high=11）</div>
      <div class="step"><b>第 3 次</b>：low=9, high=11 → mid=10；11 &gt; 10 → low=11</div>
      <div class="step"><b>第 4 次</b>：low=11, high=11 → mid=11 → 找到！</div>
      <p class="ansline">答案：比较 8、12、10、11，共 4 次（= ⌈log₂16⌉，正好是上限）</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜散列表线性探测 + ASL</summary>
    <div class="body">

      <div class="step"><b>插 15</b>：15 mod 7 = 1 → 1 号位空 → 放 1 号位（比较 1 次）</div>
      <div class="step"><b>插 22</b>：22 mod 7 = 1 → 冲突；探测 2 号位 → 空 → 放 2 号位（比较 2 次）</div>

  <h3>1.8 时间复杂度（循环计数法 + 主定理查表法）</h3>
  <div class="explain">
    <p><b>复杂度只保留"增长最快的那一项"，系数也丢掉</b>。先背大小天梯：</p>
    <div class="formula">O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(n³) &lt; O(2ⁿ) &lt; O(n!)</div>
    <p><b>方法一：循环计数法</b>（普通循环题通用）——数一数最内层语句总共执行多少次，列式求和，取大头。</p>
    <ul>
      <li>两层独立嵌套 for 1..n → n×n = n²</li>
      <li>内层依赖外层（for j=1..i）→ 1+2+…+n = n(n+1)/2 → 还是 O(n²)（丢系数和低次项）</li>
      <li>循环变量<b>每次翻倍/乘 3</b>（i=i*2）→ 走 log₂n 步就到 n → O(log n)</li>
    </ul>
    <p><b>方法二：主定理查表法</b>（递归式专用，你错题笔记 id 20 有完整九宫格，这里放速查版）：</p>
    <div class="formula">T(n)=a·T(n/b)+f(n)：先算 c = log 以 b 为底 a 的对数（递归方的量级）<br>f(n) 比 nᶜ 小 → 取 nᶜ｜f(n) 比 nᶜ 大 → 取 f(n)｜打平 → 乘一个 log n</div>
    <table>
      <tr><th>递归式</th><th>对应算法</th><th>复杂度</th></tr>
      <tr><td>T(n)=2T(n/2)+n</td><td>归并排序</td><td><span class="key">O(n log n)</span></td></tr>
      <tr><td>T(n)=T(n/2)+1</td><td>二分查找</td><td><span class="key">O(log n)</span></td></tr>
      <tr><td>T(n)=2T(n−1)+1</td><td>汉诺塔</td><td><span class="key">O(2ⁿ)</span></td></tr>
    </table>
    <p>📌 小注：T(n)=2T(n−1)+1 这类"<b>规模每次减 1</b>"的递推<b>不归主定理管</b>（主定理只处理 T(n/b) 缩小倍数型），它是逐层累加：1+2+4+…+2ⁿ⁻¹ ≈ 2ⁿ → O(2ⁿ)。考试直接背结论即可。</p>
  </div>

  <details class="ex"><summary>例题 1｜双层循环计数</summary>
    <div class="body">
      <p class="q">求下列代码的时间复杂度：</p>
      <pre><code>for (i = 1; i &lt;= n; i++)
  for (j = 1; j &lt;= i; j++)
    sum++;</code></pre>
      <div class="step"><b>①</b>内层执行次数：i=1 时 1 次，i=2 时 2 次……i=n 时 n 次</div>
      <div class="step"><b>②</b>总次数 = 1+2+…+n = n(n+1)/2 ≈ n²/2</div>
      <div class="step"><b>③</b>丢掉系数 1/2 和低次项 → O(n²)</div>
      <p class="ansline">答案：O(n²)</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜翻倍循环 + 主定理</summary>
    <div class="body">
      <p class="q">① i=1; while (i &lt;= n) i = i * 3; 的时间复杂度？② T(n) = 2T(n/2) + n 的时间复杂度？</p>
      <div class="step"><b>①</b>：i 走 3⁰→3¹→3²→…→3ᵏ ≤ n，即 k = log₃n 步 → O(log n)。底数不影响大 O（log₃n = log₂n / log₂3，只差常数）</div>
      <div class="step"><b>②</b>：a=2, b=2 → n^(log₂2) = n；f(n)=n 与 n 打平 → 乘 log → O(n log n)（归并排序！）</div>
      <p class="ansline">答案：① O(log n)　② O(n log n)</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"两段循环先后执行"是相加取最大，不是相乘；②对数底数不同不影响大 O；③O(2ⁿ) 和 O(n²) 差距悬殊，别选混——天梯顺序要背牢。</div>

  <h3>1.9 专题收尾 · 考前 60 秒速过</h3>

      <tr><td><b>标记</b></td><td>传<b>整个结构/记录</b></td><td>把整个"学生对象"传过去，其实只用一个字段</td></tr>
      <tr><td><b>控制</b></td><td>传<b>开关/标志</b>指挥对方</td><td>传个"mode=1 还是 2"，对方据此走不同分支</td></tr>
      <tr><td><b>外部</b></td><td>绑定外部环境</td><td>绑死某设备、某文件格式</td></tr>
      <tr><td><b>公共</b></td><td>共享<b>全局数据区</b></td><td>大家都读写同一个全局变量</td></tr>
      <tr><td><b>内容</b>（最差）</td><td><b>直接改对方内部</b></td><td>模块 A 直接访问 B 的内部变量/跳进 B 的代码</td></tr>
    </table>
    <p><b>口诀：</b>内聚低→高"<span class="key">偶逻时过通顺功</span>"｜耦合好→差"<span class="key">数标控外公内</span>"</p>
  </div>

  <details class="ex"><summary>例题 1｜内聚类型判断</summary>
    <div class="body">
      <p class="q">① 模块 M 里放的是"开机时打开日志、加载配置、连接数据库"三个操作；② 模块 N 中，先执行"读文件"，紧跟着"用文件内容算工资"。M 和 N 分别是什么内聚？</p>
      <div class="step"><b>①</b>三个操作抱团的唯一理由 = 都在"开机这个时刻"执行 → <b>时间内聚</b>（时间内聚的经典标志就是"初始化"）</div>
      <div class="step"><b>②</b>"读文件"的输出正好是"算工资"的输入，前者的产出喂给后者 → <b>顺序内聚</b>（若是"都操作同一个文件"才是通信内聚，区分点：有没有"输出变输入"的接力）</div>
      <p class="ansline">答案：时间内聚 / 顺序内聚</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜耦合类型判断</summary>
    <div class="body">
      <p class="q">① 模块 A 调用 B 时传了一个标志位 flag，B 根据 flag 的值走不同处理分支；② 模块 A 直接修改了模块 B 内部的变量。分别是什么耦合？</p>
      <div class="step"><b>①</b>传的不是数据而是"指挥棒"（A 控制了 B 的内部逻辑走向）→ <b>控制耦合</b></div>
      <div class="step"><b>②</b>伸手进了别人家里改东西 → <b>内容耦合</b>（最恶劣的一种）</div>
      <p class="ansline">答案：控制耦合 / 内容耦合</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①内聚最高 = <b>功能内聚</b>（不是"顺序"）；耦合最低 = <b>数据耦合/非直接</b>（"数据耦合"是理想的实在耦合）；②时间 vs 通信：初始化类选<b>时间</b>，共用同一份数据选<b>通信</b>；③控制耦合比数据耦合差——传开关意味着一方插手另一方的逻辑。</div>

  <h3>2.4 软件测试（阶段顺序 + 覆盖计算 + McCabe）</h3>
  <div class="explain">
    <p><b>测试阶段顺序（背熟）：</b></p>
    <div class="formula">单元 → 集成 → 确认 → 系统 → 验收（"单集确系验"）</div>
    <ul>
      <li><b>单元</b>：验零件（单个函数/模块）；<b>集成</b>：拼起来看<b>接口</b>；<b>确认</b>：对照需求确认"做对了没"；<b>系统</b>：连硬件环境一起整体验；<b>验收</b>：用户点头</li>
      <li><b>α 测试</b>：用户在<b>开发方场地</b>测（开发者旁边盯着）；<b>β 测试</b>：用户拿回<b>自己环境</b>自由用</li>
      <li><b>V 模型对应关系</b>：单元测试 ↔ 详细设计｜集成测试 ↔ 概要设计｜系统/验收测试 ↔ 需求分析</li>
    </ul>
    <p><b>白盒覆盖从弱到强</b>（以判断条件 <code>x&gt;0 且 y&gt;0</code> 为例）：</p>
    <table>
      <tr><th>覆盖</th><th>要求</th><th>对这个例子</th></tr>
      <tr><td><b>语句</b>（最弱）</td><td>每条语句至少执行一次</td><td>随便找一组让代码全跑通的值</td></tr>
      <tr><td><b>判定（分支）</b></td><td>每个判定的<b>真、假</b>各走一次</td><td>要一组整体为真 + 一组整体为假</td></tr>
      <tr><td><b>条件</b></td><td>每个<b>子条件</b>的真假都取到</td><td>x 取过真/假，y 也取过真/假（可以凑在一次里）</td></tr>
      <tr><td><b>判定-条件</b></td><td>判定和条件同时满足</td><td>上面两个的要求都达到</td></tr>
      <tr><td><b>条件组合</b></td><td>所有子条件的<b>真假组合</b>都覆盖</td><td>真真、真假、假真、假假 4 组全要</td></tr>
      <tr><td><b>路径</b></td><td>所有可行路径都走一遍</td><td>每条岔路组合都走（最强但代价最大）</td></tr>
    </table>
    <p><b>黑盒三件套</b>（不看代码看功能）：<b>等价类划分</b>（有效/无效各挑代表）、<b>边界值分析</b>（专测边界和 ±1，bug 爱藏在边上）、<b>因果图</b>（条件组合画图）。</p>
    <p><b>McCabe 环形复杂度</b>（衡量程序圈圈多复杂）：</p>
    <div class="formula">V(G) = 边数 E − 结点数 N + 2 ＝ 判定结点个数 + 1</div>
  </div>

  <details class="ex"><summary>例题 1｜McCabe 计算（送分公式题）</summary>
    <div class="body">
      <p class="q">某控制流图有 15 条边、10 个结点，环形复杂度是多少？又：一段代码里有 2 个 if 和 1 个 while，环形复杂度是多少？</p>
      <div class="step"><b>①</b>套公式：V(G) = E − N + 2 = 15 − 10 + 2 = <b>7</b></div>
      <div class="step"><b>②</b>每个判定结点（if、while 都算）+1：3 个判定 → 3 + 1 = <b>4</b></div>
      <p class="ansline">答案：7 / 4（两种算法互相验证，考场上挑顺手的用）</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜覆盖强弱判断</summary>
    <div class="body">
      <p class="q">为条件 "x&gt;0 且 y&gt;0" 设计测试用例：用例1 = (x=1, y=1)，它满足哪些覆盖？再补一组 (x=1, y=-1) 后，覆盖提升到什么级别？</p>
      <div class="step"><b>只看用例1</b>：x&gt;0 真、y&gt;0 真 → 整个判定为真。只走到了判定的一边 → 满足<b>语句覆盖</b>，不满足判定覆盖（缺"假"的情况）</div>
      <div class="step"><b>加入用例2</b>：判定为假（y 条件假）→ 判定真假都走了 → 满足<b>判定覆盖</b>。再看条件：x 取过真，y 取过真和假……x 还没取过假 → 还不满足条件覆盖</div>
      <p class="ansline">答案：用例1 满足语句覆盖；加用例2 后达到判定覆盖（想满足条件覆盖还得让 x 取一次假，如 x=-1, y=-1）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①<b>while、if 都算一个判定结点</b>，McCabe 千万别漏循环；②判定覆盖 ≠ 条件覆盖——判定看"整体真假"，条件看"每个子条件真假"，二者谁也不包含谁；③α/β 区别只看<b>场地</b>：开发方场地 = α，用户家里 = β。</div>

  <h3>2.5 软件维护四兄弟（2 分稳拿）</h3>
  <div class="explain">
    <p>软件交付不是结束，后面全是"维护"。四种维护按"为什么要改"区分：</p>
    <table>
      <tr><th>维护</th><th>为啥改</th><th>例子</th></tr>
      <tr><td><b>改正性</b></td><td>修 <b>bug</b>（以前就有，现在暴露）</td><td>用户报告下单偶尔失败，排查修复</td></tr>
      <tr><td><b>适应性</b></td><td><b>环境变了</b>，软件被迫跟着变</td><td>换新操作系统、数据位数升级（<b>千年虫</b>就是经典适应性维护）</td></tr>
      <tr><td><b>完善性</b></td><td>用户想<b>加功能、提性能</b></td><td>要求新增报表导出、页面提速——<span class="key">占比最大（约一半）</span></td></tr>
      <tr><td><b>预防性</b></td><td>还没坏，<b>提前改造</b>防患未然</td><td>把老代码重构得更易维护，为将来打底</td></tr>
    </table>
    <p><b>口诀：</b>修错是改正、换境是适应、加餐是完善、健身是预防。</p>
  </div>
  <details class="ex"><summary>例题｜维护类型判断三连</summary>
    <div class="body">
      <p class="q">①修复"打印偶尔乱码"；②把系统从 Windows 迁到国产操作系统；③用户要求新增大屏展示功能；④重构老模块方便未来扩展。各属于哪种维护？</p>
      <div class="step"><b>①</b>修 bug → <b>改正性</b>　<b>②</b>运行环境变了 → <b>适应性</b></div>
      <div class="step"><b>③</b>加功能 → <b>完善性</b>　<b>④</b>未雨绸缪提前改造 → <b>预防性</b></div>
      <p class="ansline">答案：改正 / 适应 / 完善 / 预防</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：占比最大的是<b>完善性维护</b>（不是改正性！很多人想当然选修 bug）；"千年虫"是<b>适应性</b>（环境：年份数据从两位变四位）。</div>

  <h3>2.6 甘特图 vs PERT + 关键路径（计算题）</h3>
  <div class="explain">
    <p><b>两个工具的分工：</b></p>
    <ul>
      <li><b>甘特图</b>：横道图，一条横杠一个任务——<b>直观</b>看"谁在什么时候干"，但<b>看不出任务之间的依赖关系</b></li>
      <li><b>PERT 图（网络图）</b>：箭头表示先后依赖——<b>能找关键路径</b>、算工期</li>
    </ul>
    <p><b>关键路径白话版</b>：晚饭时间——电饭煲煮饭要 30 分钟；同时炒菜 20 分钟 + 做汤 10 分钟。晚饭几点能好？<b>由最长的那条链决定</b>（30 分钟），不是把所有活加起来。项目同理：</p>
    <div class="formula">关键路径 = 项目网络图里<b>最长</b>的那条路径 = 完成项目的<b>最短工期</b><br>关键路径上的活动时差为 0：它延误 1 天，整个项目就延误 1 天</div>
  </div>

  <details class="ex"><summary>例题 1｜求关键路径与工期（逐步算）</summary>
    <div class="body">
      <p class="q">活动与工期：A(3天)、B(4天)、C(2天)、D(5天)、E(3天)。A、B 可同时开始；C 依赖 A；D、E 依赖 B。求关键路径和总工期。</p>
      <div class="step"><b>第 1 步·列出所有从头到尾的路径</b>：<br>路径① A → C；路径② B → D；路径③ B → E</div>
      <div class="step"><b>第 2 步·每条路径算总长</b>：① 3+2 = 5 天；② 4+5 = 9 天；③ 4+3 = 7 天</div>
      <div class="step"><b>第 3 步·取最长</b>：9 天 → B → D 是关键路径。B 和 D 上任何一个拖延，项目就拖延；A、C 有 9−5 = 4 天富余（浮动时间）</div>
      <p class="ansline">答案：关键路径 B → D，总工期 9 天</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜概念判断</summary>
    <div class="body">
      <p class="q">判断正误：①关键路径是持续时间最短的路径；②关键活动的总时差为 0；③压缩一个非关键活动的工期可以让项目提前完成。</p>
      <div class="step"><b>①</b>✗——关键路径是<b>最长</b>的路径（最长 = 决定总工期 = "最短工期"），千万别把"最短工期"理解成"最短路径"</div>
      <div class="step"><b>②</b>✓——关键活动一天富余都没有，时差 = 0</div>
      <div class="step"><b>③</b>✗——压缩非关键活动（本来就有富余）不改变总工期；必须压缩<b>关键活动</b>才有效</div>
      <p class="ansline">答案：错 / 对 / 错</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"关键路径 = 最长路径"，但它的含义是"最短工期"——两个说法是同一件事，别绕晕；②多条路径长度相同 = 可以有<b>多条关键路径</b>；③想提前完工，先压关键活动（还要考虑赶工成本）。</div>

  <h3>2.7 UML 图与类图六种关系（上午下午都考）</h3>
  <div class="explain">
    <p><b>UML 图分两大类（"静态/动态"分类是常考概念）：</b></p>
    <ul>
      <li><b>静态图（画结构）</b>：类图、对象图、<b>构件图</b>（代码组件）、<b>部署图</b>（硬件设备）、包图</li>
      <li><b>动态图（画行为）</b>：<b>用例图</b>、<b>顺序图</b>（按时间排消息）、通信图（协作图）、<b>状态图</b>（一个对象的状态变化）、<b>活动图</b>（像流程图）</li>
    </ul>
    <p><b>用例图三关系（下午 UML 题必考）：</b></p>
    <ul>
      <li><b>«include» 包含</b>：基用例<b>必须</b>执行被包含用例（"网上支付"必含"验证密码"），箭头指向被包含者</li>
      <li><b>«extend» 扩展</b>：可选的额外行为（"支付"偶尔触发"发送优惠券"）</li>
      <li><b>泛化</b>：一般 → 特殊，符号和类图一样是空心三角</li>
    </ul>
    <p><b>类图六种关系（从"缘分浅"到"缘分深"）：</b></p>
    <table>
      <tr><th>关系</th><th>含义</th><th>图形符号</th><th>例子</th></tr>
      <tr><td><b>依赖</b></td><td>临时用一下就完</td><td>虚线箭头</td><td>方法参数里用到别人</td></tr>
      <tr><td><b>关联</b></td><td>长期知道对方</td><td>实线（可带箭头）</td><td>学生 选修 课程</td></tr>
      <tr><td><b>聚合</b></td><td>整体-部分，<b>能拆开各自活</b></td><td>实线 + <b>空心菱形</b>（指向整体）</td><td>电脑 ◇— USB 鼠标</td></tr>
      <tr><td><b>组合</b></td><td>整体-部分，<b>同生共死</b></td><td>实线 + <b>实心菱形</b>（指向整体）</td><td>公司 ◆— 部门</td></tr>
      <tr><td><b>泛化</b></td><td>is-a 继承</td><td>实线 + <b>空心三角</b>（指向父类）</td><td>狗 → 动物</td></tr>
      <tr><td><b>实现</b></td><td>实现接口</td><td><b>虚线</b> + 空心三角</td><td>鸟类 → 飞行接口</td></tr>
    </table>
    <p><b>口诀：</b>菱形画在<b>整体</b>那端——<span class="key">空心能拆（聚合）、实心同死（组合）</span>；三角指向<b>父/接口</b>——实线继承（泛化）、虚线实现。</p>
  </div>

  <details class="ex"><summary>例题 1｜六关系对号入座</summary>
    <div class="body">
      <p class="q">①狗是一种动物；②公司由部门组成，公司注销则部门随之消失；③电脑和 USB 鼠标；④订单处理时要临时调用日志工具。各是什么关系？</p>
      <div class="step"><b>①</b>"是一种" → <b>泛化</b>（is-a）</div>
      <div class="step"><b>②</b>整体-部分且同生共死 → <b>组合</b>（实心菱形）</div>
      <div class="step"><b>③</b>整体-部分但鼠标拔了还能用 → <b>聚合</b>（空心菱形）</div>
      <div class="step"><b>④</b>临时调用一下 → <b>依赖</b></div>
      <p class="ansline">答案：泛化 / 组合 / 聚合 / 依赖</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜用例图关系判断</summary>
    <div class="body">
      <p class="q">"网上支付"用例一定会执行"验证密码"，且偶尔触发"发送优惠券"。两个关系分别是什么？</p>
      <div class="step"><b>分析</b>：必须执行 → <b>«include» 包含</b>；可选、偶尔发生 → <b>«extend» 扩展</b></div>
      <p class="ansline">答案：include 包含 / extend 扩展（一句话：include 必做，extend 可选）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①聚合 vs 组合只看一点——<b>部分能不能离开整体单独存在</b>（鼠标拔了能用=聚合；公司没了部门不存在=组合）；②菱形指向整体、三角指向父类/接口，方向画反是下午题常见扣分点；③顺序图强调<b>时间先后</b>，活动图像流程图（可画分支并发），别混。</div>

  <h3>2.8 软件质量六大特性（背词送分题）</h3>
  <div class="explain">
    <p>ISO/IEC 9126 质量模型六特性，考法 = 给场景选特性：</p>
    <table>
      <tr><th>特性</th><th>白话</th><th>场景关键词</th></tr>
      <tr><td><b>功能性</b></td><td>该做的都做对</td><td>功能齐全、结果正确</td></tr>
      <tr><td><b>可靠性</b></td><td>别动不动崩</td><td><b>平均无故障时间 MTBF</b>、故障恢复</td></tr>
      <tr><td><b>易用性</b></td><td>小白一学就会</td><td>界面友好、易学易用</td></tr>
      <tr><td><b>效率</b></td><td>快不快、省不省</td><td>响应时间、内存占用</td></tr>
      <tr><td><b>维护性</b></td><td>好改不好改</td><td>易修改、易诊断</td></tr>
      <tr><td><b>可移植性</b></td><td>换个平台行不行</td><td>从 Windows 搬到 Linux 改动小</td></tr>
    </table>

  <h3>4.1 进程与线程 + 三态模型（概念地基）</h3>
  <div class="explain">
    <p><b>白话开场：</b>程序是躺在硬盘里的代码，<b>进程</b>是程序跑起来的一次"生命"——它是<b>资源分配的基本单位</b>。<b>线程</b>是进程里的一条干活流水线，是 <span class="key">CPU 调度的基本单位</span>。同一进程里的多个线程共享内存（省资源、切换快），但一个线程崩可能连累全家。</p>
    <p><b>三态模型（必背转换图）：</b></p>
    <pre><code>          ┌──时间片用完 / 被高优先级抢占──┐
          ▼                              │
      [ 就绪 ] ──── 被调度选中 ────▶ [ 运行 ]
          ▲                              │
          │ 等的东西来了(如IO完成)         │ 请求IO / 等资源
          │                              ▼
      [ 等待 ] ◀──────────────────── [ 运行 ]</code></pre>
    <ul>
      <li><b>就绪 → 运行</b>：被调度选中（万事俱备只欠 CPU）</li>
      <li><b>运行 → 就绪</b>：时间片用完，或来了更高优先级进程（被"叫停换人"）</li>
      <li><b>运行 → 等待</b>：主动要等东西（读文件、等输入）</li>
      <li><b>等待 → 就绪</b>：等的东西到位了，但<b>不能直接变运行</b></li>

  <details class="ex"><summary>例题 1｜状态转换合法性判断（送分）</summary>

生产者：                    消费者：
P(empty)  // 有空格子吗？   P(full)   // 有产品吗？
P(mutex)  // 上锁           P(mutex)  // 上锁

  <h3>4.3 死锁（公式计算 + 概念判断）</h3>
  <div class="explain">
    <p><b>死锁</b>：几个进程互相攥着对方要的资源，谁也不撒手，全体卡死。<b>四个必要条件</b>（缺一个都死不了锁）：</p>

      <li><b>占有且等待</b>（请求保持）：攥着旧的还要新的</li>
      <li><b>不可剥夺</b>：不能硬抢</li>
      <li><b>环路等待</b>：你等我、我等你，绕成圈</li>
    </ul>
    <div class="formula">n 个进程，每个最多需要 k 个同类资源 → 系统<b>不死锁</b>最少需要资源数 = n × (k − 1) + 1</div>
    <p><b>白话理解</b>：最坏情况是每个进程都拿到 k−1 个、就差 1 个——此时只要有 1 个多余资源，就能"点火"让某个进程跑完释放资源，全家得救。所以 n(k−1) 个是最危险的数量，再加 1 就安全。</p>
    <p><b>处理策略四档：</b>死锁<b>预防</b>（提前破坏四个条件之一）→ 死锁<b>避免</b>（<b>银行家算法</b>：分配前算一算是否处于"安全状态"）→ 死锁<b>检测与解除</b>（先死锁再杀进程）→ 鸵鸟策略（假装没看见，Windows/Linux 实际这么干）。</p>

  <details class="ex"><summary>例题 1｜最少资源数计算（公式直接套）</summary>

      <p class="ansline">答案：10 台</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜概念判断</summary>
    <div class="body">

      <div class="step"><b>①</b>✗——银行家算法是<b>死锁避免</b>（预防是静态破坏条件，避免是动态判断安全状态）</div>
      <div class="step"><b>②</b>✗——不安全状态只是<b>可能</b>死锁，不是必然；但死锁一定是unsafe</div>
      <div class="step"><b>③</b>✗——打印机的物理特性就是互斥的，破坏不了；能破坏的是"占有且等待"等条件（如一次性申请全部资源）</div>
      <p class="ansline">答案：错 / 错 / 错</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"必要条件"=死锁时一定同时成立，但四个都成立<b>不一定</b>真死锁；②银行家算法关键词是"避免"和"安全状态"，别选成"预防"；③反着出题："某系统有 11 台打印机、3 个进程各需 4 台"→ 11 ≥ 10 安全。④不安全 ⇏ 死锁，但死锁 ⇒ 不安全。</div>

  <h3>4.4 页式存储与地址变换（计算题模板）</h3>
  <div class="explain">
    <p><b>白话开场：</b>内存被切成一样大的"格子"（页框），程序也切成同样大小的"页"，某一页可以放进任意一个页框——程序不用连续存放，彻底解决外部碎片。页与页框的对应关系记在<b>页表</b>里。</p>
    <div class="formula">逻辑地址 = 页号 P + 页内偏移 W　　物理地址 = 块号 × 页大小 + W<br>页大小 4KB = 2¹² → 地址低 12 位是页内偏移，高位是页号</div>
    <p><b>换算三步（照做不会错）：</b></p>
    <ol>
      <li>页号 = 逻辑地址 ÷ 页大小（取整）；偏移 = 逻辑地址 mod 页大小</li>
      <li>拿页号查页表 → 得到物理块号</li>
      <li>物理地址 = 块号 × 页大小 + 偏移</li>
    </ol>
    <p><b>快表 TLB：</b>页表放内存，取一个数据要"查页表 + 取数据"<b>两次访存</b>；快表是页表的 Cache，命中时一次访存搞定 → 提速。</p>
  </div>
  <details class="ex"><summary>例题 1｜逻辑地址 → 物理地址（手把手）</summary>
    <div class="body">
      <p class="q">页大小 1KB，某进程页表：页 0 → 块 5，页 1 → 块 10，页 2 → 块 3。逻辑地址 2500 对应的物理地址是多少？</p>
      <div class="step"><b>第 1 步</b>：页大小 1KB = 1024 → 页号 = ⌊2500 / 1024⌋ = <b>2</b>，偏移 = 2500 mod 1024 = <b>452</b></div>
      <div class="step"><b>第 2 步</b>：查页表，页 2 → 块 3</div>
      <div class="step"><b>第 3 步</b>：物理地址 = 3 × 1024 + 452 = 3072 + 452 = <b>3524</b></div>
      <p class="ansline">答案：3524</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜十六进制拆位 + 页内地址位数</summary>
    <div class="body">
      <p class="q">页大小 4KB，逻辑地址 2AB6H（十六进制），页内偏移是多少？页大小 8KB 时页内地址占几位二进制？</p>
      <div class="step"><b>①</b>4KB = 4096 = 2¹² → 低 12 位（十六进制<b>低 3 位</b>）是偏移 → 2AB6H 的偏移 = <b>AB6H</b>（页号 = 2）</div>
      <div class="step"><b>②</b>8KB = 8 × 1024 = 8192 = 2¹³ → 页内地址占 <b>13 位</b></div>
      <p class="ansline">答案：AB6H；13 位</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①十六进制地址题先看页大小对应的位数（4KB=12 位=3 个十六进制位），低位抄下来就是偏移；②物理地址用<b>块号</b>乘页大小，别错用页号乘；③页式无外部碎片但有<b>内部碎片</b>（最后一页装不满），段式相反。</div>

  <h3>4.5 页面置换算法（LRU/FIFO 模拟 + 缺页率）</h3>
  <div class="explain">
    <p>内存满了还想装新页，就得"腾地方"——挑一页换出去。考法：给一串页面访问序列，让你数缺页次数。</p>
    <table>
      <tr><th>算法</th><th>换谁走</th><th>要点</th></tr>
      <tr><td><b>OPT 最佳</b></td><td>以后<b>最久不用的</b></td><td>理论最优但没法实现（要知道未来）</td></tr>
      <tr><td><b>FIFO 先进先出</b></td><td>最早进来的</td><td>有 <span class="key">Belady 异常</span>：页框变多缺页反而可能变多</td></tr>
      <tr><td><b>LRU 最近最久未用</b></td><td>最久没被访问的</td><td>看<b>过去</b>谁最久没动；性能接近 OPT，常考</td></tr>
      <tr><td><b>CLOCK（NRU）</b></td><td>访问位为 0 的</td><td>环形扫描，近似 LRU，开销小</td></tr>
    </table>
    <div class="formula">缺页率 = 缺页次数 ÷ 访问总次数（每次<b>装入新页</b>都算缺页，包括刚开始的空框装入）</div>
  </div>
  <details class="ex"><summary>例题｜LRU 走一遍（数缺页）</summary>
    <div class="body">
      <p class="q">3 个页框（初始为空），访问序列：7、0、1、2、0、3、0、4。LRU 置换下缺页几次？缺页率？</p>
      <div class="step"><b>①</b>7：缺页 → [7]　<b>②</b>0：缺页 → [7,0]　<b>③</b>1：缺页 → [7,0,1]</div>
      <div class="step"><b>④</b>2：缺页，框满 → 最久没用的是 7 → 换 7 → [0,1,2]</div>
      <div class="step"><b>⑤</b>0：命中（0 刚用过）→ 顺序变为 [1,2,0]　<b>⑥</b>3：缺页 → 最久未用是 1 → 换 1 → [2,0,3]</div>
      <div class="step"><b>⑦</b>0：命中 → [2,3,0]　<b>⑧</b>4：缺页 → 最久未用是 2 → 换 2 → [3,0,4]</div>
      <div class="step"><b>统计</b>：缺页 7 次、命中 1 次 → 缺页率 = 7/8 = <b>87.5%</b></div>
      <p class="ansline">答案：缺页 7 次，缺页率 87.5%</p>
      <div class="tip">💡 模拟技巧：LRU 每次访问后把该页"提到最前"；满框缺页时换"排最后"的那个。逐条写序列别心算。</div>
    </div>
  </details>
  <div class="warn">⚠ 易错：①初始为空时的装入<b>也算缺页</b>，别只数替换次数；②LRU 看"最后一次被访问的时间离现在最远"，FIFO 看"进来最早"——两者经常不同；③Belady 异常只属于 FIFO，是判断题的常客。</div>

  <h3>4.6 文件管理（索引结点计算）</h3>
  <div class="explain">
    <p><b>文件物理结构三种：</b></p>
    <ul>
      <li><b>连续分配</b>：文件占连续盘块 → 支持<b>随机访问</b>、速度快，但难扩展、有外部碎片</li>
      <li><b>链接分配</b>：盘块间用指针串联 → 免碎片、易扩展，但只能<b>顺序访问</b>（随机访问慢）</li>
      <li><b>索引分配</b>：把所有块号集中登记在<b>索引块</b>里 → 既随机访问又易扩展，<b>Unix 采用</b></li>
    </ul>
    <p><b>索引结点计算题模板</b>（记住"一块能存几个块号"）：块大小 1KB、每个地址 4B → 一块能装 1024/4 = <b>256</b> 个块号。</p>
    <div class="formula">10 个直接地址 + 1 个一级间接：文件最大 = 10 + 256 块<br>再加 1 个二级间接：+ 256 × 256 = 65536 块（一级间接块里的每个地址又指向一个装满块号的块）</div>
  </div>
  <details class="ex"><summary>例题｜索引结点：文件最大多大、访问要几次读盘</summary>
    <div class="body">
      <p class="q">Unix 文件系统：i 结点含 10 个直接地址、1 个一级间接、1 个二级间接。块 1KB，地址 4B。①文件最大占多少数据块？②访问二级间接下的某数据块，至少要读几次盘（不计 i 结点本身）？</p>
      <div class="step"><b>①</b>一块存 1024/4 = 256 个地址 → 直接 10 + 一级 256 + 二级 256² = 10 + 256 + 65536 = <b>65802 块</b></div>
      <div class="step"><b>②</b>二级间接路径：读"二级间接块"（1 次）→ 读"一级间接块"（1 次）→ 读数据块（1 次）= <b>3 次</b>；直接地址只要 1 次、一级间接 2 次</div>
      <p class="ansline">答案：65802 块；3 次读盘</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"一级/二级"数的是<b>间接层数</b>，读盘次数 = 层数 + 1（最后那次是数据块）；②题目说"不计读 i 结点"就别加；③FAT（文件分配表）属于<b>链接</b>分配的显式版本。</div>

  <h3>4.7 作业与进程调度算法</h3>
  <div class="explain">
    <table>
      <tr><th>算法</th><th>规则</th><th>特点</th></tr>
      <tr><td><b>FCFS 先来先服务</b></td><td>排队，谁先来谁先跑</td><td>简单公平，但短作业被长作业"堵死"</td></tr>
      <tr><td><b>SJF 短作业优先</b></td><td>谁运行时间短谁先</td><td><span class="key">平均等待时间最短</span>，但长作业可能饿死</td></tr>
      <tr><td><b>优先级调度</b></td><td>按优先级</td><td>低优先级可能"饥饿"，可用老化解决</td></tr>
      <tr><td><b>RR 时间片轮转</b></td><td>轮流跑一个时间片</td><td><b>响应快</b>，适合交互系统；时间片太大退化成 FCFS</td></tr>
      <tr><td><b>高响应比 HRRN</b></td><td>响应比 = (等待 + 服务) ÷ 服务</td><td>等待越久响应比越高，兼顾长短作业</td></tr>
    </table>
    <p><b>周转时间</b> = 完成时间 − 到达时间；<b>带权周转时间</b> = 周转时间 ÷ 服务时间。</p>
  </div>
  <details class="ex"><summary>例题｜SJF 平均周转时间</summary>
    <div class="body">
      <p class="q">作业 A、B、C 同时到达，运行时间分别为 10、5、3 分钟，按 SJF 调度，平均周转时间是多少？</p>
      <div class="step"><b>①排顺序</b>：短的先跑 → C(3) → B(5) → A(10)</div>
      <div class="step"><b>②算完成时间</b>：C 第 3 分钟完成；B 第 3+5 = 8 分钟；A 第 8+10 = 18 分钟</div>
      <div class="step"><b>③周转时间</b>（同时到达=完成时间）：3、8、18 → 平均 = (3+8+18)/3 = <b>29/3 ≈ 9.67 分钟</b></div>
      <p class="ansline">答案：约 9.67 分钟（对比 FCFS 顺序 A→B→C 的平均 12 分钟，SJF 更优）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"平均周转时间最短"的算法是 <b>SJF</b>；②RR 的时间片轮转<b>不适合</b>批处理系统（切换开销大）；③高响应比公式里"等待时间在分子"，等得越久越容易被选中。</div>

    <p><b>SELECT 查询模板（背熟结构，下午题全靠它）：</b></p>
    <pre><code>SELECT   列名1, 列名2          ← 要什么（投影）
FROM     表1 JOIN 表2 ON 条件  ← 从哪来（连接）
WHERE    行条件               ← 挑行（选择），不能用聚合函数
GROUP BY 分组列               ← 按什么分组
HAVING   组条件               ← 筛选"组"（可以用聚合函数！）
ORDER BY 列 [ASC|DESC];       ← 排序（升/降序）</code></pre>
    <ul>
      <li><b>聚合函数</b>：COUNT（计数）、SUM（求和）、AVG（平均）、MAX、MIN</li>
      <li><b>WHERE vs HAVING</b>：WHERE 管单行、不能带聚合函数；HAVING 管分组、<span class="key">能带聚合函数</span></li>
      <li><b>模糊查询</b>：LIKE '%关键字%'（% 任意多字符，_ 单个字符）</li>
      <li><b>判空</b>：IS NULL（不能写 = NULL）</li>
    </ul>
    <p><b>语句分类（判断题）：</b></p>
    <table>
      <tr><th>类别</th><th>关键词</th><th>白话</th></tr>
      <tr><td><b>DDL 数据定义</b></td><td><span class="key">CREATE / ALTER / DROP</span></td><td>建表改表删表（改的是"结构"）</td></tr>
      <tr><td><b>DML 数据操纵</b></td><td>INSERT / UPDATE / DELETE / SELECT</td><td>增删改查"数据"</td></tr>
      <tr><td><b>DCL 数据控制</b></td><td>GRANT / REVOKE</td><td>授权收权</td></tr>
    </table>
  </div>
  <details class="ex"><summary>例题 1｜写一条统计查询（下午题模板）</summary>
    <div class="body">
      <p class="q">学生表 Student(Sno, Sname)，选课表 SC(Sno, Cno, Grade)。查询平均分超过 80 分的学生学号和平均分。</p>
      <div class="step"><b>①要什么</b>：学号 + 平均分 → SELECT Sno, AVG(Grade)</div>
      <div class="step"><b>②从哪来</b>：只需 SC 表（不用连接）</div>
      <div class="step"><b>③分组</b>：按学生分组 → GROUP BY Sno</div>
      <div class="step"><b>④筛组</b>："平均分超 80"是对组的条件、带聚合 → HAVING AVG(Grade) &gt; 80</div>
      <pre><code>SELECT Sno, AVG(Grade) FROM SC GROUP BY Sno HAVING AVG(Grade) &gt; 80;</code></pre>
      <p class="ansline">答案：如上（重点：聚合条件必须写 HAVING 不能写 WHERE）</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜语句分类快答</summary>
    <div class="body">
      <p class="q">①DROP TABLE ②GRANT SELECT ③UPDATE ④ALTER TABLE，各属于哪类？</p>
      <div class="step"><b>①</b>删表结构 → DDL　<b>②</b>授权 → DCL　<b>③</b>改数据 → DML　<b>④</b>改表结构 → DDL</div>
      <p class="ansline">答案：DDL / DCL / DML / DDL（分辨口诀：动"结构"是 DDL，动"数据"是 DML，管"权限"是 DCL）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①HAVING 里放聚合、WHERE 里放聚合必错；②主键定义：PRIMARY KEY；外键：FOREIGN KEY…REFERENCES…（下午题填空高频）；③DISTINCT 去重复行；④建视图用 CREATE VIEW，查询视图和查表一样。</div>

  <h3>5.4 范式与候选键（概念 + 计算都有）</h3>
  <div class="explain">
    <p><b>先会找候选键（解题第一步）：</b>把所有函数依赖画出来，<b>只在箭头左边出现、从不在右边出现过的属性</b>，一定在候选键里——拿它当起点，看能不能推出全部属性。</p>
    <p><b>范式从松到紧（后一级包含前一级）：</b></p>
    <table>
      <tr><th>范式</th><th>要求</th><th>白话</th></tr>
      <tr><td><b>1NF</b></td><td>列不可再分</td><td>每个格子只能放一个值（关系数据库最低要求）</td></tr>
      <tr><td><b>2NF</b></td><td>消除<b>部分函数依赖</b></td><td>非主属性不能只依赖"主键的一半"（针对组合主键）</td></tr>
      <tr><td><b>3NF</b></td><td>消除<b>传递依赖</b></td><td>非主属性之间不能"拐弯依赖"主键</td></tr>
      <tr><td><b>BCNF</b></td><td>每个决定因素都包含候选键</td><td>更严的 3NF，消除了主属性的问题</td></tr>
    </table>
    <p><b>传递依赖经典例</b>：学生(学号 → 系名，系名 → 系主任)——系主任"拐了个弯"（学号→系→系主任）→ 不满足 3NF，拆成"学生表"和"系表"两步走。</p>
    <p><b>为什么拆表（规范化目的）</b>：消除插入异常、删除异常、<b>数据冗余</b>和更新异常。</p>
  </div>
  <details class="ex"><summary>例题 1｜找候选键 + 判断范式</summary>
    <div class="body">
      <p class="q">R(学号, 课程号, 成绩, 学分)，依赖：课程号 → 学分，(学号, 课程号) → 成绩。①候选键是什么？②它最高满足第几范式？</p>
      <div class="step"><b>①</b>"学号、课程号"只在箭头左边出现 → 候选键 = <b>(学号, 课程号)</b>，恰好能推出成绩和学分，齐了</div>
      <div class="step"><b>②</b>学分只依赖课程号——课程号只是组合主键的"一半" → <b>部分函数依赖</b> → 只满足 1NF，不满足 2NF</div>
      <div class="step"><b>③</b>分解：SC(学号, 课程号, 成绩) + C(课程号, 学分) → 都达到 2NF 及以上</div>
      <p class="ansline">答案：候选键 (学号, 课程号)；最高 1NF（存在部分依赖）</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜传递依赖判断</summary>
    <div class="body">
      <p class="q">R(员工号, 部门, 部门电话)，员工号 → 部门，部门 → 部门电话。最高满足几范式？怎么改？</p>
      <div class="step"><b>判断</b>：员工号 → 部门 → 部门电话，部门电话"拐弯"依赖主键 → 传递依赖 → 满足 2NF 但<b>不满足 3NF</b></div>
      <div class="step"><b>改法</b>：拆成 员工(员工号, 部门) + 部门(部门, 部门电话)</div>
      <p class="ansline">答案：2NF；拆掉传递依赖即达 3NF</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①部分依赖只在<b>组合主键</b>下出现（单属性主键天然满足 2NF）；②3NF 消除的是"非主属性通过另一个非主属性传递依赖主键"；③范式越高表越多、查表要连接——<b>不是越高越好</b>，要权衡。</div>

  <h3>5.5 事务与并发控制（ACID + 三大读问题）</h3>
  <div class="explain">
    <p><b>事务 = 一组"要么全做、要么全不做"的操作</b>（如转账：扣款 + 入账必须同生共死）。</p>
    <div class="formula">ACID：原子性 Atomicity（全做或全不做）｜一致性 Consistency（账目守恒）<br>隔离性 Isolation（互不干扰）｜持久性 Durability（提交了就永久生效）</div>
    <p><b>并发不改锁会出的三类问题（场景判断题）：</b></p>
    <table>
      <tr><th>问题</th><th>场景</th><th>记忆点</th></tr>
      <tr><td><b>丢失更新</b></td><td>A、B 同时改同一数据，<b>后写的覆盖先写的</b></td><td>两个"写"相撞</td></tr>
      <tr><td><b>读脏数据</b></td><td>A 改了还没提交，B 读走；A 又<b>回滚</b>了 → B 读到的是废数据</td><td>读了"未提交"的数据</td></tr>
      <tr><td><b>不可重复读</b></td><td>A 两次读同一数据，<b>中间被 B 改了</b> → 两次结果不一样</td><td>读了"被提交修改"的数据</td></tr>
    </table>
    <p><b>锁机制：</b></p>
    <ul>
      <li><b>S 锁（共享锁/读锁）</b>：上锁后<b>别人只能读不能写</b>（可以多人同时持有 S 锁）</li>
      <li><b>X 锁（排他锁/写锁）</b>：上锁后<b>别人读写都不行</b>（独占）</li>
      <li><b>两段锁协议</b>：先集中加锁、再集中解锁（加完锁才开始解锁，不能反悔）→ 保证<b>可串行化</b>，但<b>不能防止死锁</b></li>
    </ul>
  </div>
  <details class="ex"><summary>例题｜场景判断问题类型 + 选锁</summary>
    <div class="body">
      <p class="q">①事务 T1 修改余额为 1000 未提交，T2 读到 1000，随后 T1 回滚为 500；②T1 读余额后，T2 把它改了并提交，T1 再读发现值变了。各是什么问题？③"T2 要读"应加什么锁？</p>
      <div class="step"><b>①</b>读到的是<b>回滚掉的未提交数据</b> → 读脏数据</div>
      <div class="step"><b>②</b>两次读结果不同（都是已提交数据）→ 不可重复读</div>
      <div class="step"><b>③</b>只读 → 加 <b>S 锁</b>（共享锁）；若要改才加 X 锁</div>
      <p class="ansline">答案：读脏数据 / 不可重复读 / S 锁</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①区分脏读和不可重复读的关键——脏读的数据<b>根本没提交</b>（作废了）；②两段锁保证"可串行化"但<b>不防死锁</b>（这是最爱考的反转）；③持久性靠日志 + 备份保障，隔离性靠锁。</div>

  <h3>5.6 完整性约束与安全性</h3>
  <div class="explain">
    <p><b>三类完整性（对号入座）：</b></p>
    <table>
      <tr><th>约束</th><th>管什么</th><th>例子</th></tr>
      <tr><td><b>实体完整性</b></td><td><span class="key">主键</span>非空且唯一</td><td>学号不能是 NULL</td></tr>
      <tr><td><b>参照完整性</b></td><td><span class="key">外键</span>要么为空、要么在主表里存在</td><td>选课表里的学号必须是学生表已有的</td></tr>
      <tr><td><b>用户自定义完整性</b></td><td>业务规则</td><td>CHECK (成绩 BETWEEN 0 AND 100)</td></tr>
    </table>
    <p><b>安全性手段（从外到内）：</b>用户标识鉴别（用户名密码）→ <b>存取控制 GRANT/REVOKE</b>（授权收权）→ 视图（把敏感列藏起来）→ 审计（记流水账）→ 数据加密。其中<b>视图</b>还负责"逻辑独立性 + 简化查询"。</p>
  </div>
  <details class="ex"><summary>例题｜约束与安全对号入座</summary>
    <div class="body">
      <p class="q">①"选课表的外键学号必须在学生表中存在"是什么约束？②"只允许用户 U 查询成绩表，不允许修改"该用什么？③"工资 &gt;= 0"呢？</p>
      <div class="step"><b>①</b>外键约束 → <b>参照完整性</b></div>
      <div class="step"><b>②</b>授权 → GRANT SELECT ON 成绩 TO U（收权用 REVOKE）</div>
      <div class="step"><b>③</b>业务规则 → 用户自定义完整性（CHECK）</div>
      <p class="ansline">答案：参照完整性 / GRANT 授权 / 用户自定义完整性</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①主键约束自动"非空 + 唯一"；②外键可以是 NULL（还没选课的学生记录）；③视图是<b>虚拟表</b>（不存数据），提供逻辑独立性。</div>

  <h3>5.7 故障恢复与备份（概念题）</h3>
  <div class="explain">
    <ul>
      <li><b>故障类型</b>：事务故障（某事务出错）→ 系统故障（断电，内存丢、硬盘在）→ 介质故障（磁盘坏了，最严重）</li>
      <li><b>恢复两大法宝</b>：<b>数据备份（转储）</b> + <b>日志</b>。日志必须<b>先写日志、后写数据库</b>（WAL 原则）</li>
      <li><b>检查点</b>：定期在日志里"存档记号"→ 故障后不用从头扫日志，从最近的检查点恢复，提速</li>
      <li><b>备份三兄弟</b>：
        <ul>
          <li><b>完全备份</b>：全部拷一遍（恢复最快、备份最慢最大）</li>
          <li><b>差分备份</b>：备份"<b>自上次完全备份以来</b>"变化的数据</li>
          <li><b>增量备份</b>：备份"<b>自上次任意备份以来</b>"变化的数据</li>
        </ul>
      </li>
    </ul>
  </div>
  <details class="ex"><summary>例题｜备份策略判断</summary>
    <div class="body">
      <p class="q">①周一完全备份，周二只备份周一以来变化的数据，这是哪种备份？②数据库断电重启后，用日志把"已提交未写入磁盘"的事务重做一遍，这叫什么操作？</p>
      <div class="step"><b>①</b>基准是"上次完全备份" → <b>差分备份</b>（增量备份的基准是"上次任意备份"）</div>
      <div class="step"><b>②</b>重做（REDO）——对已提交事务"重放"；撤销（UNDO）则是对未提交事务"擦除"</div>
      <p class="ansline">答案：差分备份；REDO 重做</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①差分 vs 增量只看基准——"相对上次完全备份"=差分，"相对上次任意备份"=增量；②已提交 → REDO，未提交 → UNDO，方向别反；③介质故障最严重，恢复要靠备份 + 日志。</div>

  <h3>5.8 专题收尾 · 考前 60 秒速过</h3>
  <ul>
    <li><b>E-R</b>：矩形实体、椭圆属性、菱形联系；m:n 联系必须单建表，1:n 并进 n 端</li>
    <li><b>关系代数</b>：σ 挑行、π 挑列、⋈ 同名列相等拼接且去重、"全部包含"用 ÷</li>
    <li><b>SQL</b>：聚合条件用 HAVING；CREATE/ALTER/DROP=DDL，INSERT/UPDATE/DELETE=DML，GRANT=DCL</li>
    <li><b>范式</b>：先找候选键（只出现在左边的属性）；部分依赖挡 2NF、传递依赖挡 3NF</li>
    <li><b>事务</b>：ACID；脏读=未提交、不可重复读=两次读不一致、丢失更新=写覆盖；两段锁不防死锁</li>
    <li><b>完整性</b>：主键=实体、外键=参照、CHECK=用户自定义</li>
    <li><b>备份</b>：先写日志后写库；已提交 REDO 未提交 UNDO；差分基准=上次完全、增量基准=上次任意</li>
  </ul>
  `

      <tr><td><b>寄存器寻址</b></td><td>操作数在寄存器里</td><td>快（不访存）</td></tr>
      <tr><td><b>寄存器间接寻址</b></td><td>寄存器里放的是地址</td><td>要访存一次取数</td></tr>
      <tr><td><b>基址寻址</b></td><td>基址寄存器 + 偏移</td><td><b>面向操作系统</b>：程序重定位、多道程序</td></tr>
      <tr><td><b>变址寻址</b></td><td>变址寄存器 + 偏移</td><td><b>面向用户</b>：数组循环遍历（改变址值扫数组）</td></tr>
      <tr><td><b>相对寻址</b></td><td>PC + 偏移</td><td>转移指令常用，程序搬移后仍正确</td></tr>
    </table>
    <p><b>一句话分基址 vs 变址：</b><span class="key">基址给系统搬家用（基址不变程序动），变址给用户数数组（偏移不变变址动）</span>。</p>
  </div>
  <details class="ex"><summary>例题｜场景选寻址方式</summary>
    <div class="body">
      <p class="q">①指令中直接给出操作数本身；②遍历数组元素；③操作数地址的地址放在寄存器里。各是什么寻址？</p>
      <div class="step"><b>①</b>操作数就在指令里 → <b>立即寻址</b>（速度最快）</div>
      <div class="step"><b>②</b>数组地址规律递增 → <b>变址寻址</b>（基址/偏移不变，变址寄存器逐次 +1）</div>
      <div class="step"><b>③</b>寄存器里存的是地址不是数据 → <b>寄存器间接寻址</b>（还要访存一次）</div>
      <p class="ansline">答案：立即寻址 / 变址寻址 / 寄存器间接寻址</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①"扩大寻址范围"是间接寻址的招牌；②立即寻址最快、间接寻址最慢（速度天梯：立即 &gt; 寄存器 &gt; 直接 &gt; 间接）；③基址/变址别记反——基址寄存器由系统管理，变址寄存器面向用户。</div>

  <h3>6.3 指令流水线（必考计算）</h3>
  <div class="explain">
    <p><b>白话开场：</b>流水线 = 工厂流水线——第一条指令还没做完，第二条就开始了。每条指令经过 k 段（取指、译码、执行……），每段耗时 Δt。</p>
    <div class="formula">流水线执行 n 条指令总时间 = (k + n − 1) × Δt<br>吞吐率 TP = n / (k + n − 1)Δt　　加速比 S = kn / (k + n − 1)</div>
    <p><b>公式由来（理解着背）：</b>第一条指令完整走 k 段用 kΔt；之后<b>每过一个 Δt 就"吐出"一条</b>指令，n−1 条再耗 (n−1)Δt → 共 (k+n−1)Δt。</p>
    <p><b>流水线冲突三兄弟：</b><b>资源冲突</b>（抢同一个部件）、<b>数据冲突</b>（后一条要用前一条的结果，需暂停等待）、<b>控制冲突</b>（遇到转移指令，不知跳哪）。</p>
  </div>
  <details class="ex"><summary>例题 1｜流水线总时间（送分模板）</summary>
    <div class="body">
      <p class="q">指令分 5 段，每段 1ns，用流水线执行 10 条指令，总时间是多少？</p>
      <div class="step"><b>套公式</b>：(k + n − 1) × Δt = (5 + 10 − 1) × 1 = <b>14ns</b></div>
      <div class="step"><b>对比不流水</b>：10 × 5 × 1 = 50ns → 加速明显</div>
      <p class="ansline">答案：14ns</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜吞吐率与加速比</summary>
    <div class="body">
      <p class="q">同上条件：吞吐率和加速比各是多少？n 很大时吞吐率趋近多少？</p>
      <div class="step"><b>吞吐率</b>：TP = 10 / 14 ≈ 0.71 条/ns</div>
      <div class="step"><b>加速比</b>：S = 5 × 10 / 14 ≈ 3.57</div>
      <div class="step"><b>极限</b>：n → ∞ 时 TP → 1/Δt（每 Δt 吐一条），S → k（最多加速 k 倍）</div>
      <p class="ansline">答案：0.71 条/ns；3.57；极限吞吐率 1/Δt、极限加速 k 倍</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①公式是 (k + n − 1) 不是 (k + n)；②加速比最多接近 k（段数），不可能无限加速；③遇到转移（跳转）指令最可能引发<b>控制冲突</b>。</div>

  <h3>6.4 存储层次与 Cache（命中率计算必考）</h3>
  <div class="explain">
    <p><b>存储金字塔：</b>寄存器 → Cache → 内存 → 外存，从上到下<b>越往下越大越慢越便宜</b>。Cache 能加速全靠<b>局部性原理</b>：刚用过的东西（时间局部性）和它旁边的东西（空间局部性）马上还会被用到。</p>
    <div class="formula">平均访问时间（同时访问方式）= h × t<sub>c</sub> + (1 − h) × t<sub>m</sub><br>h = 命中率，t<sub>c</sub> = Cache 访问时间，t<sub>m</sub> = 内存访问时间</div>
    <p><b>映射方式（决定主存块放 Cache 哪）：</b></p>
    <ul>
      <li><b>直接映射</b>：每个主存块只能进固定一行 → 硬件简单，但<b>冲突率高</b></li>
      <li><b>全相联</b>：想放哪行放哪行 → 最灵活、冲突最少，但<b>比较电路太贵</b></li>
      <li><b>组相联</b>：先分组、组内随便放 → 前两者的折中，<b>实际最常用</b></li>
    </ul>
    <p><b>Cache 与主存的交换单位是"块（行）"</b>；Cache 内容是主存内容的副本，由硬件自动调度，<b>对程序员透明</b>。</p>
  </div>
  <details class="ex"><summary>例题｜平均访问时间</summary>
    <div class="body">
      <p class="q">Cache 存取周期 20ns，主存 200ns，命中率 90%。CPU 平均访问时间是多少？</p>
      <div class="step"><b>套公式</b>：0.9 × 20 + (1 − 0.9) × 200 = 18 + 20 = <b>38ns</b></div>
      <div class="step"><b>另一种出法</b>（先 Cache 后主存）：未命中时也先花一次 Cache 时间 → 0.9 × 20 + 0.1 × (20 + 200) = 18 + 22 = 40ns——看清题目用哪种</div>
      <p class="ansline">答案：38ns（同时访问方式）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①两种平均访问时间公式（未命中是否再花 Cache 时间）按题意选；②Cache 对程序员/编译器<b>透明</b>；③"组相联"是冲突率与成本的折中，不是最灵活也不是最简单。</div>

  <h3>6.5 磁盘存取时间（小计算）</h3>
  <div class="explain">
    <div class="formula">磁盘存取时间 = 寻道时间（磁头移到磁道）+ 旋转延迟（等目标扇区转到磁头下）+ 传输时间（读写数据）</div>
    <p><b>旋转延迟的算法：</b>磁盘每转一圈 r 转/分 → 转一圈要 60/r 秒 → <span class="key">平均旋转延迟 = 半圈 = 60/(2r)</span> 秒。</p>
    <p>磁盘还有<b>单缓冲/双缓冲</b>读取计算题（配合专题⑧的多媒体看），核心：双缓冲能边读边处理，总时间 ≈ 连续读盘时间 + 一块处理时间。</p>
  </div>
  <details class="ex"><summary>例题｜平均旋转延迟</summary>
    <div class="body">
      <p class="q">磁盘转速 6000 转/分，平均旋转延迟是多少毫秒？</p>
      <div class="step"><b>①</b>6000 转/分 → 100 转/秒 → 转一圈 10ms</div>
      <div class="step"><b>②</b>平均等半圈 → 10 / 2 = <b>5ms</b></div>
      <p class="ansline">答案：5ms（再叠加寻道时间和传输时间才是总存取时间）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①平均旋转延迟是<b>半圈</b>，最大才是整圈；②寻道时间通常<b>远大于</b>旋转延迟，是磁盘慢的主因；③单位换算：转/分 ÷ 60 = 转/秒。</div>

  <h3>6.6 校验码：奇偶、海明、CRC（计算题三连）</h3>
  <div class="explain">
    <table>
      <tr><th>校验码</th><th>能力</th><th>原理</th></tr>
      <tr><td><b>奇偶校验</b></td><td>只能<b>检 1 位错</b>，<b>不能纠错</b></td><td>让整个码字 1 的个数为奇（奇校验）/偶（偶校验）</td></tr>
      <tr><td><b>海明码</b></td><td><span class="key">既能检错又能纠 1 位错</span></td><td>k 个校验位安插在 2 的幂次位置</td></tr>
      <tr><td><b>CRC 循环冗余</b></td><td>检错强（不纠错）</td><td>模 2 除法（异或运算）求余数作校验位</td></tr>
    </table>
    <div class="formula">海明码位数关系：2<sup>k</sup> ≥ n + k + 1（n = 信息位数，k = 校验位数）<br>CRC：信息码左移 r 位（r = 生成多项式最高次幂），对生成多项式做<b>模 2 除法</b>，余数就是校验位</div>
    <p><b>模 2 除法白话</b>：跟普通除法一样上商，但"借位减法"换成"<b>异或</b>"——上商规则：首位是 1 商 1，首位是 0 商 0，不借位。</p>
  </div>
  <details class="ex"><summary>例题 1｜海明码需要几位校验位</summary>
    <div class="body">
      <p class="q">信息位 4 位，用海明码校验至少需要几位？信息位 8 位呢？</p>
      <div class="step"><b>①</b>试 k=3：2³ = 8 ≥ 4 + 3 + 1 = 8 ✓ → 需要 <b>3 位</b></div>
      <div class="step"><b>②</b>试 k=4：2⁴ = 16 ≥ 8 + 4 + 1 = 13 ✓ → 需要 <b>4 位</b>（k=3 时 8 &lt; 12 不够）</div>
      <p class="ansline">答案：4 位信息 → 3 位；8 位信息 → 4 位</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜CRC 求校验码（模 2 除法走一遍）</summary>
    <div class="body">
      <p class="q">信息码 1101，生成多项式 G(x) = x³ + x + 1（即 1011），求 CRC 校验码。</p>
      <div class="step"><b>第 1 步</b>：G 有 4 位（最高次 3）→ 信息码左移 3 位：1101<b>000</b></div>
      <div class="step"><b>第 2 步·模 2 除</b>：1101000 ÷ 1011（异或减法）：<br>1101000 ⊕ 1011000 = 0110000 → 110000 ⊕ 101100 = 011100 → 11100 ⊕ 10110 = 1010 → 1010 ⊕ 1011 = <b>001</b>（余数 3 位）</div>
      <div class="step"><b>第 3 步</b>：余数 001 就是校验码 → 发送码 = 1101<b>001</b></div>
      <p class="ansline">答案：校验码 001（自检：1101001 ÷ 1011 余数应为 0）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①CRC 左移位数 = 生成多项式<b>位数 − 1</b>（=最高次幂）；②模 2 除法用异或、不借位；③奇偶校验"检 1 位错"不含纠错，海明才能纠错；④余数位数不够要在前面<b>补 0</b> 到 r 位。</div>

  <h3>6.7 数制与码制（补码范围年年见）</h3>
  <div class="explain">
    <p><b>进制转换一条路：</b>十进制 → 二进制"除 2 取余倒着读"；二进制 ↔ 十六进制"4 位一组"；小数部分"乘 2 取整顺着读"。</p>
    <table>
      <tr><th>码制</th><th>n 位表示范围</th><th>要点</th></tr>
      <tr><td>原码</td><td>−(2ⁿ⁻¹−1) ~ 2ⁿ⁻¹−1</td><td>最高位符号位，0 有两种表示（±0）</td></tr>
      <tr><td>反码</td><td>同原码</td><td>负数 = 原码除符号位按位取反</td></tr>
      <tr><td><b>补码</b></td><td><span class="key">−2ⁿ⁻¹ ~ 2ⁿ⁻¹−1</span></td><td>0 唯一表示，<b>多表示一个最小负数</b>；加减统一用加法</td></tr>
      <tr><td>移码</td><td>同补码</td><td>补码符号位取反，用于<b>浮点数阶码</b>（便于比较大小）</td></tr>
    </table>
    <p><b>必背：8 位补码范围 = −128 ~ +127</b>（−128 只有补码能表示，原码反码都表示不了）。</p>
  </div>
  <details class="ex"><summary>例题｜补码计算三连</summary>
    <div class="body">
      <p class="q">①16 位补码能表示的数值范围？②−1 的 8 位补码是多少？③[x]补 = 11101100，x 是多少？</p>
      <div class="step"><b>①</b>−2¹⁵ ~ 2¹⁵−1 = <b>−32768 ~ +32767</b></div>
      <div class="step"><b>②</b>1 = 00000001 → 取反 11111110 → 加 1 = <b>11111111</b>（−1 的补码是全 1）</div>
      <div class="step"><b>③</b>符号位 1 = 负数：11101100 → 减 1 = 11101011 → 取反 = 00010100 = 20 → x = <b>−20</b></div>
      <p class="ansline">答案：−32768~32767；11111111；−20</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①补码范围"<b>负多正一</b>"：−2ⁿ⁻¹ 能表示但 +2ⁿ⁻¹ 不行；②负数补码的还原步骤是"减 1 再取反"（或取反加 1，殊途同归）；③浮点数阶码用移码因为"可以直接比大小"，尾数常用补码/原码。</div>

  <h3>6.8 可靠性计算（串并联公式）</h3>
  <div class="explain">
    <div class="formula">串联系统：R = R₁ × R₂ × … × Rₙ（一个坏全坏 → 越串越不可靠）<br>并联系统：R = 1 − (1 − R₁)(1 − R₂)…(1 − Rₙ)（全坏才坏 → 越并越可靠）</div>
    <p><b>MTBF 平均无故障时间</b>：可靠性是概率，MTBF 是平均能撑多久，MTBF = 1/λ（λ 为失效率）——可靠性和 MTBF 是同一个指标的两种表达。</p>
  </div>
  <details class="ex"><summary>例题｜混合系统可靠性</summary>
    <div class="body">
      <p class="q">系统由两个部件组成：部件甲是单机可靠性 0.9；部件乙是两台 0.9 的机器并联。甲、乙串联构成系统，求系统可靠性。</p>
      <div class="step"><b>①并联部分</b>：R乙 = 1 − (1 − 0.9)² = 1 − 0.01 = <b>0.99</b></div>
      <div class="step"><b>②串联部分</b>：R = R甲 × R乙 = 0.9 × 0.99 = <b>0.891</b></div>
      <p class="ansline">答案：0.891</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①并联用"1 − (1−R)ⁿ"，先把"坏的概率"算出来再 1 减它；②串联是连乘不是相加；③N 模冗余（表决制）考概念：3 模表决中 2 个以上一致才算对。</div>

  <h3>6.9 专题收尾 · 考前 60 秒速过</h3>
  <ul>
    <li><b>CPU</b>：PC 存下一条指令地址、IR 存当前指令；ACC/ALU/PSW 属运算器</li>
    <li><b>寻址</b>：立即最快、间接最慢且扩范围；基址面向系统（重定位）、变址面向用户（数组）</li>
    <li><b>流水线</b>：总时间 (k+n−1)Δt；极限吞吐 1/Δt、极限加速 k 倍；转移指令 → 控制冲突</li>
    <li><b>Cache</b>：平均访问 = h·tc + (1−h)·tm；组相联是折中；对程序员透明</li>
    <li><b>磁盘</b>：寻道 + 旋转延迟（半圈 = 60/(2r)）+ 传输</li>
    <li><b>校验</b>：奇偶只检不纠、海明检 + 纠 1 位（2ᵏ ≥ n+k+1）、CRC 模 2 除法取余</li>
    <li><b>补码</b>：8 位 −128~127；负数范围比正数多一个；阶码用移码</li>
    <li><b>可靠性</b>：串联连乘、并联 1−(1−R)ⁿ；混合系统先算并联再串联</li>
  </ul>
  `
},

  <details class="ex"><summary>例题 2｜编译 vs 解释</summary>

      <p class="q">①生成目标程序后执行，运行快；②逐句翻译逐句执行，出错即停；③C、Python 分别属于哪种？</p>
      <div class="step"><b>①</b><b>编译方式</b>（一次性翻译，程序跑得快、可脱离编译器）</div>
      <div class="step"><b>②</b><b>解释方式</b>（边翻边执行，跨平台好、但慢）</div>
      <div class="step"><b>③</b>C = 编译型；Python = 解释型；<b>Java 是混合</b>：编译成字节码 + JVM 解释/JIT 执行</div>
      <p class="ansline">答案：编译 / 解释 / C 编译型、Python 解释型、Java 混合型</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①六阶段顺序题——语义分析在语法分析<b>之后</b>；②类型不匹配是<b>语义</b>错误不是语法错误；③编译不生成可执行代码（只翻译源程序），解释方式<b>不生成</b>目标程序。</div>

  <h3>7.2 文法与语言（四种文法对号入座）</h3>
  <div class="explain">
    <p>文法描述"句子怎么合法地构造"。Chomsky 按限制从松到严分四型：</p>
    <table>
      <tr><th>型</th><th>名称</th><th>限制</th><th>对应</th></tr>
      <tr><td>0 型</td><td>短语结构文法</td><td>左边至少含一个非终结符</td><td>图灵机</td></tr>
      <tr><td>1 型</td><td>上下文有关文法</td><td>|左边| ≤ |右边|（不能越写越短）</td><td>—</td></tr>
      <tr><td><b>2 型</b></td><td><b>上下文无关文法</b></td><td>左边必须是<b>单个非终结符</b></td><td><span class="key">语法分析</span>、程序设计语言</td></tr>
      <tr><td><b>3 型</b></td><td><b>正规文法</b></td><td>右边最多一个非终结符且位置固定（A→aB 或 A→a）</td><td><span class="key">词法分析</span>、正规式</td></tr>
    </table>
    <p><b>概念速记：</b>终结符 = 最终出现在句子里的词（如标识符、运算符）；非终结符 = 中间占位符（如 &lt;表达式&gt;）；推导 = 从开始符号一路替换到句子。</p>
  </div>
  <details class="ex"><summary>例题｜判断文法类型</summary>
    <div class="body">
      <p class="q">判断下列文法类型：①G: S → aS | a；②G: A → Aa | b；③G: S → AB，A → a，B → b。</p>
      <div class="step"><b>①</b>S → aS：左边单非终结符、右边"终结符开头+单非终结符" → <b>3 型（正规文法）</b></div>
      <div class="step"><b>②</b>A → Aa：非终结符在<b>左</b>、终结符在右——若 3 型文法其它规则是 A→a…（右线性）就矛盾，且规则集一致时是 3 型（左线性）；若同时出现 A→aB 和 A→Ba 则只能算 <b>2 型</b></div>
      <div class="step"><b>③</b>S → AB：左边单非终结符，但右边有<b>两个</b>非终结符 → 不是 3 型，是 <b>2 型（上下文无关）</b></div>
      <p class="ansline">答案：3 型；2 型；2 型（判断顺序：先看 3 型的"右边最多一个非终结符"，不行再退 2 型）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①右边出现<b>两个</b>非终结符（如 S→AB）就不是 3 型；②2 型 = 上下文无关（语法分析用），3 型 = 正规文法（词法分析用），配对关系要记牢；③正规文法左线性、右线性<b>不能混用</b>。</div>

  <h3>7.3 正规式与有限自动机</h3>
  <div class="explain">
    <p><b>正规式（正则表达式）是描述"词"的最强工具：</b></p>
    <ul>
      <li><b>|</b>：或（a|b = a 或 b）</li>
      <li><b>*</b>：闭包，重复 <span class="key">0 次或多次</span></li>
      <li><b>+</b>：重复 <b>1 次或多次</b>（a⁺ = aa*）</li>
      <li>拼接：ab = 先 a 后 b</li>
    </ul>
    <p><b>有限自动机两兄弟：</b></p>
    <ul>
      <li><b>DFA 确定有限自动机</b>：每个状态遇到每个输入字符<b>只有一个</b>去向</li>
      <li><b>NFA 非确定有限自动机</b>：可以去多个方向、可以 ε 转移（不读字符就跳）；<b>NFA 一定能转成等价的 DFA</b>，识别能力相同</li>
    </ul>
  </div>
  <details class="ex"><summary>例题｜正规式匹配判断</summary>
    <div class="body">
      <p class="q">正规式 (a|b)*abb 能匹配下面哪些串？①abb ②aabb ③abab ④bab</p>
      <div class="step"><b>读懂式子</b>：任意个 a/b 组成的串，<b>结尾必须是 abb</b></div>
      <div class="step"><b>①</b>abb ✓（开头零个字符）　<b>②</b>aabb ✓（a+abb）</div>
      <div class="step"><b>③</b>abab ✗ 结尾是 ab　<b>④</b>bab ✗ 结尾是 ab</div>
      <p class="ansline">答案：①②（技巧：先看"*"管什么、再看串尾是否吻合固定后缀）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①* 包含"0 次"，(a|b)* 能匹配<b>空串</b>；②a* 和 a⁺ 的区别就是"能不能空"；③NFA 与 DFA <b>识别能力等价</b>（都能转），差别在"确定的程度"。</div>

  <h3>7.4 参数传递：传值 vs 传址（年年考的代码题）</h3>
  <div class="explain">
    <table>
      <tr><th>方式</th><th>传什么</th><th>函数内修改实参？</th></tr>
      <tr><td><b>传值调用</b></td><td>把实参的<b>值拷贝</b>一份</td><td><span class="key">不影响外面</span>（改的是复印件）</td></tr>
      <tr><td><b>传址（引用）调用</b></td><td>把实参的<b>地址</b>递进去</td><td><span class="key">直接影响外面</span>（改的是原件）</td></tr>
    </table>
  </div>
  <details class="ex"><summary>例题｜传值与传址输出对比</summary>
    <div class="body">
      <p class="q">C 语言代码如下，输出是什么？</p>
      <pre><code>void f(int x, int *y) { x = 100; *y = 200; }
int main() {
  int a = 1, b = 2;
  f(a, &amp;b);
  printf("%d,%d", a, b);   // 输出？
}</code></pre>
      <div class="step"><b>①</b>参数 x 是<b>传值</b>：a 的值 1 被拷贝进来，改成 100 只动复印件 → a 不变，仍是 <b>1</b></div>
      <div class="step"><b>②</b>参数 y 是<b>传址</b>：拿到 b 的地址，*y = 200 改的是原件 → b 变 <b>200</b></div>
      <p class="ansline">答案：输出 1,200（口诀：传值动不了原件，传址一步到原件）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①C 语言<b>只有传值</b>——传指针本质也是"把地址值拷贝过去"，效果等同传址；②数组名传参自动退化为指针，函数内修改数组元素影响原数组；③"传引用"（C++ 的 &amp;）是真·传址。</div>

  <h3>7.5 程序语言分类与特点（概念送分）</h3>
  <div class="explain">
    <table>
      <tr><th>分类角度</th><th>类别</th><th>代表 / 特点</th></tr>
      <tr><td rowspan="4"><b>编程范式</b></td><td>命令式（过程式）</td><td>C、Pascal——一步步下指令</td></tr>
      <tr><td><b>面向对象</b></td><td>Java、C++、Python——封装继承多态</td></tr>
      <tr><td><b>函数式</b></td><td><span class="key">Lisp、Haskell</span>——函数是"一等公民"、递归重</td></tr>
      <tr><td><b>逻辑式</b></td><td><span class="key">Prolog</span>——描述事实和规则，让机器推理</td></tr>
      <tr><td rowspan="2"><b>类型系统</b></td><td>静态类型</td><td>编译时定类型：C、Java</td></tr>
      <tr><td>动态类型</td><td>运行时定类型：Python、JS</td></tr>
    </table>
    <ul>
      <li><b>脚本语言</b>（Python/JS/Shell）：解释执行、动态类型、简洁灵活，适合胶水活</li>
      <li><b>面向对象三特征</b>：<b>封装</b>（藏内部）、<b>继承</b>（复用父类）、<b>多态</b>（同接口不同实现）</li>
    </ul>
  </div>
  <details class="ex"><summary>例题｜语言对号入座</summary>
    <div class="body">
      <p class="q">①Prolog 属于什么范式语言？②"运行时才确定变量类型"指什么？③面向对象的三大特征？</p>
      <div class="step"><b>①</b><b>逻辑（声明式）语言</b>——写规则让它自己推</div>
      <div class="step"><b>②</b><b>动态类型</b>（静态 = 编译时确定）</div>
      <div class="step"><b>③</b>封装、继承、多态</div>
      <p class="ansline">答案：逻辑式；动态类型；封装/继承/多态</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①函数式代表 Lisp、逻辑式代表 Prolog，别互换；②"多态"是同一个接口、不同对象不同行为，不是"多继承"；③脚本语言 ≠ 一定动态类型（但通常都是）。</div>

  <h3>7.6 专题收尾 · 考前 60 秒速过</h3>
  <ul>
    <li><b>编译六阶段</b>：词法 → 语法 → 语义 → 中间代码 → 优化 → 目标代码；符号表和出错处理贯穿</li>

  </ul>

  <h3>8.4 多媒体基础（容量计算必考）</h3>
  <div class="explain">
    <p><b>声音数字化三步：</b>采样（每隔多久取一个点）→ 量化（把点变成数值）→ 编码。两个铁律：</p>
    <div class="formula">奈奎斯特采样定理：采样频率 ≥ 2 × 信号最高频率<br>声音容量（字节）= 采样频率 × 量化位数 × 声道数 × 时间 / 8</div>
    <p><b>图像容量：</b></p>
    <div class="formula">图像容量（字节）= 水平像素 × 垂直像素 × 颜色深度 / 8<br>颜色深度：16 色 = 4 位，256 色 = 8 位，65536 色 = 16 位，真彩色 24 位</div>
    <p><b>颜色空间（对号入座）：</b><b>RGB</b>（显示器、发光）、<b>CMYK</b>（印刷、反光）、<b>YUV</b>（电视，亮度与色度分离，兼容黑白电视）、<b>HSV</b>（直观调色）。</p>
    <p><b>视频容量 ≈ 每帧图像容量 × 帧率 × 时间</b>（未压缩时）。</p>
  </div>
  <details class="ex"><summary>例题 1｜图像容量计算（模板题）</summary>
    <div class="body">
      <p class="q">一幅 640×480 的图像，用 16 色（4 位颜色深度）存储，需要多少 KB？</p>
      <div class="step"><b>套公式</b>：640 × 480 × 4 / 8 = 640 × 480 / 2 = <b>153600 字节</b></div>
      <div class="step"><b>换单位</b>：153600 ÷ 1024 = <b>150 KB</b></div>
      <p class="ansline">答案：150 KB</p>
    </div>
  </details>
  <details class="ex"><summary>例题 2｜采样定理判断</summary>
    <div class="body">
      <p class="q">语音信号最高频率为 4kHz，数字化时采样频率至少是多少？CD 音乐采样率 44.1kHz 基于什么？</p>
      <div class="step"><b>①</b>≥ 2 × 4kHz = <b>8kHz</b>（电话语音正是 8kHz 采样）</div>
      <div class="step"><b>②</b>44.1kHz &gt; 2 × 20kHz（人耳上限）→ 满足奈奎斯特定理，可完整还原人耳可听声音</div>
      <p class="ansline">答案：8kHz；奈奎斯特采样定理（2 倍最高频率）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①容量公式最后<b>÷8 换字节</b>、再 ÷1024 换 KB，别忘；②16 色 ≠ 16 位！16 色 = 4 位（2⁴=16），256 色 = 8 位——"色数 = 2^位数"；③采样率不够会"失真"，是<b>频率混叠</b>不是噪声。</div>

  <h3>8.5 数学与逻辑杂项（零碎但常出 2~3 分）</h3>
  <div class="explain">
    <p><b>逻辑运算（真值表别记错）：</b></p>
    <table>
      <tr><th>运算</th><th>符号</th><th>记忆</th></tr>
      <tr><td>与 AND</td><td>∧、&&</td><td>全真才真</td></tr>
      <tr><td>或 OR</td><td>∨、||</td><td>有真就真</td></tr>
      <tr><td>非 NOT</td><td>¬、!</td><td>取反</td></tr>
      <tr><td>异或 XOR</td><td>⊕</td><td><span class="key">不同为真</span></td></tr>
    </table>
    <p><b>重要等价式（推导题救命的）：</b></p>
    <ul>
      <li><b>德摩根定律</b>：¬(A ∧ B) = ¬A ∨ ¬B；¬(A ∨ B) = ¬A ∧ ¬B（"与"取反变"或"）</li>
      <li><b>蕴含 A→B</b> 等价于 <span class="key">¬A ∨ B</span>；其逆否命题 ¬B→¬A 与它<b>等价</b>（A→B 的逆命题 B→A <b>不等价</b>！）</li>
      <li>短路求值：C 语言中 <code>&amp;&amp;</code> 左边为假右边不算、<code>||</code> 左边为真右边不算——考"表达式副作用执行几次"</li>
    </ul>
    <p><b>排列组合速查：</b>排列 A(n,m) = n!/(n−m)!（有顺序）；组合 C(n,m) = n!/(m!(n−m)!)（无顺序）；n 个元素全排列 = n!。</p>
  </div>
  <details class="ex"><summary>例题｜逻辑等价与短路求值</summary>
    <div class="body">
      <p class="q">①¬(A∧B) 等价于什么？②"如果下雨则带伞"的逆否命题是？③C 代码 <code>if (i&gt;0 &amp;&amp; a[i]&gt;5)</code> 中 i=0 时 a[0] 会被访问吗？</p>
      <div class="step"><b>①</b>德摩根：<b>¬A ∨ ¬B</b></div>
      <div class="step"><b>②</b>"不带伞则没下雨"（¬B→¬A）；注意逆命题"带伞则下雨"<b>不等价</b></div>
      <div class="step"><b>③</b><b>不会</b>——&amp;&amp; 短路：左边 i&gt;0 为假，右边直接跳过（这也是防数组越界的惯用写法）</div>
      <p class="ansline">答案：¬A ∨ ¬B；¬B→¬A；不会（短路）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①逆否 ⇔ 原命题，逆命题/否命题<b>不等价</b>于原命题；②A→B 为真时，若 A 真 B 必真——"A 真 B 假"是唯一让蕴含为假的组合；③异或是"不同为 1"，与"同或"（相同为 1）相反。</div>

  <h3>8.6 专业英语（术语背熟就能猜）</h3>
  <div class="explain">
    <p><b>上午卷最后 5 道英语题</b>：一篇短文挖 5 个空，四选一。<b>答题技巧：看空格前后的词性搭配 + 认高频术语</b>。下面是软件设计师真题最爱词（先背加粗的）：</p>
    <table>
      <tr><th>领域</th><th>高频术语</th></tr>
      <tr><td>需求/设计</td><td><b>requirement</b> 需求、<b>specification</b> 规格、<b>architecture</b> 架构、<b>module</b> 模块、<b>interface</b> 接口</td></tr>
      <tr><td>测试</td><td><b>test case</b> 测试用例、<b>coverage</b> 覆盖、<b>regression</b> 回归、debug 调试</td></tr>
      <tr><td>数据库</td><td><b>schema</b> 模式、<b>query</b> 查询、transaction 事务、redundancy 冗余、<b>normalization</b> 规范化</td></tr>
      <tr><td>网络/安全</td><td><b>protocol</b> 协议、<b>authentication</b> 认证、encryption 加密、vulnerability 漏洞、firewall 防火墙</td></tr>
      <tr><td>开发过程</td><td><b>iteration</b> 迭代、<b>increment</b> 增量、<b>maintainability</b> 可维护性、<b>reuse</b> 复用、agile 敏捷</td></tr>
      <tr><td>常用动词</td><td>specify 规定、validate 验证（做对了没）、verify 确认（做没做对）、deploy 部署、integrate 集成</td></tr>
    </table>
    <p><b>句法技巧：</b>空格前是冠词/形容词 → 填名词；空格前是情态动词/助动词 → 填动词原形或分词；名词从句常缺 <b>that / which</b>；条件句常缺 <b>if / when</b>。</p>
  </div>
  <details class="ex"><summary>例题｜英语填空示范</summary>
    <div class="body">
      <p class="q">"The goal of testing is to find as many defects as possible; debugging is the process of ___ the known defects."（A. removing B. removed C. remove D. removal）</p>
      <div class="step"><b>语法定位</b>：空格在 "the process of ___" 中，of 是介词，后面可接<b>名词或动名词</b></div>
      <div class="step"><b>语义定位</b>：debugging（调试）的目的是"修复"缺陷</div>
      <div class="step"><b>排除</b>：B 是过去分词不通、C 是动词原形不通；D removal 虽是名词，但 "of removing" 更符合 process of + doing 结构</div>
      <p class="ansline">答案：A. removing（修复缺陷）</p>
    </div>
  </details>
  <div class="warn">⚠ 易错：①verify（确认符合需求）和 validate（验证是用户想要的）在考题里常互换考"质量"语境，不必较真语义、按选项词性排除更快；②英语题平均每题 1 分钟，不会就按词性猜，性价比最高的 5 分。</div>

  <h3>8.7 专题收尾 · 考前 60 秒速过</h3>
  <ul>
    <li><b>著作权</b>：自动产生不用登记；署名/修改/完整权无限期；财产权 = 终生+50 年；委托无合同归受托方</li>
    <li><b>专利</b>：发明 20、实用新型 10、外观 15，自申请日起；先申请原则；商标 10 年可无限续展</li>
    <li><b>标准</b>：GB 强制、GB/T 推荐、DB 地方、Q 企业；ISO/IEC 国际</li>
    <li><b>多媒体</b>：采样 ≥ 2×最高频率；图像容量 = 像素×深度/8；16 色=4 位、256 色=8 位</li>
    <li><b>逻辑</b>：德摩根 ¬(A∧B)=¬A∨¬B；A→B ≡ ¬A∨B；逆否等价、逆命题不等价；&amp;&amp; 短路</li>
    <li><b>英语</b>：背术语 + 看词性（of 后填名词/动名词、情态动词后填原形）</li>
  </ul>
  `
}
];

/* ════════════════════════════════════════════════════════════ */
function secIds(t) {
  if (!t.done) return [];
  return [...t.html.matchAll(/<h3>/g)].map((m, i, arr) => t.id + '-' + i);
}

function renderNav() {
  $('nav').innerHTML = TOPICS.map(t => {
    const cls = t.done ? 'has' : 'empty';
    const doneMark = t.done && secIds(t).length && secIds(t).every(id => mastered[id]) ? ' done' : '';
    return `<button class="${cls}${doneMark}" ${t.done ? `onclick="jump(${t.id})"` : ''} title="${t.done ? t.title : t.title + '（待更新）'}">${t.done && doneMark ? '✓ ' : ''}${t.title}</button>`;
  }).join('');
}

function jump(id) {
  document.getElementById('sec-' + id)?.scrollIntoView({ behavior: 'smooth' });
}

function render() {
  const done = TOPICS.filter(t => t.done);
  $('content').innerHTML = done.map(t => {
    const secs = [...t.html.matchAll(/<h3>/g)];
    let html = t.html;
    // 给每个 h3 打上小节 id
    let idx = 0;
    html = html.replace(/<h3>/g, () => `<h3 id="s-${t.id}-${idx++}">`);
    const secCount = secs.length;
    const doneCount = [...Array(secCount).keys()].filter(i => mastered[t.id + '-' + i]).length;
    return `
    <section class="sec" id="sec-${t.id}">
      <div class="sec-head">
        <h2>${t.title}</h2>
        <div>
          <span class="score">${t.score}</span>
          <button class="ok-btn" onclick="toggleSec(${t.id}, this)">✓ 已吃透本专题</button>
        </div>
      </div>
      ${html}
    </section>`;
  }).join('');
  renderNav(); renderStats();
}

function renderStats() {
  let total = 0, doneN = 0;
  TOPICS.filter(t => t.done).forEach(t => {
    const n = (t.html.match(/<h3>/g) || []).length;
    total += n;
    for (let i = 0; i < n; i++) if (mastered[t.id + '-' + i]) doneN++;
  });
  $('statTotal').textContent = total;
  $('statDone').textContent = doneN;
  $('fill').style.width = total ? (doneN / total * 100) + '%' : '0%';
}

function toggleSec(id, btn) {
  const sec = document.getElementById('sec-' + id);
  const h3s = sec.querySelectorAll('h3');
  const on = btn.classList.toggle('on');
  h3s.forEach((h, i) => {
    const key = id + '-' + i;
    if (on) mastered[key] = true; else delete mastered[key];
  });
  sec.classList.toggle('mastered', on);
  localStorage.setItem(MASTER_KEY, JSON.stringify(mastered));
  renderNav(); renderStats();
}

function $ (id) { return document.getElementById(id); }
render();
</script>
