解析：虚拟局域网（VirtualLocalAreaNetwork，VLAN），是将一个物理的LAN在逻辑上划分成多
个广播域的通信技术。VLAN内的主机间可以直接通信，而VLAN之间不能直接通信，从而将广播
报文限制在一个VLAN内。VLAN的好处主要有三个：
（1）端口的分隔。即便在同一个交换机上，处于不同VLAN的端口也是不能通信的。这样一
个物理的交换机可以当作多个逻辑的交换机使用。
（2）网络的安全。不同VLAN不能直接通信，杜绝了广播信息的不安全性。
（3）灵活的管理。更改用户所属的网络不必换端口和连线，只更改软件配置就可以了。

源端口（SourcePort），16位，指明发送数据的进程使用的端口号。
目的端口（DestinationPort），16位，指明数据将发往目的主机的端口号。
序号（SequenceNumber），32位，表示该报文段所发送数据的第一个字节的编号，在TCP连接
中所传输字节流的每一个字节都会按顺序编号，由于序列号是由32位表示，所以每2^32个字节，
就会产生序列号回绕，再次从0开始。在建立连接时由计算机生成的随机数作为其初始值，通过SYN
包传给接收端主机，每发送一次数据，就「累加」一次该值。
确认号（AcknowledgmentNumber），32位，表示接收方期望收到发送方下一个报文段的第一个
字节数据的编号，也就是告诉发送方：我希望你下次发送的数据的第一个字节数据的编号为此确认
号。确认号只有在ACK标志为1时才有效。发送端收到确认应答后代表确认序号之前的数据都已经
被正常接收。
数据偏移（DataOffset），4位，它指出TCP报文段的数据起始距离TCP报文段的起始处有多远。
实际上是TCP首部长度，用来标识数据段的起始位置。最大能表示的数是15，单位是4个字节，因
此数据偏移的最大值是60个字节，这也是TCP首部的最大字节。因为固定首部的存在，数据偏移
的值最小为20个字节，因此选项长度不能超过40字节*（减去20个字节的固定首部）。
保留位（Reserved），6位，保留为今后使用，现在必须置为0。
窗口大小（Window），16位。表示现在允许对方发送的数据量，也就是告诉对方，本报文段确
认号开始允许对方发送的数据量，到达此值，需要ACK确认后才能继续发送数据。窗口指的是发送
本报文段的一方的接受窗口（而不是自己的发送窗口），窗口大小是给对方用的。之所以要有这个限
制，是因为接收方的数据缓存空间是有限的。
校验和（Checksum），16位。检验和字段检验的范围包括首部和数据这两部分。通过CRC算法
提供额外的可靠性。
紧急指针UrgentPointer），16位。紧急指针仅在URG=1时才有意义，它指出本报文段中的紧
急数据的字节数（紧急数据结束后就是普通数据）。因此，在紧急指针指出了紧急数据的末尾在报文
段中的位置。当所有紧急数据都处理完时，TCP就告诉应用程序恢复到正常操作。值得注意的是，
即使窗口为0时也可以发送紧急数据。但是在实际操作中很少使用紧急指针。
选项部分（Options），长度可变，最长可达40个字节。当没有使用“选项"时，TCP的首部长度
是20字节。最大长度可以根据TCP首部长度进行推算。

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme setup
            const themeBtn = document.getElementById('theme-btn');
            const html = document.documentElement;
            
            const savedTheme = localStorage.getItem('theme') || 'light';
            html.setAttribute('data-theme', savedTheme);
            themeBtn.textContent = savedTheme === 'light' ? '🌙' : '☀️';
            
            themeBtn.addEventListener('click', () => {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeBtn.textContent = newTheme === 'light' ? '🌙' : '☀️';
            });

            // Mobile menu
            const menuBtn = document.getElementById('menu-btn');
            const sidebar = document.getElementById('sidebar');
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('open');
            });
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 900 && !sidebar.contains(e.target) && e.target !== menuBtn) {
                    sidebar.classList.remove('open');
                }
            });

            // Parse markdown
            let rawMd = document.getElementById('raw-markdown').textContent;
            
            const contentDiv = document.getElementById('markdown-content');
            contentDiv.innerHTML = marked.parse(rawMd);
            
            // Syntax highlighting
            if (window.Prism) {
                Prism.highlightAll();
            }

            // Generate TOC
            const tocDiv = document.getElementById('toc');
            const headers = contentDiv.querySelectorAll('h1, h2, h3, h4');
            
            // Highlight specific markers
            const walker = document.createTreeWalker(contentDiv, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            let node;
            while (node = walker.nextNode()) {
                textNodes.push(node);
            }
            textNodes.forEach(textNode => {
                if (textNode.nodeValue.includes('🔺') || textNode.nodeValue.includes('重点')) {
                    const span = document.createElement('span');
                    span.innerHTML = textNode.nodeValue
                        .replace(/🔺/g, '<span class="highlight-icon">🔺</span>')
                        .replace(/重点/g, '<span style="color: #ef4444; font-weight: bold; border-bottom: 2px dashed #ef4444;">重点</span>');
                    textNode.parentNode.replaceChild(span, textNode);
                }
            });
            
            headers.forEach((h, index) => {
                const id = 'heading-' + index;
                h.id = id;
                const a = document.createElement('a');
                a.href = '#' + id;
                a.textContent = h.textContent;
                a.className = 'toc-' + h.tagName.toLowerCase();
                
                a.addEventListener('click', (e) => {
                    if (window.innerWidth <= 900) {
                        sidebar.classList.remove('open');
                    }
                });
                
                tocDiv.appendChild(a);
            });

            // Scroll to top button
            const toTop = document.getElementById('totop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    toTop.classList.add('visible');
                } else {
                    toTop.classList.remove('visible');
                }
            });
            
            // Active TOC highlighting
            const tocLinks = document.querySelectorAll('#toc a');
            window.addEventListener('scroll', () => {
                let current = '';
                // Add a small offset to highlight early
                const offset = 100;
                headers.forEach(h => {
                    const top = h.offsetTop;
                    if (scrollY >= top - offset) {
                        current = h.getAttribute('id');
                    }
                });
                
                tocLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === '#' + current) {
                        link.classList.add('active');
                    }
                });
            });
            
        });
    </script>
