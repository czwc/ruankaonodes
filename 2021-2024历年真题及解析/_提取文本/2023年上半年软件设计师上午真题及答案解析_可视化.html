===== 第2页 =====
手机端题库：微信搜索「软考达人」／PC端题库：www.ruankaodaren.com
计算机中，系统总线用于_（1）_连接。
（1）A.接口和外设
B.运算器、控制器和寄存器
C.CPU、主存及外设部件
D.DMA控制器和中断控制器
## 参考答案：C
【富国老师解析】：所谓总线(Bus)，是指计算机设备和设备之间传输信息的公共数据通道。总线
分为内部总线、外部总线和I/O总线。内部总线：CPU内部连接各寄存器及运算器部件之间的总
线。系统总线：也称外部总线，CPU和计算机系统中其他高速功能部件相互连接的总线，即CPU
与主存及外设部件之间相互连接的总线，所以答案选C。I/O总线：中低速I/0设备相互连接的
总线。I/0接口与外设之间通过数据信号线、联络信号线、时钟脉冲等进行数据交互；运算器、
控制器和寄存器是CPU的组成部分；DMA控制器和中断控制器属于输入输出系统中对外设进行
管理的部件。
在由高速缓存、主存和硬盘构成的三级存储体系中，CPU执行指令时需要读取数据，那么
DMA控制器和CPU发出的数据地址是（2）
（2）A.高速缓存地址
B.主存物理地址
C.硬盘的扇区地址
D.虚拟地址
## 参考答案：B
【富国老师解析】：输入输出系统的工作方式又四种：程序查询方式、程序中断方式、DMA方式
和通道方式。其中，在DMA方式下，通过DMA控制器获得总线的控制权，使得数据在I/O设备和
主存之间直接进行数据传输。那么DMA控制器发出的数据地址是主存的物理地址，因为 DMA控制
器要找到I/O设备与主存交换数据的地址。CPU执行指令时读取数据，数据在主存中，因此CPU
发出的数据地址是主存物理地址。答案选B。

计算机系统中，定点数常采用补码表示，以下关于补码表示的叙述中，错误的是_（5）
（5）A.补码零的表示是唯一的
B.可以将减法运算转化为加法运算
C.符号位可以与数值位一起参加运算
D.与真值的对应关系简单且直观
## 参考答案：D
【富国老师解析】：定点数的表示有原码、反码、补码和移码。在计算机中，定点数常采用补码
表示，其中，最高位为符号位，其余为数值位。在补码表示中，补码零的表示是唯一的，符号位
可以与数值位一起参加运算，而且可以将减法运算转化为加法运算，这些都是补码表示的特点。
但是，补码表示中，与真值的对应关系并不是简单直观的。因为在补码表示中，对于正数，
与原码相同；对于负数，其原码符号位不变，数值位取反末尾再加1。因此，与真值的对应关系
并不是简单直观的，需要进行特别的转换操作。这种转换操作有一定的计算复杂度，需要进行额
外的转换处理才能得到正确的结果。

===== 第4页 =====
手机端题库：微信搜索「软考达人」／PC端题库：www.ruankaodaren.com
(6)
A.1004ns
B.1998ns
C. 2003ns
D.2008ns
## 参考答案：C
【富国老师解析】：指令流水线的操作周期按各步操作的最大时间来考虑，即t=max{ti}=2ns。
对于n条指令来说，先算出第一条指令的执行时间，即2ns+2ns+lns=5ns。然后算出剩下n-1条指
令的执行时间，即(n-1)*t-(1000-1)*2ns=1998ns。因此执行完1000条指令所需的时间为
1998ns+5ns=2003ns。答案选C。

（8）

## 参考答案：DC
【富国老师解析】：SSL（Secure SocketLayer）和TLS（TransportLayer Security）建立在
TCP 传输层上的安全协议，最常使用 SSL/TLS 的场景是在HTTPS 中，通过在HTTP 和TCP 中加了一
层SSL/TLS，使得不安全的HTTP成为了安全的HTTPS。
HTTPS采用混合加密方式，即使用非对称加密算法和对称加密算法相结合的方式。整个握
手过程中，服务器和客户端通过非对称加密算法进行通信，确认彼此身份后，再生成一个会话密

钥，采用对称加密算法对后续的通信数据进行加密传输。因此，浏览器和服务器之间用于加密
HTTP消息的方式是会话密钥+对称加密。答案选D。
在PKI体系中，为了避免证书被恶意使用或泄露造成损失，引入了证书吊销机制，即当证书
被撤销时，应及时向证书颁发机构（CA）发起吊销请求，将该证书列入证书吊销列表（CRL）中。
此外，还可以使用在线证书状态协议（OCSP）查询证书是否被吊销。客户端在建立SSL/TLS连
接时，会验证服务器证书的有效性，如果证书被撤销，则无法验证证书的合法性，此时可能会出
现安全漏洞，导致网络攻击，那么客户端无法再信任服务器。答案选C。

共同封闭原则：包中的所有类对于同一类性质的变化应该是共同封闭的。一个变化若对一个
包产生影响，则将对该包中的所有类产生影响，而对于其他的包不造成任何影响。
共同重用原则：一个包中的所有类应该是共同重用的。如果重用了包中的一个类，那么就

接口分离原则：不应该强迫客户依赖于它们不用的方法。接口属于客户，不属于它所在的类
层次结构。即：依赖于抽象，不要依赖于具体，同时在抽象级别不应该有对于具体细节的依赖。
这样做的好处在于可以最大限度地应对可能的变化。

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme setup
            const themeBtn = document.getElementById('theme-btn');
            const html = document.documentElement;
            
            const savedTheme = localStorage.getItem('theme') || 'light';
            html.setAttribute('data-theme', savedTheme);
            themeBtn.textContent = savedTheme === 'light' ? '🌙' : '☀️';
            
            themeBtn.addEventListener('click', () => {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeBtn.textContent = newTheme === 'light' ? '🌙' : '☀️';
            });

            // Mobile menu
            const menuBtn = document.getElementById('menu-btn');
            const sidebar = document.getElementById('sidebar');
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('open');
            });
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 900 && !sidebar.contains(e.target) && e.target !== menuBtn) {
                    sidebar.classList.remove('open');
                }
            });

            // Parse markdown
            let rawMd = document.getElementById('raw-markdown').textContent;
            
            const contentDiv = document.getElementById('markdown-content');
            contentDiv.innerHTML = marked.parse(rawMd);
            
            // Syntax highlighting
            if (window.Prism) {
                Prism.highlightAll();
            }

            // Generate TOC
            const tocDiv = document.getElementById('toc');
            const headers = contentDiv.querySelectorAll('h1, h2, h3, h4');
            
            // Highlight specific markers
            const walker = document.createTreeWalker(contentDiv, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            let node;
            while (node = walker.nextNode()) {
                textNodes.push(node);
            }
            textNodes.forEach(textNode => {
                if (textNode.nodeValue.includes('🔺') || textNode.nodeValue.includes('重点')) {
                    const span = document.createElement('span');
                    span.innerHTML = textNode.nodeValue
                        .replace(/🔺/g, '<span class="highlight-icon">🔺</span>')
                        .replace(/重点/g, '<span style="color: #ef4444; font-weight: bold; border-bottom: 2px dashed #ef4444;">重点</span>');
                    textNode.parentNode.replaceChild(span, textNode);
                }
            });
            
            headers.forEach((h, index) => {
                const id = 'heading-' + index;
                h.id = id;
                const a = document.createElement('a');
                a.href = '#' + id;
                a.textContent = h.textContent;
                a.className = 'toc-' + h.tagName.toLowerCase();
                
                a.addEventListener('click', (e) => {
                    if (window.innerWidth <= 900) {
                        sidebar.classList.remove('open');
                    }
                });
                
                tocDiv.appendChild(a);
            });

            // Scroll to top button
            const toTop = document.getElementById('totop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    toTop.classList.add('visible');
                } else {
                    toTop.classList.remove('visible');
                }
            });
            
            // Active TOC highlighting
            const tocLinks = document.querySelectorAll('#toc a');
            window.addEventListener('scroll', () => {
                let current = '';
                // Add a small offset to highlight early
                const offset = 100;
                headers.forEach(h => {
                    const top = h.offsetTop;
                    if (scrollY >= top - offset) {
                        current = h.getAttribute('id');
                    }
                });
                
                tocLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === '#' + current) {
                        link.classList.add('active');
                    }
                });
            });
            
        });
    </script>
