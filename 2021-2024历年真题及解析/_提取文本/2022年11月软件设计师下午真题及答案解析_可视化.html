## 试题一（共15分）（202211）
阅读下列说明和图，回答问题1至问题4，将解答填入答题纸的对应栏内。
【说明】
随着新能源车数量的迅猛增长，全国各地电动汽车配套充电桩急速增长，同时也带来了充电桩计量准确性的问题。充电桩都需要配备
相应的电能计量和电费计费功能，需要对充电计量准确性强制进行检定。现需开发计量检定云端软件，其主要功能是：
（1）数据接收。接收计量装置上报的充电数据，即充电过程中电压、电流、电能等充电监测数据和计量数据（充电监测数据为充电
桩监测的数据，计量数据为计量装置计量的数据，以秒为间隔单位)，接收计量装置心跳数据，并分别进行存储。
（2）基础数据维护。管理员对充电桩、计量检定装置等基础数据进行维护。
（3）数据分析。实现电压、电流、电能数据的对比，进行误差分析，记录充电桩的充电误差，供计量装置检定。系统根据计量检测
人员给出的查询和统计条件展示查询统计结果。
（4）充电桩检定。分析充电误差：计量检测人员根据误差分析结果和检定信息记录，对充电桩进行检定，提交检定结果：系统更新
充电桩中的检定信息（检定结果和检定时间），并存储于检定记录。
（5）异常告警。检测计量装置心跳，当心跳停止时，向管理员发出告警。
（6）检定信息获取，供其它与充电桩相关的第三方服务查询充电桩中的检定信息。现采用结构化方法对计量检定云端软件进行分析

### 【问题3】
策略模式
原因：多种单位之间不同的换算规则可以写成不同的算法策略，这些算法之间是平等关系，可以根据自己的需求选择不同的策略，并
且可以灵活切换。策略模式的功能就是把具体的算法实现，从具体的业务处理里面独立出来，把它们实现成为单独的算法类，从而形成一
系列的算法，并让这些算法可以相互替换。
策略模式，此模式可以定义一些列的算法策略，把它们一个个封装起来，并且使它们可以相互替换。在需要指定的计量单位换算时，调用
相应的算法策略即可。
