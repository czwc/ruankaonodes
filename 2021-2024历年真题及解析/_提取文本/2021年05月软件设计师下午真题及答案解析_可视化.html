## 试题一（共 15 分）
阅读下列说明和数据流图，回答问题1 至问题4，将解答填入答题纸的对应栏内。
【说明】
某停车场运营方为了降低运营成本，减员增效，提供良好的停车体验，欲开发无人值守
停车系统，该系统的主要功能是：
（1）信息维护。管理人员对车位（总数、空余车位数等）计费规则等基础信息进行设
置。
（2）会员注册。车主提供手机号、车牌号等信息进行注册，提交充值信息（等级、绑
定并授权支付系统进行充值或交费的支付账号）不同级别和充值额度享受不同停车折扣点。
（3）车牌识别。当车辆进入停车场时，若有（空余车位数大于1），自动识别车牌号后
进行道闸控制，当车主开车离开停车场时，识别车牌号，计费成功后，请求道闸控制。
（4）计费。更新车辆离场时间，根据计费规则计算出停车费用，若车主是会员，提示
停车费用：若储存余额够本次停车费用，自动扣费，更新余额，若储值余额不足，自动使用
授权缴费账号请求支付系统进行支付，获取支付状态。若非会员临时停车，提示停车费用，
车主通过扫描费用信息中的支付码调用支付系统自助交费，获取支付状态。
（5）道闸控制。根据道闸控制请求向道闸控制系统发送放行指令和接收道闸执行状态。
若道闸执行状态为正常放行时，对入场车辆，将车牌号及其入场时间信息存入停车记录，修
改空余车位数；对出场车辆更新停车状态，修改空余车位数。当因道闸重置系统出现问题（断
网断电或是故障为抬杠等情况），而无法在规定的时间内接收到其返回的执行状态正常放行
时，系统向管理人员发送异常告警信息，之后管理人员安排故障排查处理，确保车辆有序出
入停车场。

据流图和图1-2 所示的0 层数据流图。

（1）注册：患者扫描医院提供的二维码进行注册，注册过程中，患者需提供其病历号，
系统根据病历号自动获取患者基本信息。
（2）登录：已注册的患者可以登录系统进行线上抓药，未册的患者系统拒绝其登陆。
（3）确认处方：患者登录后，可以查看医生开具的所有处方。患者选择需要抓药的处
方和数量（需要抓几副药），同时说明是否需要煎制。选择取药方式：自行到店取药或者送
药上门,若选择送药上门，患者需要提供提供收货人姓名、联系方式和收货地址。系统自动
计算本次抓药的费用，患者可以使用微信或支付宝等支付方式支付费用。支付成功之后，处
方被发送给药师进行药品配制。
（4）处理处方：药师根据处方配置好药品。若患者要求煎制，药师对配置好的药品进

取药。
（5）药品派送：处方完成后，对于选择送药上门的患者，系统将给快递人员发送药品
配送信息，等待快递人员取药；并给患者发送收获验证码。
（6）送药上门：快递人员将配制好的药品送到患者指定的收获地址。患者收货时，向
快递人员出示收获验证码，快递人员使用该验证码确认药品已送到。

【说明】
凸多边形是指多边形的任意两点的连线均落在多边形的边界或内部。相邻的点连线落在
多边形边界上，称为边；不相邻的点连线落在多边形内部，称为弦。假设任意两点连线上均
有权重，凸多边形最优三角剖分问题定义为：求将凸多边形划分为不相交的三角形集合，且
各三角形权重之和最小的剖分方案。每个三角形的权重为三条边权重之和。
假设N 个点的凸多边形点编号为V1, V2, ...... , VN,若在Vk 处将原凸多边形划分为一
个三角形V1VkVN，两个子多边形V1, V2, ... , Vk 和Vk, Vk+1, ... , VN 得到一个最优的
剖分方案，则该最优剖分方案应该包含这两个子凸边形的最优剖分方案。用m[i][j]表示Vi-1,
Vi, ...,Vj 构成的凸多边形的最优剖分方案的权重，S[i][j]记录剖分该凸多边形的k 值。
则：
m[i][j] =
0, i ≥j
min
i≤k＜j
m[i][k] + m[k + 1][j] + W Vi - 1VkVj , i ＜ j
其中：W(Vi-1VkVj)=Wi-1,k +Wk,j +Wj,i-1 为三角形Vi-1VkVj 的权重，Wi-1,k,Wk,j,
Wj,i-1 分别为该三角形三条边的权重。求解凸多边形的最优剖分方案，即求解最小剖分的权
重及对应的三角形集。

int S[N + 1][N + 1]; // S[i][j]记录多边形 Vi-1 到 Vj 最优三角剖分的 k 值
int W[N + 1][N + 1]; // 凸多边形的权重矩阵，在 main 函数中输入
/* 三角形的权重 a, b, c, 三角形的顶点下标 */
int get_ triangle_weight(int a, int b, int c) {
return W[a][b] + W[b][c] + W[c][a];
}

                root.querySelectorAll('p, li, td, blockquote, pre, dd').forEach(function (el) {

                    t.classList.add('revealed');

            // Syntax highlighting
            if (window.Prism) {
                Prism.highlightAll();
            }

            // Generate TOC
            const tocDiv = document.getElementById('toc');
            const headers = contentDiv.querySelectorAll('h1, h2, h3, h4');
            
            // Highlight specific markers
            const walker = document.createTreeWalker(contentDiv, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            let node;
            while (node = walker.nextNode()) {
                textNodes.push(node);
            }
            textNodes.forEach(textNode => {
                if (textNode.nodeValue.includes('🔺') || textNode.nodeValue.includes('重点')) {
                    const span = document.createElement('span');
                    span.innerHTML = textNode.nodeValue
                        .replace(/🔺/g, '<span class="highlight-icon">🔺</span>')
                        .replace(/重点/g, '<span style="color: #ef4444; font-weight: bold; border-bottom: 2px dashed #ef4444;">重点</span>');
                    textNode.parentNode.replaceChild(span, textNode);
                }
            });
            
            headers.forEach((h, index) => {

                h.id = id;

                tocDiv.appendChild(a);

            // Scroll to top button
            const toTop = document.getElementById('totop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    toTop.classList.add('visible');
                } else {
                    toTop.classList.remove('visible');
                }
            });
            
            // Active TOC highlighting
            const tocLinks = document.querySelectorAll('#toc a');
            window.addEventListener('scroll', () => {
                let current = '';
                // Add a small offset to highlight early
                const offset = 100;
                headers.forEach(h => {
                    const top = h.offsetTop;
                    if (scrollY >= top - offset) {
                        current = h.getAttribute('id');
                    }
                });
                
                tocLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === '#' + current) {
                        link.classList.add('active');
                    }
                });
            });
            
        });
