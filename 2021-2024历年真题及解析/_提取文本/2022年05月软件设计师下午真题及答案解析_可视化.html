【说明】
某公司欲开发一款外卖订餐系统，集多家外卖平台和商户为一体,为用户提供在线浏览餐品、订餐和配送等服务。该系统的主要功能
是：
1. 入驻管理。用户注册：商户申请入驻，设置按时间段接单数量阅值等。系统存储商户/用户信息。
2. 餐品管理。商户对餐品的基本信息和优惠信息进行发布、修改、删除。系统存储相关信息。
3. 订餐。用户浏览商户餐单，选择餐品及数量后提交订餐请求。系统存储订餐订单。
4. 订单处理。收到订餐请求后，向外卖平台请求配送。外卖平台接到请求后发布配送单，由平台骑手接单，外卖平台根据是否有骑
手接单返回接单状态。若外卖平台接单成功，系统给支付系统发送支付请求，接收支付状态。支付成功，更新订单状态为已接单，向商户
发送订餐请求并由商户打印订单，给用户发送订单状态：若支付失败，更新订单状态为下单失败，向外卖平台请求取消配送，向用户发送
下单失败。若系统接到外卖平台返回接单失败或超时未返回接单状态，则更新订单状态为下单失败，向用户发送下单失败。
5. 配送。商户备餐后，由骑手取餐配送给用户。送达后由用户扫描骑手出示的订单上的配送码后确认送达，订单状态更改为已送达，
并发送给商户。
6. 订单评价。用户可以对订单餐品、骑手配送服务进行评价，推送给对应的商户、所在外卖平台，商户和外卖平台对用户的评价进

## 试题四（共 15 分）（202205）
阅读下列说明和 C 代码，回答问题至问题 3，将解答写在答题纸的对应栏内。
【说明】
某工程计算中经常要完成多个矩阵相乘（链乘）的计算任务，对矩阵相乘进行以下说明。
手机端题库：微信搜索「软考达人」  /  PC端题库：www.ruankaodaren.com
===== 第5页 =====
（1）两个矩阵相乘要求第一个矩阵的列数等于第二个矩阵的行数，计算量主要由进行乘法运算的次数决定，假设采用标准的矩阵相
乘算法，计算A× ∗ B×需要 m ∗ n ∗ p 次行乘法运算的次数决定、乘法运算，即时间复杂度为 O(m ∗ n ∗ p)。
（2）矩阵相乘满足结合律，多个矩阵相乘时不同的计算顺序会产生不同的计算量。以矩阵A15×100，A2100×8，A38×50三个矩阵相乘
为例，若按(A1 ∗ A2) ∗ A3计算，则需要进行 5 ∗ 100 ∗ 8 + 5 ∗ 8 ∗ 50 = 6000次乘法运算，若按 A1 ∗ (A2 ∗ A3)计算，则需要进行 100 ∗ 8 ∗
50 + 5 ∗ 100 ∗ 50 = 65000次乘法运算。
