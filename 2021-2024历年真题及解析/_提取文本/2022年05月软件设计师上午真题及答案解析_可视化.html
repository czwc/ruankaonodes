===== 第1页 =====
软件设计师（中级）
2022 年 05 月软件设计师上午综合知识真题及答案解析
 
1.以下关于冯诺依曼计算机的叙述中，不正确的是______。
A.程序指令和数据都采用二进制表示
B.程序指令总是存储在主存中，而数据则存储在高速缓存中
C.程序的功能都由中央处理器(CPU)
D.程序的执行工作由指令进行自动控制
答案：B
本题考查的是计算机体系结构相关知识。
在冯诺依曼结构中，程序指令和数据存在同一个存储器中。B 选项描述错误。本题选择 B 选项，其他描述都是正确
的。
2.以下关于 SRAM和 DRAM 储存器的叙述中正确的是______。
A.与 DRAM相比，SRAM集成率低，功率大、不需要动态刷新
B.与 DRAM相比，SRAM集成率高，功率小、需要动态刷新
C.与 SRAM相比，DRAM集成率高，功率大、不需要动态刷新
D.与 SRAM相比，DRAM集成率低，功率大、需要动态刷新
答案：D
本题考查存储器分类相关知识。
DRAM集成率相对较低，功耗相对较大，需要动态刷新，储存元由一个晶体管和一个电容器组成。
SRAM集成率相对较高，功耗相对较小，不需要动态刷新，存储元由 6 个晶体管组成。
本题 D 选项描述正确。
3.为了实现多级中断,保存程序现场信息最有效的方法是使用______。
A.通用寄存器 B.累加器 C.堆栈 D.程序计数器
答案：C
本题考查的是中断相关概念。
在中断过程中，程序现场信息保存在堆栈部分。本题选择 C 选项。
通用寄存器、累加器、程序计数器都是属于 CPU 内部的子部件，与本题无关。
4.以下关于 RISC和 CICS 的叙述中，不正确的是______。
A.RISC的大多指令在一个时钟周期内完成
B.RISC普遍采用微程序控制器，CICS则普遍采用硬布线控制器
C.RISC的指令种类和寻指方式相对于 CICS更少
D.RISC和 CICS都采用流水线技术
答案：B
手机端题库：微信搜索「软考达人」  /  PC端题库：www.ruankaodaren.com
===== 第2页 =====
RISC采用硬布线逻辑控制，CISC采用微程序控制，B选项描述错误，本题选择 B选项。
对于 D 选项 RISC与 CISC 都可以采用流水线技术，CISC更适合，所以 D选项描述没有问题。
5. 某计算机系统构成如下图所示，假设每个软件的千小时可靠度 R 为 0.95，则该系统的干小时可靠度约为______。
A.0.95 × (1 − (1 − 0.95)2) × 0.95
B.0.95 × (1 − 0.95)2 × 0.95
C.0.95 × 2 × (1 − 0.95) × 0.95
D.0.954 × (1 − 0.95)2
答案：A
本题考查的是混联模型可靠性计算。
可以将图示分解为 3 个部分 R1、R2、R3串联，整个系统可靠度为 R1*R2*R3。
其中 R1、R3的可靠度都为 R = 0.95，R2的可靠度为 1 − (1 − R)2 = 1 − (1 − 0.95)2。代入表达式可得，系统最终
的可靠度为 0.95 × (1 − (1 − 0.95)2) × 0.95，本题选择 A选项。
6.以下信息交换情形中，采用异步传输方式的是______。
A.CPU 与内存储器之间交换信息
B.CPU 与 PCI总线交换信息
C.CPU 与 I/O接口交换信息
D.I/O 接口与打印设备间交换
答案：C
本题考查的是 I/O接口相关概念。
CPU与 I/O接口交换信息是异步传输的，C 选项描述正确。
7.下列协议中，可以用于文件安全传输的是______。
A.FTP B.SFTP C.TFTP D.ICMP
答案：B
本题考查的是 TCP/IP协议簇相关知识。
FTP文件共享是可靠但不安全的方式，TFTP文件共享是不可靠且不安全的。ICMP是 Internet控制报文协议，与文
件传输功能无关。
在计算机领域，SSH文件传输协议（英语：SSH File Transfer Protocol，也称 Secret File Transfer Protocol，
中文：安全文件传送协议，英文：Secure FTP或字母缩写：SFTP）是一数据流连接，提供文件访问、传输和管理功能
的网络传输协议。只有 SFTP涉及文件安全传输。本题选择 B 选项。
8.下列不属于计算机病毒的是______。
A.永恒之蓝 B.蠕虫 C.特洛伊木马 D.DDOS
答案：D
本题考查的是网络威胁相关内容。
在本题中将木马也归于病毒一类了。
DDoS指的是分布式拒绝服务攻击，不属于计算机病毒与木马，其他选项都属于计算机病毒或木马，本题选择 D 选
项。
手机端题库：微信搜索「软考达人」  /  PC端题库：www.ruankaodaren.com
===== 第3页 =====
9.以下关于杀毒软件的描述中，错误的是______。
A.应当为计算机安装杀毒软件并及时更新病毒
B.安装杀毒软件可以有效防止蠕虫病毒
C.安装杀毒软件可以有效防止网站信息被篡改
D.服务器操作系统也需要安装杀毒软件
答案：C
本题考查的是网络安全管理相关内容。
在杀毒软件的使用过程中，我们应该为个人计算机、服务器都按照杀毒软件，并且应当及时更新病毒库信息，可
以有效防止蠕虫病毒等。ABD选项描述都是正确的。杀毒软件只能防病毒，不能有效防止网站信息被篡改，所以 C 选项
描述错误，本题选择 C 选项。
10.通过在出口防火墙上配置______功能可以阻止外部未授权用户访问内部网络。
A.ACL B.SNAT C.入侵检测 D.防病毒
答案：A
本题考查的是网络防护相关概念。
ACL一般指访问控制列表。访问控制列表（ACL）是一种基于包过滤的访问控制技术，它可以根据设定的条件对接
口上的数据包进行过滤，允许其通过或丢弃。本题描述的是 ACL，其他选项与本题描述不符，选择 A选项。
SNAT:源地址转换,源地址转换是内网地址向外网访问时，发起访问的内网 ip地址转换为指定的 ip 地址。
11.SQL注入是常见的 web攻击，以下不能够有效防御 SQL注入的手段是______。
A.对用户输入做关键字过滤
B.部署 Web 应用防火墙进行防护
C.部署入侵检测系统阻断攻击
D.定期扫描系统漏洞并及时修复
答案：B
本题考查的是 SQL注入攻击相关内容。
对用户输入做关键字过滤、部署入侵检测系统阻断攻击、定期扫描系统漏洞并及时修复都可以有效防御 SQL 注入
攻击，WEB防火墙不可以。本题选择 B 选项。
Web应用防火墙（Web Application Firewall，简称 WAF）对网站或者 App的业务流量进行恶意特征识别及防护，
在对流量清洗和过滤后，将正常、安全的流量返回给服务器，避免网站服务器被恶意入侵导致性能异常等问题，从而
保障网站的业务安全和数据安全。
12.甲乙丙三者分别就相同内容的发明创造，先后向专利管理部门提出申清，______可以获得专利申请权。
A.甲乙丙均 B.先申请者 C.先试用者 D.先发明者
答案：B
本题考查的是知识产权人确定的相关内容。
对于专利权，谁先申请就给谁；同时申请则协商。
13.______的保护期是可以延长的。
A.著作权 B.专利权 C.商标权 D.商业秘密权
答案：C
本题考查的是知识产权保护期限相关内容。
知识产权中，软件著作权的署名权、修改权，以及普通著作权作品的署名权、修改权、保护作品完整权，都可以
永久保护。其他著作权的保护期限是作者终身及其死后 50 年。特殊的保护期限中，商标权可以续注延长，商业秘密权

14.针对月收入小于等于 3500 元免征个人所得税的需求，现分别输入 3499，3500和 3501 进行测试，则采用的测试方
法______。
A.判定覆盖
B.边界值分析

假设度为 4 的结点个数记作 n4，度为 3 的结点个数记作 n3，度为 2 的结点个数记作 n2，度为 1 的结点个数记作
n1，度为 0 的结点个数记作 n0。
此时结点总数为 n4+n3+n2+n1+n0，每个结点可以根据树枝找到其父节点，除了根，所以此时树枝的数量为
n4+n3+n2+n1+n0-1。
又因为度与树枝的定义，树枝的个数又可以计算为：4*n4+3*n3+2*n2+1*n1+0*n0。
综上可得 n4+n3+n2+n1+n0-1=4*n4+3*n3+2*n2+1*n1+0*n0，此时 n4=7，n3=5，n2=8，n1=10，代入表达式计算可得，
n0=40，本题选择 C 选项。

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme setup

            function applyEye() {

                document.body.classList.toggle('hide-answers', hid);
                eyeBtn.textContent = hid ? '🙈' : '👁️';
            }
            eyeBtn.addEventListener('click', () => {

                localStorage.setItem('hideAnswers', hid ? '0' : '1');

            });
            applyEye();

            // Mobile menu
            const menuBtn = document.getElementById('menu-btn');
            const sidebar = document.getElementById('sidebar');
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('open');
            });
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 900 && !sidebar.contains(e.target) && e.target !== menuBtn) {
                    sidebar.classList.remove('open');
                }
            });

            // Parse markdown
            let rawMd = document.getElementById('raw-markdown').textContent;

            // 答案隐藏：例题加粗单选字母 → 点击显示；含答案标记的段落/表格 → 模糊块
            (function transformAnswers(root) {
                root.querySelectorAll('p strong, li strong, td strong').forEach(function (st) {
                    var t = st.textContent.trim();
                    if (!/^[A-DＡ-Ｄa-d][\s　]*$/.test(t)) return;
                    var holder = st.closest('p, li, td');
                    if (!holder || !/^(例|题|练习|真题|考题|模拟)[：:①-⑩\s]*/.test(holder.textContent.trim())) return;

                var BLOCK_RE = /(【答案】|答案[:：]|参考答案|答案及解析|答案解析|正确答案)/;
                root.querySelectorAll('p, li, td, blockquote, pre, dd').forEach(function (el) {
                    if (el.closest('h1,h2,h3,h4,h5') || el.querySelector('.ans-inline')) return;

                    t.classList.add('revealed');

            // Syntax highlighting

            // Generate TOC
            const tocDiv = document.getElementById('toc');
            const headers = contentDiv.querySelectorAll('h1, h2, h3, h4');
            
            // Highlight specific markers
            const walker = document.createTreeWalker(contentDiv, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            let node;
            while (node = walker.nextNode()) {
                textNodes.push(node);

            textNodes.forEach(textNode => {

                        .replace(/🔺/g, '<span class="highlight-icon">🔺</span>')
                        .replace(/重点/g, '<span style="color: #ef4444; font-weight: bold; border-bottom: 2px dashed #ef4444;">重点</span>');
                    textNode.parentNode.replaceChild(span, textNode);

            });

                    toTop.classList.remove('visible');
                }
            });
            
            // Active TOC highlighting
            const tocLinks = document.querySelectorAll('#toc a');
            window.addEventListener('scroll', () => {
                let current = '';
                // Add a small offset to highlight early
                const offset = 100;
                headers.forEach(h => {
                    const top = h.offsetTop;
                    if (scrollY >= top - offset) {
                        current = h.getAttribute('id');
                    }
                });

                    if (link.getAttribute('href') === '#' + current) {
