<style>
:root {
  --bg: #0f172a;
  --card-bg: #1e293b;
  --card-hover: #334155;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --accent: #38bdf8;
  --accent2: #818cf8;
  --accent3: #f472b6;
  --green: #4ade80;
  --orange: #fb923c;
  --red: #f87171;
  --border: #334155;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  overflow-x: hidden;
}
/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,23,42,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap;
}
.header h1 {
  font-size: 1.3rem; white-space: nowrap;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  background-clip: text;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.search-box {
  flex: 1; min-width: 200px; max-width: 400px;
  position: relative;
}
.search-box input {
  width: 100%; padding: 8px 14px 8px 36px;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 0.9rem;
  outline: none; transition: border-color .2s;
}
.search-box input:focus { border-color: var(--accent); }
.search-box::before {
  content: '\1F50D'; position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%); font-size: 0.85rem;
}
.stats { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; }
/* Layout */
.layout { display: flex; min-height: calc(100vh - 60px); }
.sidebar {
  width: 220px; flex-shrink: 0; padding: 20px 12px;
  border-right: 1px solid var(--border);
  position: sticky; top: 60px; height: calc(100vh - 60px);
  overflow-y: auto;
}
.sidebar h3 {
  font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-dim); margin-bottom: 8px; padding-left: 8px;
}
.cat-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; text-align: left; padding: 8px 12px;
  background: transparent; border: none; color: var(--text);
  font-size: 0.85rem; cursor: pointer; border-radius: 8px;
  transition: background .15s; margin-bottom: 2px;
}
.cat-btn:hover { background: var(--card-bg); }
.cat-btn.active { background: var(--card-hover); color: var(--accent); }
.cat-btn .count {
  margin-left: auto; font-size: 0.7rem; color: var(--text-dim);
  background: var(--card-bg); padding: 1px 7px; border-radius: 10px;
}
.main { flex: 1; padding: 24px; max-width: 1100px; }
/* Cards */
.formula-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
  transition: border-color .2s, box-shadow .2s;
}
.formula-card:hover { border-color: var(--accent); box-shadow: 0 4px 20px rgba(56,189,248,0.08); }
.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-num {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #0f172a; font-weight: 700; font-size: 0.8rem;
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.card-title { font-size: 1.05rem; font-weight: 600; }
.card-tags { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.tag {
  font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
  font-weight: 500;
}
.tag-cat { background: rgba(56,189,248,0.15); color: var(--accent); }
.tag-priority { background: rgba(74,222,128,0.15); color: var(--green); }
.tag-priority.mid { background: rgba(251,146,60,0.15); color: var(--orange); }
.section-label {
  font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 6px; margin-top: 14px;
  display: flex; align-items: center; gap: 6px;
}
.label-meaning { color: var(--accent); }
.label-formula { color: var(--accent2); }
.label-vars { color: var(--accent3); }
.label-example { color: var(--green); }
.label-solution { color: var(--orange); }
.label-mistakes { color: var(--red); }
.section-content { margin-bottom: 8px; }
.section-content p { font-size: 0.9rem; color: var(--text); }
.section-content ul { list-style: none; padding-left: 0; }
.section-content ul li {
  font-size: 0.85rem; padding: 3px 0 3px 16px; position: relative;
}
.section-content ul li::before {
  content: '\2022'; position: absolute; left: 0; color: var(--text-dim);
}
.formula-display {
  background: rgba(15,23,42,0.6); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px 16px; margin: 8px 0;
  overflow-x: auto; text-align: center;
}
.example-block {
  background: rgba(15,23,42,0.6); border-left: 3px solid var(--green);
  border-radius: 0 8px 8px 0; padding: 12px 16px; margin: 8px 0;
  white-space: pre-line;
}
.solution-block {
  background: rgba(15,23,42,0.6); border-left: 3px solid var(--orange);
  border-radius: 0 8px 8px 0; padding: 12px 16px; margin: 8px 0;
  white-space: pre-line;
}
.answer-line {
  font-weight: 600; color: var(--green); margin-top: 6px;
}
.mistakes-block {
  background: rgba(248,113,113,0.08); border-left: 3px solid var(--red);
  border-radius: 0 8px 8px 0; padding: 12px 16px; margin: 8px 0;
}
.mistakes-block ul li::before { color: var(--red); }
table {
  width: 100%; border-collapse: collapse; margin: 8px 0;
  font-size: 0.82rem;
}
table th, table td {
  border: 1px solid var(--border); padding: 6px 10px; text-align: center;
}
table th { background: var(--card-hover); color: var(--accent); font-weight: 600; }
table td { color: var(--text); }
/* Toggle */
.toggle-btn {
  background: var(--card-hover); border: 1px solid var(--border);
  color: var(--text-dim); font-size: 0.75rem; padding: 4px 12px;
  border-radius: 6px; cursor: pointer; transition: all .15s;
}
.toggle-btn:hover { color: var(--accent); border-color: var(--accent); }
.toggle-btn.active { color: var(--accent); border-color: var(--accent); }
.collapsible { overflow: hidden; transition: max-height .3s ease; }
.collapsible.collapsed { max-height: 0; opacity: 0; }
.collapsible.expanded { max-height: 2000px; opacity: 1; }
/* Flashcard mode */
.flashcard-mode .section-content,
.flashcard-mode .answer-line { display: none; }
.flashcard-mode .formula-card .toggle-btn { display: none; }
.flashcard-mode .formula-card { cursor: pointer; }
.flashcard-mode .formula-card.flipped .section-content,
.flashcard-mode .formula-card.flipped .answer-line { display: block; }
.formula-card:focus-visible,
.cat-btn:focus-visible,
.toggle-btn:focus-visible,
.mobile-cat:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}
.learning-guide {
  border-left: 4px solid var(--accent); background: var(--card-bg);
  padding: 14px 18px; margin-bottom: 20px; border-radius: 0 8px 8px 0;
}
.learning-guide strong { color: var(--accent); }
.learning-guide p { color: var(--text-dim); font-size: 0.88rem; }
.when-block {
  background: rgba(129,140,248,0.1); border-left: 3px solid var(--accent2);
  border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 8px 0;
  font-size: 0.88rem;
}
.mobile-cat {
  display: none; background: var(--card-bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px;
}
/* Empty state */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-dim);
}
/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--card-hover); }
/* Responsive */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .mobile-cat { display: block; width: 100%; }
  .main { padding: 16px; }
  .header { padding: 10px 14px; }
  .header h1 { font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>

  <h1>软件设计师高频公式</h1>
  <div class="search-box">
    <label for="searchInput" class="sr-only">搜索公式</label>
    <input type="text" id="searchInput" placeholder="搜索公式名称或关键词...">
  </div>
  <select class="mobile-cat" id="mobileCat" aria-label="选择公式分类"></select>

<script>
// ===================== DATA =====================
const CATEGORIES = [
  { id: 'all', name: '全部', icon: '\u{1F4DA}' },
  { id: 'data', name: '数据表示与校验', icon: '\u{1F522}' },
  { id: 'hardware', name: '组成原理', icon: '\u{1F9E0}' },
  { id: 'os', name: '操作系统', icon: '\u{2699}' },
  { id: 'network', name: '计算机网络', icon: '\u{1F310}' },
  { id: 'software', name: '软件工程', icon: '\u{1F4DD}' },
  { id: 'algorithm', name: '数据结构与算法', icon: '\u{1F4CA}' },
];

const FORMULAS = [
  // ---- 数据表示与校验 ----
  {
    id: 1, cat: 'data', priority: 'high',
    title: '按权展开与进制转换',
    meaning: '就像十进制里"百位上的3表示300"一样，任意进制数的每一位都代表"数字 × 该位的权值"，把所有位的值加起来就是总数。比如二进制 101 中，从右到左权值依次是 1、2、4，所以 101 = 4+0+1 = 5。',
    formula: '\\[ (a_na_{n-1}\\cdots a_0.a_{-1}\\cdots)_r=\\sum_i a_i r^i \\]',
    vars: [
      'r：进制基数，如二进制 r=2',
      'a_i：第 i 位数字',
      '小数点左侧最低位权值为 r⁰，右侧为 r⁻¹'
    ],
    example: '将二进制数 (101101.01)₂ 转成十进制。',
    solution: '\\[ 1\\times2^5+0\\times2^4+1\\times2^3+1\\times2^2+0\\times2^1+1\\times2^0+0\\times2^{-1}+1\\times2^{-2} \\] \\[ =32+8+4+1+0.25=45.25 \\]',
    answer: '(45.25)₁₀',
    mistakes: [
      '二进制小数位权依次是 2⁻¹, 2⁻², 2⁻³，不是负数',
      '十六进制中的 A～F 分别表示 10～15',
      '二进制转八进制每 3 位一组；转十六进制每 4 位一组'
    ]
  },
  {
    id: 2, cat: 'data', priority: 'high',
    title: '原码、反码、补码表示范围',
    meaning: '计算机用固定的二进制位（比如8位）来存数字，最左边一位是符号位（0表示正数，1表示负数）。补码是计算机存负数的方式，好处是加减法可以用同一套电路处理，而且0只有一种表示（不像原码有+0和-0）。',
    formula: '\\[ n\\text{ 位补码：}-2^{n-1}\\sim 2^{n-1}-1 \\] \\[ n\\text{ 位原码/反码：}-(2^{n-1}-1)\\sim 2^{n-1}-1 \\] \\[ n\\text{ 位无符号数：}0\\sim 2^n-1 \\]',
    vars: [
      'n：二进制位数（含符号位）',
      '负数补码求法：绝对值二进制 → 按位取反 → 加 1'
    ],
    example: '8 位补码能表示的整数范围？-18 的 8 位补码是什么？',
    solution: '范围：\\[ -2^7\\sim 2^7-1=-128\\sim127 \\]\n\n求 -18：\n1. +18 的 8 位二进制为 00010010\n2. 按位取反得 11101101\n3. 加 1 得 11101110',
    answer: '范围 -128～127；-18 的补码为 11101110',
    mistakes: [
      '补码负数一侧多一个值：8 位有 -128 但没有 +128',
      '必须先确定字长，同一负数在 8 位和 16 位下补码不同',
      '原码和反码有 +0 和 -0；补码只有一个零'
    ]
  },
  {
    id: 3, cat: 'data', priority: 'mid',
    title: '浮点数表示',
    meaning: '就像科学计数法把数字写成 1.23×10⁴ 一样，浮点数把数写成 2的阶码次方 × 尾数。阶码决定"能表示多大或多小的数"（范围），尾数决定"能精确到小数点后几位"（精度）。',
    formula: '\\[ N=2^E\\times F \\] \\[ \\text{规格化：}\\frac{1}{2}\\le|F|<1 \\]',
    vars: [
      'E：阶码，决定表示范围',
      'F：尾数，决定精度',
      '浮点加减步骤：对阶 → 尾数运算 → 规格化 → 舍入 → 判断溢出'
    ],
    example: 'N₁=2⁵×0.1011₂，N₂=2³×0.1100₂，相加前如何对阶？',
    solution: '小阶向大阶对齐，将 N₂ 阶码增加 2，尾数右移 2 位：\\[ N_2=2^5\\times0.001100_2 \\] 然后相加：\\[ N_1+N_2=2^5\\times(0.101100+0.001100)_2=2^5\\times0.111000_2 \\]',
    answer: '将 N₂ 对齐到阶码 5，结果为 2⁵×0.111₂',
    mistakes: [
      '小阶向大阶对齐，小阶数尾数右移，可能损失低位精度',
      '规格化范围上界是开区间，不能写成 |F|≤1',
      '不能把大阶数向小阶数对齐'
    ]
  },
  {
    id: 4, cat: 'data', priority: 'high',
    title: '海明码校验位',
    meaning: '海明码是一种能发现并纠正一位错误的编码。原理是：在数据中间插入几个"校验位"（额外的检查位），每个校验位负责检查特定位置。如果某一位出错，校验结果会告诉你错在哪。就像快递单上加了好几个验证码，任何一个码不对就能定位问题。',
    formula: '\\[ 2^r\\ge m+r+1 \\] \\[ \\text{检 }t\\text{ 位错：}d_{min}\\ge t+1 \\] \\[ \\text{纠 }t\\text{ 位错：}d_{min}\\ge2t+1 \\]',
    vars: [
      'm：数据位数',
      'r：校验位数',
      '+1 表示"没有错误"也需要一种状态',
      '普通可纠一位错的海明码最小码距为 3'
    ],
    example: '传送 16 位数据，至少需要多少个校验位才能纠正一位错误？',
    solution: '逐个尝试：\n- r=4：2⁴=16 < 16+4+1=21，不满足\n- r=5：2⁵=32 ≥ 16+5+1=22，满足',
    answer: '至少 5 位',
    mistakes: [
      '2^r 要覆盖数据位、校验位和无错状态',
      '普通海明码码距是 3 不是 2（码距 2 只能检单错不能纠单错）',
      '校验位放在编号为 1,2,4,8… 的位置'
    ]
  },
  {
    id: 5, cat: 'data', priority: 'mid',
    title: 'CRC 循环冗余校验',
    meaning: 'CRC 是一种查错方法。发送方和接收方约定一个"除数"（生成多项式），发送方用数据对它做一种特殊的除法（模2除法，就是异或运算，不借位不进位），把余数附在数据后面发出去。接收方用同样的方法除一次，余数为0说明数据没坏。就像身份证最后一位校验码的原理。',
    formula: '\\[ \\text{补 }r\\text{ 个 0，模 2 除法求余数} \\]',
    vars: [
      'r = 生成多项式 G(x) 的最高次数',
      '在原数据后补 r 个 0',
      '余数即为 CRC 校验码，替换掉补的 0'
    ],
    example: '数据为 1101，生成多项式对应二进制为 1011，求 CRC 余数。',
    solution: '1011 最高次数为 3，补 3 个 0：1101000\n\n模 2 除法：\n- 1101 XOR 1011 = 0110，落下一位 → 1100\n- 1100 XOR 1011 = 0111，落下一位 → 1110\n- 1110 XOR 1011 = 0101，落下一位 → 1010\n- 1010 XOR 1011 = 0001\n\n保留 3 位余数：001',
    answer: 'CRC 余数为 001，发送码字为 1101001',
    mistakes: [
      '校验位数等于生成多项式的次数，不等于二进制串长度',
      '每次运算使用异或，不使用普通十进制除法'
    ]
  },
  // ---- 组成原理 ----
  {
    id: 6, cat: 'hardware', priority: 'high',
    title: '存储容量与芯片组成',
    meaning: '地址线就像门牌号的位数——n根地址线能编出2ⁿ个不同地址，也就是能访问2ⁿ个存储单元。用小芯片拼大存储器时，"字扩展"是增加存储单元数量（不够多就多拼几片），"位扩展"是增加每个单元的位数（不够宽就并排拼），两个倍数相乘就是总片数。',
    formula: '\\[ \\text{容量}=\\text{存储单元数}\\times\\text{每单元位数} \\] \\[ \\text{芯片数}=\\lceil\\frac{目标字数}{芯片字数}\\rceil\\times\\lceil\\frac{目标字长}{芯片位数}\\rceil \\]',
    vars: [
      'n 根地址线 → 2ⁿ 个存储单元',
      '字扩展：解决字数不足',
      '位扩展：解决字长不足',
      '地址范围容量 = 末地址 - 首地址 + 1'
    ],
    example: '用 16K×4 bit 芯片组成 64K×16 bit 存储器，需要多少片？',
    solution: '字扩展：64K/16K = 4\n位扩展：16/4 = 4\n总芯片数：4 × 4 = 16',
    answer: '16 片',
    mistakes: [
      '地址范围求容量一定要 末地址 - 首地址 + 1',
      'B 是字节，b 是位，1B=8b',
      '先看按字节、按字还是按位编址'
    ]
  },
  {
    id: 7, cat: 'hardware', priority: 'high',
    title: 'Cache 平均访问时间',
    meaning: 'Cache（高速缓存）是CPU和主存之间的"小仓库"，存着最近常用的数据。每次都先花 T_c 时间查 Cache；若未命中，再额外花 T_m 时间访问主存。因此最稳妥的做法是先画"命中"和"未命中"两条路径，再按概率求平均。',
    formula: '\\[ T_{avg}=hT_c+(1-h)(T_c+T_m)=T_c+(1-h)T_m \\]',
    vars: [
      'h：Cache 命中率（0～1）',
      'T_c：每次查询 Cache 的时间',
      'T_m：未命中后额外访问主存的时间',
      '若题目直接给"未命中路径总时间"T_miss，则用 hT_c+(1-h)T_miss'
    ],
    example: 'Cache 查询时间 10 ns，未命中后访问主存还需 100 ns，命中率 95%，求平均访问时间。',
    solution: '命中路径：10 ns，概率 0.95。\n未命中路径：10+100=110 ns，概率 0.05。\\[ T_{avg}=0.95\\times10+0.05\\times110=15\\text{ ns} \\]',
    answer: '15 ns',
    mistakes: [
      '95% 要写成 0.95',
      '先判断主存时间是完整时间还是额外失效代价',
      '直接映射冲突最多，全相联冲突最少但成本最高'
    ]
  },
  {

let currentCat = 'all';
let currentSearch = '';
let flashcardMode = false;

function getCategoryName(catId) {
  const c = CATEGORIES.find(c => c.id === catId);
  return c ? c.name : '';
}

function renderSidebar() {
  let html = '<h3>分类</h3>';
  let mobileHtml = '';
  CATEGORIES.forEach(c => {
    const count = c.id === 'all' ? FORMULAS.length : FORMULAS.filter(f => f.cat === c.id).length;
    const active = currentCat === c.id;
    html += `<button class="cat-btn ${active?'active':''}" aria-pressed="${active}" onclick="selectCat('${c.id}')">${c.icon} ${c.name}<span class="count">${count}</span></button>`;
    mobileHtml += `<option value="${c.id}" ${active?'selected':''}>${c.name}（${count}）</option>`;
  });
  sidebar.innerHTML = html;
  mobileCat.innerHTML = mobileHtml;
}

function getFiltered() {
  return FORMULAS.filter(f => {
    const catOk = currentCat === 'all' || f.cat === currentCat;
    if (!currentSearch) return catOk;
    const s = currentSearch.toLowerCase();
    const searchText = (f.title + ' ' + f.meaning + ' ' + f.vars.join(' ') + ' ' + f.example + ' ' + f.answer).toLowerCase();
    return catOk && searchText.includes(s);
  });
}

function renderCards() {
  const list = getFiltered();
  statsEl.textContent = `共 ${list.length} 个公式`;
  if (list.length === 0) {
    main.innerHTML = '<div class="empty-state">没有找到匹配的公式</div>';
    return;
  }
  let html = `<section class="learning-guide" aria-label="学习方法"><strong>零基础三步法</strong><p>① 先读“含义”和“什么时候用”　② 遮住解析独立列式　③ 对照易错点检查单位和题目口径。首次学习建议先掌握带“必考”标签的卡片。</p><details><summary>常见术语先看这里</summary><p><b>bit / Byte：</b>1 Byte = 8 bit；文件大小常用 Byte，网络速率常用 bit/s。　<b>Hz：</b>每秒发生次数。　<b>取整：</b>⌊x⌋向下取整，⌈x⌉向上取整。　<b>mod：</b>求余数。　<b>log₂N：</b>2的多少次方等于N。　<b>概率：</b>95%代入公式时写0.95。</p></details></section>`;
  list.forEach(f => {
    const catName = getCategoryName(f.cat);
    const priorityLabel = f.priority === 'high' ? '必考' : '常考';
    const priorityClass = f.priority === 'high' ? '' : 'mid';
    html += `<article class="formula-card" data-id="${f.id}" tabindex="0" aria-expanded="${!flashcardMode}" onclick="cardClick(${f.id})" onkeydown="cardKeydown(event, ${f.id})">`;
    html += `<div class="card-header">`;
    html += `<div class="card-num">${f.id}</div>`;
    html += `<h2 class="card-title">${f.title}</h2>`;
    html += `<div class="card-tags">`;
    html += `<span class="tag tag-cat">${catName}</span>`;
    html += `<span class="tag tag-priority ${priorityClass}">${priorityLabel}</span>`;
    html += `</div></div>`;
    // Meaning
    html += `<div class="section-content"><div class="section-label label-meaning">含义</div><p>${f.meaning}</p></div>`;
    html += `<div class="section-content"><div class="section-label label-formula">什么时候用</div><div class="when-block">${WHEN_TO_USE[f.id] || '看到题目给出公式中的关键变量并要求计算时使用。'}</div></div>`;
    // Formula
    html += `<div class="section-content"><div class="section-label label-formula">公式</div><div class="formula-display">${f.formula}</div></div>`;
    // Variables
    if (f.vars && f.vars.length > 0) {
      html += `<div class="section-content"><div class="section-label label-vars">变量与要点</div><ul>`;
      f.vars.forEach(v => { html += `<li>${v}</li>`; });
      html += `</ul></div>`;
    }
    // Example
    html += `<div class="section-content"><div class="section-label label-example">例题</div><div class="example-block">${f.example}</div></div>`;
    // Solution
    html += `<div class="section-content"><div class="section-label label-solution">解析</div><div class="solution-block">${f.solution}</div></div>`;
    // Answer
    html += `<div class="answer-line">答案：${f.answer}</div>`;
    // Mistakes
    if (f.mistakes && f.mistakes.length > 0) {
      html += `<div class="section-content"><div class="section-label label-mistakes">易错点</div><div class="mistakes-block"><ul>`;
      f.mistakes.forEach(m => { html += `<li>${m}</li>`; });
      html += `</ul></div></div>`;
    }
    html += `</article>`;
  });
  main.innerHTML = html;
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([main]);
  }
}

  document.body.classList.toggle('flashcard-mode', flashcardMode);
  flashcardBtn.classList.toggle('active', flashcardMode);
  flashcardBtn.setAttribute('aria-pressed', String(flashcardMode));
  flashcardBtn.textContent = flashcardMode ? '退出翻卡' : '翻卡模式';
  renderCards();
});

function cardClick(id) {
  if (!flashcardMode) return;
  const card = document.querySelector('.formula-card[data-id="' + id + '"]');
  if (card) {
    const flipped = card.classList.toggle('flipped');
    card.setAttribute('aria-expanded', String(flipped));
  }
}

function cardKeydown(event, id) {
  if (!flashcardMode || (event.key !== 'Enter' && event.key !== ' ')) return;
  event.preventDefault();
  cardClick(id);
}

// Init
renderSidebar();
renderCards();
</script>
</body>
</html>
