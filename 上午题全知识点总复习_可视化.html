# 上午题全知识点总复习（截至 2026-09-28）

> **来源**：Day 1~24 全部课程 + 六卷真题实证缺口补课（图算法/文法自动机/Python/中断DMA/McCabe/DFD）。
> **配合使用**：逐日卡片见《复习总笔记》；公式对答案见《公式速查手册》；口诀逐字解读见《做题笔记》口诀汇总区；真题依据见《真题六卷实证分析(2021-2024).md》。

---

## 模块一 · 计算机组成（5~6 分）

### 1.1 CPU 与寄存器
- **算盘指挥**：CPU = 运算器（算）+ 寄存器组（盘）+ 控制器（指挥）；主存**不属于** CPU
- 控制器：**PC 存下一条**指令地址、IR 存当前指令；**取指后 PC 立即 +1**
- 指令 = 操作码（干什么）+ 地址码（对谁干）；区分指令类型只看操作码

### 1.2 进制与码制
- **除二取余倒着读**；转八进制每 3 位一组、十六进制每 4 位一组
- 2 的幂表：2,4,8,16,32,**64**,128,**256** = 2¹~2⁸（颜色数换位深全靠它）
- **正数三码一，负数反加一，移码翻个头**；8 位补码范围 **−128 ~ +127**（补码左边多一格）
- 定点小数补码可表示 **−1**（2024 考点）

### 1.3 浮点数 IEEE 754 单精度
- **符号 1 + 阶码 8（真实指数+127）+ 尾数 23**；规格化 1.xxxxx×2ⁿ，打头 1 隐含不存
- 阶码管范围、尾数管精度；阶码越长范围越大（精度相对越低）

### 1.4 寻址方式
- **立即自带数**（最快，访存 0 次）、直接给门牌（1 次）、间接门牌的门牌（≥2 次最慢但范围大）
- 寄存器装数（0 次）、寄存器间接装门牌（1 次）；变址适合数组循环

### 1.5 RISC vs CISC
- RISC：指令少、寻址少、单周期、**定长**、流水线+**硬布线**、寄存器多；**微程序控制是 CISC**

### 1.6 流水线
- **Δt = 各段最大值**（木桶）；等长 T=(k+n−1)×Δt；不等长 T=**各段之和 + (n−1)×Δt**
- 加速比 = 串行时间 ÷ T；吞吐率 = n/T；⚠ (n−1) 不是 n

### 1.7 Cache 与存储
- **平均访存 = h×tc + (1−h)×tm**；未命中**只算主存 tm**，不再加 tc
- SRAM 快贵不刷新做 Cache；DRAM 慢便宜**要刷新**做主存；闪存不能替代主存（不能随机逐字节改写）
- 磁盘：转一圈(ms) = 60000÷rpm；**平均旋转延迟 = 半圈**

### 1.8 校验码
- 奇偶校验：查 1 位错、2 位错查不出；**纠错靠海明**
- 海明：**2ᵏ ≥ n+k+1**；校验位站 1,2,4,8…位；报警组合拼二进制 = 出错位置号；⚠ 别漏跨组数据位
- CRC：多项式最高次幂 = 校验位位数 r；补 r 个 0 模 2 除，余数替换末尾

### 1.9 可靠性
- 串联连乘（变小）；并联 1−(1−R₁)(1−R₂)…（变大）；混合**从里往外**；MTBF = 1/λ

### 1.10 中断 / DMA / I/O 方式（2026-09-28 补，5/6 卷必考）
- 中断六步：**请求→响应→保护现场→服务→恢复现场→返回**
- **中断向量 = 中断服务程序的入口地址**（2021/2023 连考）；保护现场存**堆栈**；多中断按优先级
- 异常 vs 中断：**除 0 = 异常**（内中断）；DMA 结束通知 = 中断（外中断）——"DMA 完全不需要中断"是干扰项
- 四种 I/O 方式：程序查询（全程盯，字）｜中断驱动（干完喊，字）｜**DMA（仅头尾介入、不经过 CPU、块）**｜通道（全独立）
- 总线：**PCI = 并行内总线；SCSI = 并行外总线；USB = 串行外总线**

## 模块二 · 程序设计语言（6 分）

### 2.1 编译六阶段
- 词法→语法→语义→中间代码→优化→目标代码（**认单词、拆句子、懂意思、写草稿、再润色、出成品**）
- 语法错误在**语法分析**阶段发现；**符号表**记录符号信息辅助语义检查和代码生成
- 解释方式**不生成目标程序**，边翻边执行；中间代码与机器无关

### 2.2 中缀转后缀
- **先按优先级补括号 → 运算符搬到右括号外 → 去括号**；后缀求值用栈
- a−b+c → `a b − c +`（同级左结合）

### 2.3 传参与栈帧
- **值传复印件**（C 语言只有值传递，传指针是改实参的手段）
- 栈帧=临时工位（局部变量、参数、返回地址）；**递归过深→栈溢出**；不能返回局部变量地址

### 2.4 文法四型（2026-09-28 补）
- **语法定 2 型（上下文无关）**，词法定 **3 型（正规文法）**，对应有限自动机
- 推导=反复替换；语法树=推导的树形图（2021 真题：上下文无关文法画语法树）

### 2.5 正规式与有限自动机（2026-09-28 补）
- 三运算符：`|` 或、连接、`a*` **闭包（0 次或多次）**；翻译正规式=逐段读成人话
- **DFA 一条路（确定），NFA 多条路（不确定）**；读状态图：从初态走到终态，翻译路径特征

### 2.6 Python（2022 起每年 2~3 题，2026-09-28 补）
- 解释型、动态类型、跨平台——**"编译型"不属于 Python**
- **list 可变有序可重复**；tuple 不可变；set 无序不重复；`列表*2`=整体重复；切片 `[10:0:-2]` 倒着取
- `input()` 返回**字符串**；异常用 **except**（没有 catch）；装包 `pip install`；match…case 新语法

## 模块三 · 数据结构（9 分）

### 3.1 线性表
- **顺序随机快、插删挪成灾；链表插删快、查找排队来**（多查少改顺序，多改少查链表）
- 链表插入铁律：**先接后断**——`s→next=p→next` 再 `p→next=s`

### 3.2 栈、队列、循环队列
- 栈=摞盘 LIFO（递归、表达式求值、括号匹配）；队列=排队 FIFO
- 循环队列：指针走一步取模；**元素个数 = (rear−front+M) % M**（防负数先加 M）

### 3.3 二叉树
- **n₀ = n₂ + 1**；完全二叉树：叶子定总数（最多乘二、最少乘二减一）、总数定叶子（**对半向上取整**）
- 顺序存储：父 i、左 2i、右 2i+1（从 1 编号）；空结点也占位
- 高度：N 个结点高度范围 [⌈log₂(N+1)⌉, N]（2021 真题 1024 结点 → [10,1024]）
- 森林转二叉树：右子树 = n₂+n₃（2023 真题）

### 3.4 遍历与还原
- 前+中→后 ✓；后+中→前 ✓；**前+后定不出中序**
- 二叉树表示算术表达式：中序+括号读（2021 真题）

### 3.5 哈夫曼
- **最小俩牵手，牵手回队伍**（新结点放回队列继续比较）；WPL = 每次合并新权值之和
- n 个叶子总结点 **2n−1**（无度 1 结点）；编码左 0 右 1 = 前缀码

### 3.6 图（含 2026-09-28 补课）
- 邻接矩阵**对称=无向**；第 i 行和=出度、列和=入度（有向）
- **DFS 一条道走到黑用栈**（递归）；**BFS 一圈圈扩用队列**；复杂度：邻接矩阵 O(n²)、邻接表 **O(n+e)**
- 拓扑排序：每次删入度 0 的点；**有环=无拓扑序列**；拓扑序列不唯一；入度=被扎次数，合法序列=前任全在前
- **最小生成树**：n−1 条边连通无环总权最小；**Prim 加点、Kruskal 加边不成环**；**都是贪心法**
- **Dijkstra 单源最短路径=贪心**；锁最短点+松弛；有权图用它，BFS 只管无权图
- 强连通=任意两点互相可达

### 3.7 哈希
- 除留取余定位、冲突线性探测**顺延、绕回**；**ASL = 比较次数之和 ÷ 元素个数**（不是表长）

### 3.8 排序
- **快些选堆不稳定**（快排/希尔/选择/堆）；冒泡、插入、归并、基数稳定
- O(nlogn) 三兄弟=快/归并/堆；快排最坏退化 O(n²)；最坏仍 O(nlogn) 只有归并和堆；O(n) 空间只有归并
- 归并=**分治**；一趟定序：冒泡/选择/堆/快排（2021 真题）
- 堆的判断：完全二叉树+父≥子（大根堆）或父≤子（小根堆）逐层查

### 3.9 进阶偶考
- BST 中序有序、最坏退化链表；AVL 严格平衡；红黑近似平衡；**B+ 树叶子有链，数据库索引用**；稀疏矩阵三元组/十字链表；KMP 主串不回退

## 模块四 · 操作系统（6 分）

- 进程=**资源分配**单位，线程=**调度执行**单位；线程共享全局变量、各有栈和寄存器
- 三态：运行→阻塞（等 I/O）、阻塞→就绪→运行；**阻塞不能直接去运行**
- PV：**P 申请减一，负了去排队；V 释放加一，喊人**；生产者消费者模板**先资源后互斥**
- 前趋图 PV：后继边=前驱 V 信号量，后继 P 之
- 死锁四条件：**互斥、请求保持、不可剥夺、循环等待**（必要非充分）；**不安全≠死锁**
- 银行家：剩余找"还需≤剩余"最饿的，回收变富豪；安全序列不唯一
- 分页：**一拆二换三拼回**（商=页号、余=偏移、偏移照抄）；页内**内部**碎片、段间**外部**碎片
- 置换：FIFO 排队走、LRU 最久不用、OPT 看未来缺页最少；FIFO 有 Belady 异常
- 文件：目录只存名和号；直接 10 块+一级间接 256+二级平方
- 位示图：字号=整除、位号=取余；**从 1 编号先减 1**
- 磁盘调度：SSTF 拣最近可饥饿、SCAN 电梯到底回头；周转=完成−到达

## 模块五 · 数据库（6 分）

- 三级模式：**外菜单（局部）、概念总谱（全局）、内仓库（物理）**
- 独立性锚点：**变什么就叫什么**——存储变=物理独立性（模式/内模式映像）、逻辑结构变=逻辑独立性（外模式/模式映像）；内模式=Internal=物理
- E-R：**矩实椭属菱联系**（联系夹在两矩形中间、属性挂旁边）；1:1 任一方加键、1:n 放 n 方、**m:n 单独建表**
- 关系代数：σ 选行、π 选列、× 行数相乘、⋈ 同名列相等去重复列
- SQL：FROM 最先执行；DISTINCT 去重；WHERE 挑行不带聚合、HAVING 挑组必带；**GRANT…WITH GRANT OPTION 可转授**
- 范式连招：1NF 单元格不拆 → 2NF 不沾一半主键 → 3NF 没有二手数据（传递）→ BCNF 决定方全是候选键
- 事务：**原子全或全不、一致总账不乱、隔离互不干扰、持久落袋为安**；共享锁共读、排他锁独占
- 聚簇索引改变的是**内模式**（2021 真题）；视图=虚表不存数据

## 模块六 · 计算机网络（5 分）

- 七层：**应表会传网数物**；路由器网络层选 IP、交换机链路层认 MAC、**集线器物理层广播**
- IP 分类：1~126=A、128~191=B、192~223=C；私有 10/172.16~31/192.168；127 回环
- 子网划分：借 n 位=2ⁿ 个网；**可用主机=2^主机位−2**（掐头去尾）；步长=256−掩码尾
- TCP 打电话可靠（三次握手），UDP 发传单快（视频/DNS）；端口：FTP21、SMTP25、DNS53、HTTP80、HTTPS443、POP3 110
- 网络命令（2024 趋势）：ping 测连通、**telnet 远程登录/测端口（基于 TCP 不安全）**、tracert 查路径、nslookup 查 DNS、ipconfig /flushdns 清缓存
- **VLAN 在数据链路层隔离广播域**；包过滤防火墙查网络层；DMZ 受保护程度：外网 < DMZ < 内网

## 模块七 · 软件工程（13 分，最大模块）

- 开发模型题眼：瀑布文档线性、**原型需求不清**、**螺旋风险驱动**、增量分批核心优先、喷泉 OO 迭代
- 需求分析产出：数据字典+DFD；**内聚偶逻时过通顺功、耦合数标控外公内容**（高内聚低耦合）
- 测试：白盒看码黑盒看脸；覆盖**语句<判定<条件<条件组合<路径**（语句最弱、路径最强）
- **McCabe 环路复杂度（6/6 卷必考）：V = E−N+2 = 判定数+1 = 区域数+1**；含义=线性独立路径条数；路径覆盖用例数=2^判定数（≠独立路径）
- 系统测试目标来自**需求分析**阶段；单元→集成→确认→系统
- 关键路径：**最长路径定工期、关键活动零松弛**；缩短非关键白费劲
- 风险：**暴露 = 概率 × 损失**；应对四招=规避/转移/减轻/接受
- CMM：**初始混乱可重复，定义管理再优化**（4 级=定量、5 级=持续改进）
- 敏捷：Scrum 冲刺 30 天；沟通路径 n(n−1)/2
- **边缘扫盲（2026-09-28 收录，待课上验证）**：
  - ISO/IEC 质量模型六特性：功能性、可靠性、易用性、效率、**可维护性、可移植性**（子特性：适应性/易安装/一致性/易替换性——易测试性属于可维护性）
  - 维护四类型：**完善性（50~60%，最多）**、适应性、纠正性、预防性；改界面=改善（完善）性维护
  - 可维护性指标：可理解性、可测试性、可修改性；**可维护性 = 1/(1+MTTR)**
  - UP 四阶段：初始→精化→构建→转换；AUP 在大型任务上连续、小型活动上迭代
  - 文档：用户手册属用户文档；开发阶段内部文档与交流文档区分
  - 设计原则：模块独立、耦合小、规模适中（不是越小越好）、扇入扇出合理；**共同重用原则**（重用一个类就要重用整包）

## 模块八 · 面向对象 + 设计模式（3~4 分 + 下午 15 分）

- 类关系从弱到强：**依→关→聚→组→泛→实现**；**聚合空心可分离（车队-车），组合实心同生死（人-心脏）**
- UML：**静类部构署，动用顺状活协**；include 指向被包含者、extend 指向基用例；状态图=[监护条件]/转换后效果；序列图 loop 组合片段（2023 新）
- 设计模式：**创建管生，结构管拼，行为管跑**；高频场景：
  - 全局唯一→**单例**｜一对多通知→**观察者**（vs 中介者=多对象集中协调，如塔台）｜算法可切换→**策略**｜统一驱动接口→**适配器**｜状态变行为变→状态｜流程固定步骤异→模板方法
- 六大原则：单一职责、开闭、里氏替换、依赖倒置、接口分离、**共同重用**

## 模块九 · 多媒体（2 分）

- **图像 = 分辨率 × 位深 ÷ 8**；**音频 = 采样频率 × 量化位数 × 声道数 × 秒 ÷ 8**
- **颜色数 = 2^位深**：16 色=4 位、256 色=8 位、真彩=24 位；**256 色=每像素 1 字节可口算**
- 采样定理：**采样频率 ≥ 2 倍最高频**（CD 44.1kHz）
- JPEG/MP3/MPEG **有损**；PNG/ZIP 无损；RGB 屏、CMYK 印；YUV=亮度+色差

## 模块十 · 信息安全（2 分）

- 对称（DES/3DES/AES/RC4）**同钥匙快**；非对称（RSA/ECC/DSA）**公私成对慢**；数字信封=对称传数据+非对称传钥匙
- 摘要（MD5/SHA）**不可逆**验完整；**发私签名（防抵赖），收公加密（保密）**；公钥锁私钥开，谁的锁谁的开
- 防火墙**防不了内部攻击和病毒**；WAF 防不了流氓软件
- 病毒要宿主、木马开后门、蠕虫自复制无宿主；DDoS 洪水、SQL 注入、撞库拖库洗库；防病毒=升级杀软
- 软件**著作权两法**：《著作权法》+《计算机软件保护条例》

## 附 B · 高频陷阱实录（错题本精华）

1. 16 色 ≠ 16 位（颜色数=2^位深）；64 色=6 位
2. DMA 结束**要发中断**；DMA 按块、查询/中断按字
3. 拓扑排序箭头：A→C = A 指 C，C 被扎（入度+1）；序列合法=前任全在前
4. 归并排序**稳定**且最坏 O(nlogn)；"快些选堆"才不稳定
5. 哈夫曼：新结点**放回队列**继续比
6. 独立性：**变什么就叫什么**（存储变=物理）；内模式=Internal=物理
7. 加密签名方向：**收公加密、发私签名**；钥匙必须同人成对
8. 未命中 Cache 只算主存，别再加 tc
9. 关键路径是**最长**的（反直觉）
10. m:n 转关系模式必须**单独建表**（3 个模式）
11. 位示图从 1 编号**先减 1**
12. FIFO 有 Belady 异常；LRU 每次访问刷新时间
13. 商标可无限续展、**专利不可续**
14. 系统总线连接 CPU/主存/外设；CPU 内部不含系统总线

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme setup
            const themeBtn = document.getElementById('theme-btn');
            const html = document.documentElement;
            
            const savedTheme = localStorage.getItem('theme') || 'light';
            html.setAttribute('data-theme', savedTheme);
            themeBtn.textContent = savedTheme === 'light' ? '🌙' : '☀️';
            
            themeBtn.addEventListener('click', () => {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeBtn.textContent = newTheme === 'light' ? '🌙' : '☀️';
            });

            // Mobile menu
            const menuBtn = document.getElementById('menu-btn');
            const sidebar = document.getElementById('sidebar');
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('open');
            });
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 900 && !sidebar.contains(e.target) && e.target !== menuBtn) {
                    sidebar.classList.remove('open');
                }
            });

            // Parse markdown
            let rawMd = document.getElementById('raw-markdown').textContent;
            
            const contentDiv = document.getElementById('markdown-content');
            contentDiv.innerHTML = marked.parse(rawMd);
            
            // Syntax highlighting
            if (window.Prism) {
                Prism.highlightAll();
            }

            // Generate TOC
            const tocDiv = document.getElementById('toc');
            const headers = contentDiv.querySelectorAll('h1, h2, h3, h4');
            
            // Highlight specific markers
            const walker = document.createTreeWalker(contentDiv, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            let node;
            while (node = walker.nextNode()) {
                textNodes.push(node);
            }
            textNodes.forEach(textNode => {
                if (textNode.nodeValue.includes('🔺') || textNode.nodeValue.includes('重点')) {
                    const span = document.createElement('span');
                    span.innerHTML = textNode.nodeValue
                        .replace(/🔺/g, '<span class="highlight-icon">🔺</span>')
                        .replace(/重点/g, '<span style="color: #ef4444; font-weight: bold; border-bottom: 2px dashed #ef4444;">重点</span>');
                    textNode.parentNode.replaceChild(span, textNode);
                }
            });
            
            headers.forEach((h, index) => {
                const id = 'heading-' + index;
                h.id = id;
                const a = document.createElement('a');
                a.href = '#' + id;
                a.textContent = h.textContent;
                a.className = 'toc-' + h.tagName.toLowerCase();
                
                a.addEventListener('click', (e) => {
                    if (window.innerWidth <= 900) {
                        sidebar.classList.remove('open');
                    }
                });
                
                tocDiv.appendChild(a);
            });

            // Scroll to top button
            const toTop = document.getElementById('totop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    toTop.classList.add('visible');
                } else {
                    toTop.classList.remove('visible');
                }
            });
            
            // Active TOC highlighting
            const tocLinks = document.querySelectorAll('#toc a');
            window.addEventListener('scroll', () => {
                let current = '';
                // Add a small offset to highlight early
                const offset = 100;
                headers.forEach(h => {
                    const top = h.offsetTop;
                    if (scrollY >= top - offset) {
                        current = h.getAttribute('id');
                    }
                });
                
                tocLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === '#' + current) {
                        link.classList.add('active');
                    }
                });
            });
            
        });
    </script>
