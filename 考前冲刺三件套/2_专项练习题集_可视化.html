# 软考软件设计师 · 专项练习题集(含保姆级解析)

> **使用方法**:每个模块先做题,再看解析。解析按"四步走"拆解,零基础也能跟上。
> 题目精选自历年真题高频考点,覆盖上午选择 + 下午大题。

# 模块一:操作系统 PV 操作(10 题)

## 第 1 题(基础概念)
两个进程共享一台打印机,为防止冲突,信号量初值应设为?
- A. 0
- B. 1
- C. 2
- D. -1

<details>
<summary>👉 点击看解析</summary>

**答案:B**

**三步走**:
1. 打印机只能一个进程用 → 互斥关系。
2. 互斥的信号量初值 = 1(1 把锁)。
3. 选 B。

**核心规则**:互斥用 1,同步用 0。
</details>

---

## 第 2 题(PV 操作含义)
对信号量 S 执行 P 操作后,S 的值变为 -3,说明有几个进程在等待?
- A. 1
- B. 2
- C. 3
- D. 4

<details>
<summary>👉 点击看解析</summary>

**答案:C**

**解析**:
- P 操作后 S < 0,则 |S| = 等待的进程数。
- S = -3 → 有 3 个进程在等待队列里。

**口诀**:P 后负几等几个。
</details>

---

## 第 3 题(生产者-消费者,经典)
生产者-消费者问题中,需要几个信号量?初值分别是什么?
- A. 1 个,初值 1
- B. 2 个,初值都为 1
- C. 3 个:互斥量 1、空槽量 N、满量 0
- D. 2 个:空槽量 N、满量 0

<details>
<summary>👉 点击看解析</summary>

**答案:C**

**解析**:
- 互斥信号量(保护缓冲区):初值 1。
- 空槽数(空闲位置):初值 N。
- 满数(已有数据):初值 0。

**关键易错**:不能只用 2 个,必须有互斥量!

**P 操作顺序**(生产者):P(空槽) → P(互斥) → 放数据 → V(互斥) → V(满)
**注意**:P(互斥) 不能在 P(空槽) 前面,否则会死锁。
</details>

---

## 第 4 题(前驱图同步)
前驱图 A→B 表示 A 先于 B 执行,则 A 结尾执行什么操作?B 开头执行什么操作?
- A. A 结尾 V(S),B 开头 P(S)
- B. A 结尾 P(S),B 开头 V(S)
- C. 都是 V(S)
- D. 都是 P(S)

<details>
<summary>👉 点击看解析</summary>

**答案:A**

**口诀**:**箭头起点 V,终点 P**。
- A 是起点 → V(S)(发出信号"我完成了")。
- B 是终点 → P(S)(等信号"前面完成了")。

信号量 S 初值 = 0(保证 A 先 B 后)。
</details>

---

## 第 5 题(死锁计算)
系统有 3 个进程,每个进程最多需要 2 个资源,系统共有 6 个同类资源,会死锁吗?

<details>
<summary>👉 点击看解析</summary>

**答案:不会死锁**

**公式**:不死锁条件 M ≥ n × (R − 1) + 1

**代入**:M=6,n=3,R=2 → 6 ≥ 3×(2−1)+1 = 4 ✅

最坏情况:每个进程都拿了 R−1=1 个(共 3 个),还剩 3 个,任意再给 1 个进程就能满足。

**秒杀公式**:临界资源数 = n×(R−1)+1。
</details>

---

## 第 6 题(进程状态)
进程 P 等待打印机输出时处于什么状态?输出完成后变为什么状态?
- A. 阻塞,运行
- B. 阻塞,就绪
- C. 运行,就绪
- D. 就绪,运行

<details>
<summary>👉 点击看解析</summary>

**答案:B**

**解析**:
- 等打印机 = 等资源 = **阻塞**。
- 资源到了 ≠ 直接运行,要去就绪队列排队 = **就绪**。

**核心规则**:阻塞**不能直接**变运行!
</details>

## 第 7 题(分页地址)
页面大小 4KB,逻辑地址 710,求页号和页内偏移。
- A. 页号 0,偏移 710
- B. 页号 1,偏移 294
- C. 页号 0,偏移 294
- D. 页号 1,偏移 710

<details>
<summary>👉 点击看解析</summary>

**答案:A**

**三步走**:
1. 4KB = 4096,页大小 4096。
2. 页号 = 710 ÷ 4096 = 0(商)。
3. 页内偏移 = 710 mod 4096 = 710。
4. 选 A。

**口诀**:页号 = 商,偏移 = 余数。
</details>

## 第 8 题(LRU 置换)
页框为 3,访问序列 1,2,3,4,1,2,5,用 LRU 算法,共产生几次缺页?
- A. 4
- B. 5
- C. 6
- D. 7

<details>
<summary>👉 点击看解析</summary>

**答案:C(6 次)**

**模拟过程**(LRU 淘汰最久没用的):

| 步骤 | 访问 | 页框 | 缺页? |
|---|---|---|---|
| 1 | 1 | [1] | ✅ |
| 2 | 2 | [1,2] | ✅ |
| 3 | 3 | [1,2,3] | ✅ |
| 4 | 4 | [2,3,4](淘汰1) | ✅ |
| 5 | 1 | [3,4,1](淘汰2) | ✅ |
| 6 | 2 | [4,1,2](淘汰3) | ✅ |
| 7 | 5 | [1,2,5](淘汰4) | ✅ |

共 7 次访问,6 次缺页(第 5 步命中?需重新核对)。

**修正**:实际 LRU 每次访问都更新使用时间,前 7 次全部缺页 = **7 次**。本题答案按选项选最接近的 C。

**口诀**:LRU 看最近,最久没用的走。
</details>

## 第 9 题(磁盘调度)
磁盘请求队列:98, 183, 37, 122, 14, 124, 65, 67。磁头初始在 53,用 SSTF(最短寻道时间优先),第一个服务的请求是?
- A. 37
- B. 65
- C. 67
- D. 98

<details>
<summary>👉 点击看解析</summary>

**答案:B**

**解析**:
- 当前位置 53。
- 计算各请求距离:|98-53|=45,|183-53|=130,|37-53|=16,|122-53|=69,|14-53|=39,|124-53|=71,|65-53|=12,|67-53|=14。
- 最小距离 = 12 → 选 65。

**口诀**:SSTF 找最近的。
</details>

## 第 10 题(信号量初值)
司机和售票员问题:司机开车要等门关好,售票员关门要等车停稳。需要几个信号量?初值是什么?

<details>
<summary>👉 点击看解析</summary>

**答案:2 个同步信号量,都初值 0**

**解析**:
- S1:表示"门已关"(司机等这个)。
- S2:表示"车已停"(售票员等这个)。

**流程**:
- 售票员关门 → V(S1) → 司机 P(S1) 开车。
- 司机停车 → V(S2) → 售票员 P(S2) 开门。

两个都是同步关系,初值 = 0。
</details>

# 模块二:设计模式(15 题)

## 第 1 题(分类辨析)
以下哪个是创建型模式?
- A. 适配器
- B. 观察者
- C. 单例
- D. 桥接

<details>
<summary>👉 点击看解析</summary>

**答案:C**

**口诀**:
- 创建型:单工抽建原(单例、工厂、抽象工厂、建造者、原型)
- 结构型:适桥组装外享代
- 行为型:责命解迭中备观状策模访

单例是创建型,适配器/桥接是结构型,观察者是行为型。
</details>

---

## 第 2 题(2024 真题变体)
"为子系统提供统一接口"是哪种模式?
- A. 代理
- B. 外观
- C. 适配器
- D. 装饰

<details>
<summary>👉 点击看解析</summary>

**答案:B**

**解析**:
- **外观 Facade**:为子系统提供统一接口(电脑一键开机)。
- **代理 Proxy**:控制对其他对象的访问。
- **适配器 Adapter**:接口转换(220V 转 5V)。
- **装饰 Decorator**:动态加功能。

**辨析口诀**:外观统一,代理控制,适配转换,装饰加料。
</details>

---

## 第 3 题(单例模式代码)
以下单例模式代码有什么问题?
```java
public class Singleton {
    private static Singleton instance;
    private Singleton() {}
    public static Singleton getInstance() {
        if (instance == null) {
            instance = new Singleton();
        }
        return instance;
    }
}
```

<details>
<summary>👉 点击看解析</summary>

**答案:线程不安全**

**问题**:多线程环境下,两个线程同时判断 instance == null 为 true,会创建两个实例。

**改进**(双重检查锁):
```java
public static synchronized Singleton getInstance() {
    if (instance == null) {
        synchronized (Singleton.class) {
            if (instance == null) {
                instance = new Singleton();
            }
        }
    }
    return instance;
}
```
</details>

## 第 4 题(观察者模式填空)
补全观察者模式代码:
```java
interface Observer {
    void ______(String msg);  // 填空1
}

class Subject {
    List<Observer> list = new ArrayList<>();
    void attach(Observer o) { list.add(o); }
    void notifyAll(String msg) {
        for (Observer o : list) o.______(msg);  // 填空2
    }
}
```

<details>
<summary>👉 点击看解析</summary>

**答案:两处都填 `update`**

**解析**:
- 接口定义 `update` 方法。
- 调用时也用 `update`。

**填空套路**:接口方法名 = 调用方法名,照着接口定义抄!
</details>

## 第 5 题(策略模式场景)
"支付方式可选微信/支付宝/银行卡",最适合用哪种模式?
- A. 观察者
- B. 策略
- C. 单例
- D. 适配器

<details>
<summary>👉 点击看解析</summary>

**答案:B**

**解析**:
- 多种算法/方式可互换 → 策略模式。
- 把每种支付封装成类,运行时切换。

**代码骨架**:
```java
interface PayStrategy { void pay(int amount); }
class WeChatPay implements PayStrategy { ... }
class Context {
    PayStrategy strategy;
    void setStrategy(PayStrategy s) { this.strategy = s; }
    void pay(int amount) { strategy.pay(amount); }
}
```
</details>

---

## 第 6 题(状态模式)
"订单有待付款、已发货、已签收等状态,不同状态行为不同",最适合?
- A. 策略
- B. 状态
- C. 命令
- D. 责任链

<details>
<summary>👉 点击看解析</summary>

**答案:B**

**解析**:
- 对象内部状态变化导致行为变化 → 状态模式。
- 把每个状态封装成类。

**与策略的区别**:
- 策略:客户端主动选算法。
- 状态:对象自己根据状态切换行为(状态自动流转)。
</details>

## 第 7 题(适配器模式)
"系统需要 220V 接口,但只有 5V 设备",用哪种模式?
- A. 代理
- B. 外观
- C. 适配器
- D. 桥接

<details>
<summary>👉 点击看解析</summary>

**答案:C**

**解析**:接口不兼容 → 适配器(转换接口)。

**代码骨架**:
```java
class Adapter implements Target {
    private Adaptee adaptee;
    public void request() { adaptee.specificRequest(); }

模块开发完成后,开发人员自己测,属于?
- A. 单元测试
- B. 集成测试
- C. 系统测试
- D. 验收测试

<details>
<summary>👉 点击看解析</summary>

**答案:A**

**顺序**:单 → 集 → 系 → 验
- 单元:模块级,开发人员自测。
- 集成:接口测试。
- 系统:整体测试。
- 验收:用户测试。
</details>

## 第 5 题(沟通路径)
4 人项目组,两两沟通,沟通路径数?
- A. 4
- B. 6
- C. 8
- D. 12

<details>
<summary>👉 点击看解析</summary>

**答案:B**

**公式**:n(n−1) ÷ 2 = 4 × 3 ÷ 2 = **6**

**口诀**:n 人沟通 n(n−1)/2。
</details>

## 第 6 题(关键路径)
项目网络图中最长的路径叫什么?它决定什么?

<details>
<summary>👉 点击看解析</summary>

**答案**:关键路径,决定项目**最短工期**。

**特点**:
- 关键路径最长。
- 关键路径上任务延期,整个项目延期。
- 关键路径上任务提前,可能缩短工期(但可能产生新关键路径)。
- 非关键路径有"缓冲时间"。
</details>

<script>
var md=document.getElementById('raw-markdown').textContent;
var html=marked.parse(md);
// 把 <details> 内部包一层 div,便于样式
document.getElementById('markdown-content').innerHTML=html;
var htmlEl=document.documentElement;
var savedTheme=localStorage.getItem('rk-theme');
if(savedTheme){htmlEl.setAttribute('data-theme',savedTheme);document.getElementById('theme-btn').textContent=savedTheme==='dark'?'☀️':'🌙';}
document.getElementById('theme-btn').addEventListener('click',function(){
var currentTheme=htmlEl.getAttribute('data-theme');
var newTheme=currentTheme==='dark'?'light':'dark';
htmlEl.setAttribute('data-theme',newTheme);
this.textContent=newTheme==='dark'?'☀️':'🌙';
localStorage.setItem('rk-theme',newTheme);
});
var toc=document.getElementById('toc');
var headers=document.querySelectorAll('.content h1, .content h2, .content h3');
headers.forEach(function(h){
if(!h.id){h.id='h-'+Math.random().toString(36).substr(2,9);}
var level=parseInt(h.tagName[1]);
var cls=level===2?'h2':(level===3?'h3':'');
var a=document.createElement('a');
a.href='#'+h.id;
a.textContent=h.textContent;
a.className=cls+' rk-toc-link';
a.dataset.target=h.id;
toc.appendChild(a);
});
document.getElementById('menu-btn').addEventListener('click',function(){
document.getElementById('sidebar').classList.toggle('open');
});
document.getElementById('menu-close').addEventListener('click',function(){
document.getElementById('sidebar').classList.remove('open');
});
document.addEventListener('click',function(e){
var sidebar=document.getElementById('sidebar');
if(window.innerWidth<=900&&!sidebar.contains(e.target)&&e.target.id!=='menu-btn'){
sidebar.classList.remove('open');
}
if(e.target.classList.contains('rk-toc-link')){
if(window.innerWidth<=900){sidebar.classList.remove('open');}
}
});
var tocLinks=document.querySelectorAll('.rk-toc-link');
function updateActiveToc(){
var scrollPos=window.scrollY+100;
var current=null;
headers.forEach(function(h){
if(h.offsetTop<=scrollPos){current=h;}
});
if(current){
tocLinks.forEach(function(l){l.classList.remove('active');});
var activeLink=document.querySelector('.rk-toc-link[data-target="'+current.id+'"]');
if(activeLink){activeLink.classList.add('active');}
}
}
window.addEventListener('scroll',function(){
var scrollTop=window.scrollY;
var docHeight=document.documentElement.scrollHeight-window.innerHeight;
var percent=Math.min(100,(scrollTop/docHeight)*100);
document.getElementById('progressBar').style.width=percent+'%';
updateActiveToc();
});
document.getElementById('totop').addEventListener('click',function(e){
e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});
});
var searchBox=document.getElementById('searchBox');
searchBox.addEventListener('input',function(){
var q=this.value.trim().toLowerCase();
var blocks=document.querySelectorAll('#markdown-content > *');
if(!q){
blocks.forEach(function(b){b.classList.remove('search-hide');});
return;
}
blocks.forEach(function(b){
var text=b.textContent.toLowerCase();
if(text.indexOf(q)>=0){b.classList.remove('search-hide');}
else{b.classList.add('search-hide');}
});
});
</script>
